global:
  scrape_interval: 15s
  scrape_timeout: 5s
  evaluation_interval: 15s

rule_files:
  - alert-rules.yml
  - alert-rules-operations.yml

scrape_configs:
  - job_name: pulsedag-v2.4.0
    metrics_path: /metrics
    scheme: http
    static_configs:
      - targets:
          - seed-1.example.invalid:9108
        labels:
          network: private-testnet-v2.4.0
          node: seed-1
          role: seed
      - targets:
          - node-1.example.invalid:9108
        labels:
          network: private-testnet-v2.4.0
          node: node-1
          role: node
      - targets:
          - node-2.example.invalid:9108
        labels:
          network: private-testnet-v2.4.0
          node: node-2
          role: node
      - targets:
          - node-3.example.invalid:9108
        labels:
          network: private-testnet-v2.4.0
          node: node-3
          role: node
      - targets:
          - node-4.example.invalid:9108
        labels:
          network: private-testnet-v2.4.0
          node: node-4
          role: node

  - job_name: pulsedag-v2.4.0-host
    metrics_path: /metrics
    scheme: http
    static_configs:
      - targets:
          - seed-1.example.invalid:9100
        labels:
          network: private-testnet-v2.4.0
          node: seed-1
          role: seed
      - targets:
          - node-1.example.invalid:9100
        labels:
          network: private-testnet-v2.4.0
          node: node-1
          role: node
      - targets:
          - node-2.example.invalid:9100
        labels:
          network: private-testnet-v2.4.0
          node: node-2
          role: node
      - targets:
          - node-3.example.invalid:9100
        labels:
          network: private-testnet-v2.4.0
          node: node-3
          role: node
      - targets:
          - node-4.example.invalid:9100
        labels:
          network: private-testnet-v2.4.0
          node: node-4
          role: node
