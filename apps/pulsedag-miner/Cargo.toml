[package]
name = "pulsedag-miner"
version.workspace = true
edition = "2021"
default-run = "pulsedag-miner"

[features]
default = []
gpu = ["dep:libloading"]
cuda = ["dep:libloading"]

[[bin]]
name = "pulsedag-cuda-probe"
path = "src/bin/cuda_probe.rs"
required-features = ["cuda"]

[dependencies]
anyhow = "1"
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
pulsedag-core = { path = "../../crates/pulsedag-core" }
pulsedag-api = { path = "../../crates/pulsedag-api" }
libloading = { version = "0.8", optional = true }

[dev-dependencies]
hex = "0.4"
sha3 = "0.10"
