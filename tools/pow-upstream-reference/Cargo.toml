# Independently resolved, test-only upstream Kaspa oracle.
# This is deliberately OUTSIDE the root Cargo workspace and lockfile.
# Its pinned js-sys 0.3.77 must not constrain libp2p 0.57.1's js-sys 0.3.85.
[package]
name = "pulsedag-upstream-pow-reference"
version = "0.1.0"
edition = "2021"
publish = false

[workspace]
resolver = "2"

[dependencies]
pulsedag-core = { path = "../../crates/pulsedag-core" }
kaspa-hashes = { git = "https://github.com/kaspanet/rusty-kaspa", rev = "cfafeb4c093fa37a303f1b9f19c58f986b870ce3" }
kaspa-pow = { git = "https://github.com/kaspanet/rusty-kaspa", rev = "cfafeb4c093fa37a303f1b9f19c58f986b870ce3" }
sha3 = "0.10"
hex = "0.4"
