name: Sync #1063 with main

on:
  push:
    branches:
      - codex/1035-fast-sync-manifest
    paths:
      - '.github/workflows/sync-1063-main.yml'

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/1035-fast-sync-manifest
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Merge current main and publish clean head
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin main
          git merge --no-edit origin/main
          rm .github/workflows/sync-1063-main.yml
          git add -A
          if ! git diff --cached --quiet; then
            git commit -m "ci: remove #1063 sync helper"
          fi
          git push origin HEAD:codex/1035-fast-sync-manifest
