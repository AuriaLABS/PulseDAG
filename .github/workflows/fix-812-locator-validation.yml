name: fix-812 locator validation

on:
  push:
    branches:
      - fix/fresh-node-orphan-recovery-812
  workflow_dispatch:

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Apply #812 patch
        run: python3 scripts/ci_fix_812_locator.py
      - name: Rustfmt
        run: cargo fmt --all
      - name: Diff check
        run: git diff --check
      - name: Sparse locator regression
        run: cargo test -p pulsedagd selected_chain_locator_spans_long_fresh_node_divergence -- --nocapture
      - name: Selected-only locator height regression
        run: cargo test -p pulsedagd headers_for_request_ignores_non_selected_locator_height -- --nocapture
      - name: Selected segment regressions
        run: cargo test -p pulsedagd selected_segment -- --nocapture
      - name: Clippy
        run: cargo clippy -p pulsedagd --all-targets --all-features -- -D warnings
      - name: Check pulsedagd
        run: cargo check -p pulsedagd
      - name: Commit validated source fix
        if: success()
        run: |
          rm .github/workflows/fix-812-locator-validation.yml
          rm scripts/ci_fix_812_locator.py
          git add -A
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "fix(sync): widen selected locator for fresh-node recovery"
          git push
