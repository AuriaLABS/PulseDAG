name: Task30 cancel duplicate runtime helper

on:
  pull_request:
    branches:
      - main
    paths:
      - .github/workflows/task30-cancel-duplicate-helper.yml

permissions:
  actions: write
  contents: read

jobs:
  cancel-duplicate:
    runs-on: ubuntu-latest
    steps:
      - name: Cancel only duplicate Task30 runtime
        uses: actions/github-script@v7
        with:
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const duplicateRunId = 32718790052;
            try {
              await github.rest.actions.cancelWorkflowRun({ owner, repo, run_id: duplicateRunId });
              core.info(`cancel requested for duplicate run ${duplicateRunId}`);
            } catch (error) {
              if (error.status === 409) {
                core.info(`duplicate run ${duplicateRunId} is already terminal`);
              } else {
                throw error;
              }
            }
