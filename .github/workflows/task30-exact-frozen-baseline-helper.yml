name: Task30 exact frozen deterministic baseline

on:
  pull_request:
    branches:
      - main
    paths:
      - .github/workflows/task30-exact-frozen-baseline-helper.yml

permissions:
  contents: read

env:
  CANDIDATE_SHA: 37f0dd6ca7aabe07341c226744f65d46bbb03d65

jobs:
  baseline:
    name: Task30 exact frozen baseline
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@v4
        with:
          ref: ${{ env.CANDIDATE_SHA }}
          persist-credentials: false

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Verify exact SHA and clean working tree
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$CANDIDATE_SHA"
          test -z "$(git status --porcelain)"

      - name: Deterministic replay and transaction matrix
        run: |
          set -euo pipefail
          cargo test --locked -p pulsedag-core --test task26_pipeline_parity
          cargo test --locked -p pulsedag-core --test task28_protocol_tx_admission
          cargo test --locked -p pulsedag-core --test task28_multi_node_tx_parity
          cargo test --locked -p pulsedag-core mempool_protocol::tests::
          cargo test --locked -p pulsedag-core tx_submission::tests::
          cargo test --locked -p pulsedag-core --test task30_stale_tx_admission
          cargo test --locked -p pulsedag-rpc --test task30_public_relay_bounds

      - name: Recovery and capability matrix
        run: |
          set -euo pipefail
          cargo test --locked -p pulsedag-storage --test task26_protocol_snapshot
          cargo test --locked -p pulsedag-core --test compact_snapshot_commit
          cargo test --locked -p pulsedag-storage --test retarget_recovery_agreement
          cargo test --locked -p pulsedag-storage --test task28_p2p_runtime_restart
          cargo test --locked -p pulsedag-p2p --test task27_capability_session
          cargo test --locked -p pulsedag-p2p --test task27_recovery_progress
          cargo test --locked -p pulsedag-p2p --test task27_acceptance_matrix

      - name: Experimental pressure regression
        run: |
          set -euo pipefail
          cargo test --locked -p pulsedag-core --test task29_high_cadence_envelope
          cargo test --locked -p pulsedag-core --test task29_orphan_pressure
          cargo test --locked -p pulsedag-rpc task29_
          cargo test --locked -p pulsedag-storage --test task29_resource_bounds
          cargo test --locked -p pulsedag-miner task29_

      - name: Write exact baseline PASS decision
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/task30-baseline/decision"
          python3 - "$RUNNER_TEMP/task30-baseline/decision/decision.json" <<'PY'
          import json, os, sys
          from datetime import datetime, timezone
          payload = {
              "task": "v2.4.0-task30-deterministic-baseline-exact-frozen-candidate",
              "candidate_sha": os.environ["CANDIDATE_SHA"],
              "control_plane_ref": os.environ.get("GITHUB_REF"),
              "control_plane_sha": os.environ.get("GITHUB_SHA"),
              "captured_at_utc": datetime.now(timezone.utc).replace(microsecond=0).isoformat().replace("+00:00", "Z"),
              "result": "PASS",
              "public_testnet_ready": False,
              "release_tag_authorized": False,
              "default_high_cadence_authorized": False,
              "smart_contract_activation_authorized": False,
          }
          with open(sys.argv[1], "w", encoding="utf-8") as handle:
              json.dump(payload, handle, indent=2, sort_keys=True)
              handle.write("\n")
          PY
          cat "$RUNNER_TEMP/task30-baseline/decision/decision.json"
          jq -e '.candidate_sha == "37f0dd6ca7aabe07341c226744f65d46bbb03d65" and .result == "PASS" and .public_testnet_ready == false' "$RUNNER_TEMP/task30-baseline/decision/decision.json" >/dev/null

      - name: Upload exact baseline decision
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: task30-baseline-decision-${{ env.CANDIDATE_SHA }}
          path: ${{ runner.temp }}/task30-baseline/decision
          if-no-files-found: error
          retention-days: 30
