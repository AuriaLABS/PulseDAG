name: v3 launch Task 37 Mining Protocol v3

on:
  pull_request:
    branches:
      - main
    paths:
      - crates/pulsedag-rpc/src/handlers/mining_submit_v3.rs
      - crates/pulsedag-rpc/src/handlers/mining_template_v3.rs
      - crates/pulsedag-rpc/src/handlers/mining_submit_guard.rs
      - crates/pulsedag-rpc/src/handlers/mining_submit_protocol.rs
      - crates/pulsedag-rpc/src/handlers/mining_template_protocol.rs
      - crates/pulsedag-rpc/src/handlers/mod.rs
      - docs/MINING_PROTOCOL_V3.md
      - .github/workflows/task37-mining-protocol-v3.yml
  push:
    branches:
      - main
    paths:
      - crates/pulsedag-rpc/src/handlers/mining_submit_v3.rs
      - crates/pulsedag-rpc/src/handlers/mining_template_v3.rs
      - crates/pulsedag-rpc/src/handlers/mining_submit_guard.rs
      - crates/pulsedag-rpc/src/handlers/mining_submit_protocol.rs
      - crates/pulsedag-rpc/src/handlers/mining_template_protocol.rs
      - crates/pulsedag-rpc/src/handlers/mod.rs
      - docs/MINING_PROTOCOL_V3.md
      - .github/workflows/task37-mining-protocol-v3.yml

permissions:
  contents: read

jobs:
  task37-mining-protocol-v3:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout candidate
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Format gate
        run: cargo fmt --all -- --check

      - name: Compile RPC v3 facade
        run: cargo check --locked -p pulsedag-rpc

      - name: Mining Protocol v3 golden and compatibility tests
        run: cargo test --locked -p pulsedag-rpc task37_

      - name: Retained Task 28/29 mining compatibility
        run: |
          cargo test --locked -p pulsedag-rpc activated_identity_rejects_legacy_submit_preflight
          cargo test --locked -p pulsedag-rpc activated_identity_builds_chain_bound_v2_rpc_template
          cargo test --locked -p pulsedag-rpc task29_post_enqueue_timeout_is_explicitly_non_final

      - name: RPC clippy gate
        run: cargo clippy --locked -p pulsedag-rpc --all-targets -- -D warnings
