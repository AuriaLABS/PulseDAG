name: v3 evidence ledger

on:
  pull_request:
    paths:
      - "scripts/release/validate_v3_evidence_ledger.py"
      - "docs/release/V3_EVIDENCE_LEDGER.md"
      - "docs/release/v3-evidence-ledger.json"
      - "docs/release/v3-testnet-evidence-ledger.json"
      - ".github/workflows/v3-evidence-ledger.yml"
  push:
    branches:
      - main
    paths:
      - "scripts/release/validate_v3_evidence_ledger.py"
      - "docs/release/V3_EVIDENCE_LEDGER.md"
      - "docs/release/v3-evidence-ledger.json"
      - "docs/release/v3-testnet-evidence-ledger.json"
      - ".github/workflows/v3-evidence-ledger.yml"

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate ledger contract
        run: |
          set -euo pipefail
          python3 scripts/release/validate_v3_evidence_ledger.py --self-test
          if [[ -f docs/release/v3-evidence-ledger.json ]]; then
            args=()
            if python3 -c 'import json, sys; d = json.load(open(sys.argv[1], encoding="utf-8")); sys.exit(0 if d.get("stage") == "mainnet" and d.get("decision") == "GO_V3_MAINNET" else 1)' docs/release/v3-evidence-ledger.json; then
              args+=(--prior-testnet-ledger docs/release/v3-testnet-evidence-ledger.json)
            fi
            python3 scripts/release/validate_v3_evidence_ledger.py docs/release/v3-evidence-ledger.json "${args[@]}"
          fi
