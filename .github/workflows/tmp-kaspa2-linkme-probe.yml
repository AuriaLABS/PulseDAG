name: tmp supported Kaspa 2 linkme probe

on:
  push:
    branches:
      - security/v3-linkme-kaspa-2
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: tmp-kaspa2-linkme-${{ github.ref }}
  cancel-in-progress: true

jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
          fetch-depth: 0

      - name: Install Rust required by supported Kaspa 2.0.1
        shell: bash
        run: |
          set -euo pipefail
          rustup toolchain install 1.91.0 --profile minimal --no-self-update
          rustup default 1.91.0
          rustc --version
          cargo --version

      - name: Move direct Kaspa dependencies to stable upstream 2.0.1
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          path = Path('crates/pulsedag-core/Cargo.toml')
          text = path.read_text()
          old = text
          upstream = 'https://github.com/kaspanet/rusty-kaspa'
          rev = 'cfafeb4c093fa37a303f1b9f19c58f986b870ce3'
          text = text.replace(
              'kaspa-hashes = "0.15.0"',
              f'kaspa-hashes = {{ git = "{upstream}", rev = "{rev}" }}',
          )
          text = text.replace(
              'kaspa-pow = "0.15.0"',
              f'kaspa-pow = {{ git = "{upstream}", rev = "{rev}" }}',
          )
          if text == old:
              raise SystemExit('expected Kaspa 0.15.0 direct dependencies were not found')
          path.write_text(text)
          PY

          # Updating either direct Kaspa package causes Cargo to resolve the
          # single pinned upstream workspace revision for both direct packages
          # and their internal path dependencies.
          cargo update -p kaspa-hashes@0.15.0

          echo '=== exact supported upstream source ==='
          grep -n 'kaspa-\(hashes\|pow\)' crates/pulsedag-core/Cargo.toml
          grep -n 'git+https://github.com/kaspanet/rusty-kaspa' Cargo.lock | head -n 20

          echo '=== old linkme path must be absent ==='
          if cargo tree --locked --workspace --all-targets -i linkme@0.2.10 >/tmp/linkme-old.txt 2>&1; then
            cat /tmp/linkme-old.txt
            exit 1
          fi
          echo 'linkme 0.2.10 absent'

          echo '=== old intertrait path must be absent ==='
          if cargo tree --locked --workspace --all-targets -i intertrait@0.2.2 >/tmp/intertrait-old.txt 2>&1; then
            cat /tmp/intertrait-old.txt
            exit 1
          fi
          echo 'intertrait 0.2.2 absent'

          cargo tree --locked -p pulsedag-core | tee /tmp/pulsedag-core-tree.txt

      - name: Compile and test consensus/PoW adapter
        shell: bash
        run: |
          set -euo pipefail
          cargo check --locked -p pulsedag-core
          cargo test --locked -p pulsedag-core

      - name: Compile node and miner consumers
        shell: bash
        run: |
          set -euo pipefail
          cargo check --locked -p pulsedag-p2p
          cargo check --locked -p pulsedagd
          cargo check --locked -p pulsedag-miner

      - name: Commit supported dependency candidate
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/tmp-kaspa2-linkme-probe.yml
          git config user.name 'kalekói'
          git config user.email 'hermida.prada@gmail.com'
          git add crates/pulsedag-core/Cargo.toml Cargo.lock .github/workflows/tmp-kaspa2-linkme-probe.yml
          git diff --cached --stat
          git commit -m 'security: migrate Kaspa PoW stack to stable 2.0.1'
          git push origin HEAD:security/v3-linkme-kaspa-2
