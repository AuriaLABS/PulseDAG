name: temp wallet pre-sign recovery fix

on:
  push:
    branches:
      - wallet/v3-pending-utxo-reconcile
    paths:
      - '.github/workflows/temp-wallet-presign-recovery-fix.yml'

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          ref: wallet/v3-pending-utxo-reconcile
          fetch-depth: 1
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.91.0
          components: clippy,rustfmt
      - name: Guard exact inputs
        shell: bash
        run: |
          set -euo pipefail
          test "$(git hash-object crates/pulsedag-wallet/src/bin/pulsedag-wallet.rs)" = "7ebfb698b188086f297d23fd6f9db555b0fcdda0"
          test "$(git hash-object .github/temp-wallet-presign-recovery-fix.py)" = "2d014e6921ba7204a5fe6e9a9e683574befe575f"
      - name: Apply guarded pre-sign recovery fix
        shell: bash
        run: |
          set -euo pipefail
          python3 .github/temp-wallet-presign-recovery-fix.py
          cargo fmt --all
          git diff --check
          test "$(git diff --name-only)" = 'crates/pulsedag-wallet/src/bin/pulsedag-wallet.rs'
      - name: Run focused regression gate
        shell: bash
        run: |
          set -euo pipefail
          cargo test --locked -p pulsedag-wallet --bin pulsedag-wallet tx_sign_precheck
          cargo test --locked -p pulsedag-wallet
          cargo clippy --locked -p pulsedag-wallet --all-targets -- -D warnings
          cargo fmt --all -- --check
          git diff --check
      - name: Publish fix and remove temporaries
        shell: bash
        run: |
          set -euo pipefail
          rm .github/temp-wallet-presign-recovery-fix.py
          rm .github/workflows/temp-wallet-presign-recovery-fix.yml
          git add crates/pulsedag-wallet/src/bin/pulsedag-wallet.rs .github/temp-wallet-presign-recovery-fix.py .github/workflows/temp-wallet-presign-recovery-fix.yml
          test "$(git diff --cached --name-only)" = $'.github/temp-wallet-presign-recovery-fix.py\n.github/workflows/temp-wallet-presign-recovery-fix.yml\ncrates/pulsedag-wallet/src/bin/pulsedag-wallet.rs'
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'wallet: precheck signed recovery conflicts'
          git push origin HEAD:wallet/v3-pending-utxo-reconcile
