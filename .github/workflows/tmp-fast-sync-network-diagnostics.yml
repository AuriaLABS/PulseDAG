name: temporary fast-sync network diagnostics

on:
  pull_request:
    branches:
      - main
    paths:
      - '.github/workflows/tmp-fast-sync-network-diagnostics.yml'
      - 'crates/pulsedag-storage/src/fast_sync_network_resume.rs'
      - 'crates/pulsedag-storage/src/root.rs'

permissions:
  contents: read

jobs:
  diagnostics:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 1

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.91.0
          components: rustfmt

      - name: Format candidate copy
        run: cargo fmt --all

      - name: Capture storage check
        shell: bash
        run: |
          set +e
          cargo check --locked -p pulsedag-storage > tmp-fast-sync-check.log 2>&1
          printf '%s\n' "$?" > tmp-fast-sync-check.status
          exit 0

      - name: Upload diagnostics
        uses: actions/upload-artifact@v4
        with:
          name: fast-sync-network-diagnostics
          path: |
            crates/pulsedag-storage/src/fast_sync_network_resume.rs
            crates/pulsedag-storage/src/root.rs
            tmp-fast-sync-check.log
            tmp-fast-sync-check.status
          if-no-files-found: error
          retention-days: 1