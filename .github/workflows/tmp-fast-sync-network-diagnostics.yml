name: temporary fast-sync network diagnostics

on:
  pull_request:
    branches:
      - main
    paths:
      - '.github/workflows/tmp-fast-sync-network-diagnostics.yml'

permissions:
  contents: write

jobs:
  repair:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout writable PR branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0

      - name: Install Rust formatter
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.91.0
          components: rustfmt

      - name: Apply import repair and rustfmt
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          path = Path('crates/pulsedag-storage/src/fast_sync_network_resume.rs')
          text = path.read_text()
          old = '''use pulsedag_core::{
              errors::PulseError, snapshot_transfer_chunk_digest_v1,
              snapshot_transfer_commitment_set_digest_v1, snapshot_transfer_payload_digest_v1,
              ProtocolActivationIdentity,
          };'''
          new = '''use pulsedag_core::snapshot_transfer::snapshot_transfer_commitment_set_digest_v1;
          use pulsedag_core::{
              errors::PulseError, snapshot_transfer_chunk_digest_v1, snapshot_transfer_payload_digest_v1,
              ProtocolActivationIdentity,
          };'''
          if old not in text:
              raise SystemExit('expected unresolved import block not found')
          path.write_text(text.replace(old, new, 1))
          PY
          cargo fmt --all
          rm .github/workflows/tmp-fast-sync-network-diagnostics.yml

      - name: Commit clean candidate
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --check
          git commit -m 'storage: fix network resume build and formatting'
          git push origin HEAD:${{ github.event.pull_request.head.ref }}