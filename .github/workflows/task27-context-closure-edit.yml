name: Task 27 context closure editor

on:
  pull_request:
    branches:
      - main
    paths:
      - scripts/task27_context_closure_edit.py
      - .github/workflows/task27-context-closure-edit.yml

permissions:
  contents: write

jobs:
  apply:
    if: github.head_ref == 'agent/task27-context-closure-work'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: agent/task27-context-closure-work
          fetch-depth: 0

      - name: Apply exact context closure edit
        run: python3 scripts/task27_context_closure_edit.py

      - name: Remove one-shot editor files
        run: |
          rm scripts/task27_context_closure_edit.py
          rm .github/workflows/task27-context-closure-edit.yml

      - name: Format and validate patch
        run: |
          cargo fmt --all
          git diff --check

      - name: Run focused frontier tests
        run: cargo test --locked -p pulsedag-p2p frontier_response_v1

      - name: Commit exact source edit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --exit-code && exit 1 || true
          git commit -m "p2p: close Task 27 required-context ancestry"
          git push origin HEAD:agent/task27-context-closure-work
