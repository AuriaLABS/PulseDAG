name: temp wallet pending idempotence fix

on:
  push:
    branches:
      - wallet/v3-pending-utxo-reconcile
    paths:
      - '.github/workflows/temp-wallet-pending-idempotence-fix.yml'

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: wallet/v3-pending-utxo-reconcile
          fetch-depth: 1
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.91.0
          components: clippy,rustfmt
      - name: Guard exact pending source
        shell: bash
        run: |
          set -euo pipefail
          test "$(git hash-object crates/pulsedag-wallet/src/pending.rs)" = "7f22ca980a9161f09d6469c394f09f75dbb502b2"
      - name: Fix inactive reservation idempotence
        shell: bash
        env:
          OLD_B64: 
          NEW_B64: 
          TEST_B64: 
        run: |
          set -euo pipefail
          python3 -c 'import base64, os, pathlib; p=pathlib.Path("crates/pulsedag-wallet/src/pending.rs"); t=p.read_text(); old=base64.b64decode(os.environ["OLD_B64"]).decode(); new=base64.b64decode(os.environ["NEW_B64"]).decode(); test=base64.b64decode(os.environ["TEST_B64"]).decode(); anchor="    #[test]\n    fn submission_started_is_reserved_serialized_and_cannot_begin_twice() {"; assert t.count(old)==1; assert t.count(anchor)==1; t=t.replace(old,new); t=t.replace(anchor,test+anchor); p.write_text(t)'
          cargo fmt --all
          git diff --check
          test "$(git diff --name-only)" = "crates/pulsedag-wallet/src/pending.rs"
      - name: Run focused gate
        shell: bash
        run: |
          set -euo pipefail
          cargo test --locked -p pulsedag-wallet --lib
          cargo clippy --locked -p pulsedag-wallet --lib -- -D warnings -A clippy::uninlined-format-args
          cargo fmt --all -- --check
          git diff --check
      - name: Publish source and remove materializer
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/temp-wallet-pending-idempotence-fix.yml
          git add crates/pulsedag-wallet/src/pending.rs .github/workflows/temp-wallet-pending-idempotence-fix.yml
          staged="$(git diff --cached --name-only | sort)"
          expected="$(printf '%s\n' '.github/workflows/temp-wallet-pending-idempotence-fix.yml' 'crates/pulsedag-wallet/src/pending.rs' | sort)"
          test "$staged" = "$expected"
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git commit -m 'fix: reject inactive reservation idempotence'
          git push origin HEAD:wallet/v3-pending-utxo-reconcile
