name: Trusted issue 783 observability fix

on:
  pull_request:
    branches:
      - release/2.4.0
    paths:
      - .github/workflows/_temporary_issue_783_observability_fix.yml

permissions:
  contents: write

concurrency:
  group: trusted-issue-783-observability
  cancel-in-progress: false

jobs:
  apply-test-publish:
    if: github.repository == 'AuriaLABS/PulseDAG' && github.event.pull_request.number == 791
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v4
        with:
          ref: fix/v2.3.0-observability-mempool-route
          fetch-depth: 0

      - name: Apply observability route patch
        shell: bash
        env:
          PATCH_GZ_B64: ''
        run: |
          set -euo pipefail
          printf '%s' "$PATCH_GZ_B64" | base64 -d | gzip -d > /tmp/issue-783.patch
          git apply --check /tmp/issue-783.patch
          git apply /tmp/issue-783.patch

      - name: Validate observability package
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/validate_v2_3_0_observability.py
          python3 scripts/validate_observability_package.py
          bash scripts/tests/test_v2_3_0_observability.sh
          python3 scripts/validate_v2_3_0_runbooks.py
          python3 -m py_compile \
            scripts/validate_v2_3_0_observability.py \
            scripts/p2p_sync_rpc_baselines.py \
            scripts/private_testnet/collect_incident_evidence.py \
            scripts/validate_v2_3_0_runbooks.py
          if grep -RIn --exclude-dir=.git '/tx/mempool' .; then
            echo 'stale /tx/mempool route remains' >&2
            exit 1
          fi

      - name: Remove trigger and verify scope
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/_temporary_issue_783_observability_fix.yml
          rm -rf scripts/__pycache__ scripts/private_testnet/__pycache__
          git diff --check
          python3 - <<'PY'
          import subprocess
          expected = {
              '.github/workflows/_temporary_issue_783_observability_fix.yml',
              'docs/benchmarks/HOT_PATH_MEASUREMENT_METHODOLOGY.md',
              'docs/benchmarks/P2P_SYNC_RPC_BASELINE_METHODOLOGY_V2_3_0.md',
              'docs/benchmarks/P2P_SYNC_RPC_BASELINE_OUTPUT_TEMPLATE_V2_3_0.md',
              'docs/benchmarks/burnin_regression_thresholds_v1.json',
              'docs/dashboard/README.md',
              'docs/runbooks/REBUILD_FROM_SNAPSHOT_AND_DELTA.md',
              'docs/runbooks/V2_3_0_PRIVATE_TESTNET_OPERATIONS.md',
              'ops/observability/v2.3.0/README.md',
              'ops/observability/v2.3.0/metrics-inventory.json',
              'scripts/p2p_sync_rpc_baselines.py',
              'scripts/private_testnet/collect_incident_evidence.py',
              'scripts/tests/test_v2_3_0_observability.sh',
              'scripts/validate_v2_3_0_observability.py',
              'scripts/validate_v2_3_0_runbooks.py',
          }
          changed = {
              line[3:]
              for line in subprocess.check_output(['git', 'status', '--short'], text=True).splitlines()
          }
          if changed != expected:
              raise SystemExit(f'unexpected changed paths: {sorted(changed ^ expected)}')
          PY

      - name: Commit tested fix
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'fix: align observability mempool route with RPC router'
          git push origin HEAD:fix/v2.3.0-observability-mempool-route
