name: v3 public-testnet identity draft shape gate (NO GO)

on:
  pull_request:
    branches: [main]
    paths:
      - scripts/v3_public_testnet_identity_shape_gate.py
      - scripts/tests/test_v3_public_testnet_identity_shape_gate.py
      - scripts/validate_v3_0_0_public_hardening.py
      - scripts/tests/test_v3_public_testnet_template_semantic_guard.py
      - "configs/public-testnet/**"
      - docs/runbooks/V3_PUBLIC_TESTNET_IDENTITY_DRAFT_OFFLINE.md
      - .github/workflows/v3-public-testnet-identity-shape-gate.yml
      - docs/MONETARY_POLICY_V3_0_0.md
      - scripts/native_v3_checkpoint_external_anchor_trial.py
      - scripts/tests/test_native_v3_checkpoint_external_anchor_trial.py
      - docs/runbooks/V3_NATIVE_CHECKPOINT_EXTERNAL_PIN_TRIAL.md
  push:
    branches: [main]
    paths:
      - scripts/v3_public_testnet_identity_shape_gate.py
      - scripts/tests/test_v3_public_testnet_identity_shape_gate.py
      - scripts/validate_v3_0_0_public_hardening.py
      - scripts/tests/test_v3_public_testnet_template_semantic_guard.py
      - "configs/public-testnet/**"
      - docs/runbooks/V3_PUBLIC_TESTNET_IDENTITY_DRAFT_OFFLINE.md
      - .github/workflows/v3-public-testnet-identity-shape-gate.yml
      - docs/MONETARY_POLICY_V3_0_0.md
      - scripts/native_v3_checkpoint_external_anchor_trial.py
      - scripts/tests/test_native_v3_checkpoint_external_anchor_trial.py
      - docs/runbooks/V3_NATIVE_CHECKPOINT_EXTERNAL_PIN_TRIAL.md
  workflow_dispatch:

permissions:
  contents: read

jobs:
  reject-unsafe-identity-drafts:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout exact source without persisted credentials
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Verify exact-head SHA
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
      - name: Compile and run offline standard-library negative fixtures
        shell: bash
        run: |
          set -euo pipefail
          python3 -m py_compile \
            scripts/v3_public_testnet_identity_shape_gate.py \
            scripts/tests/test_v3_public_testnet_identity_shape_gate.py \
            scripts/native_v3_checkpoint_external_anchor_trial.py \
            scripts/tests/test_native_v3_checkpoint_external_anchor_trial.py
          python3 -m unittest discover -v -s scripts/tests -p 'test_v3_public_testnet_identity_shape_gate.py'
          python3 -m unittest discover -v -s scripts/tests -p 'test_native_v3_checkpoint_external_anchor_trial.py'
          python3 -m unittest discover -v -s scripts/tests -p 'test_v3_public_testnet_template_semantic_guard.py'
          python3 -O -m unittest discover -v -s scripts/tests -p 'test_v3_public_testnet_template_semantic_guard.py'
          python3 scripts/validate_v3_0_0_public_hardening.py
      - name: Verify launch authority remains absent in the source and templates
        shell: bash
        run: |
          set -euo pipefail
          grep -Fq '"public_testnet_launch_authorized": False' scripts/v3_public_testnet_identity_shape_gate.py
          grep -Fq '"mainnet_launch_authorized": False' scripts/v3_public_testnet_identity_shape_gate.py
          grep -Fq '"monetary_runtime_enabled": False' scripts/v3_public_testnet_identity_shape_gate.py
          grep -Fq '"contracts_enabled": False' scripts/v3_public_testnet_identity_shape_gate.py
          grep -Fq '"checkpoint_launch_authorized": False' scripts/native_v3_checkpoint_external_anchor_trial.py
          grep -Fq '"independent_pin_provenance_authenticated": False' scripts/native_v3_checkpoint_external_anchor_trial.py
          grep -Fq '"monetary_runtime_enabled": False' scripts/native_v3_checkpoint_external_anchor_trial.py
          grep -Fq '"contracts_enabled": False' scripts/native_v3_checkpoint_external_anchor_trial.py
          grep -Fq 'PULSEDAG_P2P_ENABLED=false' configs/public-testnet/node.env.template
          grep -Fq 'PULSEDAG_PUBLIC_TESTNET_READY=false' configs/public-testnet/node.env.template
          grep -Fq 'PULSEDAG_CONTRACTS_ENABLED=false' configs/public-testnet/node.env.template
          grep -Fq 'PULSEDAG_PROTOCOL_CONSENSUS_MODE=ghostdag_v1' configs/public-testnet/node.env.template
          grep -Fq '"monetary_v3").is_err()' apps/pulsedagd/src/startup_protocol.rs
