name: v3 direct GetBlock Swarm fail-closed event logging (NO GO)

on:
  pull_request:
    paths:
      - crates/pulsedag-p2p/src/lib.rs
      - .github/workflows/v3-direct-getblock-swarm-event-sanitization-probe.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  no-raw-direct-getblock-events:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Checkout exact head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Fail-closed production transport boundaries
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
          grep -Fq 'PulseBehaviourEvent::DirectGetblock(event)' crates/pulsedag-p2p/src/lib.rs
          grep -Fq 'summarize_unapproved_direct_getblock_event_v1(&event)' crates/pulsedag-p2p/src/lib.rs
          grep -Fq 'ProtocolSupport::Outbound' crates/pulsedag-p2p/src/lib.rs
          if grep -Fq 'ProtocolSupport::Full' crates/pulsedag-p2p/src/lib.rs; then
            echo "::error::unreviewed production inbound direct GetBlock"
            exit 1
          fi
          if grep -Fq '.direct_getblock.send_request(' crates/pulsedag-p2p/src/lib.rs; then
            echo "::error::unreviewed live send_request"
            exit 1
          fi
          grep -Fq 'PULSEDAG_P2P_ENABLED=false' configs/public-testnet/node.env.template
          grep -Fq 'PULSEDAG_CONTRACTS_ENABLED=false' configs/public-testnet/node.env.template
      - name: Pin Rust 1.91
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: '1.91.0'
      - name: Compile real libp2p event types and test log boundaries
        run: |
          set -euo pipefail
          cargo check --locked -p pulsedag-p2p --all-targets
          cargo test --locked -p pulsedag-p2p --lib direct_getblock_swarm_event_sanitization_tests -- --nocapture
          cargo fmt --all -- --check
          git diff --exit-code -- Cargo.lock
