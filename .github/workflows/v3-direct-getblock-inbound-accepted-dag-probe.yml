name: v3 authenticated direct GetBlock accepted-DAG responder (no GO)

on:
  pull_request:
    paths:
      - crates/pulsedag-p2p/src/messages/direct_getblock_inbound_v1.rs
      - crates/pulsedag-p2p/src/messages.rs
      - .github/workflows/v3-direct-getblock-inbound-accepted-dag-probe.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  offline-authenticated-accepted-dag-only:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Checkout exact PR head without persisted credentials
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Fail closed on code or protocol activation
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
          grep -Fq 'pub mod direct_getblock_inbound_v1;' crates/pulsedag-p2p/src/messages.rs
          grep -Fq 'accepted_chain.dag.blocks.get(' crates/pulsedag-p2p/src/messages/direct_getblock_inbound_v1.rs
          grep -Fq 'ProtocolSupport::Outbound' crates/pulsedag-p2p/src/lib.rs
          if grep -Fq 'ProtocolSupport::Full' crates/pulsedag-p2p/src/lib.rs; then
            echo "::error::live inbound GetBlock protocol remains unauthorized"
            exit 1
          fi
          if grep -Fq '.direct_getblock.send_request(' crates/pulsedag-p2p/src/lib.rs; then
            echo "::error::live GetBlock send_request remains unauthorized"
            exit 1
          fi
          grep -Fq 'PULSEDAG_P2P_ENABLED=false' configs/public-testnet/node.env.template
          grep -Fq 'PULSEDAG_CONTRACTS_ENABLED=false' configs/public-testnet/node.env.template
      - name: Install exact pinned Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: '1.91.0'
      - name: Compile and run accepted-DAG authenticated responder negative tests
        run: |
          set -euo pipefail
          cargo check --locked -p pulsedag-p2p --all-targets
          cargo test --locked -p pulsedag-p2p --lib direct_getblock_inbound_v1 -- --nocapture
          cargo fmt --all -- --check
          git diff --exit-code -- Cargo.lock
