name: "Native-v3 authenticated GetBlock candidate boundary (NO GO)"

on:
  pull_request:
    paths:
      - "crates/pulsedag-p2p/src/messages/native_v3_getblock_candidate_v1.rs"
      - "crates/pulsedag-p2p/src/messages.rs"
      - "crates/pulsedag-core/src/block_envelope_v3.rs"
      - ".github/workflows/v3-native-getblock-candidate-inert.yml"
  workflow_dispatch:

permissions:
  contents: read

env:
  EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}

jobs:
  native-v3-getblock-candidate:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@v4
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Check exact HEAD, production hard-OFF and contracts INACTIVE
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
          grep -Fq 'const DIRECT_GETBLOCK_LIVE_REQUESTS_ENABLED: bool = false;' crates/pulsedag-p2p/src/lib.rs
          grep -Fq 'ProtocolSupport::Outbound' crates/pulsedag-p2p/src/lib.rs
          grep -Fq 'PULSEDAG_CONTRACTS_ENABLED=false' configs/public-testnet/node.env.template
          ! grep -Fq 'native_v3_getblock_candidate_v1::' crates/pulsedag-p2p/src/lib.rs
      - name: Install pinned Rust 1.91
        run: rustup toolchain install 1.91.0 --profile minimal --component rustfmt,clippy
      - name: Exact-head Rustfmt
        run: cargo +1.91.0 fmt --all -- --check
      - name: Dormant native-v3 candidate tests
        run: cargo +1.91.0 test --locked -p pulsedag-p2p native_v3_getblock_candidate_v1::tests -- --nocapture
      - name: Strict P2P Clippy
        run: cargo +1.91.0 clippy --locked -p pulsedag-p2p --all-targets -- -D warnings
      - name: Lockfile unchanged
        run: git diff --exit-code -- Cargo.lock
