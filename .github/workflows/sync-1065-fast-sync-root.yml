name: Sync #1065 with updated fast-sync root
on:
  push:
    branches: [codex/1035-fast-sync-runtime-adapter]
permissions:
  contents: write
jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/1035-fast-sync-runtime-adapter
          fetch-depth: 0
      - name: Merge current #1063 root and publish clean head
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'kalekoi'
          git config user.email 'hermida.prada@gmail.com'
          git fetch origin codex/1035-fast-sync-manifest
          git merge --no-edit origin/codex/1035-fast-sync-manifest
          rm .github/workflows/sync-1065-fast-sync-root.yml
          git add .github/workflows/sync-1065-fast-sync-root.yml
          if ! git diff --cached --quiet; then
            git commit -m 'ci: remove #1065 sync helper'
          fi
          git diff --check
          git push origin HEAD:codex/1035-fast-sync-runtime-adapter
