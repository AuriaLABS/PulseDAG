name: Propagate 1070 inventory regression fix to 1063

on:
  push:
    branches:
      - codex/1035-fast-sync-manifest
    paths:
      - .github/workflows/tmp-propagate-1070-1063.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Check out target branch
        uses: actions/checkout@v4
        with:
          ref: codex/1035-fast-sync-manifest
          fetch-depth: 0
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
      - name: Apply exact test-only delta
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p = Path('crates/pulsedag-p2p/src/lib.rs')
          s = p.read_text()
          old_name = 'fn oversized_inventory_is_capped()'
          new_name = 'fn inventory_request_fanout_is_capped()'
          old_fixture = 'let hashes = (0..MAX_INV_BLOCK_HASHES + 10)'
          new_fixture = 'let hashes = (0..MAX_INV_BLOCK_REQUEST_FANOUT + 10)'
          assert s.count(old_name) == 1, f'old test-name count={s.count(old_name)}'
          assert s.count(old_fixture) == 1, f'old fixture count={s.count(old_fixture)}'
          assert s.count(new_name) == 0, f'new test-name count={s.count(new_name)}'
          assert s.count(new_fixture) == 0, f'new fixture count={s.count(new_fixture)}'
          p.write_text(s.replace(old_name, new_name).replace(old_fixture, new_fixture))
          PY
          git diff --check
          cargo fmt --all -- --check
          cargo test -p pulsedag-p2p inventory_request_fanout_is_capped --lib
      - name: Publish verified patch and self-clean
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/tmp-propagate-1070-1063.yml
          git add crates/pulsedag-p2p/src/lib.rs
          git diff --cached --check
          git diff --cached --name-only | sort > /tmp/changed.txt
          printf '%s\n' '.github/workflows/tmp-propagate-1070-1063.yml' 'crates/pulsedag-p2p/src/lib.rs' | sort > /tmp/expected.txt
          diff -u /tmp/expected.txt /tmp/changed.txt
          git commit -m 'test(p2p): align inventory fanout regression with wire bound'
          git push origin HEAD:codex/1035-fast-sync-manifest
