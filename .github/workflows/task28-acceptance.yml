name: v2.4.0 Task 28 acceptance

on:
  pull_request:
    branches:
      - main
    paths:
      - crates/pulsedag-core/**
      - crates/pulsedag-rpc/**
      - apps/pulsedag-miner/**
      - apps/pulsedagd/**
      - .github/workflows/task28-acceptance.yml
  push:
    branches:
      - main
    paths:
      - crates/pulsedag-core/**
      - crates/pulsedag-rpc/**
      - apps/pulsedag-miner/**
      - apps/pulsedagd/**
      - .github/workflows/task28-acceptance.yml

permissions:
  contents: write

jobs:
  task28-acceptance:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout candidate
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Protocol-bound transaction admission
        run: cargo test --locked -p pulsedag-core --test task28_protocol_tx_admission

      - name: Protocol-bound mempool reconciliation
        run: cargo test --locked -p pulsedag-core mempool_protocol::tests::

      - name: Activated-v2 mining parent context
        run: cargo test --locked -p pulsedag-core mining_protocol::tests::

      - name: Activated-v2 mining state root
        run: cargo test --locked -p pulsedag-core mining_state_v2::tests::

      - name: Activated-v2 mining template envelope
        run: cargo test --locked -p pulsedag-core mining_template_v2::tests::

      - name: Activated-v2 mined block acceptance
        run: cargo test --locked -p pulsedag-core mined_block_v2::tests::

      - name: Standalone miner protocol-bound backend
        run: cargo test --locked -p pulsedag-miner protocol_backend::tests::

      - name: Standalone miner template identity
        run: cargo test --locked -p pulsedag-miner template_protocol::tests::

  stage-mining-submit-protocol:
    if: github.event_name == 'pull_request' && github.head_ref == 'agent/task28-mining-submit-protocol'
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout staging branch
        uses: actions/checkout@v4
        with:
          ref: agent/task28-mining-submit-protocol
          fetch-depth: 0

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt,clippy

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Apply exact submit/template patch
        run: python3 scripts/task28_mining_submit_protocol_patch.py

      - name: Restore permanent workflow and remove staging files
        run: |
          git fetch origin main
          git checkout origin/main -- .github/workflows/task28-acceptance.yml
          rm -f .github/workflows/task28-mining-submit-protocol-staging.yml
          rm scripts/task28_mining_submit_protocol_patch.py

      - name: Format and diff check
        run: |
          cargo fmt --all
          git diff --check

      - name: Protocol selector tests
        run: cargo test --locked -p pulsedag-rpc mining_submit_protocol::tests::

      - name: Existing mining submit regressions
        run: cargo test --locked -p pulsedag-rpc mining_submit::tests::

      - name: Existing mining template regressions
        run: cargo test --locked -p pulsedag-rpc mining_template::tests::

      - name: RPC clippy
        run: cargo clippy --locked -p pulsedag-rpc --all-targets -- -D warnings

      - name: Commit validated wiring
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --exit-code && exit 1 || true
          git commit -m "rpc: bind mining submit to protocol identity"
          git push origin HEAD:agent/task28-mining-submit-protocol
