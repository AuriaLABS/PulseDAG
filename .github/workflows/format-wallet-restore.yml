name: Format wallet restore

on:
  push:
    branches:
      - 'wallet/2.4.x-deterministic-restore-819'
    paths:
      - '.github/workflows/format-wallet-restore.yml'

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: wallet/2.4.x-deterministic-restore-819
      - name: Install pinned Rustfmt
        run: rustup toolchain install 1.88.0 --profile minimal --component rustfmt --no-self-update
      - name: Format workspace
        run: cargo +1.88.0 fmt --all
      - name: Commit formatting only
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add crates/pulsedag-wallet/src/deterministic.rs crates/pulsedag-wallet/src/lib.rs
          if git diff --cached --quiet; then
            echo 'Already formatted'
            exit 0
          fi
          git commit -m 'style: rustfmt deterministic wallet restore'
          git push origin HEAD:wallet/2.4.x-deterministic-restore-819
