# Temporary branch-local exact patcher. Delete immediately after target commit lands.
name: Task31 v2.4 profile freeze patch

on:
  pull_request:
    branches: [main]
    paths:
      - scripts/task31_profile_freeze_patch.py
      - .github/workflows/task31-profile-freeze-patch.yml

permissions:
  contents: write

jobs:
  patch:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.head_ref == 'agent/task31-release-freeze'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0

      - name: Apply exact profile freeze replacements
        run: python3 scripts/task31_profile_freeze_patch.py

      - name: Format Rust candidate
        run: cargo fmt --all

      - name: Validate shell syntax
        shell: bash
        run: |
          set -euo pipefail
          bash -n scripts/v2_4_0_single_node_preflight.sh
          bash -n scripts/tests/test_v2_4_0_single_node_preflight.sh
          bash -n scripts/v2_4_0_private_testnet_preflight.sh
          bash -n scripts/tests/test_v2_4_0_private_testnet_preflight.sh
          bash -n scripts/tests/test_v2_3_0_private_testnet_preflight.sh

      - name: Validate single-node v2.4 contract
        run: bash scripts/tests/test_v2_4_0_single_node_preflight.sh

      - name: Validate multi-host v2.4 contract
        run: bash scripts/tests/test_v2_4_0_private_testnet_preflight.sh

      - name: Preserve historical v2.3 preflight regression
        run: bash scripts/tests/test_v2_3_0_private_testnet_preflight.sh

      - name: Validate daemon config regressions
        run: cargo test --locked -p pulsedagd config::tests --no-fail-fast

      - name: Commit frozen v2.4 profiles
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            apps/pulsedagd/src/config.rs \
            configs/private-testnet/seed.env.example \
            configs/private-testnet/node.env.example \
            configs/single-node/single-node.env.example \
            scripts/v2_4_0_single_node_preflight.sh \
            scripts/tests/test_v2_4_0_single_node_preflight.sh \
            scripts/tests/test_v2_3_0_private_testnet_preflight.sh \
            scripts/v2_4_0_private_testnet_preflight.sh \
            scripts/tests/test_v2_4_0_private_testnet_preflight.sh \
            .github/workflows/v2_4_0_single_node_profile.yml \
            docs/runbooks/V2_4_0_SINGLE_NODE_OPERATIONS.md
          if git diff --cached --quiet; then
            echo "profile freeze already applied"
            exit 0
          fi
          git commit -m "release: freeze chain-bound v2.4 operator profiles"
          git push origin HEAD:${{ github.head_ref }}
