name: temporary fast-sync borrow fix

on:
  push:
    branches:
      - codex/1035-fast-sync-clean-bootstrap

permissions:
  contents: write

jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/1035-fast-sync-clean-bootstrap
          fetch-depth: 0
      - name: Apply exact borrow-checker fix
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          p = Path('apps/pulsedagd/src/fast_sync_bootstrap.rs')
          s = p.read_text()

          pattern = r'(\.summary\n\s*)\.as_ref\(\)(\n\s*\.ok_or_else\(\|\| bootstrap_error\("(?:summary disappeared|commitment page arrived before summary|chunk arrived before summary)"\)\)\?;)'
          s, n = re.subn(pattern, r'\1.clone()\2', s)
          assert n == 3, f'expected 3 summary borrow replacements, got {n}'

          pattern = r'(\.plan\n\s*)\.as_ref\(\)(\n\s*\.ok_or_else\(\|\| bootstrap_error\("chunk arrived before verified commitments"\)\)\?;)'
          s, n = re.subn(pattern, r'\1.clone()\2', s)
          assert n == 1, f'expected 1 plan borrow replacement, got {n}'

          replacements = [
              ('page.validate_against_summary(summary)', 'page.validate_against_summary(&summary)'),
              ('verify_fast_sync_commitment_pages_v1(summary, &pages)', 'verify_fast_sync_commitment_pages_v1(&summary, &pages)'),
              ('let plan = self.build_plan(summary, commitments);', 'let plan = self.build_plan(&summary, commitments);'),
              ('.decode_verified_bytes(summary, commitment)', '.decode_verified_bytes(&summary, commitment)'),
              ('                    plan,\n                    &self.expected,', '                    &plan,\n                    &self.expected,'),
              ('storage.load_fast_sync_network_resume_chunks_v1(plan, &self.expected)?', 'storage.load_fast_sync_network_resume_chunks_v1(&plan, &self.expected)?'),
              ('.import_complete_fast_sync_bootstrap_v1(plan, &chunks, &self.expected)?', '.import_complete_fast_sync_bootstrap_v1(&plan, &chunks, &self.expected)?'),
              ('storage.clear_fast_sync_network_resume_v1(plan, &self.expected)?', 'storage.clear_fast_sync_network_resume_v1(&plan, &self.expected)?'),
          ]
          for old, new in replacements:
              assert old in s, f'missing expected expression: {old!r}'
              s = s.replace(old, new, 1)

          p.write_text(s)
          PY
          cargo fmt --all
          git diff --check
      - name: Commit fixed candidate and remove helper
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/tmp-fast-sync-borrow-fix.yml
          git add apps/pulsedagd/src/fast_sync_bootstrap.rs
          git commit -m 'daemon: fix fast-sync controller borrow lifetimes'
          git push origin HEAD:codex/1035-fast-sync-clean-bootstrap
