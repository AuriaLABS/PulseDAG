name: Temporary v2.4.0 candidate validation dispatch

on:
  push:
    branches:
      - release/2.4.0
    paths:
      - .github/workflows/_temporary_dispatch_v2_4_0_pre_burn_in.yml

permissions:
  contents: write
  actions: write

concurrency:
  group: temporary-v2-4-0-candidate-dispatch
  cancel-in-progress: false

jobs:
  cleanup-and-dispatch:
    if: github.repository == 'AuriaLABS/PulseDAG'
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout release branch
        uses: actions/checkout@v4
        with:
          ref: release/2.4.0
          fetch-depth: 0

      - name: Remove temporary workflow and publish exact candidate
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          rm .github/workflows/_temporary_dispatch_v2_4_0_pre_burn_in.yml
          git add -A
          git commit -m 'ci: freeze combined v2.4.0 burn-in candidate'
          git push origin HEAD:release/2.4.0
          candidate_sha="$(git rev-parse HEAD)"
          remote_sha="$(git ls-remote origin refs/heads/release/2.4.0 | awk '{print $1}')"
          test "$candidate_sha" = "$remote_sha"
          printf 'candidate_sha=%s\n' "$candidate_sha" | tee candidate-sha.txt

      - name: Dispatch pre-burn-in verification on frozen candidate
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          curl --fail-with-body --silent --show-error --location \
            --request POST \
            --header 'Accept: application/vnd.github+json' \
            --header "Authorization: Bearer ${GH_TOKEN}" \
            --header 'X-GitHub-Api-Version: 2022-11-28' \
            https://api.github.com/repos/AuriaLABS/PulseDAG/actions/workflows/pre-release-verification.yml/dispatches \
            --data '{"ref":"release/2.4.0","inputs":{"release_tag":"v2.4.0"}}'
