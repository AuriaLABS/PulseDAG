name: v3 peer-addressed GetBlock unique local ID (NO GO)

on:
  pull_request:
    paths:
      - crates/pulsedag-p2p/src/lib.rs
      - .github/workflows/v3-direct-getblock-local-identity-probe.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  unique-local-getblock-ids:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Checkout exact SHA without write credentials
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Enforce unique request IDs and fail closed on protocol enablement
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
          grep -Fq '.getblock_requests_sent_total' crates/pulsedag-p2p/src/lib.rs
          grep -Fq '.checked_add(1)' crates/pulsedag-p2p/src/lib.rs
          grep -Fq 'peer_addressed_getblock_local_request_id(' crates/pulsedag-p2p/src/lib.rs
          grep -Fq '.outstanding_getblock_requests' crates/pulsedag-p2p/src/lib.rs
          grep -Fq '.contains_key(&request_id)' crates/pulsedag-p2p/src/lib.rs
          grep -Fq 'pub mod direct_getblock_swarm_bindings_v1;' crates/pulsedag-p2p/src/messages.rs
          grep -Fq 'ProtocolSupport::Outbound' crates/pulsedag-p2p/src/lib.rs
          if grep -Fq 'ProtocolSupport::Full' crates/pulsedag-p2p/src/lib.rs; then
            echo "::error::unreviewed live inbound GetBlock protocol"
            exit 1
          fi
          if grep -Fq '.direct_getblock.send_request(' crates/pulsedag-p2p/src/lib.rs; then
            echo "::error::unreviewed live outbound GetBlock activation"
            exit 1
          fi
          grep -Fq 'PULSEDAG_CONTRACTS_ENABLED=false' configs/public-testnet/node.env.template
      - name: Pin Rust 1.91
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: '1.91.0'
      - name: Compile and test same-second local correlation
        run: |
          set -euo pipefail
          cargo check --locked -p pulsedag-p2p --all-targets
          cargo test --locked -p pulsedag-p2p --lib peer_addressed_getblock_local_id_regressions -- --nocapture
          cargo fmt --all -- --check
          git diff --exit-code -- Cargo.lock
