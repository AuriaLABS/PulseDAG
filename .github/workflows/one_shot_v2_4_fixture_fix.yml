name: one-shot v2.4 fixture migration

on:
  pull_request:
    branches: [main]
    paths:
      - .github/workflows/one_shot_v2_4_fixture_fix.yml

permissions:
  contents: write

jobs:
  migrate-fixtures:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'release/2.4.0'
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout release branch
        uses: actions/checkout@v4
        with:
          ref: release/2.4.0
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Update legacy PoW test fixtures
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          def replace_once(path: str, old: str, new: str) -> None:
              file = Path(path)
              text = file.read_text()
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{path}: expected one match, found {count}")
              file.write_text(text.replace(old, new, 1))

          # Core acceptance fixtures must use consensus bits and real PoW.
          replace_once(
              "crates/pulsedag-core/src/accept.rs",
              """            build_candidate_block, build_coinbase_transaction, refresh_block_consensus_ids,\n            refresh_block_consensus_ids_with_state,\n""",
              """            build_candidate_block, build_coinbase_transaction, dev_mine_header,\n            refresh_block_consensus_ids, refresh_block_consensus_ids_with_state,\n""",
          )
          replace_once(
              "crates/pulsedag-core/src/accept.rs",
              """    fn valid_acceptance_block(state: &ChainState, _hash: &str, coinbase_nonce: u64) -> Block {\n        let parents = vec![state.dag.genesis_hash.clone()];\n        let txs = vec![build_coinbase_transaction(\"miner1\", 50, coinbase_nonce)];\n        let mut block = build_candidate_block(parents, 1, 1, txs);\n        refresh_block_consensus_ids_with_state(&mut block, state).unwrap();\n        block\n    }\n""",
              """    fn valid_acceptance_block(state: &ChainState, _hash: &str, coinbase_nonce: u64) -> Block {\n        let parents = vec![state.dag.genesis_hash.clone()];\n        let txs = vec![build_coinbase_transaction(\"miner1\", 50, coinbase_nonce)];\n        let difficulty = crate::expected_difficulty(state);\n        let mut block = build_candidate_block(parents, 1, difficulty, txs);\n        refresh_block_consensus_ids_with_state(&mut block, state).unwrap();\n        let (header, mined, _, _) = dev_mine_header(block.header.clone(), 200_000);\n        assert!(mined, \"expected acceptance fixture to satisfy consensus PoW\");\n        block.header = header;\n        refresh_block_consensus_ids(&mut block);\n        block\n    }\n""",
          )
          replace_once(
              "crates/pulsedag-core/src/accept.rs",
              """        let parents = vec![state.dag.genesis_hash.clone()];\n        build_candidate_block(parents, 1, 1, vec![coinbase, invalid_spend])\n    }\n""",
              """        let parents = vec![state.dag.genesis_hash.clone()];\n        let difficulty = crate::expected_difficulty(state);\n        let mut block = build_candidate_block(parents, 1, difficulty, vec![coinbase, invalid_spend]);\n        let (header, mined, _, _) = dev_mine_header(block.header.clone(), 200_000);\n        assert!(mined, \"expected invalid-transaction fixture to satisfy consensus PoW\");\n        block.header = header;\n        refresh_block_consensus_ids(&mut block);\n        block\n    }\n""",
          )

          # Orphan fixtures also pass through canonical acceptance when adopted.
          replace_once(
              "crates/pulsedag-core/src/orphans.rs",
              """            build_candidate_block, build_coinbase_transaction, refresh_block_consensus_ids,\n            refresh_block_consensus_ids_with_state,\n""",
              """            build_candidate_block, build_coinbase_transaction, dev_mine_header,\n            refresh_block_consensus_ids, refresh_block_consensus_ids_with_state,\n""",
          )
          replace_once(
              "crates/pulsedag-core/src/orphans.rs",
              """        let mut block = build_candidate_block(\n            parents,\n            height,\n            1,\n            vec![build_coinbase_transaction(\"miner\", 50, nonce)],\n        );\n        refresh_block_consensus_ids_with_state(&mut block, state).unwrap();\n        block\n""",
              """        let difficulty = crate::expected_difficulty(state);\n        let mut block = build_candidate_block(\n            parents,\n            height,\n            difficulty,\n            vec![build_coinbase_transaction(\"miner\", 50, nonce)],\n        );\n        refresh_block_consensus_ids_with_state(&mut block, state).unwrap();\n        let (header, mined, _, _) = dev_mine_header(block.header.clone(), 200_000);\n        assert!(mined, \"expected orphan fixture to satisfy consensus PoW\");\n        block.header = header;\n        refresh_block_consensus_ids(&mut block);\n        block\n""",
          )

          # Validation-only fixtures normalize the old literal 1 to v2.4 PoW-limit bits.
          replace_once(
              "crates/pulsedag-core/src/validation.rs",
              """            build_candidate_block, build_coinbase_transaction, refresh_block_consensus_ids,\n            refresh_block_consensus_ids_with_state,\n""",
              """            build_candidate_block as raw_build_candidate_block, build_coinbase_transaction,\n            refresh_block_consensus_ids, refresh_block_consensus_ids_with_state,\n""",
          )
          replace_once(
              "crates/pulsedag-core/src/validation.rs",
              """    fn coinbase(nonce: u64) -> Transaction {\n        build_coinbase_transaction(\"miner1\", 50, nonce)\n    }\n\n""",
              """    fn coinbase(nonce: u64) -> Transaction {\n        build_coinbase_transaction(\"miner1\", 50, nonce)\n    }\n\n    fn build_candidate_block(\n        parents: Vec<crate::types::Hash>,\n        height: u64,\n        difficulty: u32,\n        transactions: Vec<crate::types::Transaction>,\n    ) -> crate::types::Block {\n        let difficulty = if difficulty == 1 {\n            crate::retarget::CONSENSUS_POW_LIMIT_BITS\n        } else {\n            difficulty\n        };\n        raw_build_candidate_block(parents, height, difficulty, transactions)\n    }\n\n""",
          )
          replace_once(
              "crates/pulsedag-core/src/validation.rs",
              """    fn mined_next_block(state: &ChainState, difficulty: u32, nonce: u64) -> Block {\n        let mut parents = state.dag.tips.iter().cloned().collect::<Vec<_>>();\n""",
              """    fn mined_next_block(state: &ChainState, difficulty: u32, nonce: u64) -> Block {\n        let difficulty = if difficulty == 1 {\n            crate::expected_difficulty(state)\n        } else {\n            difficulty\n        };\n        let mut parents = state.dag.tips.iter().cloned().collect::<Vec<_>>();\n""",
          )
          replace_once(
              "crates/pulsedag-core/src/validation.rs",
              """    fn validate_block_accepts_expected_consensus_difficulty() {\n        let state = state_with_tip_difficulty(2);\n        assert_eq!(crate::expected_difficulty(&state), 2);\n        let block = mined_next_block(&state, 2, 90);\n\n        validate_block(&block, &state).expect(\"expected consensus difficulty block to validate\");\n    }\n""",
              """    fn validate_block_accepts_expected_consensus_difficulty() {\n        let expected = crate::retarget::CONSENSUS_POW_LIMIT_BITS;\n        let state = state_with_tip_difficulty(expected);\n        assert_eq!(crate::expected_difficulty(&state), expected);\n        let block = mined_next_block(&state, expected, 90);\n\n        validate_block(&block, &state).expect(\"expected consensus difficulty block to validate\");\n    }\n""",
          )
          replace_once(
              "crates/pulsedag-core/src/validation.rs",
              """    fn validate_block_rejects_lower_than_expected_difficulty() {\n        let state = state_with_tip_difficulty(2);\n        let block = mined_next_block(&state, 1, 91);\n\n        assert_invalid_block_contains(\n            validate_block(&block, &state),\n            \"invalid consensus difficulty 1, expected 2\",\n        );\n    }\n""",
              """    fn validate_block_rejects_lower_than_expected_difficulty() {\n        let expected = crate::retarget::CONSENSUS_POW_LIMIT_BITS;\n        let state = state_with_tip_difficulty(expected);\n        let mut block = mined_next_block(&state, expected, 91);\n        block.header.difficulty = 1;\n        refresh_block_consensus_ids(&mut block);\n\n        assert_invalid_block_contains(\n            validate_block(&block, &state),\n            &format!(\"invalid consensus difficulty 1, expected {expected}\"),\n        );\n    }\n""",
          )
          replace_once(
              "crates/pulsedag-core/src/validation.rs",
              """    fn validate_block_rejects_stale_template_difficulty() {\n        let state = state_with_tip_difficulty(4);\n        let stale_template_difficulty = 2;\n        let block = mined_next_block(&state, stale_template_difficulty, 92);\n\n        assert_invalid_block_contains(\n            validate_block(&block, &state),\n            \"invalid consensus difficulty 2, expected 4\",\n        );\n    }\n""",
              """    fn validate_block_rejects_stale_template_difficulty() {\n        let expected = crate::retarget::CONSENSUS_POW_LIMIT_BITS;\n        let state = state_with_tip_difficulty(expected);\n        let stale_template_difficulty = 2;\n        let mut block = mined_next_block(&state, expected, 92);\n        block.header.difficulty = stale_template_difficulty;\n        refresh_block_consensus_ids(&mut block);\n\n        assert_invalid_block_contains(\n            validate_block(&block, &state),\n            &format!(\"invalid consensus difficulty {stale_template_difficulty}, expected {expected}\"),\n        );\n    }\n""",
          )

          # Storage tests have a few direct one-block fixtures plus long state-aware chains.
          replace_once(
              "crates/pulsedag-storage/src/lib.rs",
              """        build_candidate_block, build_coinbase_transaction, compact_snapshot_to_retained_blocks,\n        dev_mine_header,\n""",
              """        build_candidate_block as raw_build_candidate_block, build_coinbase_transaction,\n        compact_snapshot_to_retained_blocks, dev_mine_header,\n""",
          )
          replace_once(
              "crates/pulsedag-storage/src/lib.rs",
              """    fn best_tip_hash(state: &pulsedag_core::ChainState) -> String {\n        state\n            .dag\n            .tips\n            .iter()\n            .min()\n            .cloned()\n            .unwrap_or_else(|| state.dag.genesis_hash.clone())\n    }\n\n""",
              """    fn best_tip_hash(state: &pulsedag_core::ChainState) -> String {\n        state\n            .dag\n            .tips\n            .iter()\n            .min()\n            .cloned()\n            .unwrap_or_else(|| state.dag.genesis_hash.clone())\n    }\n\n    fn build_candidate_block(\n        parents: Vec<Hash>,\n        height: u64,\n        difficulty: u32,\n        transactions: Vec<pulsedag_core::types::Transaction>,\n    ) -> Block {\n        let difficulty = if difficulty == 1 {\n            pulsedag_core::retarget::CONSENSUS_POW_LIMIT_BITS\n        } else {\n            difficulty\n        };\n        raw_build_candidate_block(parents, height, difficulty, transactions)\n    }\n\n""",
          )
          storage = Path("crates/pulsedag-storage/src/lib.rs")
          text = storage.read_text()
          text = text.replace(
              """                i as u64,\n                1,\n                vec![build_coinbase_transaction(\"miner\", 50, i as u64)],\n""",
              """                i as u64,\n                pulsedag_core::expected_difficulty(&state),\n                vec![build_coinbase_transaction(\"miner\", 50, i as u64)],\n""",
              1,
          )
          text = text.replace(
              """            height,\n            1,\n            vec![build_coinbase_transaction(\"miner\", 50, coinbase_nonce)],\n""",
              """            height,\n            pulsedag_core::expected_difficulty(state),\n            vec![build_coinbase_transaction(\"miner\", 50, coinbase_nonce)],\n""",
              1,
          )
          storage.write_text(text)

          # Node pruning/restart fixture builds long chains and must retarget every block.
          replace_once(
              "apps/pulsedagd/src/main.rs",
              """            accept_block, build_candidate_block, build_coinbase_transaction,\n            genesis::init_chain_state, pow::dev_mine_header, refresh_block_consensus_ids,\n""",
              """            accept_block, build_candidate_block, build_coinbase_transaction,\n            expected_difficulty, genesis::init_chain_state, pow::dev_mine_header,\n            refresh_block_consensus_ids,\n""",
          )
          replace_once(
              "apps/pulsedagd/src/main.rs",
              """                i as u64,\n                1,\n                vec![build_coinbase_transaction(\"miner\", 50, i as u64)],\n""",
              """                i as u64,\n                expected_difficulty(&state),\n                vec![build_coinbase_transaction(\"miner\", 50, i as u64)],\n""",
          )
          PY

          cargo fmt --all

      - name: Run affected package tests
        shell: bash
        run: |
          set -euo pipefail
          cargo test --locked -p pulsedag-core --lib
          cargo test --locked -p pulsedag-storage --lib
          cargo test --locked -p pulsedagd --bin pulsedagd

      - name: Commit clean fixture migration
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/one_shot_v2_4_fixture_fix.yml
          git config user.name "PulseDAG CI"
          git config user.email "actions@users.noreply.github.com"
          git add crates/pulsedag-core/src/accept.rs \
                  crates/pulsedag-core/src/orphans.rs \
                  crates/pulsedag-core/src/validation.rs \
                  crates/pulsedag-storage/src/lib.rs \
                  apps/pulsedagd/src/main.rs \
                  .github/workflows/one_shot_v2_4_fixture_fix.yml
          git commit -m "test: migrate fixtures to v2.4 consensus bits"
          git push origin HEAD:release/2.4.0
