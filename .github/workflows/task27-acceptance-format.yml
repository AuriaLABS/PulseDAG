name: Task 27 acceptance staging formatter

on:
  pull_request:
    branches:
      - main
    paths:
      - crates/pulsedag-p2p/tests/task27_acceptance_matrix.rs
      - .github/workflows/task27-acceptance-format.yml

permissions:
  contents: write

jobs:
  format:
    if: github.head_ref == 'agent/task27-acceptance-work'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout staging branch
        uses: actions/checkout@v4
        with:
          ref: agent/task27-acceptance-work
          fetch-depth: 0

      - name: Format acceptance matrix
        run: cargo fmt --all

      - name: Remove one-shot formatter
        run: rm .github/workflows/task27-acceptance-format.yml

      - name: Commit formatted matrix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --exit-code && exit 1 || true
          git commit -m "test: format Task 27 acceptance matrix"
          git push origin HEAD:agent/task27-acceptance-work
