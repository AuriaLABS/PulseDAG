name: Task 789 selected-segment continuation materializer

on:
  push:
    branches:
      - fix/v2.4-selected-segment-continuation-789

permissions:
  contents: write

jobs:
  materialize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Verify exact candidate base
        shell: bash
        run: |
          set -euo pipefail
          BASE=665ba8f86d3ca3b1a062504f7fee850bbb926c0a
          test "$(git merge-base "$BASE" HEAD)" = "$BASE"
          changed=$(git diff --name-only "$BASE"..HEAD -- . ':(exclude).github/workflows/task789-selected-segment-continuation-materialize.yml' ':(exclude).github/task789_selected_segment_continuation.py')
          test -z "$changed"

      - name: Apply activated-v2 selected-segment continuation fix
        run: python .github/task789_selected_segment_continuation.py

      - uses: dtolnay/rust-toolchain@1.88.0
        with:
          components: rustfmt

      - name: Format
        run: cargo fmt --all

      - name: Selected-segment regression tests
        run: cargo test -p pulsedagd selected_segment -- --nocapture

      - name: Check pulsedagd
        run: cargo check -p pulsedagd

      - name: Verify focused source delta
        shell: bash
        run: |
          set -euo pipefail
          BASE=665ba8f86d3ca3b1a062504f7fee850bbb926c0a
          changed=$(git diff --name-only "$BASE" -- . ':(exclude).github/workflows/task789-selected-segment-continuation-materialize.yml' ':(exclude).github/task789_selected_segment_continuation.py')
          test "$changed" = "apps/pulsedagd/src/main.rs"
          git diff --stat "$BASE" -- apps/pulsedagd/src/main.rs

      - name: Commit validated candidate and remove materializer
        shell: bash
        run: |
          set -euo pipefail
          git rm .github/workflows/task789-selected-segment-continuation-materialize.yml
          git rm .github/task789_selected_segment_continuation.py
          git add apps/pulsedagd/src/main.rs
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'fix(sync): advance activated-v2 selected segment across chunks'
          git push origin HEAD:fix/v2.4-selected-segment-continuation-789
