name: Sync #1066 with updated fast-sync root
on:
  push:
    branches: [codex/1035-fast-sync-persisted-resume]
permissions:
  contents: write
jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/1035-fast-sync-persisted-resume
          fetch-depth: 0
      - name: Merge current fast-sync root and publish clean head
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'kalekoi'
          git config user.email 'hermida.prada@gmail.com'
          git fetch origin codex/1035-fast-sync-manifest
          git merge --no-edit origin/codex/1035-fast-sync-manifest
          rm .github/workflows/sync-1066-fast-sync-root.yml
          git add .github/workflows/sync-1066-fast-sync-root.yml
          if ! git diff --cached --quiet; then
            git commit -m 'ci: remove #1066 sync helper'
          fi
          git diff --check
          git push origin HEAD:codex/1035-fast-sync-persisted-resume
