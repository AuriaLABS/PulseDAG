name: Wallet keystore lock probe

on:
  push:
    branches:
      - ci/wallet-keystore-lock-probe-819
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: wallet-keystore-probe
  cancel-in-progress: true

jobs:
  lock-probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout probe
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy,rustfmt

      - name: Resolve wallet dependencies against existing lock
        run: cargo check -p pulsedag-wallet

      - name: Prove resolved wallet graph is locked
        run: cargo metadata --locked --format-version 1 >/dev/null

      - name: Apply rustfmt to wallet crate
        run: cargo fmt -p pulsedag-wallet

      - name: Prove workspace formatting is clean
        run: cargo fmt --all -- --check

      - name: Execute wallet tests
        run: cargo test -p pulsedag-wallet --locked --all-targets

      - name: Clippy wallet crate
        run: cargo clippy -p pulsedag-wallet --locked --all-targets --no-deps -- -D warnings

      - name: Show wallet dependency graph
        run: cargo tree -p pulsedag-wallet --locked

      - name: Upload validated sources and lockfile
        uses: actions/upload-artifact@v4
        with:
          name: wallet-keystore-validated-output
          path: |
            Cargo.lock
            crates/pulsedag-wallet/Cargo.toml
            crates/pulsedag-wallet/src/lib.rs
            crates/pulsedag-wallet/src/keystore.rs
            crates/pulsedag-wallet/src/keystore_crypto.rs
            crates/pulsedag-wallet/src/secrets.rs
          if-no-files-found: error
          retention-days: 1

      - name: Commit generated lockfile and rustfmt output
        shell: bash
        run: |
          set -euo pipefail
          git add Cargo.lock \
            crates/pulsedag-wallet/Cargo.toml \
            crates/pulsedag-wallet/src/lib.rs \
            crates/pulsedag-wallet/src/keystore.rs \
            crates/pulsedag-wallet/src/keystore_crypto.rs \
            crates/pulsedag-wallet/src/secrets.rs
          if git diff --cached --quiet; then
            echo "No generated changes to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "wallet: record validated keystore crypto lock and formatting"
          git push origin HEAD:ci/wallet-keystore-lock-probe-819
