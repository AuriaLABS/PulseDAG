name: Wallet keystore lock probe

on:
  push:
    branches:
      - ci/wallet-keystore-lock-probe-819
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lock-probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout probe
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Resolve wallet dependencies against existing lock
        run: cargo check -p pulsedag-wallet

      - name: Prove resolved wallet graph is locked
        run: cargo metadata --locked --format-version 1 >/dev/null

      - name: Show wallet dependency graph
        run: cargo tree -p pulsedag-wallet --locked

      - name: Upload minimally updated lockfile
        uses: actions/upload-artifact@v4
        with:
          name: wallet-keystore-minimal-lock
          path: Cargo.lock
          if-no-files-found: error
          retention-days: 1
