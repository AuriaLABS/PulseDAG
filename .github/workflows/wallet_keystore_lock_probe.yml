name: Wallet keystore lock probe

on:
  push:
    branches:
      - ci/wallet-keystore-lock-probe-819
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lock-probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout probe
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Generate Cargo.lock from candidate manifests
        run: cargo generate-lockfile

      - name: Resolve wallet dependency graph
        run: cargo tree -p pulsedag-wallet

      - name: Upload generated lockfile
        uses: actions/upload-artifact@v4
        with:
          name: wallet-keystore-generated-lock
          path: Cargo.lock
          if-no-files-found: error
          retention-days: 1
