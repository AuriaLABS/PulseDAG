name: v3.0 Dependency security audit

on:
  pull_request:
    branches:
      - main
    paths:
      - Cargo.toml
      - Cargo.lock
      - apps/**/Cargo.toml
      - crates/**/Cargo.toml
      - .cargo/audit.toml
      - scripts/validate_v3_dependency_security.py
      - scripts/tests/test_v3_external_pow_oracle_security.py
      - tools/pow-upstream-reference/Cargo.toml
      - tools/pow-upstream-reference/Cargo.lock
      - docs/security/V3_DEPENDENCY_SECURITY.md
      - .github/workflows/dependency-audit.yml
      - SECURITY.md
  push:
    branches:
      - main
    paths:
      - Cargo.toml
      - Cargo.lock
      - apps/**/Cargo.toml
      - crates/**/Cargo.toml
      - .cargo/audit.toml
      - scripts/validate_v3_dependency_security.py
      - scripts/tests/test_v3_external_pow_oracle_security.py
      - tools/pow-upstream-reference/Cargo.toml
      - tools/pow-upstream-reference/Cargo.lock
      - docs/security/V3_DEPENDENCY_SECURITY.md
      - .github/workflows/dependency-audit.yml
      - SECURITY.md
  schedule:
    - cron: '17 3 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # Only first-attempt pull_request runs share a PR cancellation group. Re-runs
  # and push/tag/workflow_dispatch evidence are isolated by run_id.
  group: pr-supersession-v2-${{ github.workflow }}-${{ github.event_name }}-${{ github.event_name == 'pull_request' && github.run_attempt == 1 && github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' && github.run_attempt == 1 }}

jobs:
  rustsec:
    name: RustSec and reachability gate
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      CANDIDATE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@v4
        with:
          ref: ${{ env.CANDIDATE_SHA }}
          persist-credentials: false

      - name: Install pinned Rust toolchain
        shell: bash
        run: |
          set -euo pipefail
          rustup toolchain install 1.91.0 --profile minimal --no-self-update
          rustup default 1.91.0
          rustc --version
          cargo --version

      - name: Validate active v3 dependency remediation
        shell: bash
        run: |
          set -euo pipefail
          python scripts/validate_v3_dependency_security.py
          mkdir -p ci-evidence/dependency-audit
          for evidence in ci-evidence/dependency-v3-security/*; do
            cp "${evidence}" "ci-evidence/dependency-audit/v3-$(basename "${evidence}")"
          done

      - name: Install pinned cargo-audit
        shell: bash
        run: |
          set -euo pipefail
          cargo install cargo-audit --version 0.22.2 --locked
          cargo audit --version

      - name: Prove raw advisory scope
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p ci-evidence/dependency-audit
          set +e
          cargo audit --json >ci-evidence/dependency-audit/cargo-audit-raw.json
          raw_status=$?
          set -e
          echo "raw_exit_status=${raw_status}" >ci-evidence/dependency-audit/raw-exit-status.txt
          python - <<'PY' | tee ci-evidence/dependency-audit/raw-summary.txt
          import json
          import re
          from pathlib import Path

          report = json.load(open('ci-evidence/dependency-audit/cargo-audit-raw.json'))
          advisory_db = report.get('database') or {}
          advisory_commit = advisory_db.get('last-commit')
          advisory_updated = advisory_db.get('last-updated')
          if not isinstance(advisory_commit, str) or re.fullmatch(r'[0-9a-f]{40}', advisory_commit) is None:
              raise SystemExit('raw cargo-audit report lacks exact RustSec advisory DB commit')
          if not isinstance(advisory_updated, str) or not advisory_updated.strip():
              raise SystemExit('raw cargo-audit report lacks RustSec advisory DB last-updated provenance')
          vulnerabilities = report.get('vulnerabilities', {}).get('list', [])
          observed_vulnerabilities = {
              ((item.get('advisory') or {}).get('id'), (item.get('package') or {}).get('name'), (item.get('package') or {}).get('version'))
              for item in vulnerabilities
          }
          # Real patched Quinn/Hickory in the Cargo-generated lock:
          # any raw vulnerability, including a future RustSec DB addition,
          # must fail without exception or broad advisory ignores.
          expected_vulnerabilities = set()

          expected_advisory_warnings = {
              # The Kaspa dev-only packages now live in separately locked
              # tools/pow-upstream-reference, not the public Cargo.lock.
              ('unmaintained', 'RUSTSEC-2025-0141', 'bincode', '1.3.3'),
              ('unmaintained', 'RUSTSEC-2024-0436', 'paste', '1.0.15'),
          }

          warnings = report.get('warnings', {})
          allowed_warning_kinds = {'unmaintained', 'unsound', 'yanked'}
          if not set(warnings).issubset(allowed_warning_kinds):
              raise SystemExit(f'unexpected raw warning kinds: {sorted(warnings)}')

          observed_advisory_warnings = set()
          for kind in ('unmaintained', 'unsound'):
              for item in warnings.get(kind, []):
                  advisory = item.get('advisory') or {}
                  package = item.get('package') or {}
                  if not advisory.get('id'):
                      raise SystemExit(f'{kind} warning missing advisory id: {item!r}')
                  observed_advisory_warnings.add(
                      (kind, advisory.get('id'), package.get('name'), package.get('version'))
                  )

          observed_yanked = set()
          for item in warnings.get('yanked', []):
              if item.get('advisory') is not None:
                  raise SystemExit(f'yanked warning unexpectedly carries advisory data: {item!r}')
              package = item.get('package') or {}
              observed_yanked.add((package.get('name'), package.get('version')))
          # #1380: Cargo-generated patched exact lock no longer contains the
          # yanked async-executor@1.14.0 or chacha20@0.10.0. Any future
          # yanked dependency is new drift and must fail this security gate.
          expected_yanked = set()

          print(f'raw_vulnerability_count={len(vulnerabilities)}')
          for item in sorted(observed_vulnerabilities):
              print('vulnerability', *item)
          print(f'raw_advisory_warning_count={len(observed_advisory_warnings)}')
          for item in sorted(observed_advisory_warnings):
              print('warning', *item)
          print(f'raw_yanked_count={len(observed_yanked)}')
          for item in sorted(observed_yanked):
              print('yanked', *item)

          if observed_vulnerabilities != expected_vulnerabilities:
              raise SystemExit(f'unexpected raw vulnerability set: {sorted(observed_vulnerabilities)}')
          if observed_advisory_warnings != expected_advisory_warnings:
              raise SystemExit(f'unexpected raw advisory warning set: {sorted(observed_advisory_warnings)}')
          if observed_yanked != expected_yanked:
              raise SystemExit(f'unexpected raw yanked set: {sorted(observed_yanked)}')

          # The new main Cargo.lock is separate from the upstream Kaspa
          # PoW-test oracle lock. Prove both exact inventories rather than
          # silently treating a missing advisory as compiler-unreachable.
          import tomllib
          root_packages = tomllib.loads(Path('Cargo.lock').read_text(encoding='utf-8'))['package']
          oracle_packages = tomllib.loads(Path(
              'tools/pow-upstream-reference/Cargo.lock'
          ).read_text(encoding='utf-8'))['package']
          by_name = {}
          for p in root_packages:
              by_name.setdefault(p['name'], []).append(p)
          oracle_by_name = {}
          for p in oracle_packages:
              oracle_by_name.setdefault(p['name'], []).append(p)
          archived = {'kaspa-hashes', 'kaspa-pow', 'workflow-core',
                      'workflow-wasm', 'async-std', 'pin-utils',
                      'faster-hex', 'atty'}
          leaked = sorted(archived & set(by_name))
          if leaked:
              raise SystemExit(f'archived Kaspa dependency leaked into public lock: {leaked}')
          for name, version in {
              'libp2p': '0.57.1', 'hickory-proto': '0.26.3',
              'hickory-resolver': '0.26.3', 'rustix': '1.1.6',
              'quinn-proto': '0.11.19',
              'quinn-udp': '0.5.16',
          }.items():
              actual = by_name.get(name, [])
              if len(actual) != 1 or actual[0]['version'] != version:
                  raise SystemExit(f'public lock version not source-reviewed: {name} {actual}')
          for name in ('kaspa-hashes', 'kaspa-pow'):
              actual = oracle_by_name.get(name, [])
              if len(actual) != 1 or actual[0]['version'] != '2.0.1':
                  raise SystemExit(f'upstream oracle missing exact Kaspa {name}: {actual}')
              if not str(actual[0].get('source','')).startswith(
                  'git+https://github.com/kaspanet/rusty-kaspa?rev=cfafeb4c093fa37a303f1b9f19c58f986b870ce3#'
              ):
                  raise SystemExit(f'upstream oracle Kaspa source drift: {name}')
          security = json.loads(Path(
              'ci-evidence/dependency-audit/v3-validation.json'
          ).read_text(encoding='utf-8'))
          mode = security['kaspa_dependency_mode']
          if mode != 'native_runtime_external_reference':
              raise SystemExit(f'public source must use separate PoW oracle: {mode}')
          if not security.get('public_root_retired_kaspa_advisory_packages_absent'):
              raise SystemExit('missing positive root-lock removal evidence')
          if not security.get('upstream_oracle_separate_locked_workspace'):
              raise SystemExit('missing positive separate PoW oracle proof')
          for root in ('pulsedag-p2p', 'pulsedagd', 'pulsedag-miner', 'pulsedag-wallet'):
              packages = set(Path(
                  f'ci-evidence/dependency-audit/v3-{root}-compiled-packages.txt'
              ).read_text(encoding='utf-8').splitlines())
              forbidden = sorted(p for p in packages
                  if p.split('@', 1)[0] in archived)
              if forbidden:
                  raise SystemExit(f'archived Kaspa runtime compiler exposure: {root}: {forbidden}')
              print('absent-public-runtime', root, 'archived-kaspa-and-unmaintained-chain')

          # Hickory and Quinn are now patched; no known raw vulnerabilities.
          # Still check real compiler artifacts in EVERY clean launch root,
          # to prohibit accidental activation of optional QUIC transports.
          reviewed_optional_quic = {'quinn-proto@0.11.19', 'quinn-udp@0.5.16'}
          forbidden_quic = {'libp2p-quic', 'quinn', 'quinn-proto', 'quinn-udp'}
          roots = ('pulsedag-p2p', 'pulsedagd', 'pulsedag-miner', 'pulsedag-wallet')
          for root in roots:
              compiled = Path(f'ci-evidence/dependency-audit/v3-{root}-compiled-packages.txt')
              packages = set(compiled.read_text(encoding='utf-8').splitlines())
              forbidden = sorted(
                  package for package in packages
                  if package in reviewed_optional_quic or package.split('@', 1)[0] in forbidden_quic
              )
              if forbidden:
                  raise SystemExit(
                      f'vulnerable/optional QUIC compiler-reachable from {root}: {forbidden}; '
                      'lock-only disposition invalid'
                  )
              for package in sorted(reviewed_optional_quic):
                  print('unreachable', root, package)
              print('unreachable', root, 'quinn-stack')
          PY

      - name: Enforce configured audit policy
        shell: bash
        run: |
          set -euo pipefail
          # No vulnerability waivers: the exact raw report has already been
          # checked for ZERO vulnerabilities and the persisted .cargo/audit.toml
          # remains ignore=[]. A fresh DB advisory fails this command.
          cargo audit --json | tee ci-evidence/dependency-audit/cargo-audit-configured.json

      - name: Record exact-candidate audit provenance
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p ci-evidence/dependency-audit
          {
            echo "candidate_sha=${CANDIDATE_SHA}"
            echo "checked_out_sha=$(git rev-parse HEAD)"
            echo "rustc=$(rustc --version 2>/dev/null || true)"
            echo "cargo=$(cargo --version 2>/dev/null || true)"
            echo "cargo_audit=$(cargo audit --version 2>/dev/null || true)"
            # Read the actual DB commit from cargo-audit's raw JSON output, not a possibly absent local git checkout.
            echo "advisory_db_sha=$(python -c 'import json; print(json.load(open("ci-evidence/dependency-audit/cargo-audit-raw.json"))["database"]["last-commit"])' 2>/dev/null || true)"
            echo "cargo_lock_sha256=$(sha256sum Cargo.lock | awk '{print $1}')"
            echo "audit_config_sha256=$(sha256sum .cargo/audit.toml | awk '{print $1}')"
            echo "v3_gate_sha256=$(sha256sum scripts/validate_v3_dependency_security.py | awk '{print $1}')"
            echo "v3_security_record_sha256=$(sha256sum docs/security/V3_DEPENDENCY_SECURITY.md | awk '{print $1}')"
          } >ci-evidence/dependency-audit/provenance.txt
          test "$(git rev-parse HEAD)" = "${CANDIDATE_SHA}"
          find ci-evidence/dependency-audit -maxdepth 1 -type f ! -name SHA256SUMS \
            -print0 | sort -z | xargs -0 sha256sum >ci-evidence/dependency-audit/SHA256SUMS

      - name: Upload dependency-audit evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dependency_audit_${{ github.run_id }}
          path: ci-evidence/dependency-audit
          if-no-files-found: error
          retention-days: 90
