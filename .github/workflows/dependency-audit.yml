name: Dependency security audit

on:
  pull_request:
    branches:
      - main
    paths:
      - Cargo.toml
      - Cargo.lock
      - apps/**/Cargo.toml
      - crates/**/Cargo.toml
      - .cargo/audit.toml
      - scripts/validate_v3_dependency_security.py
      - docs/security/V3_DEPENDENCY_SECURITY.md
      - .github/workflows/dependency-audit.yml
      - SECURITY.md
  push:
    branches:
      - main
    paths:
      - Cargo.toml
      - Cargo.lock
      - apps/**/Cargo.toml
      - crates/**/Cargo.toml
      - .cargo/audit.toml
      - scripts/validate_v3_dependency_security.py
      - docs/security/V3_DEPENDENCY_SECURITY.md
      - .github/workflows/dependency-audit.yml
      - SECURITY.md
  schedule:
    - cron: '17 3 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: dependency-audit-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rustsec:
    name: RustSec and reachability gate
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      CANDIDATE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@v4
        with:
          ref: ${{ env.CANDIDATE_SHA }}
          persist-credentials: false

      - name: Install pinned Rust toolchain
        shell: bash
        run: |
          set -euo pipefail
          rustup toolchain install 1.88.0 --profile minimal --no-self-update
          rustup default 1.88.0
          rustc --version
          cargo --version

      - name: Validate active v3 dependency remediation
        shell: bash
        run: |
          set -euo pipefail
          python scripts/validate_v3_dependency_security.py
          mkdir -p ci-evidence/dependency-audit
          for evidence in ci-evidence/dependency-v3-security/*; do
            cp "${evidence}" "ci-evidence/dependency-audit/v3-$(basename "${evidence}")"
          done

      - name: Install pinned cargo-audit
        shell: bash
        run: |
          set -euo pipefail
          cargo install cargo-audit --version 0.22.2 --locked
          cargo audit --version

      - name: Prove raw advisory scope
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p ci-evidence/dependency-audit
          set +e
          cargo audit --json >ci-evidence/dependency-audit/cargo-audit-raw.json
          raw_status=$?
          set -e
          echo "raw_exit_status=${raw_status}" >ci-evidence/dependency-audit/raw-exit-status.txt
          python - <<'PY' | tee ci-evidence/dependency-audit/raw-summary.txt
          import json

          report = json.load(open('ci-evidence/dependency-audit/cargo-audit-raw.json'))
          vulnerabilities = report.get('vulnerabilities', {}).get('list', [])
          observed_vulnerabilities = {
              ((item.get('advisory') or {}).get('id'), (item.get('package') or {}).get('name'), (item.get('package') or {}).get('version'))
              for item in vulnerabilities
          }
          expected_vulnerabilities = set()

          expected_advisory_warnings = {
              ('unmaintained', 'RUSTSEC-2025-0052', 'async-std', '1.13.2'),
              ('unmaintained', 'RUSTSEC-2024-0375', 'atty', '0.2.14'),
              ('unsound', 'RUSTSEC-2021-0145', 'atty', '0.2.14'),
              ('unmaintained', 'RUSTSEC-2025-0141', 'bincode', '1.3.3'),
              ('unmaintained', 'RUSTSEC-2024-0384', 'instant', '0.1.13'),
              ('unsound', 'RUSTSEC-2024-0407', 'linkme', '0.2.10'),
              ('unmaintained', 'RUSTSEC-2024-0436', 'paste', '1.0.15'),
              ('unmaintained', 'RUSTSEC-2024-0370', 'proc-macro-error', '1.0.4'),
          }

          warnings = report.get('warnings', {})
          allowed_warning_kinds = {'unmaintained', 'unsound', 'yanked'}
          if not set(warnings).issubset(allowed_warning_kinds):
              raise SystemExit(f'unexpected raw warning kinds: {sorted(warnings)}')

          observed_advisory_warnings = set()
          for kind in ('unmaintained', 'unsound'):
              for item in warnings.get(kind, []):
                  advisory = item.get('advisory') or {}
                  package = item.get('package') or {}
                  if not advisory.get('id'):
                      raise SystemExit(f'{kind} warning missing advisory id: {item!r}')
                  observed_advisory_warnings.add(
                      (kind, advisory.get('id'), package.get('name'), package.get('version'))
                  )

          observed_yanked = set()
          for item in warnings.get('yanked', []):
              if item.get('advisory') is not None:
                  raise SystemExit(f'yanked warning unexpectedly carries advisory data: {item!r}')
              package = item.get('package') or {}
              observed_yanked.add((package.get('name'), package.get('version')))
          expected_yanked = {('chacha20', '0.10.0')}

          print(f'raw_vulnerability_count={len(vulnerabilities)}')
          for item in sorted(observed_vulnerabilities):
              print('vulnerability', *item)
          print(f'raw_advisory_warning_count={len(observed_advisory_warnings)}')
          for item in sorted(observed_advisory_warnings):
              print('warning', *item)
          print(f'raw_yanked_count={len(observed_yanked)}')
          for item in sorted(observed_yanked):
              print('yanked', *item)

          if observed_vulnerabilities != expected_vulnerabilities:
              raise SystemExit(f'unexpected raw vulnerability set: {sorted(observed_vulnerabilities)}')
          if observed_advisory_warnings != expected_advisory_warnings:
              raise SystemExit(f'unexpected raw advisory warning set: {sorted(observed_advisory_warnings)}')
          if observed_yanked != expected_yanked:
              raise SystemExit(f'unexpected raw yanked set: {sorted(observed_yanked)}')
          PY

      - name: Enforce configured audit policy
        shell: bash
        run: |
          set -euo pipefail
          cargo audit --json | tee ci-evidence/dependency-audit/cargo-audit-configured.json

      - name: Record exact-candidate audit provenance
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p ci-evidence/dependency-audit
          {
            echo "candidate_sha=${CANDIDATE_SHA}"
            echo "checked_out_sha=$(git rev-parse HEAD)"
            echo "rustc=$(rustc --version 2>/dev/null || true)"
            echo "cargo=$(cargo --version 2>/dev/null || true)"
            echo "cargo_audit=$(cargo audit --version 2>/dev/null || true)"
            echo "advisory_db_sha=$(git -C \"${HOME}/.cargo/advisory-db\" rev-parse HEAD 2>/dev/null || true)"
            echo "cargo_lock_sha256=$(sha256sum Cargo.lock | awk '{print $1}')"
            echo "audit_config_sha256=$(sha256sum .cargo/audit.toml | awk '{print $1}')"
            echo "v3_gate_sha256=$(sha256sum scripts/validate_v3_dependency_security.py | awk '{print $1}')"
            echo "v3_security_record_sha256=$(sha256sum docs/security/V3_DEPENDENCY_SECURITY.md | awk '{print $1}')"
          } >ci-evidence/dependency-audit/provenance.txt
          test "$(git rev-parse HEAD)" = "${CANDIDATE_SHA}"
          find ci-evidence/dependency-audit -maxdepth 1 -type f ! -name SHA256SUMS \
            -print0 | sort -z | xargs -0 sha256sum >ci-evidence/dependency-audit/SHA256SUMS

      - name: Upload dependency-audit evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dependency_audit_${{ github.run_id }}
          path: ci-evidence/dependency-audit
          if-no-files-found: error
          retention-days: 90
