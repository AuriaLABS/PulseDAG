name: Task30 control-plane validation

on:
  pull_request:
    branches:
      - main
    paths:
      - .github/workflows/task30-control-plane-validation.yml

permissions:
  contents: read

env:
  CANDIDATE_SHA: 5e0a97d143faa7e85838873d11e937c44976820e

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout control plane
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          path: control-plane
          persist-credentials: false
      - name: Checkout exact product candidate
        uses: actions/checkout@v4
        with:
          ref: ${{ env.CANDIDATE_SHA }}
          path: candidate
          persist-credentials: false
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
      - name: Verify exact candidate
        run: |
          set -euo pipefail
          test "$(git -C candidate rev-parse HEAD)" = "$CANDIDATE_SHA"
          test -z "$(git -C candidate status --porcelain)"
      - name: Build isolated Task30 signer
        run: |
          set -euo pipefail
          cargo build --manifest-path control-plane/.github/task30-control/tx-helper/Cargo.toml
      - name: Prepare prune harness with stale-template overlay
        env:
          ADAPT_DIR: ${{ runner.temp }}/task30-control-plane-validation/prune
        run: |
          set -euo pipefail
          mkdir -p "$ADAPT_DIR"
          python3 -m py_compile \
            control-plane/.github/task30-control/adapt_harness_v2.py \
            control-plane/.github/task30-control/prune_stale_overlay.py
          python3 control-plane/.github/task30-control/adapt_harness_v2.py \
            prune "$GITHUB_WORKSPACE/candidate" "$ADAPT_DIR/prune-harness.sh"
          python3 control-plane/.github/task30-control/prune_stale_overlay.py \
            "$ADAPT_DIR/prune-harness.sh"
          bash -n "$ADAPT_DIR/prune-harness.sh"
          grep -q 'template_skipped_stale' "$ADAPT_DIR/prune-harness.sh"
          test -s "$ADAPT_DIR/harness.diff"
          test -s "$ADAPT_DIR/stale-template-overlay.diff"
          test -s "$ADAPT_DIR/STALE_OVERLAY_SHA256SUMS"
          test -z "$(git -C candidate status --porcelain)"
