name: v3 signed 26-header checkpoint prune replay (TEST ONLY)

on:
  pull_request:
    branches: [main]
    paths:
      - crates/pulsedag-storage/tests/native_v3_dormant_signed_checkpoint_trial.rs
      - crates/pulsedag-core/src/native_ghostdag_policy_candidate_v3.rs
      - crates/pulsedag-core/src/native_v3_signed_prestate_trial.rs
      - crates/pulsedag-core/src/pow_v3.rs
      - crates/pulsedag-core/src/block_envelope_v3.rs
      - crates/pulsedag-storage/src/native_envelope_v3.rs
      - crates/pulsedag-core/Cargo.toml
      - crates/pulsedag-storage/Cargo.toml
      - Cargo.lock
      - .github/workflows/v3-signed-26header-prune-checkpoint-trial.yml
  push:
    branches: [main]
    paths:
      - crates/pulsedag-storage/tests/native_v3_dormant_signed_checkpoint_trial.rs
      - crates/pulsedag-core/src/native_ghostdag_policy_candidate_v3.rs
      - crates/pulsedag-core/src/native_v3_signed_prestate_trial.rs
      - crates/pulsedag-core/src/pow_v3.rs
      - crates/pulsedag-core/src/block_envelope_v3.rs
      - crates/pulsedag-storage/src/native_envelope_v3.rs
      - crates/pulsedag-core/Cargo.toml
      - crates/pulsedag-storage/Cargo.toml
      - Cargo.lock
      - .github/workflows/v3-signed-26header-prune-checkpoint-trial.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: v3-signed-26header-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  real-pow-signed-prune-differential:
    runs-on: ubuntu-24.04
    timeout-minutes: 65
    env:
      CARGO_INCREMENTAL: "0"
      CARGO_BUILD_JOBS: "2"
    steps:
      - name: Checkout exact head without persisted credentials
        uses: actions/checkout@v4
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Verify exact candidate checkout
        shell: bash
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
      - name: Install pinned Rust, rustfmt and Clippy
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.91.0"
          components: rustfmt, clippy
      - name: Enforce workspace formatting
        run: cargo fmt --all -- --check
      - name: Require all four isolated signed prune regressions (no ignored tests)
        shell: bash
        run: |
          set -euo pipefail
          cargo test --locked -p pulsedag-storage --test native_v3_dormant_signed_checkpoint_trial -- --nocapture --test-threads=1 2>&1 | tee /tmp/v3-signed-prune-replay.log
          grep -Fq 'test result: ok. 4 passed; 0 failed; 0 ignored;' /tmp/v3-signed-prune-replay.log
      - name: Reject clippy warnings in exact test target
        run: cargo clippy --locked -p pulsedag-storage --test native_v3_dormant_signed_checkpoint_trial -- -D warnings
      - name: Confirm immutable dependencies
        run: git diff --exit-code -- Cargo.lock
