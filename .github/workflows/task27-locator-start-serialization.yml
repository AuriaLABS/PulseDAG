name: Task 27 locator start serialization

on:
  push:
    branches:
      - agent/task27-rejoin-runtime-work

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: agent/task27-rejoin-runtime-work
          fetch-depth: 0

      - name: Apply exact locator-start serialization
        run: python3 .github/task27_locator_start_serialization.py

      - name: Remove one-shot editor files
        run: rm .github/task27_locator_start_serialization.py .github/workflows/task27-locator-start-serialization.yml

      - name: Format and validate patch
        run: |
          cargo fmt --all
          git diff --check
          git diff --stat
          git diff -- apps/pulsedagd/src/main.rs | sed -n '1,420p'

      - name: Commit exact source edit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "node: serialize Task 27 and legacy locator starts"
          git push origin HEAD:agent/task27-rejoin-runtime-work
