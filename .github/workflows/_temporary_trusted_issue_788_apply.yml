name: Trusted one-shot issue 788 fix

on:
  pull_request:
    branches:
      - release/2.4.0
    paths:
      - .github/workflows/_temporary_issue_788_fix.yml

permissions:
  contents: write

concurrency:
  group: trusted-one-shot-issue-788
  cancel-in-progress: false

jobs:
  apply-test-publish:
    if: github.repository == 'AuriaLABS/PulseDAG' && github.event.pull_request.number == 790
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v4
        with:
          ref: feature/2.4.0-parent-state-context-unavailable
          fetch-depth: 0

      - name: Apply issue 788 patch
        shell: bash
        env:
          PATCH_GZ_B64: ''
        run: |
          set -euo pipefail
          printf '%s' "$PATCH_GZ_B64" | base64 -d | gzip -d > /tmp/issue-788.patch
          git apply --check /tmp/issue-788.patch
          git apply /tmp/issue-788.patch

      - name: Format workspace
        run: cargo fmt --all

      - name: Check affected crates
        run: cargo check -p pulsedag-core -p pulsedag-rpc

      - name: Test compact snapshot regressions
        run: cargo test -p pulsedag-core --test compact_snapshot_commit -- --nocapture

      - name: Test RPC rejection taxonomy
        run: cargo test -p pulsedag-rpc parent_state_context_unavailable_has_stable_rpc_reason_code -- --nocapture

      - name: Remove feature workflow and verify scope
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/_temporary_issue_788_fix.yml
          git diff --check
          allowed='^(crates/pulsedag-core/src/validation\.rs|crates/pulsedag-core/tests/compact_snapshot_commit\.rs|crates/pulsedag-rpc/src/handlers/mining_submit\.rs|\.github/workflows/_temporary_issue_788_fix\.yml)$'
          unexpected="$(git status --short | awk '{print $2}' | grep -Ev "$allowed" || true)"
          if [[ -n "$unexpected" ]]; then
            printf 'unexpected changed paths:\n%s\n' "$unexpected" >&2
            exit 1
          fi

      - name: Commit tested fix
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'fix: classify pruned side-parent context as unavailable'
          git push origin HEAD:feature/2.4.0-parent-state-context-unavailable
