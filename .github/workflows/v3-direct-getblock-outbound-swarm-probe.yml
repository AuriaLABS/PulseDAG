name: v3 direct GetBlock outbound-only Swarm probe (no GO)

on:
  pull_request:
    paths:
      - crates/pulsedag-p2p/src/lib.rs
      - crates/pulsedag-p2p/src/messages/direct_getblock_codec_v1.rs
      - crates/pulsedag-p2p/src/messages/direct_getblock_pending_v1.rs
      - Cargo.lock
      - .github/workflows/v3-direct-getblock-outbound-swarm-probe.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  outbound-only-real-swarm:
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    steps:
      - name: Checkout exact unmerged test candidate
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Source identity and non-activation guards
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
          grep -Fq 'ProtocolSupport::Outbound' crates/pulsedag-p2p/src/lib.rs
          grep -Fq 'direct_getblock: DirectGetBlockSwarmBehaviourV1' crates/pulsedag-p2p/src/lib.rs
          if grep -Fq 'ProtocolSupport::Full' crates/pulsedag-p2p/src/lib.rs; then
            echo "::error::inbound direct GetBlock support is forbidden in this slice"
            exit 1
          fi
          if grep -Fq '.direct_getblock.send_request(' crates/pulsedag-p2p/src/lib.rs; then
            echo "::error::direct GetBlock send_request is forbidden in this slice"
            exit 1
          fi
          grep -Fq 'PULSEDAG_CONTRACTS_ENABLED=false' configs/public-testnet/node.env.template
          grep -Fq 'PULSEDAG_P2P_ENABLED=false' configs/public-testnet/node.env.template
      - name: Install pinned Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: '1.91.0'
      - name: Check P2P and real Swarm initialization with exact lock
        run: |
          set -euo pipefail
          cargo check --locked -p pulsedag-p2p --all-targets
          cargo test --locked -p pulsedag-p2p --lib real_runtime_mode_initializes_without_loopback_labeling -- --nocapture
          cargo fmt --all -- --check
          git diff --exit-code -- Cargo.lock
