name: one-shot v2.4 fixture migration round 3

on:
  pull_request:
    branches: [main]
    paths:
      - .github/workflows/one_shot_v2_4_fixture_fix_round3.yml

permissions:
  contents: write

jobs:
  migrate-fixtures:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'release/2.4.0'
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout release branch
        uses: actions/checkout@v4
        with:
          ref: release/2.4.0
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Apply complete fixture migration
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          def replace_once(path: str, old: str, new: str) -> None:
              file = Path(path)
              text = file.read_text()
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{path}: expected one match, found {count}")
              file.write_text(text.replace(old, new, 1))

          # Reuse the complete first-pass migration, correcting the PoW helper path.
          workflow = Path('.github/workflows/one_shot_v2_4_fixture_fix.yml').read_text()
          marker = "          python3 - <<'PY'\n"
          start = workflow.index(marker) + len(marker)
          end = workflow.index("\n          PY\n", start)
          embedded = workflow[start:end]
          script = "\n".join(
              line[10:] if line.startswith("          ") else line
              for line in embedded.splitlines()
          )
          script = script.replace(
              "build_candidate_block, build_coinbase_transaction, dev_mine_header,\\n            refresh_block_consensus_ids, refresh_block_consensus_ids_with_state,\\n",
              "build_candidate_block, build_coinbase_transaction,\\n            refresh_block_consensus_ids, refresh_block_consensus_ids_with_state,\\n",
          )
          script = script.replace(
              "let (header, mined, _, _) = dev_mine_header(",
              "let (header, mined, _, _) = crate::dev_mine_header(",
          )
          exec(compile(script, 'embedded_fixture_migration.py', 'exec'), {})

          # Replace the second family of acceptance fixtures with the canonical helper.
          replace_once(
              'crates/pulsedag-core/src/accept.rs',
              '''        let parents = vec![state.dag.genesis_hash.clone()];
        let txs = vec![build_coinbase_transaction("miner1", 50, 1)];
        let mut block = build_candidate_block(parents, 1, 1, txs);
        refresh_block_consensus_ids_with_state(&mut block, &state).unwrap();

        assert!(accept_block(block, &mut state, AcceptSource::P2p).is_ok());
''',
              '''        let block = valid_acceptance_block(&state, "valid-pow", 1);

        assert!(accept_block(block, &mut state, AcceptSource::P2p).is_ok());
''',
          )
          replace_once(
              'crates/pulsedag-core/src/accept.rs',
              '''        let parents = vec![state.dag.genesis_hash.clone()];
        let txs = vec![build_coinbase_transaction("miner1", 50, 1)];
        let mut block = build_candidate_block(parents, 1, 1, txs);
        refresh_block_consensus_ids_with_state(&mut block, &state).unwrap();
        assert!(accept_block(block.clone(), &mut state, AcceptSource::P2p).is_ok());
''',
              '''        let block = valid_acceptance_block(&state, "duplicate", 1);
        assert!(accept_block(block.clone(), &mut state, AcceptSource::P2p).is_ok());
''',
          )
          replace_once(
              'crates/pulsedag-core/src/accept.rs',
              '''        let parents = vec![state.dag.genesis_hash.clone()];
        let coinbase = build_coinbase_transaction("miner1", 50, 1);
        let mut invalid_spend = crate::types::Transaction {
            txid: String::new(),
            version: 1,
            inputs: vec![crate::types::TxInput {
                previous_output: crate::types::OutPoint {
                    txid: "missing-utxo".to_string(),
                    index: 0,
                },
                public_key: "not-a-valid-public-key".to_string(),
                signature: "not-a-valid-signature".to_string(),
            }],
            outputs: vec![crate::types::TxOutput {
                address: "receiver".to_string(),
                amount: 1,
            }],
            fee: 0,
            nonce: 1,
        };
        invalid_spend.txid = crate::tx::compute_txid(&invalid_spend);
        let block = build_candidate_block(parents, 1, 1, vec![coinbase, invalid_spend]);
''',
              '''        let block = invalid_transaction_acceptance_block(&state);
''',
          )
          replace_once(
              'crates/pulsedag-core/src/accept.rs',
              '''        let parents = vec![init_chain_state("agreement".to_string()).dag.genesis_hash];
        let txs = vec![build_coinbase_transaction("miner1", 50, 1)];
        let mut peer_state = init_chain_state("agreement".to_string());
        let mut mining_state = init_chain_state("agreement".to_string());
        let mut block = build_candidate_block(parents, 1, 1, txs);
        refresh_block_consensus_ids_with_state(&mut block, &peer_state).unwrap();
''',
              '''        let mut peer_state = init_chain_state("agreement".to_string());
        let mut mining_state = init_chain_state("agreement".to_string());
        let block = valid_acceptance_block(&peer_state, "agreement", 1);
''',
          )
          replace_once(
              'crates/pulsedag-core/src/accept.rs',
              '''        let mut block = build_candidate_block(parents, 1, 1, txs);
        block.hash = "mutated-block".to_string();
        let outcome = accept_block_with_result(block, &mut state, AcceptSource::P2p);
''',
              '''        let difficulty = crate::expected_difficulty(&state);
        let mut block = build_candidate_block(parents, 1, difficulty, txs);
        let (header, mined, _, _) = crate::dev_mine_header(block.header.clone(), 200_000);
        assert!(mined, "expected malformed fixture to satisfy consensus PoW");
        block.header = header;
        block.hash = "mutated-block".to_string();
        let outcome = accept_block_with_result(block, &mut state, AcceptSource::P2p);
''',
          )

          # A single helper makes post-mutation PoW explicit in validation tests.
          replace_once(
              'crates/pulsedag-core/src/validation.rs',
              '''        raw_build_candidate_block(parents, height, difficulty, transactions)
    }

    fn structurally_valid_block(state: &ChainState) -> Block {
''',
              '''        raw_build_candidate_block(parents, height, difficulty, transactions)
    }

    fn mine_current_header(block: &mut Block) {
        let (header, mined, _, _) = crate::dev_mine_header(block.header.clone(), 200_000);
        assert!(mined, "expected validation fixture to satisfy consensus PoW");
        block.header = header;
        refresh_block_consensus_ids(block);
    }

    fn structurally_valid_block(state: &ChainState) -> Block {
''',
          )
          replace_once(
              'crates/pulsedag-core/src/validation.rs',
              '''        let mut block = build_candidate_block(parents, 1, 1, vec![coinbase(1)]);
        refresh_block_consensus_ids_with_state(&mut block, state).unwrap();
        block
''',
              '''        let mut block = build_candidate_block(parents, 1, 1, vec![coinbase(1)]);
        refresh_block_consensus_ids_with_state(&mut block, state).unwrap();
        mine_current_header(&mut block);
        block
''',
          )
          replace_once(
              'crates/pulsedag-core/src/validation.rs',
              '''        b.header.state_root = "wrong-side-root".to_string();
        refresh_block_consensus_ids(&mut b);

        match validate_block(&b, &state) {
''',
              '''        b.header.state_root = "wrong-side-root".to_string();
        refresh_block_consensus_ids(&mut b);
        mine_current_header(&mut b);

        match validate_block(&b, &state) {
''',
          )
          replace_once(
              'crates/pulsedag-core/src/validation.rs',
              '''        let mut side_branch = build_candidate_block(parents.clone(), 1, 1, vec![coinbase(31)]);
        refresh_block_consensus_ids_with_state(&mut side_branch, &state).unwrap();

        let mut competing_tip = build_candidate_block(parents, 1, 1, vec![coinbase(32)]);
        refresh_block_consensus_ids_with_state(&mut competing_tip, &state).unwrap();
        apply_block(&competing_tip, &mut state).unwrap();
''',
              '''        let mut side_branch = build_candidate_block(parents.clone(), 1, 1, vec![coinbase(31)]);
        refresh_block_consensus_ids_with_state(&mut side_branch, &state).unwrap();
        mine_current_header(&mut side_branch);

        let mut competing_tip = build_candidate_block(parents, 1, 1, vec![coinbase(32)]);
        refresh_block_consensus_ids_with_state(&mut competing_tip, &state).unwrap();
        mine_current_header(&mut competing_tip);
        apply_block(&competing_tip, &mut state).unwrap();
''',
          )

          # Reward and multi-parent tests need PoW after their final state-root update.
          validation = Path('crates/pulsedag-core/src/validation.rs')
          text = validation.read_text()
          targeted = [
              ('refresh_block_consensus_ids_with_state(&mut block, &state).unwrap();\n\n        assert_validation_error(validate_block(&block, &state), |err| {\n            matches!(err, PulseError::ExcessiveCoinbaseReward)',
               'refresh_block_consensus_ids_with_state(&mut block, &state).unwrap();\n        mine_current_header(&mut block);\n\n        assert_validation_error(validate_block(&block, &state), |err| {\n            matches!(err, PulseError::ExcessiveCoinbaseReward)'),
              ('refresh_block_consensus_ids_with_state(&mut funding_block, &state).unwrap();\n        apply_block(&funding_block, &mut state).unwrap();',
               'refresh_block_consensus_ids_with_state(&mut funding_block, &state).unwrap();\n        mine_current_header(&mut funding_block);\n        apply_block(&funding_block, &mut state).unwrap();'),
              ('refresh_block_consensus_ids_with_state(&mut block, &state).unwrap();\n\n        validate_block(&block, &state).expect("fee-inclusive reward should validate");',
               'refresh_block_consensus_ids_with_state(&mut block, &state).unwrap();\n        mine_current_header(&mut block);\n\n        validate_block(&block, &state).expect("fee-inclusive reward should validate");'),
              ('refresh_block_consensus_ids_with_state(&mut block, &state).unwrap();\n\n        assert_validation_error(validate_block(&block, &state), |err| {\n            matches!(err, PulseError::RewardOverflow)',
               'refresh_block_consensus_ids_with_state(&mut block, &state).unwrap();\n        mine_current_header(&mut block);\n\n        assert_validation_error(validate_block(&block, &state), |err| {\n            matches!(err, PulseError::RewardOverflow)'),
              ('block.header.timestamp = parent.header.timestamp + 1;\n        refresh_block_consensus_ids_with_state(&mut block, &state).unwrap();\n\n        assert!(validate_block(&block, &state).is_ok());',
               'block.header.timestamp = parent.header.timestamp + 1;\n        refresh_block_consensus_ids_with_state(&mut block, &state).unwrap();\n        mine_current_header(&mut block);\n\n        assert!(validate_block(&block, &state).is_ok());'),
          ]
          for old, new in targeted:
              if old not in text:
                  raise SystemExit(f'validation target not found: {old[:80]}')
              text = text.replace(old, new, 1)

          # The second excessive-reward test has the same assertion shape; mine the remaining one.
          needle = 'refresh_block_consensus_ids_with_state(&mut block, &state).unwrap();\n\n        assert_validation_error(validate_block(&block, &state), |err| {\n            matches!(err, PulseError::ExcessiveCoinbaseReward)'
          if needle in text:
              text = text.replace(
                  needle,
                  'refresh_block_consensus_ids_with_state(&mut block, &state).unwrap();\n        mine_current_header(&mut block);\n\n        assert_validation_error(validate_block(&block, &state), |err| {\n            matches!(err, PulseError::ExcessiveCoinbaseReward)',
                  1,
              )
          validation.write_text(text)
          PY

          cargo fmt --all

      - name: Run affected package tests
        shell: bash
        run: |
          set -euo pipefail
          cargo test --locked -p pulsedag-core --lib
          cargo test --locked -p pulsedag-storage --lib
          cargo test --locked -p pulsedagd --bin pulsedagd

      - name: Commit clean fixture migration
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/one_shot_v2_4_fixture_fix.yml
          rm .github/workflows/one_shot_v2_4_fixture_fix_retry.yml
          rm .github/workflows/one_shot_v2_4_fixture_fix_round3.yml
          git config user.name "PulseDAG CI"
          git config user.email "actions@users.noreply.github.com"
          git add crates/pulsedag-core/src/accept.rs \
                  crates/pulsedag-core/src/orphans.rs \
                  crates/pulsedag-core/src/validation.rs \
                  crates/pulsedag-storage/src/lib.rs \
                  apps/pulsedagd/src/main.rs \
                  .github/workflows/one_shot_v2_4_fixture_fix.yml \
                  .github/workflows/one_shot_v2_4_fixture_fix_retry.yml \
                  .github/workflows/one_shot_v2_4_fixture_fix_round3.yml
          git commit -m "test: migrate fixtures to v2.4 consensus bits"
          git push origin HEAD:release/2.4.0
