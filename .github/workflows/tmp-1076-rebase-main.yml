name: temporary 1076 rebase onto current main

on:
  push:
    branches:
      - codex/1036-mempool-v3-live-policy
    paths:
      - .github/workflows/tmp-1076-rebase-main.yml

permissions:
  contents: write

jobs:
  rebase:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/1036-mempool-v3-live-policy
          fetch-depth: 0
      - name: Rebase candidate and verify current fast-sync gate exists
        run: |
          set -euo pipefail
          git config user.name 'chatgpt-codex-connector[bot]'
          git config user.email '199175422+chatgpt-codex-connector[bot]@users.noreply.github.com'
          git fetch origin main
          test "$(git rev-parse origin/main)" = "47f8bd9dbf5bdc64bdf0cbca4bf029dfedcdc661"
          git rebase origin/main
          test -f crates/pulsedag-storage/tests/v3_fast_sync_restore_rejoin.rs
          cargo fmt --all -- --check
          rm .github/workflows/tmp-1076-rebase-main.yml
          git add .github/workflows/tmp-1076-rebase-main.yml
          git commit -m 'ci: remove temporary 1076 rebase helper'
          git push --force-with-lease origin HEAD:codex/1036-mempool-v3-live-policy
