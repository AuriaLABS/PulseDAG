name: task28-v2-template-compile-fix

on:
  push:
    branches:
      - agent/task28-v2-mining-template-rpc

permissions:
  contents: write

jobs:
  compile-fix:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/task28-v2-mining-template-rpc
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: Apply exact compile fixes
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          p = Path('crates/pulsedag-rpc/src/handlers/mining_template_protocol.rs')
          text = p.read_text()

          marker = '''pub use super::mining_template_legacy::StoredMiningTemplate;\npub(crate) use super::mining_template_legacy::{'''
          replacement = '''#[cfg(test)]\npub(crate) use super::mining_template_legacy::store_template;\npub use super::mining_template_legacy::StoredMiningTemplate;\npub(crate) use super::mining_template_legacy::{'''
          if text.count(marker) != 1:
              raise SystemExit('expected one mining template legacy reexport marker')
          text = text.replace(marker, replacement)

          old = '''            let duplicate_tx_filtered_total = {\n                let runtime_handle = state.runtime();\n                runtime_handle.read().await.duplicate_tx_filtered_total\n            };'''
          new = '''            let duplicate_tx_filtered_total = {\n                let runtime_handle = state.runtime();\n                let value = runtime_handle.read().await.duplicate_tx_filtered_total;\n                value\n            };'''
          if text.count(old) != 1:
              raise SystemExit('expected one runtime duplicate counter read block')
          text = text.replace(old, new)
          p.write_text(text)
          PY

          cargo fmt --all
          git diff --check
          cargo test -p pulsedag-rpc --all-targets --no-run

          mapfile -t changed < <(git diff --name-only)
          for path in "${changed[@]}"; do
            if [[ "$path" != "crates/pulsedag-rpc/src/handlers/mining_template_protocol.rs" ]]; then
              echo "::error::unexpected source path changed: $path"
              exit 1
            fi
          done
      - name: Commit source and remove one-shot workflow
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- crates/pulsedag-rpc/src/handlers/mining_template_protocol.rs
          git rm -- .github/workflows/task28-v2-template-compile-fix.yml
          git commit -m "rpc: fix activated-v2 template facade compilation"
          git push origin HEAD:agent/task28-v2-mining-template-rpc
