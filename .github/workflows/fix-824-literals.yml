name: fix-824-literals

on:
  push:
    branches:
      - fix/2.4.x-prune-boundary-824

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply literal compatibility fix
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/fix_824_literals.py
          cargo fmt --all
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "test: cover prune boundary in existing inventories"
          git push origin HEAD:fix/2.4.x-prune-boundary-824
      - name: Compile focused tests
        shell: bash
        run: |
          set -euo pipefail
          cargo test -p pulsedag-p2p prune_boundary --locked
          cargo test -p pulsedagd prune_boundary --locked
