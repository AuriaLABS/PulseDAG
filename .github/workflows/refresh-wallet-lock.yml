name: Refresh wallet lockfile

on:
  push:
    branches:
      - 'wallet/2.4.x-deterministic-restore-819'
    paths:
      - 'crates/pulsedag-wallet/Cargo.toml'
      - '.github/workflows/refresh-wallet-lock.yml'

permissions:
  contents: write

jobs:
  refresh-lock:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: wallet/2.4.x-deterministic-restore-819
      - name: Install pinned Rust
        run: rustup toolchain install 1.88.0 --profile minimal --no-self-update
      - name: Resolve wallet lockfile conservatively
        run: cargo +1.88.0 check -p pulsedag-wallet
      - name: Commit Cargo.lock only
        run: |
          set -euo pipefail
          if git diff --quiet -- Cargo.lock; then
            echo 'Cargo.lock already current'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add Cargo.lock
          git diff --cached --exit-code -- crates/pulsedag-wallet Cargo.toml .github || true
          git commit -m 'build: sync Cargo.lock for deterministic wallet restore'
          git push origin HEAD:wallet/2.4.x-deterministic-restore-819
