name: v3 native KHeavyHash runtime migration (PARITY / NO GO)

on:
  pull_request:
    branches: [main]
    paths:
      - crates/pulsedag-core/src/pow_native_kheavyhash.rs
      - crates/pulsedag-core/src/pow.rs
      - crates/pulsedag-core/src/lib.rs
      - crates/pulsedag-core/Cargo.toml
      - crates/pulsedag-core/tests/native_pow_backend_migration.rs
      - .github/workflows/v3-native-pow-runtime-migration.yml
      - Cargo.lock
  workflow_dispatch:

permissions:
  contents: read

jobs:
  native-pow-parity:
    runs-on: ubuntu-24.04
    timeout-minutes: 70
    env:
      CARGO_INCREMENTAL: "0"
      CARGO_BUILD_JOBS: "2"
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Pin source commit identity
        shell: bash
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.91.0"
          components: rustfmt, clippy
      - name: Strict formatting
        run: cargo fmt --all -- --check
      - name: Native release implementation versus original upstream
        run: cargo test --locked -p pulsedag-core --test native_pow_backend_migration -- --nocapture
      - name: Independent Python/Rust golden candidate versus new canonical path
        run: cargo test --locked -p pulsedag-core --test native_v3_kaspa_free_pow_oracle_trial -- --nocapture
      - name: Prepared CPU nonce search release-performance gate vs pinned upstream
        run: cargo test --locked --release -p pulsedag-core --test native_pow_backend_migration -- --ignored --nocapture
      - name: Strict Clippy including reference parity
        run: cargo clippy --locked -p pulsedag-core --test native_pow_backend_migration -- -D warnings
      - name: Normal release dependency trees exclude archived Kaspa across Linux Windows and macOS
        shell: bash
        run: |
          set -euo pipefail
          # cargo tree is target-filtered RESOLUTION evidence. On this Linux
          # runner only the Linux compiler-artifact gate proves compiled absence;
          # Windows and macOS still need separate real release-build evidence.
          for target in x86_64-unknown-linux-gnu x86_64-pc-windows-msvc aarch64-apple-darwin; do
            for root in pulsedagd pulsedag-miner pulsedag-wallet pulsedag-p2p; do
              evidence="/tmp/$root-$target-normal-tree.txt"
              cargo tree --locked --target "$target" -e normal -p "$root" > "$evidence"
              if ! grep -qE "^$root v" "$evidence"; then
                echo "::error::missing $root in $target dependency-tree evidence"
                exit 1
              fi
              if grep -E '(kaspa-pow|kaspa-hashes|workflow-(core|wasm)|async-std|pin-utils) v' "$evidence"; then
                echo "::error::obsolete Kaspa runtime dependency reachable in $root on $target"
                exit 1
              fi
              echo "PASS $target/$root: normal dependency resolution excludes pinned legacy Kaspa stack"
            done
          done
      - name: Cargo.lock must remain untouched for reference-only migration
        run: git diff --exit-code -- Cargo.lock
