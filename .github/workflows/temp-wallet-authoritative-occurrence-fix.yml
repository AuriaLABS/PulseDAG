name: temp wallet authoritative occurrence fix

on:
  push:
    branches:
      - wallet/v3-pending-utxo-reconcile
    paths:
      - '.github/workflows/temp-wallet-authoritative-occurrence-fix.yml'

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          ref: wallet/v3-pending-utxo-reconcile
          fetch-depth: 1
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.91.0
          components: clippy,rustfmt
      - name: Guard exact inputs
        shell: bash
        run: |
          set -euo pipefail
          test "$(git hash-object crates/pulsedag-core/src/validation.rs)" = "00c7d104f1fdbe2cdb51869521a718e4df14cf11"
          test "$(git hash-object crates/pulsedag-rpc/src/handlers/address.rs)" = "47d4fa4d42989254e211c1712a55e286152f42fb"
          test "$(git hash-object .github/temp-wallet-authoritative-occurrence-fix.py)" = "1c22280be88bf140d90ee334e272693d572b7cae"
      - name: Apply guarded authoritative occurrence fix
        shell: bash
        run: |
          set -euo pipefail
          python3 .github/temp-wallet-authoritative-occurrence-fix.py
          cargo fmt --all
          git diff --check
          test "$(git diff --name-only)" = $'crates/pulsedag-core/src/validation.rs\ncrates/pulsedag-rpc/src/handlers/address.rs'
      - name: Run focused and package regression gates
        shell: bash
        run: |
          set -euo pipefail
          cargo test --locked -p pulsedag-rpc duplicate_retained_txid_reports_only_applied_block_occurrence
          cargo test --locked -p pulsedag-rpc address_activity
          cargo test --locked -p pulsedag-core
          cargo test --locked -p pulsedag-rpc
          cargo test --locked -p pulsedag-wallet
          cargo clippy --locked -p pulsedag-core -p pulsedag-rpc -p pulsedag-wallet --all-targets -- -D warnings
          cargo fmt --all -- --check
          git diff --check
      - name: Publish fix and remove temporaries
        shell: bash
        run: |
          set -euo pipefail
          rm .github/temp-wallet-authoritative-occurrence-fix.py
          rm .github/workflows/temp-wallet-authoritative-occurrence-fix.yml
          git add crates/pulsedag-core/src/validation.rs crates/pulsedag-rpc/src/handlers/address.rs .github/temp-wallet-authoritative-occurrence-fix.py .github/workflows/temp-wallet-authoritative-occurrence-fix.yml
          test "$(git diff --cached --name-only)" = $'.github/temp-wallet-authoritative-occurrence-fix.py\n.github/workflows/temp-wallet-authoritative-occurrence-fix.yml\ncrates/pulsedag-core/src/validation.rs\ncrates/pulsedag-rpc/src/handlers/address.rs'
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'rpc: bind authoritative activity to applied occurrence'
          git push origin HEAD:wallet/v3-pending-utxo-reconcile
