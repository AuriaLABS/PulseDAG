          def read(path):
              return Path(path).read_text()
          def write(path, text):
              Path(path).write_text(text)
          def once(text, old, new, label):
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{label}: expected 1 match, got {count}")
              return text.replace(old, new, 1)

          # --- core accept: carry v3 policy context through ready-orphan promotion only ---
          p = 'crates/pulsedag-core/src/accept.rs'
          s = read(p)
          s = once(s,
              '    mempool_protocol::reconcile_mempool_for_protocol,\n    pow_validation_result, selected_pow_name,',
              '    mempool_protocol::reconcile_mempool_for_protocol,\n    mempool_v3::MempoolPolicyV3,\n    pow_validation_result, selected_pow_name,',
              'accept import policy')
          start = s.index('fn promote_ready_orphans(')
          end = s.index('\nfn mempool_needs_reconcile', start)
          new_promote = r'''fn promote_ready_orphans(
    state: &mut ChainState,
    source: AcceptSource,
    validation: TransactionAdmissionValidation<'_>,
    policy: Option<MempoolPolicyV3>,
) {
    loop {
        let mut ready = state
            .mempool
            .orphan_transactions
            .iter()
            .filter_map(|(txid, tx)| {
                if missing_transaction_inputs(tx, state).is_empty() {
                    Some(txid.clone())
                } else {
                    None
                }
            })
            .collect::<Vec<_>>();
        if ready.is_empty() {
            break;
        }
        ready.sort();

        let mut promoted_any = false;
        for txid in ready {
            let Some(tx) = state.mempool.orphan_transactions.get(&txid).cloned() else {
                continue;
            };
            remove_orphan_transaction(&txid, state);

            if let Some(policy) = policy {
                let result = match validation {
                    TransactionAdmissionValidation::LegacyV1 => {
                        crate::mempool_admission_v3::accept_transaction_with_mempool_policy_v3(
                            tx,
                            state,
                            source,
                            policy,
                        )
                    }
                    TransactionAdmissionValidation::Protocol(identity) => {
                        crate::mempool_admission_v3::accept_transaction_with_mempool_policy_v3_for_protocol(
                            tx,
                            state,
                            source,
                            identity,
                            policy,
                        )
                    }
                };
                match result {
                    TxAcceptanceResult::Accepted => {
                        state.mempool.counters.orphan_promoted_total = state
                            .mempool
                            .counters
                            .orphan_promoted_total
                            .saturating_add(1);
                        promoted_any = true;
                    }
                    TxAcceptanceResult::Orphan => {
                        // The admission path has already parked the transaction again.
                    }
                    _ => {
                        state.mempool.counters.orphan_dropped_total = state
                            .mempool
                            .counters
                            .orphan_dropped_total
                            .saturating_add(1);
                    }
                }
                continue;
            }

            let result = match validation {
                TransactionAdmissionValidation::LegacyV1 => {
                    accept_transaction(tx.clone(), state, source)
                }
                TransactionAdmissionValidation::Protocol(identity) => {
                    accept_transaction_for_protocol(tx.clone(), state, source, identity)
                }
            };
            match result {
                Ok(()) => {
                    state.mempool.counters.orphan_promoted_total = state
                        .mempool
                        .counters
                        .orphan_promoted_total
                        .saturating_add(1);
                    promoted_any = true;
                }
                Err(PulseError::UtxoNotFound) => {
                    store_orphan_transaction(tx, state);
                }
                Err(_) => {
                    state.mempool.counters.orphan_dropped_total = state
                        .mempool
                        .counters
                        .orphan_dropped_total
                        .saturating_add(1);
                }
            }
        }
        if !promoted_any {
            break;
        }
    }
}
