name: Harden #1064 mining identity binding

on:
  push:
    branches:
      - codex/issue-1037-mining-protocol-v3
    paths:
      - '.github/workflows/harden-1064-mining-identity.yml'

permissions:
  contents: write

jobs:
  harden:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/issue-1037-mining-protocol-v3
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Bind public v3 identity to protocol fingerprint
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          def replace_once(path, old, new):
              p = Path(path)
              text = p.read_text()
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{path}: expected one replacement, found {count}")
              p.write_text(text.replace(old, new))

          protocol = "crates/pulsedag-rpc/src/handlers/mining_template_protocol.rs"
          replace_once(
              protocol,
              "                identity,\n                fingerprint,\n",
              "                identity.clone(),\n                fingerprint.clone(),\n",
          )
          replace_once(
              protocol,
              "            Some(data.into())",
              "            let mut data: MiningTemplateData = data.into();\n            data.protocol_identity = Some(identity);\n            data.protocol_identity_fingerprint = Some(fingerprint);\n            Some(data)",
          )

          replace_once(
              "crates/pulsedag-rpc/src/handlers/mining_submit_v3.rs",
              '''pub(crate) fn versioned_template_id(internal_template_id: &str) -> String {
              if internal_template_id.starts_with(MINING_V3_TEMPLATE_PREFIX) {
                  internal_template_id.to_string()
              } else {
                  format!("{MINING_V3_TEMPLATE_PREFIX}{internal_template_id}")
              }
          }

          fn internal_template_id(external_template_id: &str) -> &str {
              external_template_id
                  .strip_prefix(MINING_V3_TEMPLATE_PREFIX)
                  .unwrap_or(external_template_id)
          }''',
              '''pub(crate) fn versioned_template_id(
              internal_template_id: &str,
              protocol_fingerprint: &str,
          ) -> String {
              if internal_template_id.starts_with(MINING_V3_TEMPLATE_PREFIX) {
                  internal_template_id.to_string()
              } else {
                  format!(
                      "{MINING_V3_TEMPLATE_PREFIX}{protocol_fingerprint}:{internal_template_id}"
                  )
              }
          }

          fn internal_template_id(external_template_id: &str) -> &str {
              let Some(rest) = external_template_id.strip_prefix(MINING_V3_TEMPLATE_PREFIX) else {
                  return external_template_id;
              };
              match rest.split_once(':') {
                  Some((fingerprint, internal))
                      if fingerprint.len() == 64
                          && fingerprint.bytes().all(|byte| byte.is_ascii_hexdigit()) =>
                  {
                      internal
                  }
                  _ => rest,
              }
          }'''
          )

          replace_once(
              "crates/pulsedag-rpc/src/handlers/mining_template_v3.rs",
              '''    let external_template_id = super::mining_submit::versioned_template_id(&internal_template_id);
              let job_id = super::mining_submit::job_id_for_template(&external_template_id);''',
              '''    let protocol_fingerprint = object
                  .get("protocol_identity_fingerprint")
                  .and_then(Value::as_str)
                  .filter(|fingerprint| {
                      fingerprint.len() == 64
                          && fingerprint.bytes().all(|byte| byte.is_ascii_hexdigit())
                  })
                  .ok_or_else(|| {
                      "mining template response is missing a valid protocol identity fingerprint"
                          .to_string()
                  })?;
              let external_template_id = super::mining_submit::versioned_template_id(
                  &internal_template_id,
                  protocol_fingerprint,
              );
              let job_id = super::mining_submit::job_id_for_template(&external_template_id);'''
          )

          replace_once(
              "crates/pulsedag-rpc/src/handlers/mining_submit_v3.rs",
              '''    fn task37_versioned_template_ids_round_trip_without_losing_internal_identity() {
                  let internal = "v1-work-abc";
                  let external = versioned_template_id(internal);
                  assert_eq!(external, "v3:v1-work-abc");
                  assert_eq!(internal_template_id(&external), internal);
                  assert_eq!(versioned_template_id(&external), external);
              }

              #[test]
              fn task37_protocol_identity_golden_vectors_are_frozen() {
                  assert_eq!(
                      job_id_for_template("v3:v1-work-abc"),
                      "v3-job-dc75926e7d0f69e205aac68bae505b0cae953de4b7242880d91033169c394fd3"
                  );
                  assert_eq!(
                      submit_id_for(Some("v3:v1-work-abc"), "block-123"),
                      "v3-submit-555a479be74c0128d02c67fdacfa98f0c923e51739fb534510a0e12208e9e675"
                  );
              }''',
              '''    fn task37_versioned_template_ids_round_trip_without_losing_internal_identity() {
                  let internal = "v1-work-abc";
                  let fingerprint = "11".repeat(32);
                  let external = versioned_template_id(internal, &fingerprint);
                  assert_eq!(external, format!("v3:{fingerprint}:v1-work-abc"));
                  assert_eq!(internal_template_id(&external), internal);
                  assert_eq!(versioned_template_id(&external, &fingerprint), external);
                  assert_eq!(internal_template_id("v3:v1-work-abc"), internal);
              }

              #[test]
              fn task37_protocol_identity_golden_vectors_are_frozen() {
                  let template_id = concat!(
                      "v3:",
                      "1111111111111111111111111111111111111111111111111111111111111111",
                      ":v1-work-abc"
                  );
                  assert_eq!(
                      job_id_for_template(template_id),
                      "v3-job-6f2746fc48959fd03d4b11c2cc24704ab522f2eac07a1bdc5dc2466926c41ae6"
                  );
                  assert_eq!(
                      submit_id_for(Some(template_id), "block-123"),
                      "v3-submit-48f2e0e1cbd16c5245b720cfc87d3959a36176be6345aad3a5b1f0561970536d"
                  );
                  let other = versioned_template_id("v1-work-abc", &"22".repeat(32));
                  assert_ne!(job_id_for_template(template_id), job_id_for_template(&other));
              }'''
          )

          replace_once(
              "crates/pulsedag-rpc/tests/mining_protocol_v3_contract.rs",
              '''    assert!(data["template_id"]
                  .as_str()
                  .is_some_and(|value| value.starts_with("v3:")));
              assert!(data["job_id"]''',
              '''    let protocol_fingerprint = data["protocol_identity_fingerprint"]
                  .as_str()
                  .expect("v3 template must expose its exact protocol identity fingerprint");
              assert_eq!(protocol_fingerprint.len(), 64);
              assert!(data["template_id"]
                  .as_str()
                  .is_some_and(|value| value.starts_with(&format!("v3:{protocol_fingerprint}:"))));
              assert!(data["job_id"]'''
          )

          replace_once(
              "docs/MINING_PROTOCOL_V3.md",
              '''Status: launch-candidate external miner contract for issue #1037. This document freezes the wire identity implemented by the RPC facade; it does not authorize mainnet launch. Launch authority remains #781 / #794.''',
              '''Status: external miner contract candidate for issue #1037. This document freezes the structural v3 wire/domain format implemented by the RPC facade; concrete mainnet/testnet identity values remain governed by #1049 and are not frozen here. It does not authorize mainnet launch. Launch authority remains #781 / #794.'''
          )

          replace_once(
              "docs/MINING_PROTOCOL_V3.md",
              '''v3:<internal-template-id>
          ```

          The internal suffix is preserved byte-for-byte so the facade can recover the lower-layer durable template identity after reconnect/restart without a lossy lookup table.''',
              '''v3:<protocol-identity-fingerprint>:<internal-template-id>
          ```

          The protocol fingerprint is the exact lower-layer `ProtocolActivationIdentity::fingerprint()` used to bind the template. This structurally domain-separates external miner job/submit identities across incompatible chain/genesis/protocol identities without freezing the concrete Q4 mainnet/testnet values ahead of #1049. The internal suffix is preserved byte-for-byte so the facade can recover the lower-layer durable template identity after reconnect/restart without a lossy lookup table. The submit parser also accepts the earlier `v3:<internal-template-id>` development form for compatibility, but newly issued v3 work always includes the fingerprint.'''
          )

          replace_once(
              "docs/MINING_PROTOCOL_V3.md",
              '''Because the external `template_id` embeds the lower-layer template ID after `v3:`, reconnect/restart does not require a transient map merely to recover template identity.''',
              '''Because the external `template_id` embeds the protocol fingerprint and then the lower-layer template ID after `v3:`, reconnect/restart does not require a transient map merely to recover template identity.'''
          )
          PY

          cargo fmt --all
          git diff --check

          cargo test --locked -p pulsedag-rpc task37_versioned_template_ids_round_trip_without_losing_internal_identity
          cargo test --locked -p pulsedag-rpc task37_protocol_identity_golden_vectors_are_frozen
          cargo test --locked -p pulsedag-rpc --test mining_protocol_v3_contract -- --test-threads=1
          cargo test --locked -p pulsedag-rpc activated_identity_rejects_legacy_submit_preflight
          cargo test --locked -p pulsedag-rpc activated_identity_builds_chain_bound_v2_rpc_template
          cargo clippy --locked -p pulsedag-rpc --all-targets -- -D warnings

          rm .github/workflows/harden-1064-mining-identity.yml

          python3 - <<'PY'
          import subprocess
          allowed = {
              '.github/workflows/harden-1064-mining-identity.yml',
              'crates/pulsedag-rpc/src/handlers/mining_submit_v3.rs',
              'crates/pulsedag-rpc/src/handlers/mining_template_v3.rs',
              'crates/pulsedag-rpc/src/handlers/mining_template_protocol.rs',
              'crates/pulsedag-rpc/tests/mining_protocol_v3_contract.rs',
              'docs/MINING_PROTOCOL_V3.md',
          }
          changed = set(subprocess.check_output(['git', 'diff', '--name-only'], text=True).splitlines())
          if changed != allowed:
              raise SystemExit(f'unexpected working-tree delta: {sorted(changed)}')
          PY

          git config user.name "kalekói"
          git config user.email "hermida.prada@gmail.com"
          git add -A
          git commit -m "rpc: bind Mining Protocol v3 identity to protocol fingerprint"
          git push origin HEAD:codex/issue-1037-mining-protocol-v3
