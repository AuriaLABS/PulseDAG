name: one-shot v2.4 fixture migration retry

on:
  pull_request:
    branches: [main]
    paths:
      - .github/workflows/one_shot_v2_4_fixture_fix_retry.yml

permissions:
  contents: write

jobs:
  migrate-fixtures:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'release/2.4.0'
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout release branch
        uses: actions/checkout@v4
        with:
          ref: release/2.4.0
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Apply corrected fixture migration
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          workflow = Path('.github/workflows/one_shot_v2_4_fixture_fix.yml').read_text()
          marker = "          python3 - <<'PY'\n"
          start = workflow.index(marker) + len(marker)
          end = workflow.index("\n          PY\n", start)
          embedded = workflow[start:end]
          script = "\n".join(
              line[10:] if line.startswith("          ") else line
              for line in embedded.splitlines()
          )
          script = script.replace(
              "build_candidate_block, build_coinbase_transaction, dev_mine_header,\\n            refresh_block_consensus_ids, refresh_block_consensus_ids_with_state,\\n",
              "build_candidate_block, build_coinbase_transaction,\\n            refresh_block_consensus_ids, refresh_block_consensus_ids_with_state,\\n",
          )
          script = script.replace(
              "let (header, mined, _, _) = dev_mine_header(",
              "let (header, mined, _, _) = crate::dev_mine_header(",
          )
          exec(compile(script, 'embedded_fixture_migration.py', 'exec'), {})
          PY
          cargo fmt --all

      - name: Run affected package tests
        shell: bash
        run: |
          set -euo pipefail
          cargo test --locked -p pulsedag-core --lib
          cargo test --locked -p pulsedag-storage --lib
          cargo test --locked -p pulsedagd --bin pulsedagd

      - name: Commit clean fixture migration
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/one_shot_v2_4_fixture_fix.yml
          rm .github/workflows/one_shot_v2_4_fixture_fix_retry.yml
          git config user.name "PulseDAG CI"
          git config user.email "actions@users.noreply.github.com"
          git add crates/pulsedag-core/src/accept.rs \
                  crates/pulsedag-core/src/orphans.rs \
                  crates/pulsedag-core/src/validation.rs \
                  crates/pulsedag-storage/src/lib.rs \
                  apps/pulsedagd/src/main.rs \
                  .github/workflows/one_shot_v2_4_fixture_fix.yml \
                  .github/workflows/one_shot_v2_4_fixture_fix_retry.yml
          git commit -m "test: migrate fixtures to v2.4 consensus bits"
          git push origin HEAD:release/2.4.0
