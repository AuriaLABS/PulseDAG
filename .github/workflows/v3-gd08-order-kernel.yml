name: native GD-08 authenticated order kernel (DORMANT / NO GO)

on:
  pull_request:
    branches: [main]
    paths:
      - crates/pulsedag-core/src/native_gd08_order_kernel_v3.rs
      - crates/pulsedag-core/src/lib.rs
      - crates/pulsedag-core/tests/native_gd08_order_kernel_v3.rs
      - .github/workflows/v3-gd08-order-kernel.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  gd08-kernel-test:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.91.0"
          components: rustfmt, clippy
      - run: cargo fmt --all -- --check
      - name: Real KHeavyHash multi-parent order, invalid ancestry, wrong anchors
        run: cargo test --locked -p pulsedag-core --test native_gd08_order_kernel_v3 -- --nocapture
      - name: Strict Clippy for exact test target
        run: cargo clippy --locked -p pulsedag-core --test native_gd08_order_kernel_v3 -- -D warnings
