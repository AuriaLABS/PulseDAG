name: apply Task 38 OpenCL multi-device phase 13 once v3

on:
  push:
    branches:
      - codex/issue-1038-opencl-multidevice-phase13
    paths:
      - ".github/workflows/task38-phase13-apply-once-v3.yml"

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/issue-1038-opencl-multidevice-phase13
          fetch-depth: 0

      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.91.0
          components: rustfmt,clippy

      - uses: Swatinem/rust-cache@v2

      - name: Apply Phase 13 functional patch structurally
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import textwrap

          helper = Path(".github/workflows/task38-phase13-apply-once.yml").read_text()
          start_marker = "          python3 - <<'PY'\n"
          end_marker = "\n          PY\n"
          start = helper.index(start_marker) + len(start_marker)
          end = helper.index(end_marker, start)
          script = textwrap.dedent(helper[start:end])
          script = script.replace('.replace("          ", "")', '')

          block_start = script.index("old_methods = '''")
          block_end = script.index("\n\nselect_devices = '''", block_start)
          robust_methods = r'''new_methods = """    pub fn selected_device(&self) -> &OpenClDeviceSelection {
              &self.selected_devices[0]
          }

          pub fn selected_devices(&self) -> &[OpenClDeviceSelection] {
              &self.selected_devices
          }

          #[cfg(test)]
          pub(crate) fn for_test(
              config: GpuBackendConfig,
              selected_device: OpenClDeviceSelection,
          ) -> Self {
              Self::for_test_devices(config, vec![selected_device])
          }

          #[cfg(test)]
          pub(crate) fn for_test_devices(
              config: GpuBackendConfig,
              selected_devices: Vec<OpenClDeviceSelection>,
          ) -> Self {
              assert!(!selected_devices.is_empty());
              Self {
                  config,
                  selected_devices,
              }
          }
          """
          methods_start = lib.index("    pub fn selected_device(&self) -> &OpenClDeviceSelection {")
          methods_end = lib.index("\n}\n\n#[cfg(feature = \"gpu\")]\nimpl MiningBackend", methods_start)
          lib = lib[:methods_start] + new_methods + lib[methods_end:]
          '''
          robust_methods = textwrap.dedent(robust_methods)
          script = script[:block_start] + robust_methods.rstrip() + script[block_end:]

          test_start = script.index("old_test_backend = '''")
          test_end = script.index("\n\nmultidevice_test = '''", test_start)
          robust_test_helpers = r'''new_test_backend = """    fn test_selection(device_index: usize) -> OpenClDeviceSelection {
              OpenClDeviceSelection {
                  platform_index: 0,
                  device_index,
                  platform_name: \"test-platform\".to_string(),
                  device_name: format!(\"test-device-{device_index}\"),
              }
          }

          fn test_backend(device_index: usize, batch_size: u64, work_size: usize) -> GpuMiningBackend {
              GpuMiningBackend::for_test(
                  GpuBackendConfig {
                      device_index: Some(device_index),
                      batch_size,
                      work_size,
                  },
                  test_selection(device_index),
              )
          }

          fn test_backend_devices(
              device_indices: &[usize],
              batch_size: u64,
              work_size: usize,
          ) -> GpuMiningBackend {
              GpuMiningBackend::for_test_devices(
                  GpuBackendConfig {
                      device_index: None,
                      batch_size,
                      work_size,
                  },
                  device_indices.iter().copied().map(test_selection).collect(),
              )
          }
          """
          test_helper_start = backend.index("    fn test_backend(device_index: usize, batch_size: u64, work_size: usize) -> GpuMiningBackend {")
          test_helper_end = backend.index("\n\n    #[test]", test_helper_start)
          backend = backend[:test_helper_start] + new_test_backend + backend[test_helper_end:]
          '''
          robust_test_helpers = textwrap.dedent(robust_test_helpers)
          script = script[:test_start] + robust_test_helpers.rstrip() + script[test_end:]

          exec(compile(script, "phase13-functional-patch.py", "exec"), {"textwrap": textwrap})
          PY

      - name: Format functional tree
        run: cargo fmt --all

      - name: Test OpenCL multi-device contracts
        run: |
          cargo test --locked -p pulsedag-miner --features gpu --lib opencl_backend::tests
          cargo test --locked -p pulsedag-miner --features gpu --lib gpu_device_list_tests
          cargo test --locked -p pulsedag-miner --features gpu --test opencl_driver_launch_contract

      - name: Strict Clippy
        run: cargo clippy --locked -p pulsedag-miner --features gpu --all-targets -- -D warnings

      - name: Commit functional Phase 13 tree
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "pulsedag-phase13-bot"
          git config user.email "actions@users.noreply.github.com"
          git rm .github/workflows/task38-phase13-apply-once.yml .github/workflows/task38-phase13-apply-once-v2.yml .github/workflows/task38-phase13-apply-once-v3.yml
          git add apps/pulsedag-miner/src/lib.rs apps/pulsedag-miner/src/opencl_backend.rs
          git commit -m "miner: add OpenCL multi-device software scheduling for #1038"
          git push origin "HEAD:${GITHUB_REF_NAME}"
