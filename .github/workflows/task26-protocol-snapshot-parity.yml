name: task26-protocol-snapshot-parity

on:
  push:
    branches:
      - feature/2.4.0-task26-protocol-snapshot-parity

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/2.4.0-task26-protocol-snapshot-parity
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Materialize and verify activated-v2 protocol snapshots
        shell: bash
        run: |
          set -euo pipefail
          python3 -c "import base64; exec(base64.b64decode('' ))"
          cargo fmt --all
          cargo test -p pulsedag-core state_replay_v2 --lib
          cargo test -p pulsedag-storage --test task26_protocol_snapshot
          cargo fmt --all -- --check
          rm -f .github/workflows/task26-protocol-snapshot-parity.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if ! git diff --cached --quiet; then
            git commit -m "test: enforce activated-v2 protocol snapshot parity"
            git push origin HEAD:feature/2.4.0-task26-protocol-snapshot-parity
          fi
