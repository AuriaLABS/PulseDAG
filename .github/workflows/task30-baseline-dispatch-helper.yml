name: Task30 exact-main baseline dispatch helper

on:
  pull_request:
    branches:
      - main
    paths:
      - .github/workflows/task30-baseline-dispatch-helper.yml

permissions:
  contents: read
  actions: write
  issues: write

jobs:
  dispatch:
    runs-on: ubuntu-latest
    steps:
      - name: Dispatch Task30 baseline at exact frozen main and record run
        uses: actions/github-script@v7
        env:
          TARGET_SHA: 37f0dd6ca7aabe07341c226744f65d46bbb03d65
        with:
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const targetSha = process.env.TARGET_SHA;
            const workflowId = 'task30-acceptance.yml';

            const mainRef = await github.rest.git.getRef({ owner, repo, ref: 'heads/main' });
            if (mainRef.data.object.sha !== targetSha) {
              throw new Error(`main moved before Task30 baseline dispatch: expected ${targetSha}, got ${mainRef.data.object.sha}`);
            }

            const dispatchedAt = Date.now();
            await github.rest.actions.createWorkflowDispatch({
              owner,
              repo,
              workflow_id: workflowId,
              ref: 'main',
            });

            let run = null;
            for (let attempt = 0; attempt < 18 && !run; attempt += 1) {
              await new Promise(resolve => setTimeout(resolve, 5000));
              const runs = await github.rest.actions.listWorkflowRuns({
                owner,
                repo,
                workflow_id: workflowId,
                event: 'workflow_dispatch',
                branch: 'main',
                per_page: 50,
              });
              run = runs.data.workflow_runs.find(candidate =>
                candidate.head_sha === targetSha &&
                new Date(candidate.created_at).getTime() >= dispatchedAt - 5000
              ) || null;
            }

            if (!run) {
              throw new Error(`Task30 baseline dispatch run for ${targetSha} not discoverable`);
            }

            await github.rest.issues.createComment({
              owner,
              repo,
              issue_number: 872,
              body: `TASK30_BASELINE_EXACT_DISPATCH\n\ncandidate_sha=\`${targetSha}\`\nrun_id=\`${run.id}\`\nrun_url=${run.html_url}\nstatus=\`${run.status}\`\nevent=\`${run.event}\`\nhead_branch=\`${run.head_branch}\`\nhelper_sha=\`${context.sha}\`\n\nBaseline dispatch only; no Task30 PASS/FAIL is inferred until all baseline jobs complete.`,
            });
