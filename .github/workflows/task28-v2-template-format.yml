name: task28-v2-template-format

on:
  push:
    branches:
      - agent/task28-v2-mining-template-rpc

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/task28-v2-mining-template-rpc
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: Fix test lifetime and format
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          p = Path('crates/pulsedag-rpc/src/handlers/mining_template_protocol.rs')
          text = p.read_text()
          old = '''        assert_eq!(\n            data.protocol_identity_fingerprint.as_deref(),\n            Some(activated.fingerprint().unwrap().as_str())\n        );'''
          new = '''        let fingerprint = activated.fingerprint().unwrap();\n        assert_eq!(\n            data.protocol_identity_fingerprint.as_deref(),\n            Some(fingerprint.as_str())\n        );'''
          if old not in text:
              raise SystemExit('fingerprint test pattern not found')
          p.write_text(text.replace(old, new))
          PY
          cargo fmt --all
          git diff --check
          mapfile -t changed < <(git diff --name-only)
          for path in "${changed[@]}"; do
            if [[ "$path" != "crates/pulsedag-rpc/src/handlers/mining_template_protocol.rs" ]]; then
              echo "::error::unexpected formatted path: $path"
              exit 1
            fi
          done
      - name: Commit formatted source and remove one-shot workflow
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- crates/pulsedag-rpc/src/handlers/mining_template_protocol.rs
          git rm -- .github/workflows/task28-v2-template-format.yml
          git commit -m "rpc: format activated-v2 mining template facade"
          git push origin HEAD:agent/task28-v2-mining-template-rpc
