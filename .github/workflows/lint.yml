name: Lint

on:
  pull_request:

permissions:
  contents: write

jobs:
  lint:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: agent/task28-daemon-v2-block-selector

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Cargo.lock hygiene check
        run: |
          set -euo pipefail
          if ! cargo metadata --locked --format-version 1 >/dev/null; then
            echo "::error::Cargo.lock is out of sync. Run 'cargo generate-lockfile' (or intentional 'cargo update') and commit Cargo.lock."
            exit 1
          fi

      - name: Apply Task 28 daemon selector patch
        run: |
          if ! grep -q '^mod block_protocol;' apps/pulsedagd/src/main.rs; then
            python3 .github/scripts/task28_patch_daemon_v2.py
          fi

      - name: Format patched candidate
        run: cargo fmt --all

      - name: Clippy
        run: cargo clippy --all-targets --all-features -- -D warnings

      - name: Publish validated Task 28 daemon patch
        if: ${{ github.actor != 'github-actions[bot]' && github.head_ref == 'agent/task28-daemon-v2-block-selector' }}
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- apps/pulsedagd/src/main.rs apps/pulsedagd/src/block_protocol.rs
          git diff --cached --quiet && exit 0
          git commit -m "daemon: wire activated-v2 inbound block runtime"
          git push origin HEAD:${{ github.head_ref }}
