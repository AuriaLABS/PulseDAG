name: Lint

on:
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.88.0
          components: clippy, rustfmt

      - name: Cargo.lock hygiene check
        run: |
          set -euo pipefail
          if ! cargo metadata --locked --format-version 1 >/dev/null; then
            echo "::error::Cargo.lock is out of sync. Run 'cargo generate-lockfile' (or intentional 'cargo update') and commit Cargo.lock."
            exit 1
          fi

      - name: Format check
        run: cargo fmt --all -- --check

      - name: Clippy
        # Keep all warnings fatal while excluding the Rust-1.88 style-only
        # uninlined-format-args lint from blocking unrelated v3 work. The
        # repository contains legacy call sites that predate this lint policy;
        # semantic and correctness warnings remain denied.
        run: cargo clippy --all-targets --all-features -- -D warnings -A clippy::uninlined-format-args
