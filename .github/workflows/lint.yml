name: Lint

on:
  pull_request:

permissions:
  contents: write

jobs:
  lint:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Apply exact Task 28 daemon wiring
        if: github.head_ref == 'agent/task28-daemon-v2-runtime'
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          path = Path("apps/pulsedagd/src/main.rs")
          text = path.read_text()

          def replace_once(text, old, new, label):
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{label}: expected exactly one match, found {count}")
              return text.replace(old, new, 1)

          text = replace_once(
              text,
              "mod app_state;\n",
              "mod activated_v2_runtime;\nmod app_state;\n",
              "module declaration",
          )
          text = replace_once(
              text,
              "use anyhow::{Context, Result};\n",
              "use activated_v2_runtime::restore_activated_v2_p2p_runtime_for_startup;\nuse anyhow::{Context, Result};\n",
              "startup restore import",
          )
          text = replace_once(
              text,
              "    let startup_consistency_issue_count = pulsedag_core::dag_consistency_issues(&chain_state).len();\n",
              "    let mut startup_consistency_issue_count =\n        pulsedag_core::dag_consistency_issues(&chain_state).len();\n",
              "mutable startup consistency count",
          )

          old_startup = """    } else {
              info!("p2p disabled");
              (None, None)
          };

          let startup_report = derive_startup_path_report(
          """
          new_startup = """    } else {
              info!("p2p disabled");
              (None, None)
          };

          let startup_local_protocol_capabilities = match p2p.as_ref() {
              Some(p2p_handle) => p2p_handle
                  .local_protocol_capabilities_v1()
                  .map_err(|error| {
                      anyhow::anyhow!(
                          "failed reading local protocol capabilities for activated-v2 runtime restore: {error}"
                      )
                  })?,
              None => None,
          };
          let (
              restored_chain_state,
              startup_activated_v2_p2p_runtime,
              startup_activated_v2_identity,
          ) = restore_activated_v2_p2p_runtime_for_startup(
              &storage,
              startup_local_protocol_capabilities.as_ref(),
              chain_state,
          )?;
          chain_state = restored_chain_state;

          if let Some(identity) = startup_activated_v2_identity.as_ref() {
              startup_consistency_issue_count =
                  pulsedag_core::dag_consistency_issues(&chain_state).len();
              let reconcile_result = reconcile_mempool(&mut chain_state);
              if !reconcile_result.removed_txids.is_empty() {
                  warn!(
                      removed_mempool_tx = reconcile_result.removed_txids.len(),
                      "removed invalid mempool transactions after activated-v2 runtime restore"
                  );
              }
              if cfg.persist_snapshot_on_start {
                  storage.persist_activated_v2_p2p_runtime_snapshot(
                      identity,
                      &chain_state,
                      &startup_activated_v2_p2p_runtime,
                  )?;
              }
              info!(
                  protocol_fingerprint = %identity
                      .fingerprint()
                      .unwrap_or_else(|_| "invalid-identity".to_string()),
                  pending_v2 = startup_activated_v2_p2p_runtime.pending_len(),
                  staged_v2 = startup_activated_v2_p2p_runtime.staging().len(),
                  "restored activated-v2 P2P runtime"
              );
          }

          let startup_report = derive_startup_path_report(
          """
          text = replace_once(
              text,
              old_startup,
              new_startup,
              "startup capability-gated restore",
          )

          text = replace_once(
              text,
              "        tokio::spawn(async move {\n            let mut activated_v2_p2p_runtime = pulsedag_core::ActivatedV2P2pRuntime::default();\n",
              "        tokio::spawn(async move {\n            let mut activated_v2_p2p_runtime = startup_activated_v2_p2p_runtime;\n",
              "restored runtime handoff",
          )

          old_driver = """                        if let InboundP2pBlockProtocol::ActivatedV2(identity) = inbound_protocol {
                              let drive = pulsedag_core::drive_activated_v2_p2p_block_atomically(
                                  block.clone(),
                                  &mut guard,
                                  &mut activated_v2_p2p_runtime,
                                  &identity,
                                  |candidate, prepared| {
                                      storage.persist_block_and_chain_state(candidate, prepared)
                                  },
                                  |bundle, prepared| {
                                      storage.persist_blocks_and_chain_state(bundle, prepared)
                                  },
                                  |candidate| {
                                      if let Some(ref p2p_handle) = p2p {
                                          p2p_handle.broadcast_block(candidate)?;
                                      }
                                      Ok(())
                                  },
                              );
          """
          new_driver = """                        if let InboundP2pBlockProtocol::ActivatedV2(identity) = inbound_protocol {
                              let drive =
                                  pulsedag_core::drive_activated_v2_p2p_block_with_runtime_persistence(
                                      block.clone(),
                                      &mut guard,
                                      &mut activated_v2_p2p_runtime,
                                      &identity,
                                      pulsedag_core::ActivatedV2P2pRuntimePersistence::new(
                                          |state: &pulsedag_core::ChainState,
                                           durable_runtime: &pulsedag_core::ActivatedV2P2pRuntime| {
                                              storage.persist_activated_v2_p2p_runtime_snapshot(
                                                  &identity,
                                                  state,
                                                  durable_runtime,
                                              )
                                          },
                                          |candidate: &pulsedag_core::Block,
                                           prepared: &pulsedag_core::ChainState,
                                           durable_runtime: &pulsedag_core::ActivatedV2P2pRuntime| {
                                              storage.persist_activated_v2_p2p_block_and_runtime(
                                                  candidate,
                                                  &identity,
                                                  prepared,
                                                  durable_runtime,
                                              )
                                          },
                                          |bundle: &[pulsedag_core::Block],
                                           prepared: &pulsedag_core::ChainState,
                                           durable_runtime: &pulsedag_core::ActivatedV2P2pRuntime| {
                                              storage.persist_activated_v2_p2p_blocks_and_runtime(
                                                  bundle,
                                                  &identity,
                                                  prepared,
                                                  durable_runtime,
                                              )
                                          },
                                      ),
                                      |candidate| {
                                          if let Some(ref p2p_handle) = p2p {
                                              p2p_handle.broadcast_block(candidate)?;
                                          }
                                          Ok(())
                                      },
                                  );
          """
          text = replace_once(
              text,
              old_driver,
              new_driver,
              "durable activated-v2 inbound driver",
          )

          path.write_text(text)
          PY

          cargo fmt --all
          git diff --check
          grep -q '^mod activated_v2_runtime;$' apps/pulsedagd/src/main.rs
          grep -q 'restore_activated_v2_p2p_runtime_for_startup' apps/pulsedagd/src/main.rs
          grep -q 'drive_activated_v2_p2p_block_with_runtime_persistence' apps/pulsedagd/src/main.rs
          if grep -q 'drive_activated_v2_p2p_block_atomically' apps/pulsedagd/src/main.rs; then
            echo 'legacy in-memory activated-v2 driver still present in daemon main.rs' >&2
            exit 1
          fi

      - name: Cargo.lock hygiene check
        run: |
          set -euo pipefail
          if ! cargo metadata --locked --format-version 1 >/dev/null; then
            echo "::error::Cargo.lock is out of sync. Run 'cargo generate-lockfile' (or intentional 'cargo update') and commit Cargo.lock."
            exit 1
          fi

      - name: Format check
        run: cargo fmt --all -- --check

      - name: Clippy
        run: cargo clippy --all-targets --all-features -- -D warnings

      - name: Focused Task 28 daemon tests
        if: github.head_ref == 'agent/task28-daemon-v2-runtime'
        run: |
          set -euo pipefail
          cargo test --locked -p pulsedagd block_protocol::tests::
          cargo test --locked -p pulsedagd activated_v2_runtime::tests::

      - name: Publish verified Task 28 daemon wiring
        if: github.head_ref == 'agent/task28-daemon-v2-runtime'
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'Task 28 wiring bot'
          git config user.email 'actions@users.noreply.github.com'
          git show HEAD^:.github/workflows/lint.yml > .github/workflows/lint.yml
          git rm -f .github/workflows/task28-daemon-wire-once.yml
          git add -- apps/pulsedagd/src/main.rs .github/workflows/lint.yml
          git diff --cached --check
          git commit -m 'daemon: persist and restore activated-v2 P2P runtime'
          git push origin "HEAD:${GITHUB_HEAD_REF}"
