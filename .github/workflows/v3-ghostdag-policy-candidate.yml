name: v3 GHOSTDAG policy candidate symbolic self-test (non-normative)

on:
  pull_request:
    branches: [main]
    paths:
      - "scripts/native_v3_ghostdag_policy_candidate.py"
      - "scripts/native_v3_ghostdag_kheavyhash_bridge.py"
      - "scripts/native_v3_crosslang_ghostdag_vectors.py"
      - "docs/fixtures/native_v3_ghostdag_fork_crosslang.json"
      - "crates/pulsedag-core/tests/native_v3_ghostdag_policy_bridge.rs"
      - "scripts/native_v3_kheavyhash_oracle.py"
      - "scripts/native_v3_work_policy_candidates.py"
      - "scripts/native_v3_compact_target_oracle.py"
      - "docs/NATIVE_V3_GHOSTDAG_FREEZE_CANDIDATE_20261022.md"
      - ".github/workflows/v3-ghostdag-policy-candidate.yml"
  push:
    branches: [main]
    paths:
      - "scripts/native_v3_ghostdag_policy_candidate.py"
      - "scripts/native_v3_ghostdag_kheavyhash_bridge.py"
      - "scripts/native_v3_crosslang_ghostdag_vectors.py"
      - "docs/fixtures/native_v3_ghostdag_fork_crosslang.json"
      - "crates/pulsedag-core/tests/native_v3_ghostdag_policy_bridge.rs"
      - "scripts/native_v3_kheavyhash_oracle.py"
      - "scripts/native_v3_work_policy_candidates.py"
      - "scripts/native_v3_compact_target_oracle.py"
      - "docs/NATIVE_V3_GHOSTDAG_FREEZE_CANDIDATE_20261022.md"
      - ".github/workflows/v3-ghostdag-policy-candidate.yml"

permissions:
  contents: read

jobs:
  symbolic-policy:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@v4
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Require exact candidate SHA
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
      - name: Run 120-permutation candidate with assertions enabled and optimized Python
        run: |
          set -euo pipefail
          python3 scripts/native_v3_ghostdag_policy_candidate.py
          python3 -O scripts/native_v3_ghostdag_policy_candidate.py
      - name: Check independent KHeavyHash to policy integration (header-only, no activation)
        run: |
          set -euo pipefail
          python3 scripts/native_v3_ghostdag_kheavyhash_bridge.py
      - name: Emit independent full-byte native fork vectors for fixture freezing
        run: |
          set -euo pipefail
          python3 scripts/native_v3_crosslang_ghostdag_vectors.py --emit
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.91.0
          components: rustfmt,clippy
      - uses: Swatinem/rust-cache@v2
      - name: Cross-check authenticated native Rust headers and K candidate invariants
        shell: bash
        run: |
          set -euo pipefail
          cargo fmt --all -- --check
          cargo test --locked -p pulsedag-core --test native_v3_ghostdag_policy_bridge -- --nocapture | tee /tmp/native-v3-ghostdag-rust-probe.log
          grep -Fq 'test result: ok. 2 passed; 0 failed;' /tmp/native-v3-ghostdag-rust-probe.log
          cargo clippy --locked -p pulsedag-core --test native_v3_ghostdag_policy_bridge -- -D warnings
