name: Task31 Codex review fixes

on:
  push:
    branches:
      - agent/task31-release-freeze
    paths:
      - .github/workflows/task31-codex-review-fixes.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch-and-verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact branch
        uses: actions/checkout@v4
        with:
          ref: agent/task31-release-freeze
          fetch-depth: 0

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt

      - name: Apply exact Codex review fixes
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          def replace_exact(path: str, old: str, new: str) -> None:
              p = Path(path)
              text = p.read_text()
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{path}: expected exactly one anchor, found {count}")
              p.write_text(text.replace(old, new, 1))

          mining = "crates/pulsedag-rpc/src/handlers/mining_submit_protocol.rs"
          old_identity = '''pub(crate) fn rpc_protocol_identity<S: RpcStateLike>(
              state: &S,
          ) -> Result<Option<ProtocolActivationIdentity>, PulseError> {
              let Some(p2p) = state.p2p() else {
                  return Ok(None);
              };
              p2p.local_protocol_capabilities_v1()
                  .map(|capabilities| capabilities.map(|capabilities| capabilities.protocol_identity))
          }
          '''
          new_identity = '''fn resolve_rpc_protocol_identity(
              p2p_identity: Option<ProtocolActivationIdentity>,
              durable_identity: Option<ProtocolActivationIdentity>,
          ) -> Result<Option<ProtocolActivationIdentity>, PulseError> {
              match (p2p_identity, durable_identity) {
                  (Some(p2p), Some(durable)) if p2p != durable => Err(PulseError::Internal(format!(
                      "RPC protocol identity mismatch between P2P capabilities and durable activation record: p2p={p2p:?} durable={durable:?}"
                  ))),
                  (Some(p2p), _) => Ok(Some(p2p)),
                  (None, Some(durable)) => Ok(Some(durable)),
                  (None, None) => Ok(None),
              }
          }

          pub(crate) fn rpc_protocol_identity<S: RpcStateLike>(
              state: &S,
          ) -> Result<Option<ProtocolActivationIdentity>, PulseError> {
              let p2p_identity = match state.p2p() {
                  Some(p2p) => p2p
                      .local_protocol_capabilities_v1()?
                      .map(|capabilities| capabilities.protocol_identity),
                  None => None,
              };
              let durable_identity = state
                  .storage()
                  .protocol_activation_record()?
                  .map(|record| record.identity);
              resolve_rpc_protocol_identity(p2p_identity, durable_identity)
          }
          '''
          replace_exact(mining, old_identity, new_identity)

          chain_anchor = '''    let path = match validate_stored_template_protocol_identity(
          '''
          chain_replacement = '''    let storage = state.storage();
              let (durable_chain, activated_v2_runtime) =
                  match storage.load_activated_v2_p2p_runtime_snapshot(&local_identity) {
                      Ok(snapshot) => snapshot,
                      Err(error) => {
                          return rejected_response(
                              &req,
                              "storage_rejected",
                              format!("activated-v2 runtime sidecar is unavailable or invalid: {error}"),
                              None,
                          );
                      }
                  };
              if durable_chain.chain_state_generation != chain.chain_state_generation
                  || durable_chain.dag.best_height != chain.dag.best_height
                  || preferred_tip_hash(&durable_chain) != preferred_tip_hash(&chain)
              {
                  return rejected_response(
                      &req,
                      "storage_rejected",
                      "activated-v2 durable runtime snapshot does not match the current in-memory chain state",
                      None,
                  );
              }

              let path = match validate_stored_template_protocol_identity(
          '''
          replace_exact(mining, chain_anchor, chain_replacement)

          old_persist = '''        |block, chain| state.storage().persist_block_and_chain_state(block, chain),
          '''
          new_persist = '''        |block, committed_chain| {
                      storage.persist_activated_v2_p2p_block_and_runtime(
                          block,
                          &local_identity,
                          committed_chain,
                          &activated_v2_runtime,
                      )
                  },
          '''
          replace_exact(mining, old_persist, new_persist)

          p = Path(mining)
          text = p.read_text()
          insertion = r'''

              #[test]
              fn rpc_identity_falls_back_to_durable_activation_without_p2p() {
                  let state = init_chain_state("task31-rpc-durable-identity".to_string());
                  let identity = activated_identity(&state);
                  assert_eq!(
                      resolve_rpc_protocol_identity(None, Some(identity.clone())).unwrap(),
                      Some(identity)
                  );
              }

              #[test]
              fn rpc_identity_rejects_p2p_and_durable_mismatch() {
                  let state = init_chain_state("task31-rpc-identity-mismatch".to_string());
                  let legacy = ProtocolActivationIdentity::legacy_from_state(&state);
                  let activated = activated_identity(&state);
                  assert!(resolve_rpc_protocol_identity(Some(legacy), Some(activated)).is_err());
              }

              #[test]
              fn activated_v2_mined_block_persistence_keeps_runtime_sidecar_restartable() {
                  let path = std::env::temp_dir().join(format!(
                      "pulsedag-task31-mined-v2-sidecar-{}",
                      std::time::SystemTime::now()
                          .duration_since(std::time::UNIX_EPOCH)
                          .unwrap()
                          .as_nanos()
                  ));
                  let storage = pulsedag_storage::Storage::open(path.to_str().unwrap()).unwrap();
                  let mut state = pulsedag_core::genesis_v2::init_chain_state_v2(
                      "task31-mined-v2-sidecar".to_string(),
                  )
                  .unwrap();
                  let identity = activated_identity(&state);
                  let runtime = pulsedag_core::ActivatedV2P2pRuntime::default();
                  storage
                      .persist_activated_v2_p2p_runtime_snapshot(&identity, &state, &runtime)
                      .unwrap();

                  let template = build_activated_v2_mining_template(
                      &state,
                      &identity,
                      ActivatedV2MiningTemplateSpec {
                          miner_address: "pulse1task31rpcminer".to_string(),
                          timestamp: current_ts(),
                          coinbase_nonce: 31,
                          transactions: Vec::new(),
                      },
                  )
                  .unwrap();
                  let mut block = template.block;
                  for nonce in 0..=200_000_u64 {
                      block.header.nonce = nonce;
                      block.hash = compute_block_hash_v2(&block.header, &identity.chain_id).unwrap();
                      if validate_pow_for_protocol(&block.header, &state, &identity).is_ok() {
                          break;
                      }
                  }
                  assert!(validate_pow_for_protocol(&block.header, &state, &identity).is_ok());
                  let accepted_hash = block.hash.clone();

                  let acceptance = accept_mined_block_for_protocol(
                      block,
                      &mut state,
                      Some(&identity),
                      |persisted_block, committed_state| {
                          storage.persist_activated_v2_p2p_block_and_runtime(
                              persisted_block,
                              &identity,
                              committed_state,
                              &runtime,
                          )
                      },
                  )
                  .unwrap();
                  assert!(acceptance.result.is_accepted());

                  let (restored, restored_runtime) = storage
                      .load_activated_v2_p2p_runtime_snapshot(&identity)
                      .unwrap();
                  assert_eq!(restored.chain_state_generation, state.chain_state_generation);
                  assert!(restored.dag.blocks.contains_key(&accepted_hash));
                  assert!(restored_runtime.pending_is_empty());
                  assert!(restored_runtime.staging().is_empty());

                  drop(storage);
                  let _ = std::fs::remove_dir_all(path);
              }
          '''
          idx = text.rfind("\n}")
          if idx < 0:
              raise SystemExit(f"{mining}: could not locate test module closing brace")
          text = text[:idx] + insertion + text[idx:]
          p.write_text(text)

          tx = "crates/pulsedag-rpc/src/handlers/tx_protocol.rs"
          old_tx_identity = '''fn rpc_protocol_identity<S: RpcStateLike>(
              state: &S,
          ) -> Result<Option<ProtocolActivationIdentity>, PulseError> {
              let Some(p2p) = state.p2p() else {
                  return Ok(None);
              };
              p2p.local_protocol_capabilities_v1()
                  .map(|capabilities| capabilities.map(|capabilities| capabilities.protocol_identity))
          }
          '''
          new_tx_identity = '''fn rpc_protocol_identity<S: RpcStateLike>(
              state: &S,
          ) -> Result<Option<ProtocolActivationIdentity>, PulseError> {
              super::mining_submit_protocol::rpc_protocol_identity(state)
          }
          '''
          replace_exact(tx, old_tx_identity, new_tx_identity)

          preflight = "scripts/v2_4_0_private_testnet_preflight.sh"
          old_path = '''is_absolute_persistent_path() {
            local value="$1"
            [[ "$value" == /* ]] && [[ "$value" != /tmp/* ]] && [[ "$value" != /run/* ]]
          }
          '''
          new_path = '''is_absolute_persistent_path() {
            local value="$1"
            [[ "$value" == /* ]] \\
              && [[ "$value" != /tmp ]] \\
              && [[ "$value" != /tmp/* ]] \\
              && [[ "$value" != /run ]] \\
              && [[ "$value" != /run/* ]]
          }
          '''
          replace_exact(preflight, old_path, new_path)

          preflight_test = "scripts/tests/test_v2_4_0_private_testnet_preflight.sh"
          anchor = '''cp "$TMP_DIR/node.env" "$TMP_DIR/auto-prune.env"
          sed -i 's/^PULSEDAG_AUTO_PRUNE_ENABLED=false/PULSEDAG_AUTO_PRUNE_ENABLED=true/' "$TMP_DIR/auto-prune.env"
          expect_fail "$TMP_DIR/auto-prune.env"
          '''
          replacement = anchor + '''
          cp "$TMP_DIR/node.env" "$TMP_DIR/volatile-rocksdb-root.env"
          sed -i 's#^PULSEDAG_ROCKSDB_PATH=.*#PULSEDAG_ROCKSDB_PATH=/tmp#' "$TMP_DIR/volatile-rocksdb-root.env"
          expect_fail "$TMP_DIR/volatile-rocksdb-root.env"

          cp "$TMP_DIR/node.env" "$TMP_DIR/volatile-identity-root.env"
          sed -i 's#^PULSEDAG_P2P_IDENTITY_KEY=.*#PULSEDAG_P2P_IDENTITY_KEY=/run#' "$TMP_DIR/volatile-identity-root.env"
          expect_fail "$TMP_DIR/volatile-identity-root.env"
          '''
          replace_exact(preflight_test, anchor, replacement)
          PY

      - name: Format and focused regression tests
        shell: bash
        run: |
          set -euo pipefail
          cargo fmt --all
          cargo fmt --all -- --check
          cargo test --locked -p pulsedag-rpc mining_submit_protocol --lib
          bash scripts/tests/test_v2_4_0_private_testnet_preflight.sh
          git diff --check

      - name: Commit source fixes
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "Task31 CI"
          git config user.email "task31-ci@users.noreply.github.com"
          git add \
            crates/pulsedag-rpc/src/handlers/mining_submit_protocol.rs \
            crates/pulsedag-rpc/src/handlers/tx_protocol.rs \
            scripts/v2_4_0_private_testnet_preflight.sh \
            scripts/tests/test_v2_4_0_private_testnet_preflight.sh
          git diff --cached --exit-code && { echo "no patch produced" >&2; exit 1; } || true
          git commit -m "fix: address Task31 activated-v2 review blockers"
          git push origin HEAD:agent/task31-release-freeze
