name: Repair #1064 durable identity materializer

on:
  push:
    branches:
      - codex/issue-1037-mining-protocol-v3
    paths:
      - '.github/workflows/harden-1064-mining-identity-v4.yml'

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/issue-1037-mining-protocol-v3
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Patch v3 materializer structurally
        shell: bash
        run: |
          set -euo pipefail
          python3 .github/scripts/repair_1064_materializer.py
          git diff --check
          rm .github/scripts/repair_1064_materializer.py
          rm .github/workflows/harden-1064-mining-identity-v4.yml
          rm .github/workflows/harden-1064-mining-identity-v5.yml
          git config user.name "kalekói"
          git config user.email "hermida.prada@gmail.com"
          git add -A
          git commit -m "ci: target #1064 materializer structurally"
          git push origin HEAD:codex/issue-1037-mining-protocol-v3
