name: temporary 1076 RPC classification fix

on:
  push:
    branches:
      - codex/1036-mempool-v3-live-policy
    paths:
      - .github/workflows/tmp-1076-rpc-classification-fix.yml

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/1036-mempool-v3-live-policy
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Preserve legacy RPC classification with v3 machine code
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          path = Path('crates/pulsedag-rpc/src/handlers/tx_protocol.rs')
          text = path.read_text()
          old = '''    let reason = rejection_reason(result);\n    if let Some(code) = mempool_policy_rejection_code_from_reason_v3(&reason) {\n        return ApiResponse::err(code, mempool_policy_rejection_detail_v3(&reason));\n    }\n    match classify_rpc_transaction_acceptance(transaction, chain, identity, result) {\n        Some(classification) => {\n            ApiResponse::err_classified("TX_REJECTED", reason, classification.as_str())\n        }\n        None => ApiResponse::err("TX_REJECTED", reason),\n    }\n'''
          new = '''    let reason = rejection_reason(result);\n    let classification = classify_rpc_transaction_acceptance(transaction, chain, identity, result);\n    if let Some(code) = mempool_policy_rejection_code_from_reason_v3(&reason) {\n        let detail = mempool_policy_rejection_detail_v3(&reason);\n        return match classification {\n            Some(classification) => ApiResponse::err_classified(code, detail, classification.as_str()),\n            None => ApiResponse::err(code, detail),\n        };\n    }\n    match classification {\n        Some(classification) => {\n            ApiResponse::err_classified("TX_REJECTED", reason, classification.as_str())\n        }\n        None => ApiResponse::err("TX_REJECTED", reason),\n    }\n'''
          if old not in text:
              raise SystemExit('expected classified_rejection block not found')
          path.write_text(text.replace(old, new, 1))
          PY
          cargo fmt --all -- --check
          cargo test -p pulsedag-rpc --all-targets
          cargo clippy -p pulsedag-rpc --all-targets -- -D warnings
          rm .github/workflows/tmp-1076-rpc-classification-fix.yml
          git config user.name 'chatgpt-codex-connector[bot]'
          git config user.email '199175422+chatgpt-codex-connector[bot]@users.noreply.github.com'
          git add crates/pulsedag-rpc/src/handlers/tx_protocol.rs .github/workflows/tmp-1076-rpc-classification-fix.yml
          git commit -m 'rpc: preserve rejection classification with v3 codes'
          git push origin HEAD:codex/1036-mempool-v3-live-policy
