name: tmp-apply-1130-dead-code

on:
  workflow_dispatch:
  push:
    branches: [audit/1130-block-request-dead-code-attr]
    paths:
      - scripts/_tmp_1130_dead_code.patch
      - .github/workflows/_tmp_apply_1130_dead_code.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/audit/1130-block-request-dead-code-attr'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: audit/1130-block-request-dead-code-attr
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Apply and drop one-shot files
        run: |
          set -euo pipefail
          git apply --verbose scripts/_tmp_1130_dead_code.patch
          rm -f scripts/_tmp_1130_dead_code.patch .github/workflows/_tmp_apply_1130_dead_code.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/pulsedagd/src/block_request.rs
          git add -u scripts/_tmp_1130_dead_code.patch .github/workflows/_tmp_apply_1130_dead_code.yml || true
          git commit -m "pulsedagd: gate block_request dead_code allows to non-test builds (#1130)"
          git push origin audit/1130-block-request-dead-code-attr
