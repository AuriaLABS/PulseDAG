name: TEMP format wallet reconcile

on:
  push:
    branches:
      - wallet/v3-pending-utxo-reconcile
    paths:
      - .github/workflows/temp-format-wallet-reconcile.yml

permissions:
  contents: write

jobs:
  format-and-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout exact branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: wallet/v3-pending-utxo-reconcile

      - name: Install rustfmt
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.91.0
          components: rustfmt

      - name: Format exact reconcile source
        shell: bash
        run: |
          set -euo pipefail
          test "$(git hash-object crates/pulsedag-wallet/src/bin/pulsedag-wallet-reconcile.rs)" = "2d4004ae2cb096242a5fd95119489170a7466369"
          cargo fmt --all
          git diff --check
          changed="$(git diff --name-only)"
          test "$changed" = "crates/pulsedag-wallet/src/bin/pulsedag-wallet-reconcile.rs"

      - name: Publish formatting and clean workflow
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/temp-format-wallet-reconcile.yml
          git add -A
          changed="$(git diff --cached --name-only | sort)"
          expected="$(printf '%s\n' '.github/workflows/temp-format-wallet-reconcile.yml' 'crates/pulsedag-wallet/src/bin/pulsedag-wallet-reconcile.rs' | sort)"
          test "$changed" = "$expected"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "wallet: format reconcile command"
          git push origin HEAD:wallet/v3-pending-utxo-reconcile
