name: RPC and Release Validation

on:
  pull_request:
  push:
    branches: [main]

jobs:
  rpc-tests:
    runs-on: ubuntu-latest
    env:
      RUST_TEST_THREADS: 1
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      - name: Build default keyless pulsedag-rpc tests
        run: cargo test -p pulsedag-rpc --all-targets --no-run

      - name: Run full default keyless pulsedag-rpc suite
        run: cargo test -p pulsedag-rpc --all-targets

      - name: Prove legacy wallet RPC feature is removed
        shell: bash
        run: |
          set -euo pipefail
          if grep -R --line-number --fixed-strings 'legacy-wallet-rpc' apps/pulsedagd/Cargo.toml crates/pulsedag-rpc/Cargo.toml crates/pulsedag-rpc/src; then
            echo 'legacy-wallet-rpc compatibility feature is still present' >&2
            exit 1
          fi
          if grep -R --line-number -E 'struct Wallet(Sign|Transfer)Request|private_key' crates/pulsedag-rpc/src/handlers/wallet.rs; then
            echo 'raw-key wallet RPC implementation is still present' >&2
            exit 1
          fi

  release-readiness-tests:
    runs-on: ubuntu-latest
    env:
      RUST_TEST_THREADS: 1
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      - name: Runtime/read-plane/release regression tests
        run: |
          cargo test -p pulsedag-rpc handlers::runtime::tests::
          cargo test -p pulsedag-rpc handlers::release::tests::
          cargo test -p pulsedag-rpc handlers::status::tests::
          cargo test -p pulsedag-rpc handlers::tx::tests::
