name: v3.0 RPC and Release Validation

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  # Supersede only stale heads from the same pull request. Keep push, tag and
  # workflow_dispatch runs isolated so retained/manual evidence is never cancelled.
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  rpc-tests:
    runs-on: ubuntu-latest
    env:
      RUST_TEST_THREADS: 1
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      - name: Build pulsedag-rpc tests
        run: cargo test -p pulsedag-rpc --all-targets --no-run

      - name: Run full pulsedag-rpc suite
        run: cargo test -p pulsedag-rpc --all-targets

  release-readiness-tests:
    runs-on: ubuntu-latest
    env:
      RUST_TEST_THREADS: 1
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      - name: Runtime/read-plane/release regression tests
        run: |
          cargo test -p pulsedag-rpc handlers::runtime::tests::
          cargo test -p pulsedag-rpc handlers::release::tests::
          cargo test -p pulsedag-rpc handlers::status::tests::
          cargo test -p pulsedag-rpc handlers::tx::tests::
