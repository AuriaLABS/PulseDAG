name: one-shot fix 811 live mining gate

on:
  push:
    branches:
      - fix/rejoin-catchup-stall-811

permissions:
  contents: write

jobs:
  patch-test-commit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
      - name: Apply patch
        run: python .github/scripts/fix_811_live_mining_gate.py
      - name: Format patch
        run: cargo fmt --all
      - name: Format check
        run: cargo fmt --all -- --check
      - name: Diff sanity
        run: git diff --check
      - name: Live recovery predicate
        run: cargo test -p pulsedag-rpc live_missing_parent_state_still_blocks_mining -- --nocapture
      - name: Stale runtime regression
        run: cargo test -p pulsedag-rpc stale_runtime_missing_parent_counters_do_not_block_clean_chain_template -- --nocapture
      - name: Mining template tests
        run: cargo test -p pulsedag-rpc mining_template -- --nocapture
      - name: Node check
        run: cargo check -p pulsedagd
      - name: Commit tested patch
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/one-shot-fix-811-live-mining-gate.yml
          git rm .github/scripts/fix_811_live_mining_gate.py
          git add crates/pulsedag-rpc/src/handlers/mining_template.rs
          git commit -m "fix(sync): gate mining on live recovery state"
          git push origin HEAD:fix/rejoin-catchup-stall-811
