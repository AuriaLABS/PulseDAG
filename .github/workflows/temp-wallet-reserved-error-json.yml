name: temp wallet reserved UTXO machine-readable error

on:
  push:
    branches:
      - wallet/v3-pending-utxo-reconcile
    paths:
      - '.github/workflows/temp-wallet-reserved-error-json.yml'

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: wallet/v3-pending-utxo-reconcile
          fetch-depth: 1
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.91.0
          components: clippy,rustfmt
      - name: Guard exact wallet CLI source
        shell: bash
        run: |
          set -euo pipefail
          test "$(git hash-object crates/pulsedag-wallet/src/bin/pulsedag-wallet.rs)" = "c01d8d7541d88e7aeac77b06eccf0bcc017e9ce4"
      - name: Add reserved UTXO JSON error contract
        shell: bash
        run: |
          set -euo pipefail
          python3 <<'PY'
          from pathlib import Path
          p = Path('crates/pulsedag-wallet/src/bin/pulsedag-wallet.rs')
          t = p.read_text()

          old_import = '''    WalletPendingJournal, WalletPendingJournalStore, WalletPendingState, WalletPlanSigner,\n'''
          new_import = '''    WalletPendingError, WalletPendingJournal, WalletPendingJournalStore, WalletPendingState,\n    WalletPlanSigner,\n'''
          assert t.count(old_import) == 1
          t = t.replace(old_import, new_import)

          anchor = '''async fn run() -> CliResult<()> {\n'''
          helper = '''fn machine_readable_pending_error(error: &(dyn Error + 'static)) -> Option<String> {\n    match error.downcast_ref::<WalletPendingError>()? {\n        WalletPendingError::ReservedOutpoint { txid, index } => Some(\n            serde_json::json!({\n                "ok": false,\n                "error": {\n                    "code": "PENDING_UTXO_RESERVED",\n                    "message": "selected outpoint is reserved by a pending transaction",\n                    "txid": txid,\n                    "index": index,\n                }\n            })\n            .to_string(),\n        ),\n        _ => None,\n    }\n}\n\n'''
          assert t.count(anchor) == 1
          t = t.replace(anchor, helper + anchor)

          old_main = '''#[tokio::main]\nasync fn main() {\n    if let Err(error) = run().await {\n        eprintln!("pulsedag-wallet: {error}");\n        std::process::exit(1);\n    }\n}\n'''
          new_main = '''#[tokio::main]\nasync fn main() {\n    if let Err(error) = run().await {\n        if let Some(encoded) = machine_readable_pending_error(error.as_ref()) {\n            eprintln!("{encoded}");\n        } else {\n            eprintln!("pulsedag-wallet: {error}");\n        }\n        std::process::exit(1);\n    }\n}\n'''
          assert t.count(old_main) == 1
          t = t.replace(old_main, new_main)

          test_anchor = '''    #[test]\n    fn parser_exposes_no_secret_command_line_options() {\n'''
          test = '''    #[test]\n    fn reserved_outpoint_error_is_machine_readable() {\n        let txid = "11".repeat(32);\n        let error = WalletPendingError::ReservedOutpoint {\n            txid: txid.clone(),\n            index: 7,\n        };\n        let encoded = machine_readable_pending_error(&error).expect("structured error");\n        let value: serde_json::Value = serde_json::from_str(&encoded).expect("valid JSON");\n        assert_eq!(value["ok"], false);\n        assert_eq!(value["error"]["code"], "PENDING_UTXO_RESERVED");\n        assert_eq!(\n            value["error"]["message"],\n            "selected outpoint is reserved by a pending transaction"\n        );\n        assert_eq!(value["error"]["txid"], txid);\n        assert_eq!(value["error"]["index"], 7);\n        assert!(machine_readable_pending_error(&WalletPendingError::ConflictingReservations).is_none());\n    }\n\n'''
          assert t.count(test_anchor) == 1
          t = t.replace(test_anchor, test + test_anchor)
          p.write_text(t)
          PY
          cargo fmt --all
          git diff --check
          test "$(git diff --name-only)" = "crates/pulsedag-wallet/src/bin/pulsedag-wallet.rs"
      - name: Run focused gate
        shell: bash
        run: |
          set -euo pipefail
          cargo test --locked -p pulsedag-wallet --bin pulsedag-wallet
          cargo clippy --locked -p pulsedag-wallet --all-targets -- -D warnings
          cargo fmt --all -- --check
          git diff --check
      - name: Publish source and remove materializer
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/temp-wallet-reserved-error-json.yml
          git add crates/pulsedag-wallet/src/bin/pulsedag-wallet.rs .github/workflows/temp-wallet-reserved-error-json.yml
          test "$(git diff --cached --name-only)" = $'.github/workflows/temp-wallet-reserved-error-json.yml\ncrates/pulsedag-wallet/src/bin/pulsedag-wallet.rs'
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'wallet: emit reserved UTXO conflicts as JSON'
          git push origin HEAD:wallet/v3-pending-utxo-reconcile
