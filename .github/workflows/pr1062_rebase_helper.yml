name: PR1062 rebase helper

on:
  push:
    branches:
      - codex/pr1062-bootstrap-768a04b

jobs:
  build-validated-four-file-merge:
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - name: Checkout full history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Three-way merge exact four files
        shell: bash
        run: |
          set -euo pipefail
          SOURCE=8f2c1e02d124b06b179c63190abe40315f3cbb83
          BASE=c7a04869c8ec5cb4bcb590673118c228e7a02678
          MAIN=768a04b76604adc9c2c3ca4489040b1d940e4f32
          paths=(
            crates/pulsedag-core/src/validation.rs
            crates/pulsedag-rpc/src/handlers/release.rs
            crates/pulsedag-wallet/src/bin/pulsedag-wallet.rs
            crates/pulsedag-wallet/src/pulsedag_wallet_relay.rs
          )
          for p in "${paths[@]}"; do
            git show "$SOURCE:$p" > current.tmp
            git show "$BASE:$p" > base.tmp
            git show "$MAIN:$p" > other.tmp
            git merge-file --union current.tmp base.tmp other.tmp || true
            cp current.tmp "$p"
          done

      - name: Resolve exact semantic overlaps
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re, subprocess

          source = "8f2c1e02d124b06b179c63190abe40315f3cbb83"
          main = "768a04b76604adc9c2c3ca4489040b1d940e4f32"
          cli_path = Path("crates/pulsedag-wallet/src/bin/pulsedag-wallet.rs")
          relay_path = Path("crates/pulsedag-wallet/src/pulsedag_wallet_relay.rs")
          relay_repo_path = "crates/pulsedag-wallet/src/pulsedag_wallet_relay.rs"

          cli = cli_path.read_text()
          combined_import = '''use pulsedag_wallet_relay::{
              fetch_address_balance, fetch_address_utxos, fetch_mempool_fee_estimate,
              parse_signed_broadcast, prepare_broadcast, submit_prepared, AddressBalanceOutput,
              AddressUtxosOutput, BroadcastOutput, MempoolFeeEstimateOutput, RelayEnvelope,
          };'''
          cli, count = re.subn(
              r"use pulsedag_wallet_relay::\{.*?\n\};",
              combined_import,
              cli,
              count=1,
              flags=re.S,
          )
          if count != 1:
              raise SystemExit("failed to normalize CLI relay import")
          cli_path.write_text(cli)

          relay_source = subprocess.check_output(
              ["git", "show", f"{source}:{relay_repo_path}"], text=True
          )
          relay_main = subprocess.check_output(
              ["git", "show", f"{main}:{relay_repo_path}"], text=True
          )

          src_start = relay_source.index("pub async fn prepare_broadcast(")
          src_end = relay_source.index("fn address_url(", src_start)
          durable_region = relay_source[src_start:src_end]
          old_reject = "            rejection_message: Some(error.message),\n"
          if old_reject not in durable_region:
              raise SystemExit("#1062 rejection output shape changed unexpectedly")
          durable_region = durable_region.replace(
              old_reject,
              old_reject + "            rejection_classification: error.classification,\n",
              1,
          )
          old_accept = "        rejection_message: None,\n"
          if old_accept not in durable_region:
              raise SystemExit("#1062 accepted output shape changed unexpectedly")
          durable_region = durable_region.replace(
              old_accept,
              old_accept + "        rejection_classification: None,\n",
              1,
          )

          mempool_start = relay_main.index("async fn fetch_mempool_identity(")
          mempool_end = relay_main.index("fn rejected_broadcast_output(", mempool_start)
          mempool_identity_region = relay_main[mempool_start:mempool_end]

          relay = relay_path.read_text()

          m = re.search(r"pub struct BroadcastOutput \{(.*?)\n\}", relay, re.S)
          if not m:
              raise SystemExit("BroadcastOutput missing")
          if "rejection_classification" not in m.group(1):
              body = m.group(1).replace(
                  "    pub rejection_message: Option<String>,",
                  "    pub rejection_message: Option<String>,\n    pub rejection_classification: Option<String>,",
              )
              relay = relay[:m.start(1)] + body + relay[m.end(1):]

          m = re.search(r"struct ApiError \{(.*?)\n\}", relay, re.S)
          if not m:
              raise SystemExit("ApiError missing")
          if "classification" not in m.group(1):
              body = m.group(1).replace(
                  "    message: String,",
                  "    message: String,\n    #[serde(default)]\n    classification: Option<String>,",
              )
              relay = relay[:m.start(1)] + body + relay[m.end(1):]

          starts = [
              pos for marker in ("pub async fn prepare_broadcast(", "fn rejected_broadcast_output(")
              if (pos := relay.find(marker)) >= 0
          ]
          if not starts:
              raise SystemExit("relay submit conflict start not found")
          start = min(starts)
          end = relay.find("fn validate_decimal_u128(", start)
          if end < 0:
              raise SystemExit("main fee-estimate validation region missing")
          relay = relay[:start] + mempool_identity_region + durable_region + relay[end:]

          relay, removed = re.subn(
              r"\npub async fn broadcast_signed\(.*?\n\}\n",
              "\n",
              relay,
              count=1,
              flags=re.S,
          )
          if removed != 1:
              raise SystemExit(f"expected exactly one obsolete broadcast_signed wrapper, got {removed}")

          relay_path.write_text(relay)
          PY

      - name: Format and whitespace check
        shell: bash
        run: |
          set -euo pipefail
          cargo fmt --all
          cargo fmt --all -- --check
          git diff --check

      - name: Report merged contracts
        shell: bash
        run: |
          set -uo pipefail
          failures=0
          present() {
            label="$1"; pattern="$2"; file="$3"
            if grep -Fq -- "$pattern" "$file"; then
              echo "PASS: $label"
            else
              echo "FAIL: $label (missing '$pattern' in $file)"
              failures=$((failures + 1))
            fi
          }
          absent() {
            label="$1"; pattern="$2"; file="$3"
            if grep -Fq -- "$pattern" "$file"; then
              echo "FAIL: $label (unexpected '$pattern' in $file)"
              failures=$((failures + 1))
            else
              echo "PASS: $label"
            fi
          }

          present core-authoritative-occurrence authoritative_confirmed_transaction_occurrences crates/pulsedag-core/src/validation.rs
          present core-production-fee-bound MEMPOOL_POLICY_V3_PRODUCTION_MAX_TRANSACTION_FEE crates/pulsedag-core/src/validation.rs
          present release-authoritative-v1 authoritative_address_activity_v1 crates/pulsedag-rpc/src/handlers/release.rs
          present release-authoritative-v2 authoritative_address_activity_v2 crates/pulsedag-rpc/src/handlers/release.rs
          present release-fee-estimate-route /api/v1/mempool/fee-estimate crates/pulsedag-rpc/src/handlers/release.rs
          present cli-fee-estimate-command 'FeeEstimate(NetworkReadOnlyArgs)' crates/pulsedag-wallet/src/bin/pulsedag-wallet.rs
          present cli-fee-estimate-fetch fetch_mempool_fee_estimate crates/pulsedag-wallet/src/bin/pulsedag-wallet.rs
          present cli-pending-journal pending_journal crates/pulsedag-wallet/src/bin/pulsedag-wallet.rs
          present cli-prepare-broadcast prepare_broadcast crates/pulsedag-wallet/src/bin/pulsedag-wallet.rs
          present cli-submit-prepared submit_prepared crates/pulsedag-wallet/src/bin/pulsedag-wallet.rs
          present cli-reservation-error PENDING_UTXO_RESERVED crates/pulsedag-wallet/src/bin/pulsedag-wallet.rs
          absent cli-no-one-shot-broadcast broadcast_signed crates/pulsedag-wallet/src/bin/pulsedag-wallet.rs
          present relay-fee-version MEMPOOL_FEE_ESTIMATE_V3_VERSION crates/pulsedag-wallet/src/pulsedag_wallet_relay.rs
          present relay-fee-output 'pub struct MempoolFeeEstimateOutput' crates/pulsedag-wallet/src/pulsedag_wallet_relay.rs
          present relay-mempool-identity 'async fn fetch_mempool_identity' crates/pulsedag-wallet/src/pulsedag_wallet_relay.rs
          present relay-fee-fetch 'pub async fn fetch_mempool_fee_estimate' crates/pulsedag-wallet/src/pulsedag_wallet_relay.rs
          present relay-prepare 'pub async fn prepare_broadcast' crates/pulsedag-wallet/src/pulsedag_wallet_relay.rs
          present relay-submit 'pub async fn submit_prepared' crates/pulsedag-wallet/src/pulsedag_wallet_relay.rs
          present relay-rejection-classification rejection_classification crates/pulsedag-wallet/src/pulsedag_wallet_relay.rs
          absent relay-no-old-submit 'async fn submit_transaction' crates/pulsedag-wallet/src/pulsedag_wallet_relay.rs
          absent relay-no-one-shot-wrapper 'pub async fn broadcast_signed' crates/pulsedag-wallet/src/pulsedag_wallet_relay.rs

          echo "$failures" > .pr1062-contract-failures
          echo "CONTRACT_FAILURES=$failures"
          exit 0

      - name: Compile affected packages and all targets
        shell: bash
        run: |
          set -euo pipefail
          cargo check -p pulsedag-core -p pulsedag-rpc -p pulsedag-wallet --all-targets

      - name: Focused tests
        shell: bash
        run: |
          set -euo pipefail
          cargo test -p pulsedag-rpc release_metadata_reports_keyless_signed_relay_surface -- --nocapture
          cargo test -p pulsedag-wallet --lib
          cargo test -p pulsedag-wallet --bin pulsedag-wallet

      - name: Stage four-file artifact
        shell: bash
        run: |
          set -euo pipefail
          rm -rf .pr1062-artifact
          mkdir -p .pr1062-artifact/crates/pulsedag-core/src
          mkdir -p .pr1062-artifact/crates/pulsedag-rpc/src/handlers
          mkdir -p .pr1062-artifact/crates/pulsedag-wallet/src/bin
          mkdir -p .pr1062-artifact/crates/pulsedag-wallet/src
          cp crates/pulsedag-core/src/validation.rs .pr1062-artifact/crates/pulsedag-core/src/validation.rs
          cp crates/pulsedag-rpc/src/handlers/release.rs .pr1062-artifact/crates/pulsedag-rpc/src/handlers/release.rs
          cp crates/pulsedag-wallet/src/bin/pulsedag-wallet.rs .pr1062-artifact/crates/pulsedag-wallet/src/bin/pulsedag-wallet.rs
          cp crates/pulsedag-wallet/src/pulsedag_wallet_relay.rs .pr1062-artifact/crates/pulsedag-wallet/src/pulsedag_wallet_relay.rs
          cp .pr1062-contract-failures .pr1062-artifact/contract-failures
          sha256sum .pr1062-artifact/crates/pulsedag-core/src/validation.rs \
                    .pr1062-artifact/crates/pulsedag-rpc/src/handlers/release.rs \
                    .pr1062-artifact/crates/pulsedag-wallet/src/bin/pulsedag-wallet.rs \
                    .pr1062-artifact/crates/pulsedag-wallet/src/pulsedag_wallet_relay.rs \
                    | tee .pr1062-artifact/SHA256SUMS
          git diff -- \
            crates/pulsedag-core/src/validation.rs \
            crates/pulsedag-rpc/src/handlers/release.rs \
            crates/pulsedag-wallet/src/bin/pulsedag-wallet.rs \
            crates/pulsedag-wallet/src/pulsedag_wallet_relay.rs \
            > .pr1062-artifact/four-file.diff

      - name: Upload validated artifact
        uses: actions/upload-artifact@v4
        with:
          name: pr1062-four-merged-files-validated-windows
          path: .pr1062-artifact
          if-no-files-found: error
          retention-days: 1

      - name: Enforce merged contract gate
        shell: bash
        run: |
          set -euo pipefail
          test "$(cat .pr1062-contract-failures)" = "0"
