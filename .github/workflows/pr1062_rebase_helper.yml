name: PR1062 rebase helper

on:
  push:
    branches:
      - codex/pr1062-bootstrap-768a04b

jobs:
  diagnose-four-file-merge:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - name: Checkout helper branch with full history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Print exact three-way conflicts
        shell: bash
        run: |
          set -euo pipefail
          SOURCE=8f2c1e02d124b06b179c63190abe40315f3cbb83
          BASE=c7a04869c8ec5cb4bcb590673118c228e7a02678
          MAIN=768a04b76604adc9c2c3ca4489040b1d940e4f32
          paths=(
            crates/pulsedag-core/src/validation.rs
            crates/pulsedag-rpc/src/handlers/release.rs
            crates/pulsedag-wallet/src/bin/pulsedag-wallet.rs
            crates/pulsedag-wallet/src/pulsedag_wallet_relay.rs
          )
          for p in "${paths[@]}"; do
            echo "===== FILE $p ====="
            git show "$SOURCE:$p" > current.tmp
            git show "$BASE:$p" > base.tmp
            git show "$MAIN:$p" > other.tmp
            set +e
            git merge-file -L PR1062 -L MERGE_BASE -L MAIN current.tmp base.tmp other.tmp
            rc=$?
            set -e
            echo "MERGE_RC=$rc"
            if grep -q '^<<<<<<< ' current.tmp; then
              awk '
                /^<<<<<<< / {printing=1}
                printing {print}
                /^>>>>>>> / {printing=0; print "----- END CONFLICT -----"}
              ' current.tmp
            else
              echo "NO_CONFLICT_MARKERS"
            fi
          done
