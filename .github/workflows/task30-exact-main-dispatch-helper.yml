name: Task30 exact-main dispatch helper

on:
  push:
    branches:
      - agent/task30-dispatch-helper
    paths:
      - .github/workflows/task30-exact-main-dispatch-helper.yml

permissions:
  contents: read
  actions: write
  issues: write

concurrency:
  group: task30-exact-main-dispatch-helper
  cancel-in-progress: true

jobs:
  dispatch:
    runs-on: ubuntu-latest
    steps:
      - name: Dispatch Task30 at frozen main and record run
        uses: actions/github-script@v7
        env:
          TARGET_SHA: 37f0dd6ca7aabe07341c226744f65d46bbb03d65
          TARGET_INTEGRATED_AT: '2026-08-24T10:28:23Z'
        with:
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const targetSha = process.env.TARGET_SHA;
            const targetIntegratedAt = new Date(process.env.TARGET_INTEGRATED_AT).getTime();
            const workflowId = 'task30-adversarial-runtime.yml';

            const mainRef = await github.rest.git.getRef({ owner, repo, ref: 'heads/main' });
            if (mainRef.data.object.sha !== targetSha) {
              throw new Error(`main moved before Task30 dispatch: expected ${targetSha}, got ${mainRef.data.object.sha}`);
            }

            const findExistingRun = async (notBeforeMs) => {
              const runs = await github.rest.actions.listWorkflowRuns({
                owner,
                repo,
                workflow_id: workflowId,
                event: 'workflow_dispatch',
                branch: 'main',
                per_page: 50,
              });
              return runs.data.workflow_runs.find(candidate =>
                candidate.head_sha === targetSha &&
                new Date(candidate.created_at).getTime() >= notBeforeMs
              ) || null;
            };

            let run = await findExistingRun(targetIntegratedAt);
            let dispatchMode = 'recovered-existing';

            if (!run) {
              const dispatchedAt = Date.now();
              await github.rest.actions.createWorkflowDispatch({
                owner,
                repo,
                workflow_id: workflowId,
                ref: 'main',
              });
              dispatchMode = 'created';

              for (let attempt = 0; attempt < 18 && !run; attempt += 1) {
                await new Promise(resolve => setTimeout(resolve, 5000));
                run = await findExistingRun(dispatchedAt - 5000);
              }
            }

            if (!run) {
              await github.rest.issues.createComment({
                owner,
                repo,
                issue_number: 872,
                body: `TASK30_EXACT_DISPATCH_FAILED\n\ncandidate_sha=\`${targetSha}\`\nreason=no matching workflow_dispatch run was discoverable after exact-main retry\nhelper_sha=\`${context.sha}\`\n\nNo Task30 PASS/FAIL is inferred.`,
              });
              throw new Error(`Task30 dispatch run for ${targetSha} not discoverable`);
            }

            await github.rest.issues.createComment({
              owner,
              repo,
              issue_number: 872,
              body: `TASK30_EXACT_DISPATCH\n\ncandidate_sha=\`${targetSha}\`\nrun_id=\`${run.id}\`\nrun_url=${run.html_url}\nstatus=\`${run.status}\`\nevent=\`${run.event}\`\nhead_branch=\`${run.head_branch}\`\ndispatch_mode=\`${dispatchMode}\`\nhelper_sha=\`${context.sha}\`\n\nThis records dispatch only; Task30 remains open until the exact run completes and its decision evidence is inspected.`,
            });
