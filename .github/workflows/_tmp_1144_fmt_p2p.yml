name: One-shot rustfmt P2P match

on:
  push:
    branches:
      - docs/1139-historical-rustsec-bincode-on-main
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: tmp-1144-fmt-p2p
  cancel-in-progress: false

jobs:
  wrap-match:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: docs/1139-historical-rustsec-bincode-on-main
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Wrap fail-closed P2P match arm and remove this workflow
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p = Path("apps/pulsedagd/src/main.rs")
          text = p.read_text(encoding="utf-8")
          old = "            other => { anyhow::bail!(\"invalid P2P mode '{other}'. Supported values: libp2p-real, libp2p-dev, libp2p, libp2p-skeleton, memory, simulated\"); }"
          new = "            other => {\n                anyhow::bail!(\"invalid P2P mode '{other}'. Supported values: libp2p-real, libp2p-dev, libp2p, libp2p-skeleton, memory, simulated\");\n            }"
          if old in text:
              p.write_text(text.replace(old, new, 1), encoding="utf-8")
              print("patched main.rs")
          else:
              print("main.rs already formatted or marker missing")
          PY
          git config user.name "kalekoi"
          git config user.email "hermida.prada@gmail.com"
          rm -f .github/workflows/_tmp_1144_fmt_p2p.yml
          git add apps/pulsedagd/src/main.rs .github/workflows/_tmp_1144_fmt_p2p.yml || true
          if git diff --cached --quiet; then
            echo "nothing to commit"
            exit 0
          fi
          git commit -m "style: rustfmt P2P fail-closed match arm (#1141 leftover)"
          git push origin HEAD:docs/1139-historical-rustsec-bincode-on-main
