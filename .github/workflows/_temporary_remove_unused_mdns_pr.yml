name: Temporary remove unused mDNS PR

on:
  pull_request:
    branches:
      - release/2.4.0
    paths:
      - .github/workflows/_temporary_remove_unused_mdns_pr.yml

permissions:
  contents: read

concurrency:
  group: temporary-remove-unused-mdns-pr-prune-optional-lock-20260804
  cancel-in-progress: true

jobs:
  disabled-manual-lock-pruning:
    if: ${{ false }}
    runs-on: ubuntu-24.04
    steps:
      - run: echo 'Manual Cargo.lock and checksum editing is disabled; Cargo must resolve the graph.'
