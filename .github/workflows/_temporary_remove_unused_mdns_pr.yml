name: Temporary remove unused mDNS PR

on:
  pull_request:
    branches:
      - release/2.4.0
    paths:
      - .github/workflows/_temporary_remove_unused_mdns_pr.yml
      - scripts/_temporary_remove_unused_mdns.py

permissions:
  contents: write

concurrency:
  group: temporary-remove-unused-mdns-pr-workspace-prune
  cancel-in-progress: true

jobs:
  patch-validate-and-clean:
    if: github.repository == 'AuriaLABS/PulseDAG' && github.head_ref == 'security/2.4.0-dependency-remediation'
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout remediation branch
        uses: actions/checkout@v4
        with:
          ref: security/2.4.0-dependency-remediation
          fetch-depth: 0

      - name: Install pinned Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.88.0
          components: rustfmt

      - name: Apply dependency remediation
        shell: bash
        run: |
          set -euo pipefail
          python scripts/_temporary_remove_unused_mdns.py
          cargo update --workspace
          cargo update -p quinn-proto@0.11.14 --precise 0.11.15
          cargo metadata --locked --format-version 1 >/dev/null
          cargo fmt --all

      - name: Validate dependency and runtime contract
        shell: bash
        run: |
          set -euo pipefail
          cargo test --locked -p pulsedag-p2p
          cargo test --locked -p pulsedagd config::tests
          cargo check --locked -p pulsedag-p2p --all-targets
          cargo check --locked -p pulsedagd --all-targets
          cargo tree --locked --workspace --all-features --target all -i hickory-proto \
            > /tmp/hickory-tree.txt 2>&1 || true
          if grep -q '^hickory-proto v' /tmp/hickory-tree.txt; then
            cat /tmp/hickory-tree.txt
            echo 'hickory-proto remains reachable after removing the unused mDNS feature' >&2
            exit 1
          fi
          if grep -q 'name = "hickory-proto"' Cargo.lock; then
            echo 'hickory-proto remains in Cargo.lock after conservative workspace prune' >&2
            exit 1
          fi
          if grep -q 'name = "libp2p-mdns"' Cargo.lock; then
            echo 'libp2p-mdns remains in Cargo.lock after conservative workspace prune' >&2
            exit 1
          fi
          grep -A2 'name = "quinn-proto"' Cargo.lock | grep 'version = "0.11.15"'

      - name: Capture remediation evidence
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p ci-evidence/dependency-final-remediation
          cargo tree --locked -p pulsedag-p2p >ci-evidence/dependency-final-remediation/p2p-tree.txt
          cargo tree --locked --workspace --all-features --target all -i hickory-proto \
            >ci-evidence/dependency-final-remediation/hickory-proto.txt 2>&1 || true
          cargo tree --locked --workspace --all-features --target all -i quinn-proto \
            >ci-evidence/dependency-final-remediation/quinn-proto.txt 2>&1 || true
          {
            echo "source_sha=${GITHUB_SHA}"
            echo "rustc=$(rustc --version)"
            echo "cargo=$(cargo --version)"
            echo "cargo_lock_sha256=$(sha256sum Cargo.lock | awk '{print $1}')"
            echo "mdns_feature_present=$(grep -c '\"mdns\"' crates/pulsedag-p2p/Cargo.toml || true)"
            echo "libp2p_mdns_lock_entries=$(grep -c 'name = \"libp2p-mdns\"' Cargo.lock || true)"
            echo "hickory_lock_entries=$(grep -c 'name = \"hickory-proto\"' Cargo.lock || true)"
            echo "hickory_reachable=$(grep -c '^hickory-proto v' ci-evidence/dependency-final-remediation/hickory-proto.txt || true)"
            grep -A2 'name = "quinn-proto"' Cargo.lock || true
          } >ci-evidence/dependency-final-remediation/provenance.txt
          sha256sum ci-evidence/dependency-final-remediation/* \
            >ci-evidence/dependency-final-remediation/SHA256SUMS

      - name: Publish code-only remediation
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/_temporary_dependency_audit.yml
          rm -f .github/workflows/_temporary_mdns_diagnostic.yml
          rm -f .github/workflows/_temporary_remove_unused_mdns.yml
          rm -f .github/workflows/_temporary_remove_unused_mdns_kick.yml
          rm .github/workflows/_temporary_remove_unused_mdns_pr.yml
          rm scripts/_temporary_remove_unused_mdns.py
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --check
          git commit -m 'security: remove unsupported mDNS dependency'
          git push origin HEAD:security/2.4.0-dependency-remediation

      - name: Upload remediation evidence
        uses: actions/upload-artifact@v4
        with:
          name: dependency_final_remediation_${{ github.run_id }}
          path: ci-evidence/dependency-final-remediation
          if-no-files-found: error
          retention-days: 90
