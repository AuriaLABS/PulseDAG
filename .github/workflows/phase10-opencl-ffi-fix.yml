name: Phase 10 OpenCL FFI fix

on:
  push:
    branches:
      - automation/phase10-opencl-ffi-fix

permissions:
  contents: write

jobs:
  apply-fix:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout Phase 10 branch
        uses: actions/checkout@v4
        with:
          ref: codex/issue-1038-amd-opencl-runtime-phase10
          fetch-depth: 0

      - name: Patch clGetProgramBuildInfo value call
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          path = Path("apps/pulsedag-miner/src/opencl_driver_launch.rs")
          lines = path.read_text(encoding="utf-8").splitlines(keepends=True)
          matches = []
          for i in range(2, len(lines)):
              if (
                  "buffer.as_mut_ptr().cast::<c_void>()" in lines[i - 2]
                  and lines[i - 1].strip() == "std::ptr::null_mut(),"
                  and lines[i].strip() == "&mut size,"
              ):
                  matches.append(i)
          if len(matches) != 1:
              raise SystemExit(f"expected exactly one erroneous build-log size argument, found {len(matches)}")
          del lines[matches[0]]
          path.write_text("".join(lines), encoding="utf-8")
          PY

      - name: Commit exact fix
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- apps/pulsedag-miner/src/opencl_driver_launch.rs
          git commit -m "fix: correct OpenCL program build log FFI call"
          git push origin HEAD:codex/issue-1038-amd-opencl-runtime-phase10
