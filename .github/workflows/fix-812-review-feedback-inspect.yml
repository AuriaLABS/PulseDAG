name: Validate #815 review feedback fixes

on:
  push:
    branches:
      - fix/fresh-node-orphan-recovery-812
    paths:
      - .github/workflows/fix-812-review-feedback-inspect.yml

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: fix/fresh-node-orphan-recovery-812
          fetch-depth: 0

      - name: Apply review feedback fixes
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          main_path = Path('apps/pulsedagd/src/main.rs')
          main = main_path.read_text()

          def replace_once(text, old, new, label):
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{label} anchor count={count}')
              return text.replace(old, new, 1)

          # P2 #1: continuation locators must only advance from a tail header
          # that is already locally accepted. If the page tail is still pending,
          # wait for it instead of treating the in-flight hash as a known anchor.
          old = '''fn selected_header_discovery_continuation_anchor(
              session: Option<&SelectedSegmentSession>,
              headers: &[HeaderInventory],
              selected_requests: &[String],
          ) -> Option<String> {
              if !selected_requests.is_empty() {
                  return None;
              }
              let session = session?;
              let furthest = headers.iter().max_by(|a, b| {
                  a.header
                      .height
                      .cmp(&b.header.height)
                      .then_with(|| a.hash.cmp(&b.hash))
              })?;
              (furthest.header.height < session.remote_selected_height).then(|| furthest.hash.clone())
          }
          '''
          new = '''fn selected_header_discovery_continuation_anchor(
              session: Option<&SelectedSegmentSession>,
              headers: &[HeaderInventory],
              selected_requests: &[String],
              known_blocks: &HashSet<String>,
          ) -> Option<String> {
              if !selected_requests.is_empty() {
                  return None;
              }
              let session = session?;
              let furthest = headers.iter().max_by(|a, b| {
                  a.header
                      .height
                      .cmp(&b.header.height)
                      .then_with(|| a.hash.cmp(&b.hash))
              })?;
              if !known_blocks.contains(&furthest.hash) {
                  return None;
              }
              (furthest.header.height < session.remote_selected_height).then(|| furthest.hash.clone())
          }
          '''
          main = replace_once(main, old, new, 'continuation helper')

          old = '''                            selected_header_discovery_continuation_anchor(
                                      selected_segment_session.as_ref(),
                                      &headers,
                                      &selected_requests,
                                  )
          '''
          new = '''                            selected_header_discovery_continuation_anchor(
                                      selected_segment_session.as_ref(),
                                      &headers,
                                      &selected_requests,
                                      &known,
                                  )
          '''
          main = replace_once(main, old, new, 'continuation call')

          # P2 #2: retained-gap detection is selected-chain logic, so compare
          # against the selected tip height, not a taller side-DAG best_height.
          marker = 'fn selected_locator_peer_for_priority_gap(\n'
          helper = '''fn local_selected_tip_height(chain: &pulsedag_core::ChainState) -> u64 {
              chain
                  .dag
                  .selected_chain
                  .last()
                  .and_then(|hash| chain.dag.blocks.get(hash))
                  .map(|block| block.header.height)
                  .unwrap_or(chain.dag.best_height)
          }

          '''
          if main.count(marker) != 1:
              raise SystemExit(f'local selected height insertion marker count={main.count(marker)}')
          main = main.replace(marker, helper + marker, 1)

          old = '                            (known, common, height, guard.dag.best_height)\n'
          new = '                            (known, common, height, local_selected_tip_height(&guard))\n'
          main = replace_once(main, old, new, 'retained gap local selected height')

          # P2 #3: mirror the durable retained-gap peer set into runtime stats.
          # Canonical RPC state must not infer active retained-gap state from a
          # mutable last-diagnostic string.
          old = '''                        let mut rt = runtime.write().await;
                                  if issued_selected_header_continuation {
          '''
          new = '''                        let retained_history_gap_peer_count = {
                                      let guard = selected_segment_locator_state.lock().await;
                                      guard.retained_history_gap_peers.len()
                                  };
                                  let mut rt = runtime.write().await;
                                  rt.selected_segment_retained_history_gap_peer_count =
                                      retained_history_gap_peer_count;
                                  if issued_selected_header_continuation {
          '''
          main = replace_once(main, old, new, 'runtime retained-gap count update')

          old = '''                                {
                                              let mut locator_state =
                                                  selected_segment_locator_state.lock().await;
                                              locator_state.pending_locator = None;
                                              locator_state.retained_history_gap_peers.clear();
                                          }
                                          if let Some(ref p2p_handle) = p2p {
          '''
          new = '''                                {
                                              let mut locator_state =
                                                  selected_segment_locator_state.lock().await;
                                              locator_state.pending_locator = None;
                                              locator_state.retained_history_gap_peers.clear();
                                          }
                                          {
                                              let mut rt = runtime.write().await;
                                              rt.selected_segment_retained_history_gap_peer_count = 0;
                                          }
                                          if let Some(ref p2p_handle) = p2p {
          '''
          main = replace_once(main, old, new, 'runtime retained-gap clear')

          # Update the existing known-page continuation regression to provide
          # the accepted set explicitly.
          old = '''        session.update_remote_target(Some("remote-700"), 700);

                  assert_eq!(
                      selected_header_discovery_continuation_anchor(Some(&session), &headers, &[]),
                      Some("b3".to_string())
                  );
          '''
          new = '''        session.update_remote_target(Some("remote-700"), 700);
                  let known = HashSet::from([
                      "b1".to_string(),
                      "b2".to_string(),
                      "b3".to_string(),
                  ]);

                  assert_eq!(
                      selected_header_discovery_continuation_anchor(
                          Some(&session),
                          &headers,
                          &[],
                          &known,
                      ),
                      Some("b3".to_string())
                  );
          '''
          main = replace_once(main, old, new, 'known-page continuation test')

          marker = '''    #[test]
              fn unrelated_header_page_cannot_hijack_pending_selected_locator() {
          '''
          test = '''    #[test]
              fn selected_header_discovery_waits_for_pending_tail_before_continuing() {
                  let headers = vec![
                      selected_test_header("b1", "common", 1),
                      selected_test_header("b2", "b1", 2),
                      selected_test_header("b3", "b2", 3),
                  ];
                  let locator = vec!["common".to_string()];
                  let mut session = SelectedSegmentSession::new(
                      1,
                      "peer-a".to_string(),
                      "common".to_string(),
                      0,
                      &headers,
                      &locator,
                      1,
                      100,
                  )
                  .expect("session");
                  session.update_remote_target(Some("remote-700"), 700);
                  let known = HashSet::from(["b1".to_string(), "b2".to_string()]);

                  assert_eq!(
                      selected_header_discovery_continuation_anchor(
                          Some(&session),
                          &headers,
                          &[],
                          &known,
                      ),
                      None
                  );
              }

          '''
          if main.count(marker) != 1:
              raise SystemExit(f'pending-tail test marker count={main.count(marker)}')
          main = main.replace(marker, test + marker, 1)

          marker = '''    #[test]
              fn selected_segment_common_ancestor_prefers_pending_locator_parent() {
          '''
          test = '''    #[test]
              fn retained_gap_uses_selected_tip_height_not_taller_side_height() {
                  let mut chain = pulsedag_core::genesis::init_chain_state("testnet-dev".to_string());
                  let genesis = chain.dag.genesis_hash.clone();
                  let selected = test_orphan("selected-5", vec![genesis.as_str()], 5);
                  chain
                      .dag
                      .blocks
                      .insert(selected.hash.clone(), selected.clone());
                  chain.dag.selected_chain.push(selected.hash.clone());
                  chain.dag.best_height = 10;
                  let pending = PendingSelectedLocator {
                      request_id: 1,
                      peer_id: "peer-a".to_string(),
                      locator: vec![selected.hash.clone()],
                      requested_at_unix: 100,
                      retained_history_gap: false,
                  };
                  let headers = vec![selected_test_header("remote-7", "pruned-6", 7)];

                  assert_eq!(local_selected_tip_height(&chain), 5);
                  assert!(selected_headers_indicate_retained_history_gap(
                      &headers,
                      local_selected_tip_height(&chain),
                      Some(&pending),
                      Some("peer-a"),
                      None,
                      false,
                  ));
                  assert!(!selected_headers_indicate_retained_history_gap(
                      &headers,
                      chain.dag.best_height,
                      Some(&pending),
                      Some("peer-a"),
                      None,
                      false,
                  ));
              }

          '''
          if main.count(marker) != 1:
              raise SystemExit(f'selected-tip-height test marker count={main.count(marker)}')
          main = main.replace(marker, test + marker, 1)
          main_path.write_text(main)

          api_path = Path('crates/pulsedag-rpc/src/api.rs')
          api = api_path.read_text()
          old = '''    #[serde(default)]
              pub selected_segment_uncorrelated_headers_total: u64,
              #[serde(default)]
              pub active_session_id: Option<u64>,
          '''
          new = '''    #[serde(default)]
              pub selected_segment_uncorrelated_headers_total: u64,
              #[serde(default)]
              pub selected_segment_retained_history_gap_peer_count: usize,
              #[serde(default)]
              pub active_session_id: Option<u64>,
          '''
          api = replace_once(api, old, new, 'runtime stats retained-gap field')
          api_path.write_text(api)

          canonical_path = Path('crates/pulsedag-rpc/src/handlers/canonical_sync.rs')
          canonical = canonical_path.read_text()
          old = '''    let retained_history_gap_active = runtime
              .final_quiescence_selected_sync_blocked_reason
              .as_deref()
              == Some("retained_history_gap");
          '''
          new = '''    let retained_history_gap_active =
              runtime.selected_segment_retained_history_gap_peer_count > 0;
          '''
          canonical = replace_once(canonical, old, new, 'canonical dedicated retained-gap state')

          old = '''        let runtime = NodeRuntimeStats {
                      sync_state: "selected_segment_failed".into(),
                      final_quiescence_selected_sync_blocked_reason: Some("retained_history_gap".into()),
                      ..NodeRuntimeStats::default()
                  };
          '''
          new = '''        let runtime = NodeRuntimeStats {
                      sync_state: "selected_segment_failed".into(),
                      selected_segment_retained_history_gap_peer_count: 1,
                      final_quiescence_selected_sync_blocked_reason: Some(
                          "selected_segment_no_progress_rearm".into(),
                      ),
                      ..NodeRuntimeStats::default()
                  };
          '''
          canonical = replace_once(canonical, old, new, 'canonical retained-gap regression state')
          canonical_path.write_text(canonical)

          print('applied all three #815 P2 review fixes')
          PY

      - name: Format
        run: cargo fmt --all

      - name: Diff check
        run: git diff --check

      - name: Continuation anchor regressions
        run: |
          cargo test -p pulsedagd selected_segment_known_header_page_continues_toward_advertised_tip -- --nocapture
          cargo test -p pulsedagd selected_header_discovery_waits_for_pending_tail_before_continuing -- --nocapture

      - name: Selected-tip retained-gap regression
        run: cargo test -p pulsedagd retained_gap_uses_selected_tip_height_not_taller_side_height -- --nocapture

      - name: Existing retained-gap daemon regressions
        run: cargo test -p pulsedagd retained_history_gap -- --nocapture

      - name: Canonical dedicated retained-gap regression
        run: cargo test -p pulsedag-rpc retained_history_gap_prevents_canonical_synced_state_when_remote_evidence_ages_out -- --nocapture

      - name: Canonical sync regressions
        run: cargo test -p pulsedag-rpc canonical_sync -- --nocapture

      - name: Selected-segment regressions
        run: cargo test -p pulsedagd selected_segment -- --nocapture

      - name: RPC clippy
        run: cargo clippy -p pulsedag-rpc --all-targets --all-features -- -D warnings

      - name: Daemon clippy
        run: cargo clippy -p pulsedagd --all-targets --all-features -- -D warnings

      - name: RPC check
        run: cargo check -p pulsedag-rpc

      - name: Daemon check
        run: cargo check -p pulsedagd

      - name: Commit validated source and remove temporary workflow
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/fix-812-review-feedback-inspect.yml
          git add -A
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "fix(sync): address selected-sync review feedback"
          git pull --rebase origin fix/fresh-node-orphan-recovery-812
          git push origin HEAD:fix/fresh-node-orphan-recovery-812
