            chain.dag.blocks.insert(block.hash.clone(), block.clone());
        }
        chain
            .dag
            .selected_parents
            .insert("b1".to_string(), Some(genesis.clone()));
        chain
            .dag
            .selected_parents
            .insert("b2".to_string(), Some("b1".to_string()));
        chain
            .dag
            .selected_parents
            .insert("b3".to_string(), Some("b2".to_string()));
