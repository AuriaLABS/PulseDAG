name: v3 Noise GetBlock staged real sender blocked by review gate (NO GO)

on:
  pull_request:
    paths:
      - crates/pulsedag-p2p/src/lib.rs
      - crates/pulsedag-p2p/src/messages/direct_getblock_swarm_bindings_v1.rs
      - .github/workflows/v3-direct-getblock-real-sender-gated-probe.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  dormant-real-noise-getblock-sender:
    runs-on: ubuntu-24.04
    timeout-minutes: 70
    steps:
      - name: Checkout immutable exact-head candidate
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Fail closed on unreviewed activation, broadcast fallback and contracts
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
          grep -Fq 'const DIRECT_GETBLOCK_LIVE_REQUESTS_ENABLED: bool = false;' crates/pulsedag-p2p/src/lib.rs
          grep -Fq 'if DIRECT_GETBLOCK_LIVE_REQUESTS_ENABLED =>' crates/pulsedag-p2p/src/lib.rs
          grep -Fq 'direct_getblock_bindings.issue_daemon_request_with(' crates/pulsedag-p2p/src/lib.rs
          grep -Fq 'live_direct_behaviour.send_request(target, wire)' crates/pulsedag-p2p/src/lib.rs
          grep -Fq 'direct_getblock_bindings.deliver_bound_response_to_daemon(' crates/pulsedag-p2p/src/lib.rs
          grep -Fq 'direct_getblock_live_request_gate_regressions' crates/pulsedag-p2p/src/lib.rs
          grep -Fq 'ProtocolSupport::Outbound' crates/pulsedag-p2p/src/lib.rs
          if grep -Fq 'ProtocolSupport::Full' crates/pulsedag-p2p/src/lib.rs; then
            echo "::error::unapproved full-duplex protocol activation"
            exit 1
          fi
          grep -Fq 'PULSEDAG_CONTRACTS_ENABLED=false' configs/public-testnet/node.env.template
      - name: Pin Rust 1.91 for exact source compatibility
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: '1.91.0'
      - name: Compile staged direct delivery and prevent release activation
        run: |
          set -euo pipefail
          cargo check --locked -p pulsedag-p2p --all-targets
          cargo test --locked -p pulsedag-p2p --lib direct_getblock_live_request_gate_regressions -- --nocapture
          cargo test --locked -p pulsedag-p2p --lib direct_getblock_swarm_bindings_v1 -- --nocapture
          cargo test --locked -p pulsedag-p2p --test direct_getblock_noise_roundtrip_v1 -- --nocapture
          cargo fmt --all -- --check
          git diff --exit-code -- Cargo.lock
