name: apply Task 38 OpenCL multi-device phase 13 once

on:
  push:
    branches:
      - codex/issue-1038-opencl-multidevice-phase13
    paths:
      - ".github/workflows/task38-phase13-apply-once.yml"

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/issue-1038-opencl-multidevice-phase13
          fetch-depth: 0

      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.91.0
          components: rustfmt,clippy

      - uses: Swatinem/rust-cache@v2

      - name: Apply Phase 13 functional patch
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re

          lib_path = Path("apps/pulsedag-miner/src/lib.rs")
          lib = lib_path.read_text()

          old_struct = '''#[cfg(feature = "gpu")]
          #[derive(Debug, Clone)]
          pub struct GpuMiningBackend {
              config: GpuBackendConfig,
              selected_device: OpenClDeviceSelection,
          }
          '''.replace("          ", "")
          new_struct = '''#[cfg(feature = "gpu")]
          const OPENCL_DEVICE_LIST_ENV: &str = "PULSEDAG_MINER_GPU_DEVICES";

          #[cfg(feature = "gpu")]
          fn parse_opencl_device_indices(value: &str) -> Result<Vec<usize>> {
              let mut indices = Vec::new();
              for raw_index in value.split(',') {
                  let token = raw_index.trim();
                  if token.is_empty() {
                      return Err(anyhow!(
                          "{OPENCL_DEVICE_LIST_ENV} contains an empty device index"
                      ));
                  }
                  let index = token.parse::<usize>().map_err(|_| {
                      anyhow!(
                          "invalid OpenCL GPU device index '{token}' in {OPENCL_DEVICE_LIST_ENV}"
                      )
                  })?;
                  indices.push(index);
              }
              if indices.is_empty() {
                  return Err(anyhow!(
                      "{OPENCL_DEVICE_LIST_ENV} must contain at least one device index"
                  ));
              }
              indices.sort_unstable();
              if indices.windows(2).any(|pair| pair[0] == pair[1]) {
                  return Err(anyhow!(
                      "{OPENCL_DEVICE_LIST_ENV} contains a duplicate device index"
                  ));
              }
              Ok(indices)
          }

          #[cfg(feature = "gpu")]
          fn requested_opencl_device_indices(explicit: Option<usize>) -> Result<Option<Vec<usize>>> {
              let env_value = std::env::var(OPENCL_DEVICE_LIST_ENV)
                  .ok()
                  .filter(|value| !value.trim().is_empty());
              match (explicit, env_value) {
                  (Some(_), Some(_)) => Err(anyhow!(
                      "explicit --gpu-device selection cannot be combined with {OPENCL_DEVICE_LIST_ENV}"
                  )),
                  (Some(index), None) => Ok(Some(vec![index])),
                  (None, Some(value)) => Ok(Some(parse_opencl_device_indices(&value)?)),
                  (None, None) => Ok(None),
              }
          }

          #[cfg(all(test, feature = "gpu"))]
          mod gpu_device_list_tests {
              use super::parse_opencl_device_indices;

              #[test]
              fn opencl_device_list_is_canonicalized_and_duplicates_fail_closed() {
                  assert_eq!(parse_opencl_device_indices("3, 1,2").unwrap(), vec![1, 2, 3]);
                  assert!(parse_opencl_device_indices("1,1").is_err());
                  assert!(parse_opencl_device_indices("1,,2").is_err());
                  assert!(parse_opencl_device_indices("gpu0").is_err());
              }
          }

          #[cfg(feature = "gpu")]
          #[derive(Debug, Clone)]
          pub struct GpuMiningBackend {
              config: GpuBackendConfig,
              selected_devices: Vec<OpenClDeviceSelection>,
          }
          '''.replace("          ", "")
          if old_struct not in lib:
              raise SystemExit("GpuMiningBackend struct needle not found")
          lib = lib.replace(old_struct, new_struct, 1)

          new_impl = '''    pub fn new(config: GpuBackendConfig) -> Result<Self> {
              if config.batch_size == 0 {
                  return Err(anyhow!("OpenCL GPU batch size must be non-zero"));
              }
              if config.work_size == 0 {
                  return Err(anyhow!("OpenCL GPU work size must be non-zero"));
              }

              let requested_devices = requested_opencl_device_indices(config.device_index)?;
              let selected_devices = opencl::select_devices(requested_devices.as_deref()).map_err(|err| {
                  anyhow!(
                      "OpenCL GPU backend initialization failed: {err}. Use --backend cpu to fall back to CPU mining."
                  )
              })?;
              if selected_devices.is_empty() {
                  return Err(anyhow!("OpenCL GPU backend selected no devices"));
              }
              for selected_device in &selected_devices {
                  opencl_driver_launch::probe_opencl_gpu(selected_device.device_index).map_err(|err| {
                      anyhow!(
                          "OpenCL canonical runtime probe failed for GPU device index {}: {err}. Use --backend cpu to fall back to CPU mining.",
                          selected_device.device_index
                      )
                  })?;
              }
              let selected_indices = selected_devices
                  .iter()
                  .map(|device| device.device_index.to_string())
                  .collect::<Vec<_>>()
                  .join(",");
              println!(
                  "gpu_backend_opencl selected_devices={} device_indices={} batch_size={} work_size={} canonical_runtime=true homogeneous_multidevice_software=true hardware_equivalence=NOT_CLAIMED GPU_MINING_AMD_PASS=NOT_CLAIMED env_devices={} env_batch=PULSEDAG_MINER_GPU_BATCH_SIZE env_work=PULSEDAG_MINER_GPU_WORK_SIZE",
                  selected_devices.len(),
                  selected_indices,
                  config.batch_size,
                  config.work_size,
                  OPENCL_DEVICE_LIST_ENV,
              );
              Ok(Self {
                  config,
                  selected_devices,
              })
          }

          pub fn config'''
          lib, count = re.subn(
              r'    pub fn new\(config: GpuBackendConfig\) -> Result<Self> \{.*?\n    \}\n\n    pub fn config',
              new_impl,
              lib,
              count=1,
              flags=re.S,
          )
          if count != 1:
              raise SystemExit(f"GpuMiningBackend::new replacement count={count}")

          old_methods = '''    pub fn selected_device(&self) -> &OpenClDeviceSelection {
              &self.selected_device
          }

          #[cfg(test)]
          pub(crate) fn for_test(
              config: GpuBackendConfig,
              selected_device: OpenClDeviceSelection,
          ) -> Self {
              Self {
                  config,
                  selected_device,
              }
          }
          '''.replace("          ", "")
          new_methods = '''    pub fn selected_device(&self) -> &OpenClDeviceSelection {
              &self.selected_devices[0]
          }

          pub fn selected_devices(&self) -> &[OpenClDeviceSelection] {
              &self.selected_devices
          }

          #[cfg(test)]
          pub(crate) fn for_test(
              config: GpuBackendConfig,
              selected_device: OpenClDeviceSelection,
          ) -> Self {
              Self::for_test_devices(config, vec![selected_device])
          }

          #[cfg(test)]
          pub(crate) fn for_test_devices(
              config: GpuBackendConfig,
              selected_devices: Vec<OpenClDeviceSelection>,
          ) -> Self {
              assert!(!selected_devices.is_empty());
              Self {
                  config,
                  selected_devices,
              }
          }
          '''.replace("          ", "")
          if old_methods not in lib:
              raise SystemExit("GpuMiningBackend selected_device methods needle not found")
          lib = lib.replace(old_methods, new_methods, 1)

          select_devices = '''    pub fn select_devices(
              requested_device_indices: Option<&[usize]>,
          ) -> Result<Vec<OpenClDeviceSelection>> {
              let api = OpenClApi::load()?;
              let platforms = api.platforms()?;
              if platforms.is_empty() {
                  return Err(anyhow!("no OpenCL platforms found"));
              }

              let mut discovered = Vec::new();
              let mut global_device_index = 0usize;
              for (platform_index, platform) in platforms.iter().copied().enumerate() {
                  let platform_name = api
                      .platform_info_string(platform, CL_PLATFORM_NAME)
                      .unwrap_or_else(|_| "<unknown platform>".to_string());
                  let devices = api.gpu_devices(platform)?;
                  for (platform_device_index, device) in devices.iter().copied().enumerate() {
                      let device_name = api
                          .device_info_string(device, CL_DEVICE_NAME)
                          .unwrap_or_else(|_| "<unknown GPU device>".to_string());
                      discovered.push(OpenClDeviceSelection {
                          platform_index,
                          device_index: global_device_index,
                          platform_name: platform_name.clone(),
                          device_name: format!(
                              "{} (platform_device_index={})",
                              device_name, platform_device_index
                          ),
                      });
                      global_device_index = global_device_index.saturating_add(1);
                  }
              }

              if discovered.is_empty() {
                  return Err(anyhow!("no OpenCL GPU devices found"));
              }

              let Some(requested_device_indices) = requested_device_indices else {
                  return Ok(vec![discovered.remove(0)]);
              };
              if requested_device_indices.is_empty() {
                  return Err(anyhow!("OpenCL GPU device selection must not be empty"));
              }

              let mut canonical_indices = requested_device_indices.to_vec();
              canonical_indices.sort_unstable();
              if canonical_indices.windows(2).any(|pair| pair[0] == pair[1]) {
                  return Err(anyhow!("OpenCL GPU device selection contains duplicates"));
              }

              let discovered_count = discovered.len();
              canonical_indices
                  .into_iter()
                  .map(|index| {
                      discovered.get(index).cloned().ok_or_else(|| {
                          anyhow!(
                              "OpenCL GPU device index {index} was not found; discovered {discovered_count} GPU device(s)"
                          )
                      })
                  })
                  .collect()
          }

          fn opencl_library_candidates'''
          lib, count = re.subn(
              r'    pub fn select_device\(requested_device_index: Option<usize>\) -> Result<OpenClDeviceSelection> \{.*?\n    \}\n\n    fn opencl_library_candidates',
              select_devices,
              lib,
              count=1,
              flags=re.S,
          )
          if count != 1:
              raise SystemExit(f"OpenCL select_devices replacement count={count}")

          lib_path.write_text(lib)

          backend_path = Path("apps/pulsedag-miner/src/opencl_backend.rs")
          backend = backend_path.read_text()
          backend = backend.replace(
              "use crate::protocol_backend::protocol_nonce_partition;",
              "use crate::protocol_backend::{protocol_nonce_lane_count, protocol_nonce_partition};",
              1,
          )

          old_call = '''    search_work(
              header,
              work,
              max_tries,
              backend.selected_device().device_index,
              batch_size,
              backend.config().work_size,
              launcher,
          )
          '''.replace("          ", "")
          new_call = '''    let device_indices = backend
              .selected_devices()
              .iter()
              .map(|device| device.device_index)
              .collect::<Vec<_>>();
              search_work(
                  header,
                  work,
                  max_tries,
                  &device_indices,
                  batch_size,
                  backend.config().work_size,
                  launcher,
              )
          '''.replace("          ", "")
          if old_call not in backend:
              raise SystemExit("OpenCL search_work call needle not found")
          backend = backend.replace(old_call, new_call, 1)

          new_search = '''fn search_work(
              header: BlockHeader,
              work: ProtocolPowWork,
              max_tries: u64,
              device_indices: &[usize],
              batch_size: usize,
              work_size: usize,
              launcher: &dyn OpenClBatchLauncher,
          ) -> Result<NonceSearchResult> {
              if device_indices.is_empty() {
                  return Err(anyhow!("OpenCL multi-device search requires at least one device"));
              }
              for (position, device_index) in device_indices.iter().enumerate() {
                  if device_indices[..position].contains(device_index) {
                      return Err(anyhow!(
                          "OpenCL multi-device search contains duplicate device index {device_index}"
                      ));
                  }
              }

              let max_tries = max_tries.max(1);
              let active_lanes = protocol_nonce_lane_count(max_tries, device_indices.len());
              let partitions = (0..active_lanes)
                  .map(|lane| protocol_nonce_partition(max_tries, active_lanes, lane))
                  .collect::<Result<Vec<_>>>()?;
              let mut iterations = vec![0u64; active_lanes];
              let mut exhausted = vec![false; active_lanes];
              let pre_pow_hash = canonical_pre_pow_hash(&work);
              let mut tries = 0u64;
              let mut last_nonce = None;

              loop {
                  let mut made_progress = false;
                  for lane_index in 0..active_lanes {
                      if exhausted[lane_index] {
                          continue;
                      }
                      let partition = partitions[lane_index];
                      let device_index = device_indices[lane_index];
                      let mut nonces = Vec::with_capacity(batch_size);
                      for _ in 0..batch_size {
                          let Some(nonce) = partition.nonce_at(iterations[lane_index])? else {
                              exhausted[lane_index] = true;
                              break;
                          };
                          nonces.push(nonce);
                          iterations[lane_index] = iterations[lane_index]
                              .checked_add(1)
                              .ok_or_else(|| {
                                  anyhow!(
                                      "OpenCL nonce iteration overflow for canonical lane {}",
                                      partition.lane()
                                  )
                              })?;
                      }

                      if nonces.is_empty() {
                          continue;
                      }
                      made_progress = true;

                      let hashes = launcher.launch(device_index, pre_pow_hash, &nonces, work_size)?;
                      if hashes.len() != nonces.len() {
                          return Err(anyhow!(
                              "OpenCL launcher returned {} hash(es) for {} nonce(s); refusing incomplete accelerator result",
                              hashes.len(),
                              nonces.len()
                          ));
                      }

                      let batch_tries = u64::try_from(nonces.len())
                          .map_err(|_| anyhow!("OpenCL batch nonce count does not fit in u64"))?;
                      tries = tries
                          .checked_add(batch_tries)
                          .ok_or_else(|| anyhow!("OpenCL nonce attempt counter overflow"))?;

                      for (&nonce, &accelerator_hash) in nonces.iter().zip(&hashes) {
                          last_nonce = Some(nonce);
                          if !compare_pow_hash_to_target(
                              &accelerator_hash,
                              &work.material.target.target,
                          ) {
                              continue;
                          }

                          let accepted = work.reverify_accelerator_hash(nonce, accelerator_hash)?;
                          if !accepted {
                              return Err(anyhow!(
                                  "OpenCL accelerator hash passed target prefilter for nonce {nonce} but canonical re-verification rejected it"
                              ));
                          }

                          let mut winner = header.clone();
                          winner.nonce = nonce;
                          let canonical = work.evaluate_nonce(nonce);
                          return Ok(NonceSearchResult {
                              header: winner,
                              accepted: true,
                              tries,
                              final_hash_hex: canonical.final_hash.hash_hex,
                          });
                      }
                  }

                  if !made_progress {
                      break;
                  }
              }

              let fallback_nonce = last_nonce.ok_or_else(|| {
                  anyhow!("OpenCL canonical nonce partitions produced no work after normalization")
              })?;
              let canonical = work.evaluate_nonce(fallback_nonce);
              let mut fallback = header;
              fallback.nonce = fallback_nonce;
              Ok(NonceSearchResult {
                  header: fallback,
                  accepted: false,
                  tries: tries.max(1),
                  final_hash_hex: canonical.final_hash.hash_hex,
              })
          }

          fn canonical_pre_pow_hash'''
          backend, count = re.subn(
              r'fn search_work\(.*?\n\}\n\nfn canonical_pre_pow_hash',
              new_search,
              backend,
              count=1,
              flags=re.S,
          )
          if count != 1:
              raise SystemExit(f"OpenCL search_work replacement count={count}")

          old_test_backend = '''    fn test_backend(device_index: usize, batch_size: u64, work_size: usize) -> GpuMiningBackend {
              GpuMiningBackend::for_test(
                  GpuBackendConfig {
                      device_index: Some(device_index),
                      batch_size,
                      work_size,
                  },
                  OpenClDeviceSelection {
                      platform_index: 0,
                      device_index,
                      platform_name: "test-platform".to_string(),
                      device_name: "test-device".to_string(),
                  },
              )
          }
          '''.replace("          ", "")
          new_test_backend = '''    fn test_selection(device_index: usize) -> OpenClDeviceSelection {
              OpenClDeviceSelection {
                  platform_index: 0,
                  device_index,
                  platform_name: "test-platform".to_string(),
                  device_name: format!("test-device-{device_index}"),
              }
          }

          fn test_backend(device_index: usize, batch_size: u64, work_size: usize) -> GpuMiningBackend {
              GpuMiningBackend::for_test(
                  GpuBackendConfig {
                      device_index: Some(device_index),
                      batch_size,
                      work_size,
                  },
                  test_selection(device_index),
              )
          }

          fn test_backend_devices(
              device_indices: &[usize],
              batch_size: u64,
              work_size: usize,
          ) -> GpuMiningBackend {
              GpuMiningBackend::for_test_devices(
                  GpuBackendConfig {
                      device_index: None,
                      batch_size,
                      work_size,
                  },
                  device_indices
                      .iter()
                      .copied()
                      .map(test_selection)
                      .collect(),
              )
          }
          '''.replace("          ", "")
          if old_test_backend not in backend:
              raise SystemExit("OpenCL test_backend needle not found")
          backend = backend.replace(old_test_backend, new_test_backend, 1)

          multidevice_test = '''    #[test]
          fn multi_device_batches_cover_nonce_domain_exactly_once() {
              let target_bits = 0x0300_0001;
              let header = header(BLOCK_HEADER_VERSION_V1, target_bits);
              let work = build_protocol_pow_work(&header, target_bits, None).unwrap();
              let rejected_hash = [0xffu8; 32];
              assert!(!compare_pow_hash_to_target(
                  &rejected_hash,
                  &work.material.target.target
              ));
              let launcher = FakeLauncher {
                  hashes: (0..7).map(|nonce| (nonce, rejected_hash)).collect(),
                  calls: Mutex::new(Vec::new()),
                  error: None,
              };
              let backend = test_backend_devices(&[1, 3], 2, 64);

              let result = mine_canonical_with_launcher(
                  &backend,
                  header,
                  7,
                  target_bits,
                  None,
                  &launcher,
              )
              .unwrap();
              assert!(!result.accepted);
              assert_eq!(result.tries, 7);

              let calls = launcher.calls();
              assert_eq!(calls.len(), 4);
              assert_eq!(calls[0].device_index, 1);
              assert_eq!(calls[0].nonces, vec![0, 2]);
              assert_eq!(calls[1].device_index, 3);
              assert_eq!(calls[1].nonces, vec![1, 3]);
              assert_eq!(calls[2].device_index, 1);
              assert_eq!(calls[2].nonces, vec![4, 6]);
              assert_eq!(calls[3].device_index, 3);
              assert_eq!(calls[3].nonces, vec![5]);

              let mut observed = calls
                  .iter()
                  .flat_map(|call| call.nonces.iter().copied())
                  .collect::<Vec<_>>();
              observed.sort_unstable();
              let expected: Vec<u64> = (0..7).collect();
              assert_eq!(observed, expected);
          }

          '''.replace("          ", "")
          marker = "    #[test]\n    fn zero_opencl_launch_shape_fails_closed() {"
          if marker not in backend:
              raise SystemExit("OpenCL first test marker not found")
          backend = backend.replace(marker, multidevice_test + marker, 1)
          backend_path.write_text(backend)
          PY

      - name: Format functional tree
        run: cargo fmt --all

      - name: Test OpenCL multi-device contracts
        run: |
          cargo test --locked -p pulsedag-miner --features gpu --lib opencl_backend::tests
          cargo test --locked -p pulsedag-miner --features gpu --lib gpu_device_list_tests
          cargo test --locked -p pulsedag-miner --features gpu --test opencl_driver_launch_contract

      - name: Strict Clippy
        run: cargo clippy --locked -p pulsedag-miner --features gpu --all-targets -- -D warnings

      - name: Commit functional Phase 13 tree
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "pulsedag-phase13-bot"
          git config user.email "actions@users.noreply.github.com"
          git rm .github/workflows/task38-phase13-apply-once.yml
          git add apps/pulsedag-miner/src/lib.rs apps/pulsedag-miner/src/opencl_backend.rs
          git commit -m "miner: add OpenCL multi-device software scheduling for #1038"
          git push origin "HEAD:${GITHUB_REF_NAME}"
