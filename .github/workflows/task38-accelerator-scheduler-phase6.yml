name: v3 launch Task 38 accelerator scheduler phase 6

on:
  pull_request:
    branches:
      - main
    paths:
      - apps/pulsedag-miner/src/accelerator_scheduler.rs
      - apps/pulsedag-miner/src/bin/pulsedag-accelerator-scheduler-probe.rs
      - apps/pulsedag-miner/src/protocol_backend.rs
      - .github/workflows/task38-accelerator-scheduler-phase6.yml
  push:
    branches:
      - main
    paths:
      - apps/pulsedag-miner/src/accelerator_scheduler.rs
      - apps/pulsedag-miner/src/bin/pulsedag-accelerator-scheduler-probe.rs
      - apps/pulsedag-miner/src/protocol_backend.rs
      - .github/workflows/task38-accelerator-scheduler-phase6.yml

permissions:
  contents: read

jobs:
  accelerator-scheduler-contract:
    name: accelerator-scheduler-contract (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - windows-latest
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20

    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Verify exact SHA and clean checkout
        shell: bash
        env:
          CANDIDATE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$CANDIDATE_SHA"
          test -z "$(git status --porcelain)"
          echo "task38_accelerator_scheduler_candidate_sha=$CANDIDATE_SHA"

      - name: Install Rust 1.91.0
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.91.0
          components: rustfmt, clippy

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Workspace format contract
        run: cargo fmt --all -- --check

      - name: Accelerator scheduler unit contract
        run: cargo test --locked -p pulsedag-miner --bin pulsedag-accelerator-scheduler-probe

      - name: Deterministic scheduler self-test
        run: cargo run --locked -p pulsedag-miner --bin pulsedag-accelerator-scheduler-probe -- --self-test

      - name: Canonical nonce partition regression
        run: cargo test --locked -p pulsedag-miner nonce_partitions_are_deterministic_disjoint_and_cover_domain

      - name: Accelerator scheduler clippy
        run: cargo clippy --locked -p pulsedag-miner --bin pulsedag-accelerator-scheduler-probe -- -D warnings

      - name: Record software-only scheduler scope
        shell: bash
        run: |
          echo "accelerator_scheduler_contract=PASS"
          echo "canonical_nonce_partition_reuse=PASS"
          echo "deterministic_worker_assignment=PASS"
          echo "failed_worker_lane_redistribution=PASS"
          echo "job_refresh_contract=PASS"
          echo "physical_gpu_execution=NOT_CLAIMED"
          echo "single_multi_gpu_correctness=NOT_CLAIMED"
          echo "GPU_MINING_NVIDIA_PASS=NOT_CLAIMED"
          echo "GPU_MINING_AMD_PASS=NOT_CLAIMED"
