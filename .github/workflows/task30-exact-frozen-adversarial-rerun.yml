name: Task30 exact frozen adversarial rerun

on:
  pull_request:
    branches:
      - main
    paths:
      - .github/workflows/task30-exact-frozen-adversarial-rerun.yml

permissions:
  contents: read

env:
  CANDIDATE_SHA: 37f0dd6ca7aabe07341c226744f65d46bbb03d65

jobs:
  multi-miner-convergence:
    name: 5N/${{ matrix.miners }}M corrected harness
    runs-on: ubuntu-latest
    timeout-minutes: 75
    strategy:
      fail-fast: false
      matrix:
        miners: [1, 2, 4]
    steps:
      - name: Checkout control plane
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          path: control-plane
          persist-credentials: false
      - name: Checkout exact frozen candidate
        uses: actions/checkout@v4
        with:
          ref: ${{ env.CANDIDATE_SHA }}
          path: candidate
          persist-credentials: false
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
      - name: Cache candidate cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: candidate -> target
      - name: Verify candidate and prepare harness
        env:
          ADAPT_DIR: ${{ runner.temp }}/task30-adaptation/multi-${{ matrix.miners }}m
        run: |
          set -euo pipefail
          test "$(git -C candidate rev-parse HEAD)" = "$CANDIDATE_SHA"
          test -z "$(git -C candidate status --porcelain)"
          python3 -m py_compile control-plane/.github/task30-control/adapt_harness.py
          mkdir -p "$ADAPT_DIR"
          python3 control-plane/.github/task30-control/adapt_harness.py multi "$GITHUB_WORKSPACE/candidate" "$ADAPT_DIR/rehearsal.sh"
          bash -n "$ADAPT_DIR/rehearsal.sh"
      - name: Run five-node multi-miner convergence rehearsal
        working-directory: candidate
        env:
          TASK30_CANDIDATE_ROOT: ${{ github.workspace }}/candidate
          MINER_COUNT: ${{ matrix.miners }}
          DURATION_SECS: 600
          P2P_CONNECT_WAIT_SECS: 120
          QUIESCENCE_WAIT_SECS: 90
          GLOBAL_DEADLINE_SECS: 1800
          RUN_ID: ${{ github.run_id }}-${{ github.run_attempt }}-${{ matrix.miners }}m-rerun
          OUT_DIR: ${{ runner.temp }}/task30/multi-${{ matrix.miners }}m
          ADAPTED_SCRIPT: ${{ runner.temp }}/task30-adaptation/multi-${{ matrix.miners }}m/rehearsal.sh
        run: |
          set -euo pipefail
          bash "$ADAPTED_SCRIPT"
          test -z "$(git status --porcelain)"
      - name: Upload multi-miner evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: task30-rerun-5n-${{ matrix.miners }}m-${{ env.CANDIDATE_SHA }}
          path: |
            ${{ runner.temp }}/task30/multi-${{ matrix.miners }}m
            ${{ runner.temp }}/task30-adaptation/multi-${{ matrix.miners }}m
          if-no-files-found: error
          retention-days: 30

  partition-restart-rejoin:
    name: 5N partition restart rejoin rerun
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout exact frozen candidate
        uses: actions/checkout@v4
        with:
          ref: ${{ env.CANDIDATE_SHA }}
          path: candidate
          persist-credentials: false
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
      - name: Cache candidate cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: candidate -> target
      - name: Verify exact SHA and prerequisites
        run: |
          set -euo pipefail
          test "$(git -C candidate rev-parse HEAD)" = "$CANDIDATE_SHA"
          test -z "$(git -C candidate status --porcelain)"
          sudo -n true
          command -v ip
          command -v jq
          command -v curl
          command -v python3
      - name: Build release node and standalone miner
        working-directory: candidate
        run: cargo build --locked --release -p pulsedagd -p pulsedag-miner
      - name: Run isolated five-node partition and restart rehearsal
        working-directory: candidate
        env:
          EVIDENCE_ROOT: ${{ runner.temp }}/task30/netns
        run: |
          set -euo pipefail
          bash scripts/private_testnet/netns_rehearsal.sh \
            --candidate-sha "$CANDIDATE_SHA" \
            --workspace "$PWD" \
            --evidence-root "$EVIDENCE_ROOT"
          python3 scripts/private_testnet/multi_host_rehearsal.py verify-evidence --evidence-dir "$EVIDENCE_ROOT/controller"
          test -z "$(git status --porcelain)"
      - name: Upload partition evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: task30-rerun-partition-${{ env.CANDIDATE_SHA }}
          path: ${{ runner.temp }}/task30/netns
          if-no-files-found: error
          retention-days: 30

  delayed-parent-selected-segment:
    name: 5N delayed parent selected-segment corrected K5
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout control plane
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          path: control-plane
          persist-credentials: false
      - name: Checkout exact frozen candidate
        uses: actions/checkout@v4
        with:
          ref: ${{ env.CANDIDATE_SHA }}
          path: candidate
          persist-credentials: false
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
      - name: Cache candidate cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: candidate -> target
      - name: Verify candidate and prepare explicit K5 harness
        env:
          ADAPT_DIR: ${{ runner.temp }}/task30-adaptation/delayed-parent
        run: |
          set -euo pipefail
          test "$(git -C candidate rev-parse HEAD)" = "$CANDIDATE_SHA"
          test -z "$(git -C candidate status --porcelain)"
          mkdir -p "$ADAPT_DIR"
          python3 control-plane/.github/task30-control/adapt_harness.py lag "$GITHUB_WORKSPACE/candidate" "$ADAPT_DIR/runtime-harness.sh"
          bash -n "$ADAPT_DIR/runtime-harness.sh"
      - name: Run delayed-parent selected-segment runtime drill
        working-directory: candidate
        env:
          OUT_DIR: ${{ runner.temp }}/task30/lag-selected-segment
          RUN_ID: ${{ github.run_id }}-${{ github.run_attempt }}-lag-k5
          MIN_SELECTED_GAP: 64
          CI_MODE: 0
          V2_3_0_RUNTIME_HARNESS: ${{ runner.temp }}/task30-adaptation/delayed-parent/runtime-harness.sh
        run: |
          set -euo pipefail
          bash scripts/v2_3_0_lag_injection_selected_segment.sh
          jq -e '
            .result == "PASS" and .evidence_kind == "runtime" and
            .closeout_eligible == true and .node_count == 5 and .external_miners == 4 and
            .observed_network_selected_height_gap >= 64 and .final_convergence == true and
            .storage_memory_consistent == true and .pending_selected_segment_requests == 0 and
            .final_orphan_count == 0 and .final_missing_parent_blockers == 0 and
            .public_testnet_ready == false
          ' "$OUT_DIR/evidence_manifest.json" >/dev/null
          test -z "$(git status --porcelain)"
      - name: Upload delayed-parent evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: task30-rerun-delayed-parent-${{ env.CANDIDATE_SHA }}
          path: |
            ${{ runner.temp }}/task30/lag-selected-segment
            ${{ runner.temp }}/task30-adaptation/delayed-parent
          if-no-files-found: error
          retention-days: 30

  signed-relay-runtime:
    name: 5N signed relay corrected K5
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout control plane
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          path: control-plane
          persist-credentials: false
      - name: Checkout exact frozen candidate
        uses: actions/checkout@v4
        with:
          ref: ${{ env.CANDIDATE_SHA }}
          path: candidate
          persist-credentials: false
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
      - name: Cache candidate cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: candidate -> target
      - name: Verify candidate and prepare explicit K5 driver
        env:
          ADAPT_DIR: ${{ runner.temp }}/task30-adaptation/signed-relay
        run: |
          set -euo pipefail
          test "$(git -C candidate rev-parse HEAD)" = "$CANDIDATE_SHA"
          test -z "$(git -C candidate status --porcelain)"
          mkdir -p "$ADAPT_DIR"
          python3 control-plane/.github/task30-control/adapt_harness.py relay "$GITHUB_WORKSPACE/candidate" "$ADAPT_DIR/relay.sh"
          bash -n "$ADAPT_DIR/relay.sh"
      - name: Run signed transaction relay runtime drill
        working-directory: candidate
        env:
          OUT_DIR: ${{ runner.temp }}/task30/mempool-relay
          TX_COUNT: 1
          REHEARSAL_MEMPOOL_CAPACITY: 2
          ADAPTED_DRIVER: ${{ runner.temp }}/task30-adaptation/signed-relay/relay.sh
        run: |
          set -euo pipefail
          bash "$ADAPTED_DRIVER"
          jq -e '
            .result == "PASS" and .evidence_kind == "runtime" and .node_count == 5 and
            .relay_converged == true and .duplicate_suppression == true and
            .conflicting_transaction_rejection == true and .stale_transaction_rejection == true and
            .capacity_rejection_taxonomy == true and .confirmation_cleanup == true and
            .deterministic_final_mempool_sets == true and
            .topology_status.required_peers_per_node == 4 and .topology_status.stable == true and
            .public_testnet_ready == false
          ' "$OUT_DIR/evidence_manifest.json" >/dev/null
          test -z "$(git status --porcelain)"
      - name: Upload signed-relay evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: task30-rerun-signed-relay-${{ env.CANDIDATE_SHA }}
          path: |
            ${{ runner.temp }}/task30/mempool-relay
            ${{ runner.temp }}/task30-adaptation/signed-relay
          if-no-files-found: error
          retention-days: 30

  prune-restart-rejoin:
    name: 5N prune snapshot restart rejoin corrected K5
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout control plane
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          path: control-plane
          persist-credentials: false
      - name: Checkout exact frozen candidate
        uses: actions/checkout@v4
        with:
          ref: ${{ env.CANDIDATE_SHA }}
          path: candidate
          persist-credentials: false
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
      - name: Cache candidate cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: candidate -> target
      - name: Verify candidate and prepare explicit K5 harness
        env:
          ADAPT_DIR: ${{ runner.temp }}/task30-adaptation/prune
        run: |
          set -euo pipefail
          test "$(git -C candidate rev-parse HEAD)" = "$CANDIDATE_SHA"
          test -z "$(git -C candidate status --porcelain)"
          mkdir -p "$ADAPT_DIR"
          python3 control-plane/.github/task30-control/adapt_harness.py prune "$GITHUB_WORKSPACE/candidate" "$ADAPT_DIR/prune-harness.sh"
          bash -n "$ADAPT_DIR/prune-harness.sh"
      - name: Run prune snapshot restart and rejoin runtime drill
        working-directory: candidate
        env:
          TASK30_CANDIDATE_ROOT: ${{ github.workspace }}/candidate
          OUT_DIR: ${{ runner.temp }}/task30/prune-restart-rejoin
          MIN_OFFLINE_ADVANCE_BLOCKS: 64
          PRUNE_RESTART_REJOIN_TASK04_HARNESS: ${{ runner.temp }}/task30-adaptation/prune/prune-harness.sh
        run: |
          set -euo pipefail
          bash scripts/v2_3_0_prune_restart_rejoin_runtime.sh
          jq -e '
            .result == "PASS" and .evidence_kind == "runtime" and .node_count == 5 and
            .blocks_pruned_total > 0 and .snapshot_delta_restart_executed == true and
            .restart_selected_tip_matches == true and .restart_state_root_matches == true and
            .offline_advance_blocks >= 64 and .rejoin_executed == true and .rejoin_converged == true and
            .final_storage_memory_consistent == true and
            all(.final_nodes[]; (.compatible_peers // -1) >= 4) and .public_testnet_ready == false
          ' "$OUT_DIR/evidence_manifest.json" >/dev/null
          test -z "$(git status --porcelain)"
      - name: Upload prune evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: task30-rerun-prune-${{ env.CANDIDATE_SHA }}
          path: |
            ${{ runner.temp }}/task30/prune-restart-rejoin
            ${{ runner.temp }}/task30-adaptation/prune
          if-no-files-found: error
          retention-days: 30

  decision:
    name: Task30 corrected adversarial decision
    runs-on: ubuntu-latest
    if: always()
    needs:
      - multi-miner-convergence
      - partition-restart-rejoin
      - delayed-parent-selected-segment
      - signed-relay-runtime
      - prune-restart-rejoin
    env:
      MULTI_MINER_RESULT: ${{ needs.multi-miner-convergence.result }}
      PARTITION_RESULT: ${{ needs.partition-restart-rejoin.result }}
      DELAYED_PARENT_RESULT: ${{ needs.delayed-parent-selected-segment.result }}
      RELAY_RESULT: ${{ needs.signed-relay-runtime.result }}
      RECOVERY_RESULT: ${{ needs.prune-restart-rejoin.result }}
    steps:
      - name: Write corrected exact-candidate decision
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/task30-rerun/decision"
          python3 - "$RUNNER_TEMP/task30-rerun/decision/decision.json" <<'PY'
          import json, os, sys
          from datetime import datetime, timezone
          jobs = {
              "multi_miner_convergence": os.environ["MULTI_MINER_RESULT"],
              "partition_restart_rejoin": os.environ["PARTITION_RESULT"],
              "delayed_parent_selected_segment": os.environ["DELAYED_PARENT_RESULT"],
              "signed_relay_runtime": os.environ["RELAY_RESULT"],
              "prune_restart_rejoin": os.environ["RECOVERY_RESULT"],
          }
          passed = all(v == "success" for v in jobs.values())
          payload = {
              "task": "v2.4.0-task30-adversarial-runtime-exact-frozen-candidate-corrected-harness",
              "candidate_sha": os.environ["CANDIDATE_SHA"],
              "control_plane_ref": os.environ.get("GITHUB_REF"),
              "control_plane_sha": os.environ.get("GITHUB_SHA"),
              "captured_at_utc": datetime.now(timezone.utc).replace(microsecond=0).isoformat().replace("+00:00", "Z"),
              "result": "PASS" if passed else "FAIL",
              "jobs": jobs,
              "harness_adaptations": {
                  "multi_miner": "skip obsolete v2.2.20 release-surface preflight only",
                  "host_local_topology": "explicit deterministic K5 via comma-separated multi-bootnode wiring; four-peer criterion retained"
              },
              "first_exact_run_id": 32718341298,
              "public_testnet_ready": False,
              "release_tag_authorized": False,
              "default_high_cadence_authorized": False,
              "smart_contract_activation_authorized": False,
          }
          with open(sys.argv[1], "w", encoding="utf-8") as handle:
              json.dump(payload, handle, indent=2, sort_keys=True)
              handle.write("\n")
          PY
          cat "$RUNNER_TEMP/task30-rerun/decision/decision.json"
          jq -e '.candidate_sha == "37f0dd6ca7aabe07341c226744f65d46bbb03d65" and .result == "PASS" and .public_testnet_ready == false' "$RUNNER_TEMP/task30-rerun/decision/decision.json" >/dev/null
      - name: Upload corrected Task30 decision
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: task30-rerun-decision-${{ env.CANDIDATE_SHA }}
          path: ${{ runner.temp }}/task30-rerun/decision
          if-no-files-found: error
          retention-days: 30
