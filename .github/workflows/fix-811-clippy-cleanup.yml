name: fix-811 clippy cleanup

on:
  push:
    branches:
      - fix/rejoin-catchup-stall-811
    paths:
      - .github/workflows/fix-811-clippy-cleanup.yml

permissions:
  contents: write

jobs:
  validate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: fix/rejoin-catchup-stall-811
          fetch-depth: 0

      - name: Apply cleanup
        run: python3 .github/tmp/fix_811_clippy.py

      - name: Format
        run: cargo fmt --all

      - name: Diff check
        run: git diff --check

      - name: Selected segment regressions
        run: cargo test -p pulsedagd selected_segment -- --nocapture

      - name: Clippy daemon
        run: cargo clippy -p pulsedagd --all-targets --all-features -- -D warnings

      - name: Daemon compile check
        run: cargo check -p pulsedagd

      - name: Commit cleanup and remove temporary harness
        shell: bash
        run: |
          rm -f .github/tmp/fix_811_clippy.py
          rm -f .github/workflows/fix-811-clippy-cleanup.yml
          git add -A
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore(sync): keep selected request-order helper test-only"
          git push origin HEAD:fix/rejoin-catchup-stall-811
