name: temporary wire clean fast-sync daemon integration

on:
  push:
    branches:
      - codex/1035-fast-sync-clean-bootstrap

permissions:
  contents: write

jobs:
  wire:
    if: github.actor != 'github-actions[bot]'
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/1035-fast-sync-clean-bootstrap
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.91.0
          components: rustfmt
      - name: Wire live daemon lifecycle
        run: |
          python3 .github/scripts/tmp_wire_fast_sync_daemon.py
          cargo fmt --all
          git diff --check
      - name: Compile daemon integration
        run: |
          cargo check --locked -p pulsedagd
      - name: Run clean bootstrap daemon regressions
        run: |
          cargo test --locked -p pulsedagd fast_sync_bootstrap::tests:: -- --nocapture
      - name: Commit wired candidate and remove helpers
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/tmp-wire-fast-sync-daemon.yml
          git rm .github/scripts/tmp_wire_fast_sync_daemon.py
          git add apps/pulsedagd/src/fast_sync_bootstrap.rs apps/pulsedagd/src/main.rs
          git commit -m 'daemon: drive clean fast-sync over live p2p'
          git push origin HEAD:codex/1035-fast-sync-clean-bootstrap
