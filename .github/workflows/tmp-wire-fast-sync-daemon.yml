name: temporary wire clean fast-sync daemon integration

on:
  push:
    branches:
      - codex/1035-fast-sync-clean-bootstrap

permissions:
  contents: write

jobs:
  wire:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/1035-fast-sync-clean-bootstrap
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.91.0
          components: rustfmt
      - name: Wire live daemon lifecycle
        run: |
          python3 - <<'PY'
          from pathlib import Path

          module = Path('apps/pulsedagd/src/fast_sync_bootstrap.rs')
          s = module.read_text()

          old = '''use pulsedag_core::{
              errors::PulseError, snapshot_transfer::snapshot_transfer_commitment_set_digest_v1,
              ProtocolActivationIdentity,
          };'''
          new = '''use pulsedag_core::{
              errors::PulseError, snapshot_transfer::snapshot_transfer_commitment_set_digest_v1,
              ActivatedV2P2pRuntime, ChainState, ProtocolActivationIdentity,
          };'''
          assert old in s
          s = s.replace(old, new, 1)

          old = 'use pulsedag_p2p::{P2pStatus, RemoteSelectedTipStatus};'
          new = 'use pulsedag_p2p::{P2pHandle, P2pStatus, RemoteSelectedTipStatus};'
          assert old in s
          s = s.replace(old, new, 1)

          old = 'const FAST_SYNC_REQUEST_RETRY_SECS: u64 = 5;'
          new = '''const FAST_SYNC_REQUEST_RETRY_SECS: u64 = 5;
          const FAST_SYNC_CAPABILITY_PROBE_RETRY_SECS: u64 = 5;
          const FAST_SYNC_CLEAN_DISCOVERY_SECS: u64 = 30;'''
          assert old in s
          s = s.replace(old, new, 1)

          anchor = '''    pub fn source_peer(&self) -> Option<&str> {
              self.source_peer.as_deref()
          }

          pub fn imported(&self) -> bool {'''
          replacement = '''    pub fn source_peer(&self) -> Option<&str> {
              self.source_peer.as_deref()
          }

          pub fn has_peer_capabilities(&self, peer_id: &str) -> bool {
              self.peer_capabilities.contains_key(peer_id)
          }

          pub fn imported(&self) -> bool {'''
          assert anchor in s
          s = s.replace(anchor, replacement, 1)

          marker = '\n#[cfg(test)]\nmod tests {'
          assert s.count(marker) == 1
          coordinator = r'''

          #[derive(Debug, Clone)]
          pub struct FastSyncImportedStateV1 {
              pub report: SnapshotVerificationReport,
              pub chain_state: ChainState,
              pub runtime: ActivatedV2P2pRuntime,
          }

          pub struct FastSyncDaemonRuntimeV1 {
              expected: ProtocolActivationIdentity,
              local_capabilities: FastSyncCapabilitiesV1,
              controller: Option<FastSyncBootstrapController>,
              serving_session: Option<FastSyncServingSessionV1>,
              discovery_started_at_unix: u64,
              capability_probe_sent_at: BTreeMap<String, u64>,
              fallback_to_normal_sync: bool,
          }

          impl FastSyncDaemonRuntimeV1 {
              pub fn new(
                  expected: ProtocolActivationIdentity,
                  clean_bootstrap: bool,
                  now_unix: u64,
              ) -> Result<Self, PulseError> {
                  let local_capabilities = local_fast_sync_capabilities_v1(&expected)?;
                  let controller = clean_bootstrap
                      .then(|| FastSyncBootstrapController::new(expected.clone()))
                      .transpose()?;
                  Ok(Self {
                      expected,
                      local_capabilities,
                      controller,
                      serving_session: None,
                      discovery_started_at_unix: now_unix,
                      capability_probe_sent_at: BTreeMap::new(),
                      fallback_to_normal_sync: false,
                  })
              }

              pub fn authority_active(&self) -> bool {
                  !self.fallback_to_normal_sync
                      && self
                          .controller
                          .as_ref()
                          .is_some_and(|controller| !controller.imported())
              }

              pub fn fallback_to_normal_sync(&self) -> bool {
                  self.fallback_to_normal_sync
              }

              fn discovery_expired(&self, now_unix: u64) -> bool {
                  now_unix.saturating_sub(self.discovery_started_at_unix)
                      >= FAST_SYNC_CLEAN_DISCOVERY_SECS
              }

              fn probe_is_due(&self, peer_id: &str, now_unix: u64) -> bool {
                  self.capability_probe_sent_at
                      .get(peer_id)
                      .map(|sent_at| {
                          now_unix.saturating_sub(*sent_at)
                              >= FAST_SYNC_CAPABILITY_PROBE_RETRY_SECS
                      })
                      .unwrap_or(true)
              }

              pub fn drive(
                  &mut self,
                  p2p: &dyn P2pHandle,
                  local_height: u64,
                  now_unix: u64,
              ) -> Result<(), PulseError> {
                  if !self.authority_active() {
                      return Ok(());
                  }

                  let eligible_peers = p2p.fast_sync_eligible_peers_v1()?;
                  let peers_to_probe = {
                      let controller = self
                          .controller
                          .as_ref()
                          .ok_or_else(|| bootstrap_error("clean bootstrap controller disappeared"))?;
                      eligible_peers
                          .iter()
                          .filter(|peer_id| {
                              !controller.has_peer_capabilities(peer_id)
                                  && self.probe_is_due(peer_id, now_unix)
                          })
                          .cloned()
                          .collect::<Vec<_>>()
                  };
                  for peer_id in peers_to_probe {
                      p2p.send_fast_sync_v1(
                          &peer_id,
                          &FastSyncWireV1::CapabilityProbe {
                              chain_id: self.expected.chain_id.clone(),
                          },
                      )?;
                      self.capability_probe_sent_at.insert(peer_id, now_unix);
                  }

                  let status = p2p.status()?;
                  let source = {
                      let controller = self
                          .controller
                          .as_mut()
                          .ok_or_else(|| bootstrap_error("clean bootstrap controller disappeared"))?;
                      controller.maybe_select_source(&status, &eligible_peers, local_height)
                  };

                  if source.is_none()
                      && self
                          .controller
                          .as_ref()
                          .and_then(|controller| controller.source_peer())
                          .is_none()
                      && self.discovery_expired(now_unix)
                  {
                      self.fallback_to_normal_sync = true;
                      return Ok(());
                  }

                  let request = {
                      let controller = self
                          .controller
                          .as_mut()
                          .ok_or_else(|| bootstrap_error("clean bootstrap controller disappeared"))?;
                      let source_peer = controller.source_peer().map(str::to_string);
                      let request = controller.next_request(now_unix)?;
                      source_peer.zip(request)
                  };
                  if let Some((peer_id, wire)) = request {
                      p2p.send_fast_sync_v1(&peer_id, &wire)?;
                  }
                  Ok(())
              }

              pub fn handle_inbound(
                  &mut self,
                  p2p: &dyn P2pHandle,
                  storage: &Storage,
                  peer_id: &str,
                  wire: &FastSyncWireV1,
              ) -> Result<Option<FastSyncImportedStateV1>, PulseError> {
                  if matches!(
                      wire,
                      FastSyncWireV1::CapabilityProbe { .. }
                          | FastSyncWireV1::GetTransferSummary { .. }
                          | FastSyncWireV1::GetCommitmentPage { .. }
                          | FastSyncWireV1::GetChunks(_)
                  ) {
                      let responses = serve_fast_sync_request_v1(
                          storage,
                          &self.expected,
                          &self.local_capabilities,
                          &mut self.serving_session,
                          wire,
                      )?;
                      for response in responses {
                          p2p.send_fast_sync_v1(peer_id, &response)?;
                      }
                      return Ok(None);
                  }

                  let Some(controller) = self.controller.as_mut() else {
                      return Ok(None);
                  };
                  match controller.accept_response(storage, peer_id, wire.clone()) {
                      Ok(FastSyncBootstrapOutcome::Imported(report)) => {
                          let (chain_state, runtime) =
                              storage.load_activated_v2_p2p_runtime_snapshot(&self.expected)?;
                          Ok(Some(FastSyncImportedStateV1 {
                              report,
                              chain_state,
                              runtime,
                          }))
                      }
                      Ok(FastSyncBootstrapOutcome::Idle | FastSyncBootstrapOutcome::Progress) => {
                          Ok(None)
                      }
                      Err(error) => {
                          if controller.source_peer() == Some(peer_id) {
                              controller.abandon_source();
                          }
                          Err(error)
                      }
                  }
              }
          }
          '''
          s = s.replace(marker, coordinator + marker, 1)

          test_insert = r'''

              #[test]
              fn daemon_runtime_authority_is_clean_node_only() {
                  let expected = identity();
                  let clean = FastSyncDaemonRuntimeV1::new(expected.clone(), true, 100).unwrap();
                  let existing = FastSyncDaemonRuntimeV1::new(expected, false, 100).unwrap();
                  assert!(clean.authority_active());
                  assert!(!existing.authority_active());
              }

              #[test]
              fn clean_discovery_window_is_bounded_and_saturating() {
                  let expected = identity();
                  let runtime = FastSyncDaemonRuntimeV1::new(expected, true, 100).unwrap();
                  assert!(!runtime.discovery_expired(99));
                  assert!(!runtime.discovery_expired(129));
                  assert!(runtime.discovery_expired(130));
              }
          '''
          idx = s.rfind('\n}')
          assert idx != -1
          s = s[:idx] + test_insert + s[idx:]
          module.write_text(s)

          main = Path('apps/pulsedagd/src/main.rs')
          m = main.read_text()

          anchor = '''    let snapshot_exists = storage.snapshot_exists().unwrap_or(false);
              let persisted_blocks = storage.list_blocks().unwrap_or_default();
              let mut chain_state = if startup_protocol.activated_v2() {'''
          replacement = '''    let snapshot_exists = storage.snapshot_exists().unwrap_or(false);
              let persisted_blocks = storage.list_blocks().unwrap_or_default();
              let clean_fast_sync_bootstrap =
                  startup_protocol.activated_v2() && !snapshot_exists && persisted_blocks.is_empty();
              let mut chain_state = if startup_protocol.activated_v2() {'''
          assert anchor in m
          m = m.replace(anchor, replacement, 1)

          anchor = '''        if let Some(capabilities) = startup_protocol.local_capabilities.clone() {
                  stack
                      .handle
                      .configure_protocol_capabilities_v1(capabilities)?;
              }
              if let Ok(status) = stack.handle.status() {'''
          replacement = '''        if let Some(capabilities) = startup_protocol.local_capabilities.clone() {
                  stack
                      .handle
                      .configure_protocol_capabilities_v1(capabilities)?;
              }
              if startup_protocol.activated_v2() {
                  let expected = startup_protocol.restore_identity.as_ref().ok_or_else(|| {
                      anyhow::anyhow!(
                          "activated-v2 startup selection is missing fast-sync protocol identity"
                      )
                  })?;
                  stack.handle.configure_fast_sync_capabilities_v1(
                      fast_sync_bootstrap::local_fast_sync_capabilities_v1(expected)?,
                  )?;
              }
              if let Ok(status) = stack.handle.status() {'''
          assert anchor in m
          m = m.replace(anchor, replacement, 1)

          anchor = '''    if let Some(mut rx) = inbound_rx {
              let chain = app_state.chain.clone();'''
          replacement = '''    let fast_sync_daemon_runtime = if startup_protocol.activated_v2() {
              let expected = startup_protocol.restore_identity.as_ref().ok_or_else(|| {
                  anyhow::anyhow!("activated-v2 startup selection is missing fast-sync identity")
              })?;
              Some(fast_sync_bootstrap::FastSyncDaemonRuntimeV1::new(
                  expected.clone(),
                  clean_fast_sync_bootstrap,
                  now_unix(),
              )?)
          } else {
              None
          };

              if let Some(mut rx) = inbound_rx {
              let chain = app_state.chain.clone();'''
          assert anchor in m
          m = m.replace(anchor, replacement, 1)

          anchor = '''        tokio::spawn(async move {
                  let mut activated_v2_p2p_runtime = startup_activated_v2_p2p_runtime;'''
          replacement = '''        tokio::spawn(async move {
                  let mut fast_sync_daemon_runtime = fast_sync_daemon_runtime;
                  let mut activated_v2_p2p_runtime = startup_activated_v2_p2p_runtime;'''
          assert anchor in m
          m = m.replace(anchor, replacement, 1)

          anchor = '''                let now = now_unix();
                  let timed_out = block_requests.drain_timeouts(now);'''
          replacement = '''                let now = now_unix();
                  if let (Some(p2p_handle), Some(fast_sync_runtime)) =
                      (p2p.as_ref(), fast_sync_daemon_runtime.as_mut())
                  {
                      let local_height = chain.read().await.dag.best_height;
                      if let Err(error) = fast_sync_runtime.drive(p2p_handle.as_ref(), local_height, now)
                      {
                          warn!(error = %error, "clean fast-sync bootstrap drive failed closed");
                      }

                      if let Some(InboundEvent::FastSync { peer_id, wire }) = maybe_event.as_ref() {
                          match fast_sync_runtime.handle_inbound(
                              p2p_handle.as_ref(),
                              &storage,
                              peer_id,
                              wire,
                          ) {
                              Ok(Some(imported)) => {
                                  let imported_height = imported.chain_state.dag.best_height;
                                  let recovery_confidence = imported.report.recovery_confidence.clone();
                                  *chain.write().await = imported.chain_state;
                                  activated_v2_p2p_runtime = imported.runtime;
                                  info!(
                                      imported_height,
                                      recovery_confidence = %recovery_confidence,
                                      "clean fast-sync bootstrap imported and activated live state"
                                  );
                              }
                              Ok(None) => {}
                              Err(error) => {
                                  warn!(peer_id = %peer_id, error = %error, "fast-sync inbound failed closed");
                              }
                          }
                          continue;
                      }

                      if fast_sync_runtime.authority_active() {
                          continue;
                      }
                  }

                  let timed_out = block_requests.drain_timeouts(now);'''
          assert anchor in m
          m = m.replace(anchor, replacement, 1)

          main.write_text(m)
          PY
          cargo fmt --all
          git diff --check
      - name: Compile daemon integration
        run: cargo check --locked -p pulsedagd
      - name: Run clean bootstrap daemon regressions
        run: cargo test --locked -p pulsedagd fast_sync_bootstrap::tests:: -- --nocapture
      - name: Commit wired candidate and remove helper
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/tmp-wire-fast-sync-daemon.yml
          git add apps/pulsedagd/src/fast_sync_bootstrap.rs apps/pulsedagd/src/main.rs
          git commit -m 'daemon: drive clean fast-sync over live p2p'
          git push origin HEAD:codex/1035-fast-sync-clean-bootstrap
