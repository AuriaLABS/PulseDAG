name: fix-812 selected-chain metadata repair

on:
  push:
    branches:
      - fix/fresh-node-orphan-recovery-812
  workflow_dispatch:

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      - name: Apply selected-chain metadata repair
        run: python3 scripts/ci_fix_812_selected_chain_repair.py

      - name: Rustfmt
        run: cargo fmt --all

      - name: Diff check
        run: git diff --check

      - name: Empty selected-chain startup regression
        id: empty_selected_chain_regression
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          cargo test -p pulsedagd startup_selected_chain_metadata_repair_restores_locator_from_empty_snapshot_metadata -- --nocapture 2>&1 | tee fix812-empty-selected-chain.log

      - name: Upload empty selected-chain regression log
        if: steps.empty_selected_chain_regression.outcome == 'failure'
        uses: actions/upload-artifact@v4
        with:
          name: fix812-empty-selected-chain-regression-log
          path: fix812-empty-selected-chain.log
          if-no-files-found: error

      - name: Fail on empty selected-chain regression
        if: steps.empty_selected_chain_regression.outcome == 'failure'
        run: exit 1

      - name: Deep locator regression
        run: cargo test -p pulsedagd selected_chain_locator_spans_long_fresh_node_divergence -- --nocapture

      - name: Selected segment regressions
        run: cargo test -p pulsedagd selected_segment -- --nocapture

      - name: Clippy
        run: cargo clippy -p pulsedagd --all-targets --all-features -- -D warnings

      - name: Check pulsedagd
        run: cargo check -p pulsedagd

      - name: Commit validated source fix
        if: success()
        run: |
          rm .github/workflows/fix-812-selected-chain-repair.yml
          rm scripts/ci_fix_812_selected_chain_repair.py
          git add -A
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "fix(sync): repair selected-chain metadata on startup"
          git push
