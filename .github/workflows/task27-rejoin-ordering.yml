name: Task 27 rejoin ownership ordering

on:
  push:
    branches:
      - agent/task27-rejoin-runtime-work

permissions:
  contents: write

jobs:
  apply-ordering:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: agent/task27-rejoin-runtime-work
          fetch-depth: 0

      - name: Apply exact ordering hardening
        run: python3 .github/task27_rejoin_ordering.py

      - name: Remove one-shot editor files
        run: rm .github/task27_rejoin_ordering.py .github/workflows/task27-rejoin-ordering.yml

      - name: Format and validate patch shape
        run: |
          cargo fmt --all
          git diff --check
          git diff --stat
          git diff -- apps/pulsedagd/src/main.rs | sed -n '1,260p'

      - name: Commit exact source edit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "node: strengthen Task 27 recovery ownership ordering"
          git push origin HEAD:agent/task27-rejoin-runtime-work
