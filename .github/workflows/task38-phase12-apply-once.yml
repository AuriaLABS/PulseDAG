name: Task38 phase12 apply-once

on:
  push:
    branches:
      - codex/issue-1038-opencl-discovery-cli-phase12
    paths:
      - ".github/workflows/task38-phase12-apply-once.yml"
      - ".github/scripts/task38_phase12_apply_once.py"

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: codex/issue-1038-opencl-discovery-cli-phase12
          fetch-depth: 0

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.91.0
          components: rustfmt,clippy

      - name: Apply exact Phase12 patch
        run: python3 .github/scripts/task38_phase12_apply_once.py

      - name: Format and test patched discovery
        shell: bash
        run: |
          set -euo pipefail
          cargo fmt --all
          cargo test --locked -p pulsedag-miner --features gpu --lib opencl::tests
          cargo test --locked -p pulsedag-miner --features gpu --bin pulsedag-miner usage_describes_canonical_opencl_and_explicit_cuda_backends
          cargo clippy --locked -p pulsedag-miner --features gpu --all-targets -- -D warnings

      - name: Commit patch and remove apply-once helpers
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/task38-phase12-apply-once.yml .github/scripts/task38_phase12_apply_once.py
          git add apps/pulsedag-miner/src/lib.rs apps/pulsedag-miner/src/main.rs
          git commit -m "miner: harden OpenCL discovery and CLI for #1038"
          git push origin HEAD:codex/issue-1038-opencl-discovery-cli-phase12
