name: temporary 1036 DAG reorder mempool evidence

on:
  push:
    branches:
      - codex/1036-mempool-dag-reorder-evidence
    paths:
      - .github/workflows/tmp-1036-dag-reorder-evidence.yml

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/1036-mempool-dag-reorder-evidence
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Verify DAG arrival-order mempool determinism
        run: |
          set -euo pipefail
          cargo fmt --all
          cargo test --locked -p pulsedag-core --test v3_mempool_dag_reorder_determinism -- --nocapture
          cargo clippy --locked -p pulsedag-core --test v3_mempool_dag_reorder_determinism -- -D warnings
          rm .github/workflows/tmp-1036-dag-reorder-evidence.yml
          git config user.name 'chatgpt-codex-connector[bot]'
          git config user.email '199175422+chatgpt-codex-connector[bot]@users.noreply.github.com'
          git add crates/pulsedag-core/tests/v3_mempool_dag_reorder_determinism.rs .github/workflows/tmp-1036-dag-reorder-evidence.yml
          git commit -m 'test: verify mempool DAG reorder determinism'
          git push origin HEAD:codex/1036-mempool-dag-reorder-evidence
