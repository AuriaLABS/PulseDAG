name: TEMP pending submission state

on:
  push:
    branches:
      - wallet/v3-pending-utxo-reconcile
    paths:
      - .github/workflows/temp-pending-state.yml

permissions:
  contents: write

jobs:
  apply-and-verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: wallet/v3-pending-utxo-reconcile

      - name: Verify source and apply state patch
        shell: bash
        run: |
          set -euo pipefail
          test "$(git hash-object crates/pulsedag-wallet/src/pending.rs)" = "a44a2c260759566eeb0ab5a44669343cda5bf122"
          git apply --check .github/temp-pending-state.patch
          git apply .github/temp-pending-state.patch
          git diff --check
          cargo fmt --all -- --check

      - name: Wallet tests
        run: cargo test -p pulsedag-wallet

      - name: Wallet clippy
        run: cargo clippy -p pulsedag-wallet --all-targets -- -D warnings

      - name: Publish state change and clean applicator
        shell: bash
        run: |
          set -euo pipefail
          rm .github/temp-pending-state.patch .github/workflows/temp-pending-state.yml
          git add -A
          changed="$(git diff --cached --name-only | sort)"
          expected="$(printf '%s\n' '.github/temp-pending-state.patch' '.github/workflows/temp-pending-state.yml' 'crates/pulsedag-wallet/src/pending.rs' | sort)"
          test "$changed" = "$expected"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "wallet: persist submission-started state"
          git push origin HEAD:wallet/v3-pending-utxo-reconcile
