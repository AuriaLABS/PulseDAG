name: v2.4.0 private burn-in phase A launch

on:
  push:
    branches:
      - ops/v2.4.0-burnin-8a1a5f74
    paths:
      - ops/burnin/v2_4_0_phase_a_remote.sh
      - ops/burnin/v2_4_0_phase_a_controller.sh
      - .github/workflows/v2_4_0_private_burnin_phase_a.yml
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  launch:
    runs-on: [self-hosted, linux, pulsedag-private-testnet]
    environment: pulsedag-private-testnet-rehearsal
    timeout-minutes: 90
    steps:
      - name: Checkout operations branch
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Launch exact-SHA private burn-in Phase A
        shell: bash
        env:
          SSH_KEY: ${{ secrets.PULSEDAG_V2_3_0_REHEARSAL_SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.PULSEDAG_V2_3_0_REHEARSAL_KNOWN_HOSTS }}
          INVENTORY_B64: ${{ secrets.PULSEDAG_V2_3_0_REHEARSAL_INVENTORY_B64 }}
          GH_TOKEN: ${{ github.token }}
        run: bash ops/burnin/v2_4_0_phase_a_controller.sh

      - name: Upload sanitized start evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v2_4_0_phase_a_start_${{ github.run_id }}_${{ github.run_attempt }}
          path: ops-output/phase-a
          if-no-files-found: warn
          retention-days: 180
