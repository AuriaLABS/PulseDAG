name: Task 27 frontier edit

on:
  push:
    branches:
      - agent/task27-frontier-reconcile-fetch

permissions:
  contents: write

jobs:
  apply-frontier-slice:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: agent/task27-frontier-reconcile-fetch
          fetch-depth: 0

      - name: Apply exact Task 27 edits
        run: python3 .github/task27_frontier_edit.py

      - name: Remove one-shot editor files
        run: rm .github/task27_frontier_edit.py .github/workflows/task27-frontier-edit.yml

      - name: Format and validate patch shape
        run: |
          cargo fmt --all
          git diff --check
          git diff --stat
          git diff -- apps/pulsedagd/src/main.rs | sed -n '1,320p'

      - name: Commit exact source edit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "node: schedule bounded fetches from Task 27 frontiers"
          git push origin HEAD:agent/task27-frontier-reconcile-fetch
