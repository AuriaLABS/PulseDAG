name: v3 Task39 cadence evidence

on:
  workflow_dispatch:
  pull_request:
    branches:
      - main
    paths:
      - apps/pulsedagd/**
      - apps/pulsedag-miner/**
      - crates/pulsedag-core/**
      - crates/pulsedag-p2p/**
      - crates/pulsedag-rpc/**
      - crates/pulsedag-storage/**
      - scripts/private_testnet/task39_cadence_evidence.py
      - scripts/lib/patch_task39_cadence_integrity.py
      - scripts/lib/patch_task39_propagation_availability.py
      - .github/workflows/task39-cadence-evidence.yml
  push:
    branches:
      - main
    paths:
      - apps/pulsedagd/**
      - apps/pulsedag-miner/**
      - crates/pulsedag-core/**
      - crates/pulsedag-p2p/**
      - crates/pulsedag-rpc/**
      - crates/pulsedag-storage/**
      - scripts/private_testnet/task39_cadence_evidence.py
      - scripts/lib/patch_task39_cadence_integrity.py
      - scripts/lib/patch_task39_propagation_availability.py
      - .github/workflows/task39-cadence-evidence.yml

permissions:
  contents: read

jobs:
  cadence-evidence:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      CANDIDATE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Verify exact candidate and clean tree
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$CANDIDATE_SHA"
          test -z "$(git status --porcelain)"
          echo "candidate_sha=$(git rev-parse HEAD)"
          echo "candidate_tree=$(git rev-parse 'HEAD^{tree}')"

      - name: Task39 hardened harness syntax and self-test
        run: |
          set -euo pipefail
          base_harness="${RUNNER_TEMP:?RUNNER_TEMP is required}/task39_cadence_evidence.base.py"
          harness="${RUNNER_TEMP:?RUNNER_TEMP is required}/task39_cadence_evidence.py"
          python3 -m py_compile \
            scripts/lib/patch_task39_cadence_integrity.py \
            scripts/lib/patch_task39_propagation_availability.py
          python3 scripts/lib/patch_task39_cadence_integrity.py \
            scripts/private_testnet/task39_cadence_evidence.py \
            "$base_harness"
          python3 scripts/lib/patch_task39_propagation_availability.py \
            "$base_harness" \
            "$harness"
          python3 -m py_compile "$harness"
          python3 "$harness" --self-test
          rm -rf scripts/lib/__pycache__ scripts/private_testnet/__pycache__
          test -z "$(git status --porcelain)"

      - name: Existing fast-cadence and startup-protocol regressions
        run: |
          set -euo pipefail
          cargo test --locked -p pulsedagd config::tests::experimental_fast_cadence
          cargo test --locked -p pulsedagd config::tests::target_block_interval
          cargo test --locked -p pulsedagd startup_protocol::tests::

      - name: Build release node and standalone miner
        run: cargo build --locked --release -p pulsedagd -p pulsedag-miner

      - name: Run 1000ms 500ms 250ms rehearsal matrix
        env:
          EVIDENCE_DIR: ${{ runner.temp }}/task39-cadence
          PULSEDAG_MAX_PARALLEL_TIPS: "8"
          PULSEDAG_MAX_MERGE_SET_SIZE: "64"
          PULSEDAG_MAX_ORPHAN_COUNT: "2048"
          PULSEDAG_MAX_PENDING_MISSING_PARENTS: "1024"
          PULSEDAG_MAX_BLOCK_MASS: "2000000"
          PULSEDAG_MAX_TEMPLATE_AGE_MS: "5000"
        run: |
          set -euo pipefail
          harness="${RUNNER_TEMP:?RUNNER_TEMP is required}/task39_cadence_evidence.py"
          test -f "$harness"
          python3 "$harness" \
            --candidate-sha "$CANDIDATE_SHA" \
            --out-dir "$EVIDENCE_DIR" \
            --duration-secs 10 \
            --sample-ms 50 \
            --max-tries 500000 \
            --threads 1

      - name: Enforce runtime result and evidence digests without premature completion claim
        env:
          EVIDENCE_DIR: ${{ runner.temp }}/task39-cadence
        run: |
          set -euo pipefail
          jq -e --arg sha "$CANDIDATE_SHA" '
            .candidate_sha == $sha and
            .required_cadence_points_ms == [1000,500,250] and
            .runtime_gate_result == "PASS" and
            .completion_eligible == false and
            .production_cadence_selected == false and
            (.runs | length) == 3 and
            ([.runs[].cadence_ms] == [1000,500,250]) and
            (all(.runs[]; .runtime_gate_result == "PASS" and .completion_eligible == false)) and
            (all(.runs[]; (.evidence_sha256 | test("^[0-9a-f]{64}$"))))
          ' "$EVIDENCE_DIR/aggregate.json" >/dev/null
          for cadence in 1000 500 250; do
            evidence="$EVIDENCE_DIR/cadence-${cadence}ms/evidence.json"
            jq -e --arg sha "$CANDIDATE_SHA" --argjson cadence "$cadence" '
              .candidate_sha == $sha and
              .configured_cadence_ms == $cadence and
              .configured_experimental_limits.PULSEDAG_MAX_PARALLEL_TIPS == 8 and
              .configured_experimental_limits.PULSEDAG_MAX_MERGE_SET_SIZE == 64 and
              .configured_experimental_limits.PULSEDAG_MAX_ORPHAN_COUNT == 2048 and
              .configured_experimental_limits.PULSEDAG_MAX_PENDING_MISSING_PARENTS == 1024 and
              .configured_experimental_limits.PULSEDAG_MAX_BLOCK_MASS == 2000000 and
              .configured_experimental_limits.PULSEDAG_MAX_TEMPLATE_AGE_MS == 5000 and
              .runtime_observation.consensus_mode == "ghostdag_dev" and
              .runtime_observation.protocol_consensus_mode == "legacy" and
              .runtime_observation.configured_p2p.mode == "libp2p-real" and
              .runtime_observation.configured_p2p.mdns == false and
              ([.runtime_observation.observed_p2p_mode_by_node[]] | all(. == "libp2p-real")) and
              ([.runtime_observation.observed_p2p_mdns_by_node[]] | all(. == false)) and
              ([.runtime_observation.observed_p2p_fresh_by_node[]] | all(. == true)) and
              ([.runtime_observation.observed_connected_peers_are_real_network_by_node[]] | all(. == true)) and
              .runtime_observation.full_mesh_verified == true and
              ([.runtime_observation.mesh_peer_counts_after_startup[]] | all(. == 2)) and
              ((.runtime_observation.connected_peer_ids_by_node.a | sort) == ([.runtime_observation.peer_ids_by_node.b, .runtime_observation.peer_ids_by_node.c] | sort)) and
              ((.runtime_observation.connected_peer_ids_by_node.b | sort) == ([.runtime_observation.peer_ids_by_node.a, .runtime_observation.peer_ids_by_node.c] | sort)) and
              ((.runtime_observation.connected_peer_ids_by_node.c | sort) == ([.runtime_observation.peer_ids_by_node.a, .runtime_observation.peer_ids_by_node.b] | sort)) and
              (.runtime_observation.peer_ids_by_node.a | length) > 0 and
              (.runtime_observation.peer_ids_by_node.b | length) > 0 and
              (.runtime_observation.peer_ids_by_node.c | length) > 0 and
              (.runtime_observation.bootstrap_multiaddrs_by_node.b | contains("/p2p/")) and
              (.runtime_observation.bootstrap_multiaddrs_by_node.c | contains("/p2p/")) and
              ([.runtime_observation.effective_cadence_ms_by_node[]] | all(. == $cadence)) and
              .measurement.shutdown_and_log_drain_overhead_ms >= 0 and
              .measurement.configured_post_sample_sleep_ms == 50 and
              .measurement.observed_same_node_poll_gap_ms.count >= 1 and
              .measurement.active_window_sampling_min_success_fraction == 0.8 and
              (all(.measurement.active_window_sampling_by_node[];
                .attempts == (.successes + .failures) and
                .attempts > 0 and
                .successes >= 2 and
                .success_fraction >= 0.8 and
                .success_fraction <= 1.0)) and
              (
                (
                  .propagation_and_dag.propagation_available == true and
                  .propagation_and_dag.sampled_selected_tip_convergence_latency_ms.count >= 1 and
                  .propagation_and_dag.propagation_unavailable_reason == null
                ) or
                (
                  .propagation_and_dag.propagation_available == false and
                  .propagation_and_dag.sampled_selected_tip_convergence_latency_ms.count == 0 and
                  ((.propagation_and_dag.propagation_unavailable_reason | type) == "string") and
                  ((.propagation_and_dag.propagation_unavailable_reason | length) > 0)
                )
              ) and
              .propagation_and_dag.propagation_exclusion_policy == "exclude-pre-measurement-selected-tips" and
              ((.propagation_and_dag.propagation_excluded_pre_measurement_tips | type) == "array") and
              (all(.propagation_and_dag.propagation_excluded_pre_measurement_tips[];
                (type == "string") and (length > 0))) and
              ((.canonical_end_state.ordered_dag_tip | type) == "string") and
              (.canonical_end_state.ordered_dag_tip | length) > 0 and
              .experimental_only == true and
              .runtime_gate_result == "PASS" and
              .production_cadence_selected == false and
              .coverage.completion_eligible == false and
              (.coverage.missing_required_measurements | length) >= 1
            ' "$evidence" >/dev/null
            expected="$(jq -r --argjson cadence "$cadence" '.runs[] | select(.cadence_ms == $cadence) | .evidence_sha256' "$EVIDENCE_DIR/aggregate.json")"
            actual="$(sha256sum "$evidence" | awk '{print $1}')"
            test -n "$expected"
            test "$expected" != "null"
            test "$expected" = "$actual"
          done

      - name: Upload exact-candidate cadence evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: task39-cadence-${{ github.event.pull_request.head.sha || github.sha }}
          path: ${{ runner.temp }}/task39-cadence
          if-no-files-found: error
          retention-days: 14