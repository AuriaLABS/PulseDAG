name: Harden #1064 mining identity binding v3

on:
  push:
    branches:
      - codex/issue-1037-mining-protocol-v3
    paths:
      - '.github/workflows/harden-1064-mining-identity-v3.yml'

permissions:
  contents: write

jobs:
  harden:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/issue-1037-mining-protocol-v3
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Apply durable fail-closed mining identity binding
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          def replace_once(path, old, new):
              p = Path(path)
              text = p.read_text()
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{path}: expected one replacement, found {count}")
              p.write_text(text.replace(old, new))

          # Add a backward-compatible protocol fingerprint field to every durable
          # StoredMiningTemplate construction. Existing JSON records deserialize with
          # an empty value; newly issued v3 work below must persist the exact value.
          literal_count = 0
          for p in Path("crates/pulsedag-rpc").rglob("*.rs"):
              text = p.read_text()
              count = text.count("StoredMiningTemplate {\n")
              if not count:
                  continue
              literal_count += count
              text = text.replace(
                  "StoredMiningTemplate {\n",
                  "StoredMiningTemplate {\n        protocol_identity_fingerprint: String::new(),\n",
              )
              p.write_text(text)
          legacy = Path("crates/pulsedag-rpc/src/handlers/mining_template.rs")
          text = legacy.read_text()
          definition = "pub struct StoredMiningTemplate {\n        protocol_identity_fingerprint: String::new(),\n"
          if text.count(definition) != 1:
              raise SystemExit("StoredMiningTemplate definition anchor is not unique")
          text = text.replace(
              definition,
              "pub struct StoredMiningTemplate {\n    #[serde(default)]\n    pub protocol_identity_fingerprint: String,\n",
              1,
          )
          legacy.write_text(text)
          if literal_count < 2:
              raise SystemExit(f"unexpected StoredMiningTemplate occurrence count: {literal_count}")

          protocol = "crates/pulsedag-rpc/src/handlers/mining_template_protocol.rs"
          replace_once(
              protocol,
              '''#[cfg(test)]
          pub(crate) use super::mining_template_legacy::store_template;
          pub use super::mining_template_legacy::StoredMiningTemplate;
          pub(crate) use super::mining_template_legacy::{
              current_template_state, load_template, template_freshness_window,
              template_id_matches_lifecycle, MINING_PROTOCOL_VERSION,
          };''',
              '''pub use super::mining_template_legacy::StoredMiningTemplate;
          pub(crate) use super::mining_template_legacy::{
              current_template_state, load_template, store_template, template_freshness_window,
              template_id_matches_lifecycle, MINING_PROTOCOL_VERSION,
          };'''
          )

          p = Path(protocol)
          text = p.read_text()
          start = text.index("async fn post_legacy_template")
          end = text.index("\npub async fn post_mining_template", start)
          segment = text[start:end]
          old_bind = '''            if let Err(error) = super::mining_submit::bind_template_protocol(
                          data.template_id.clone(),
                          identity,
                          fingerprint,
                      ) {'''
          new_bind = '''            let internal_template_id = data.template_id.clone();
                      if let Err(error) = super::mining_submit::bind_template_protocol(
                          internal_template_id.clone(),
                          identity.clone(),
                          fingerprint.clone(),
                      ) {'''
          if segment.count(old_bind) != 1 or segment.count("            Some(data.into())") != 1:
              raise SystemExit("post_legacy_template durable binding anchors are not unique")
          segment = segment.replace(old_bind, new_bind)
          segment = segment.replace(
              "            Some(data.into())",
              '''            let mut stored = match load_template(&internal_template_id) {
                          Some(stored) => stored,
                          None => {
                              return Json(ApiResponse::err(
                                  "PROTOCOL_IDENTITY_ERROR",
                                  "cannot reload issued mining template before protocol binding",
                              ));
                          }
                      };
                      stored.protocol_identity_fingerprint = fingerprint.clone();
                      store_template(&stored);
                      let durable = load_template(&internal_template_id).is_some_and(|stored| {
                          stored.protocol_identity_fingerprint == fingerprint
                      });
                      if !durable {
                          return Json(ApiResponse::err(
                              "PROTOCOL_IDENTITY_ERROR",
                              "issued mining template protocol fingerprint was not durably persisted",
                          ));
                      }
                      let mut data: MiningTemplateData = data.into();
                      data.protocol_identity = Some(identity);
                      data.protocol_identity_fingerprint = Some(fingerprint);
                      Some(data)'''
          )
          p.write_text(text[:start] + segment + text[end:])

          submit = "crates/pulsedag-rpc/src/handlers/mining_submit_v3.rs"
          replace_once(
              submit,
              '''pub(crate) fn versioned_template_id(internal_template_id: &str) -> String {
              if internal_template_id.starts_with(MINING_V3_TEMPLATE_PREFIX) {
                  internal_template_id.to_string()
              } else {
                  format!("{MINING_V3_TEMPLATE_PREFIX}{internal_template_id}")
              }
          }

          fn internal_template_id(external_template_id: &str) -> &str {
              external_template_id
                  .strip_prefix(MINING_V3_TEMPLATE_PREFIX)
                  .unwrap_or(external_template_id)
          }''',
              '''pub(crate) fn versioned_template_id(
              internal_template_id: &str,
              protocol_fingerprint: &str,
          ) -> String {
              if internal_template_id.starts_with(MINING_V3_TEMPLATE_PREFIX) {
                  internal_template_id.to_string()
              } else {
                  format!("{MINING_V3_TEMPLATE_PREFIX}{protocol_fingerprint}:{internal_template_id}")
              }
          }

          fn external_protocol_fingerprint(external_template_id: &str) -> Option<&str> {
              let rest = external_template_id.strip_prefix(MINING_V3_TEMPLATE_PREFIX)?;
              let (fingerprint, _) = rest.split_once(':')?;
              (fingerprint.len() == 64
                  && fingerprint.bytes().all(|byte| byte.is_ascii_hexdigit()))
                  .then_some(fingerprint)
          }

          fn internal_template_id(external_template_id: &str) -> &str {
              let Some(rest) = external_template_id.strip_prefix(MINING_V3_TEMPLATE_PREFIX) else {
                  return external_template_id;
              };
              match rest.split_once(':') {
                  Some((fingerprint, internal))
                      if fingerprint.len() == 64
                          && fingerprint.bytes().all(|byte| byte.is_ascii_hexdigit()) =>
                  {
                      internal
                  }
                  _ => rest,
              }
          }

          fn issued_protocol_fingerprint(internal_template_id: &str) -> Result<String, String> {
              if let Some((_, fingerprint)) = internal_template_id.rsplit_once(':') {
                  if internal_template_id.starts_with("v2:")
                      && fingerprint.len() == 64
                      && fingerprint.bytes().all(|byte| byte.is_ascii_hexdigit())
                  {
                      return Ok(fingerprint.to_string());
                  }
              }
              let stored = super::mining_template_protocol::load_template(internal_template_id)
                  .ok_or_else(|| "issued mining template record is unavailable".to_string())?;
              let fingerprint = stored.protocol_identity_fingerprint;
              if fingerprint.len() == 64
                  && fingerprint.bytes().all(|byte| byte.is_ascii_hexdigit())
              {
                  Ok(fingerprint)
              } else {
                  Err("issued mining template is missing its durable protocol fingerprint".to_string())
              }
          }'''
          )

          replace_once(
              "crates/pulsedag-rpc/src/handlers/mining_template_v3.rs",
              '''    let external_template_id = super::mining_submit::versioned_template_id(&internal_template_id);
              let job_id = super::mining_submit::job_id_for_template(&external_template_id);''',
              '''    let protocol_fingerprint = object
                  .get("protocol_identity_fingerprint")
                  .and_then(Value::as_str)
                  .filter(|fingerprint| {
                      fingerprint.len() == 64
                          && fingerprint.bytes().all(|byte| byte.is_ascii_hexdigit())
                  })
                  .ok_or_else(|| {
                      "mining template response is missing a valid protocol identity fingerprint"
                          .to_string()
                  })?;
              let external_template_id = super::mining_submit::versioned_template_id(
                  &internal_template_id,
                  protocol_fingerprint,
              );
              let job_id = super::mining_submit::job_id_for_template(&external_template_id);'''
          )

          replace_once(
              submit,
              '''async fn known_block_reconciliation<S: RpcStateLike>(''',
              '''fn protocol_identity_mismatch_data(
              req: &SubmitMinedBlockRequest,
              external_template_id: Option<&str>,
              submit_id: &str,
              job: Option<&JobObservation>,
              expected: &str,
              claimed: &str,
          ) -> Value {
              decorate_submit_data(
                  json!({
                      "accepted": false,
                      "reason": "external mining template protocol identity does not match issued work",
                      "block_hash": req.block.hash,
                      "block_id": Value::Null,
                      "height": req.block.header.height,
                      "pow_algorithm": pulsedag_core::selected_pow_name(),
                      "pow_accepted": false,
                      "pow_accepted_dev": false,
                      "target_u64": 0,
                      "target_hex": format!("{:064x}", 0_u64),
                      "pow_hash": Value::Null,
                      "invalid_pow": false,
                      "stale": false,
                      "duplicate": false,
                      "stale_template": false,
                      "reason_code": "protocol_identity_mismatch",
                      "selected_tip": Value::Null,
                      "adopted_orphans": 0,
                      "pow_hash_score_u64": 0,
                      "pow_rejection_code": "protocol_identity_mismatch",
                      "pow_rejection_reason": format!("expected protocol fingerprint {expected}, got {claimed}")
                  }),
                  external_template_id,
                  submit_id,
                  job,
                  false,
              )
          }

          async fn known_block_reconciliation<S: RpcStateLike>('''
          )

          replace_once(
              submit,
              '''    let job = job_observation(scope_id, external_template_id.as_deref());
              let candidate_fingerprint = match candidate_fingerprint(&req.block) {''',
              '''    let job = job_observation(scope_id, external_template_id.as_deref());
              if let Some(claimed) = external_template_id
                  .as_deref()
                  .and_then(external_protocol_fingerprint)
              {
                  let internal = external_template_id
                      .as_deref()
                      .map(internal_template_id)
                      .unwrap_or_default();
                  let expected = match issued_protocol_fingerprint(internal) {
                      Ok(expected) => expected,
                      Err(error) => {
                          return Json(ApiResponse::err(
                              "MINING_PROTOCOL_V3_PROTOCOL_IDENTITY",
                              format!("cannot resolve issued mining protocol identity: {error}"),
                          ));
                      }
                  };
                  if claimed != expected {
                      return Json(ApiResponse::ok(protocol_identity_mismatch_data(
                          &req,
                          external_template_id.as_deref(),
                          &submit_id,
                          job.as_ref(),
                          &expected,
                          claimed,
                      )));
                  }
              }
              let candidate_fingerprint = match candidate_fingerprint(&req.block) {'''
          )

          replace_once(
              submit,
              '''    fn task37_versioned_template_ids_round_trip_without_losing_internal_identity() {
                  let internal = "v1-work-abc";
                  let external = versioned_template_id(internal);
                  assert_eq!(external, "v3:v1-work-abc");
                  assert_eq!(internal_template_id(&external), internal);
                  assert_eq!(versioned_template_id(&external), external);
              }

              #[test]
              fn task37_protocol_identity_golden_vectors_are_frozen() {
                  assert_eq!(
                      job_id_for_template("v3:v1-work-abc"),
                      "v3-job-dc75926e7d0f69e205aac68bae505b0cae953de4b7242880d91033169c394fd3"
                  );
                  assert_eq!(
                      submit_id_for(Some("v3:v1-work-abc"), "block-123"),
                      "v3-submit-555a479be74c0128d02c67fdacfa98f0c923e51739fb534510a0e12208e9e675"
                  );
              }''',
              '''    fn task37_versioned_template_ids_round_trip_without_losing_internal_identity() {
                  let internal = "v1-work-abc";
                  let fingerprint = "11".repeat(32);
                  let external = versioned_template_id(internal, &fingerprint);
                  assert_eq!(external, format!("v3:{fingerprint}:v1-work-abc"));
                  assert_eq!(external_protocol_fingerprint(&external), Some(fingerprint.as_str()));
                  assert_eq!(internal_template_id(&external), internal);
                  assert_eq!(versioned_template_id(&external, &fingerprint), external);
                  assert_eq!(internal_template_id("v3:v1-work-abc"), internal);
              }

              #[test]
              fn task37_protocol_identity_golden_vectors_are_frozen() {
                  let template_id = concat!(
                      "v3:",
                      "1111111111111111111111111111111111111111111111111111111111111111",
                      ":v1-work-abc"
                  );
                  assert_eq!(
                      job_id_for_template(template_id),
                      "v3-job-6f2746fc48959fd03d4b11c2cc24704ab522f2eac07a1bdc5dc2466926c41ae6"
                  );
                  assert_eq!(
                      submit_id_for(Some(template_id), "block-123"),
                      "v3-submit-48f2e0e1cbd16c5245b720cfc87d3959a36176be6345aad3a5b1f0561970536d"
                  );
                  let other = versioned_template_id("v1-work-abc", &"22".repeat(32));
                  assert_ne!(job_id_for_template(template_id), job_id_for_template(&other));
              }'''
          )

          contract = "crates/pulsedag-rpc/tests/mining_protocol_v3_contract.rs"
          replace_once(
              contract,
              '''    assert!(data["template_id"]
                  .as_str()
                  .is_some_and(|value| value.starts_with("v3:")));
              assert!(data["job_id"]''',
              '''    let protocol_fingerprint = data["protocol_identity_fingerprint"]
                  .as_str()
                  .expect("v3 template must expose its exact protocol identity fingerprint");
              assert_eq!(protocol_fingerprint.len(), 64);
              assert!(data["template_id"]
                  .as_str()
                  .is_some_and(|value| value.starts_with(&format!("v3:{protocol_fingerprint}:"))));
              assert!(data["job_id"]'''
          )
          replace_once(
              contract,
              '''    assert_eq!(data["resource_limits"]["max_inflight_submits"], 64);

              let compact_target = data["compact_target"].as_u64().unwrap() as u32;''',
              '''    assert_eq!(data["resource_limits"]["max_inflight_submits"], 64);

              let original_template_id = template_id(&template);
              let mut wrong_fingerprint = protocol_fingerprint.to_string();
              let replacement = if wrong_fingerprint.starts_with('0') { "1" } else { "0" };
              wrong_fingerprint.replace_range(0..1, replacement);
              let substituted_template_id = original_template_id.replacen(
                  protocol_fingerprint,
                  &wrong_fingerprint,
                  1,
              );
              let identity_mismatch = submit_block(
                  &state,
                  substituted_template_id,
                  template_block(&template),
              )
              .await;
              assert_eq!(identity_mismatch["ok"], true);
              assert_eq!(identity_mismatch["data"]["accepted"], false);
              assert_eq!(
                  identity_mismatch["data"]["reason_code"],
                  "protocol_identity_mismatch"
              );
              assert_eq!(identity_mismatch["data"]["finality"], "rejected");

              let compact_target = data["compact_target"].as_u64().unwrap() as u32;'''
          )

          docs = "docs/MINING_PROTOCOL_V3.md"
          replace_once(
              docs,
              '''Status: launch-candidate external miner contract for issue #1037. This document freezes the wire identity implemented by the RPC facade; it does not authorize mainnet launch. Launch authority remains #781 / #794.''',
              '''Status: external miner contract candidate for issue #1037. This document freezes the structural v3 wire/domain format implemented by the RPC facade; concrete mainnet/testnet identity values remain governed by #1049 and are not frozen here. It does not authorize mainnet launch. Launch authority remains #781 / #794.'''
          )
          replace_once(
              docs,
              '''v3:<internal-template-id>
          ```

          The internal suffix is preserved byte-for-byte so the facade can recover the lower-layer durable template identity after reconnect/restart without a lossy lookup table.''',
              '''v3:<protocol-identity-fingerprint>:<internal-template-id>
          ```

          Newly issued legacy v3 work persists the exact protocol fingerprint in the durable lower-layer template record before it is returned to a miner; submit reloads that issued record instead of deriving identity from mutable tip/height state. Activated-v2 work reuses the fingerprint already embedded in its internal v2 template ID. A valid-looking substituted fingerprint therefore fails before reconciliation or lower-layer submission, while a correct issued fingerprint remains stable across chain advancement and reconnect/restart. Concrete Q4 mainnet/testnet identity values remain governed by #1049. The internal suffix is preserved byte-for-byte so the facade can recover the lower-layer durable template identity after reconnect/restart. The submit parser still accepts the earlier `v3:<internal-template-id>` development form for compatibility.'''
          )
          replace_once(
              docs,
              '''Because the external `template_id` embeds the lower-layer template ID after `v3:`, reconnect/restart does not require a transient map merely to recover template identity.''',
              '''Because the external `template_id` embeds the protocol fingerprint and then the lower-layer template ID after `v3:`, reconnect/restart does not require a transient map merely to recover template identity.'''
          )
          PY

          cargo fmt --all
          git diff --check
          cargo test --locked -p pulsedag-rpc task37_versioned_template_ids_round_trip_without_losing_internal_identity
          cargo test --locked -p pulsedag-rpc task37_protocol_identity_golden_vectors_are_frozen
          cargo test --locked -p pulsedag-rpc --test mining_protocol_v3_contract -- --test-threads=1
          cargo test --locked -p pulsedag-rpc activated_identity_rejects_legacy_submit_preflight
          cargo test --locked -p pulsedag-rpc activated_identity_builds_chain_bound_v2_rpc_template
          cargo clippy --locked -p pulsedag-rpc --all-targets -- -D warnings

          rm .github/workflows/harden-1064-mining-identity.yml
          rm .github/workflows/harden-1064-mining-identity-v2.yml
          rm .github/workflows/harden-1064-mining-identity-v3.yml

          python3 - <<'PY'
          import subprocess
          expected = {
              '.github/workflows/harden-1064-mining-identity.yml',
              '.github/workflows/harden-1064-mining-identity-v2.yml',
              '.github/workflows/harden-1064-mining-identity-v3.yml',
              'crates/pulsedag-rpc/src/handlers/mining_submit.rs',
              'crates/pulsedag-rpc/src/handlers/mining_submit_v3.rs',
              'crates/pulsedag-rpc/src/handlers/mining_template.rs',
              'crates/pulsedag-rpc/src/handlers/mining_template_v3.rs',
              'crates/pulsedag-rpc/src/handlers/mining_template_protocol.rs',
              'crates/pulsedag-rpc/tests/mining_protocol_v3_contract.rs',
              'docs/MINING_PROTOCOL_V3.md',
          }
          changed = set(subprocess.check_output(['git', 'diff', '--name-only'], text=True).splitlines())
          if changed != expected:
              raise SystemExit(f'unexpected working-tree delta: {sorted(changed)}')
          PY

          git config user.name "kalekói"
          git config user.email "hermida.prada@gmail.com"
          git add -A
          git commit -m "rpc: bind Mining Protocol v3 to durable issued identity"
          git push origin HEAD:codex/issue-1037-mining-protocol-v3
