# One-shot staging workflow; removed by the successful edit commit.
name: Task 27 same-height convergence editor

on:
  pull_request:
    branches:
      - main
    paths:
      - scripts/task27_same_height_edit.py
      - .github/workflows/task27-same-height-edit.yml

permissions:
  contents: write

jobs:
  apply:
    if: github.head_ref == 'agent/task27-same-height-work'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: agent/task27-same-height-work
          fetch-depth: 0

      - name: Apply exact Task 27 same-height convergence edit
        run: python3 scripts/task27_same_height_edit.py

      - name: Remove one-shot editor files
        run: |
          rm scripts/task27_same_height_edit.py
          rm .github/workflows/task27-same-height-edit.yml

      - name: Format and validate patch
        run: |
          cargo fmt --all
          git diff --check

      - name: Run focused Task 27 recovery tests
        run: |
          cargo test --locked -p pulsedag-p2p --test task27_recovery_progress
          cargo test --locked -p pulsedagd task27_rejoin_runtime_tests

      - name: Commit exact source edit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --exit-code && exit 1 || true
          git commit -m "node: reconcile Task 27 same-height divergence"
          git push origin HEAD:agent/task27-same-height-work
