name: Task30 materialize selected-segment continuation fix

on:
  pull_request:
    branches:
      - main
    paths:
      - .github/task30-control/apply_selected_segment_continuation_fix.py
      - .github/workflows/task30-apply-selected-segment-fix.yml

permissions:
  contents: write

env:
  FROZEN_CANDIDATE_SHA: 37f0dd6ca7aabe07341c226744f65d46bbb03d65
  FIX_BRANCH: agent/task30-selected-segment-continuation

jobs:
  materialize-fix:
    if: github.event.pull_request.head.ref == 'agent/task30-selected-segment-continuation'
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout exact PR head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0

      - name: Verify frozen source base and clean checkout
        run: |
          set -euo pipefail
          test "${{ github.event.pull_request.base.sha }}" = "$FROZEN_CANDIDATE_SHA"
          test -z "$(git status --porcelain)"
          git diff --exit-code "$FROZEN_CANDIDATE_SHA" -- apps/pulsedagd/src/main.rs
          test -f .github/task30-control/apply_selected_segment_continuation_fix.py
          test -f .github/workflows/task30-apply-selected-segment-fix.yml

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Apply fail-closed source fix
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          path = Path('.github/task30-control/apply_selected_segment_continuation_fix.py')
          text = path.read_text()
          old = '                                                Ok(()) => true,'
          new = '                                                Ok(_) => true,'
          if text.count(old) != 1:
              raise SystemExit(f'expected exactly one request_block_from return-type patch target, found {text.count(old)}')
          path.write_text(text.replace(old, new, 1))
          PY
          python3 .github/task30-control/apply_selected_segment_continuation_fix.py \
            apps/pulsedagd/src/main.rs
          git diff --check
          cargo fmt --all -- --check

      - name: Run selected-segment regression matrix
        run: |
          set -euo pipefail
          cargo test --locked -p pulsedagd \
            selected_segment_single_header_page_continues_after_global_64_request_cap \
            -- --nocapture
          cargo test --locked -p pulsedagd \
            selected_segment_chunks_are_strictly_sequential_for_64_plus_49 \
            -- --nocapture
          cargo test --locked -p pulsedagd selected_segment -- --nocapture

      - name: Check pulsedagd
        run: cargo check --locked -p pulsedagd

      - name: Remove temporary control plane and verify final tree scope
        run: |
          set -euo pipefail
          git rm -f \
            .github/task30-control/apply_selected_segment_continuation_fix.py \
            .github/workflows/task30-apply-selected-segment-fix.yml
          git add apps/pulsedagd/src/main.rs
          git diff --cached --check
          mapfile -t changed < <(git diff --cached --name-only "$FROZEN_CANDIDATE_SHA")
          printf 'final changed paths:\n'
          printf '  %s\n' "${changed[@]}"
          test "${#changed[@]}" -eq 1
          test "${changed[0]}" = "apps/pulsedagd/src/main.rs"

      - name: Commit validated product fix to defect branch
        env:
          HEAD_BRANCH: ${{ github.event.pull_request.head.ref }}
        run: |
          set -euo pipefail
          git config user.name "Task30 CI"
          git config user.email "task30-ci@users.noreply.github.com"
          git commit -m "fix(p2p): continue selected-segment block chunks"
          git push origin "HEAD:${HEAD_BRANCH}"
          printf 'materialized_commit=%s\n' "$(git rev-parse HEAD)"
