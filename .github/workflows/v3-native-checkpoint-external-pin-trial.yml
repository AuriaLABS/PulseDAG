name: v3 native checkpoint external pin boundary (NO GO)

on:
  pull_request:
    branches: [main]
    paths:
      - scripts/native_v3_checkpoint_external_anchor_trial.py
      - scripts/tests/test_native_v3_checkpoint_external_anchor_trial.py
      - docs/runbooks/V3_NATIVE_CHECKPOINT_EXTERNAL_PIN_TRIAL.md
      - .github/workflows/v3-native-checkpoint-external-pin-trial.yml
  push:
    branches: [main]
    paths:
      - scripts/native_v3_checkpoint_external_anchor_trial.py
      - scripts/tests/test_native_v3_checkpoint_external_anchor_trial.py
      - docs/runbooks/V3_NATIVE_CHECKPOINT_EXTERNAL_PIN_TRIAL.md
      - .github/workflows/v3-native-checkpoint-external-pin-trial.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  offline-anti-rollback-negative-tests:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout exact candidate without persisted credentials
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Match exact candidate SHA
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
      - name: Compile offline helper and run negative fixtures
        shell: bash
        run: |
          set -euo pipefail
          python3 -m py_compile \
            scripts/native_v3_checkpoint_external_anchor_trial.py \
            scripts/tests/test_native_v3_checkpoint_external_anchor_trial.py
          python3 -m unittest discover -v -s scripts/tests -p 'test_native_v3_checkpoint_external_anchor_trial.py'
      - name: Enforce explicit no-authority output and existing production denial
        shell: bash
        run: |
          set -euo pipefail
          grep -Fq '"checkpoint_launch_authorized": False' scripts/native_v3_checkpoint_external_anchor_trial.py
          grep -Fq '"independent_pin_provenance_authenticated": False' scripts/native_v3_checkpoint_external_anchor_trial.py
          grep -Fq '"monetary_runtime_enabled": False' scripts/native_v3_checkpoint_external_anchor_trial.py
          grep -Fq '"contracts_enabled": False' scripts/native_v3_checkpoint_external_anchor_trial.py
          grep -Fq '"monetary_v3").is_err()' apps/pulsedagd/src/startup_protocol.rs
          grep -Fq 'PULSEDAG_CONTRACTS_ENABLED=false' configs/public-testnet/node.env.template
