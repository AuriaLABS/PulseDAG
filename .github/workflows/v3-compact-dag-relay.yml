name: v3 compact DAG relay verification

on:
  pull_request:
    branches:
      - main
    paths:
      - '.github/workflows/v3-compact-dag-relay.yml'
      - 'crates/pulsedag-p2p/src/messages.rs'
      - 'crates/pulsedag-p2p/src/messages/compact_relay_v1.rs'
      - 'crates/pulsedag-p2p/src/lib.rs'
      - 'crates/pulsedag-p2p/Cargo.toml'
      - 'Cargo.toml'
      - 'Cargo.lock'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  compact-relay-contract:
    name: compact relay contract (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - windows-latest
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20

    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 1

      - name: Verify exact SHA and clean checkout
        shell: bash
        env:
          CANDIDATE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$CANDIDATE_SHA"
          test -z "$(git status --porcelain)"

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.91.0

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Validate locked dependency graph
        run: cargo metadata --locked --format-version 1

      - name: Compile P2P library and tests
        run: cargo test --locked -p pulsedag-p2p --no-run

      - name: Run bounded compact relay regressions
        run: cargo test --locked -p pulsedag-p2p compact_relay_v1::tests:: -- --nocapture
