name: tmp-1036-resource-v2

on:
  push:
    branches:
      - codex/1036-production-resource-expiry-freeze-v2

permissions:
  contents: write

jobs:
  stage:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt,clippy
      - name: Materialize and verify production resource policy
        shell: bash
        run: |
          set -euo pipefail
          git show 8db6ea946befd33ef680241d68ff1edfb2a715d6:.github/workflows/tmp-1036-resource-implement.yml > /tmp/source.yml
          python3 - <<'PY'
          from pathlib import Path

          source = Path('/tmp/source.yml').read_text()
          marker = "          python3 <<'PY'\n"
          start = source.index(marker) + len(marker)
          end = source.index("\n          PY\n", start)
          body = source[start:end]
          repaired = []
          for line in body.splitlines():
              repaired.append(line[10:] if line.startswith('          ') else line)
          script = '\n'.join(repaired) + '\n'

          # #1090 changed classified_rejection to take tx/chain/identity/result.
          # Drop only the obsolete replacement from the recovered materializer;
          # the live signature is patched explicitly after materialization.
          needle = "replace_once(\n    'crates/pulsedag-rpc/src/handlers/tx_protocol.rs',\n    '''fn classified_rejection(reason: String)"
          obsolete_start = script.index(needle)
          obsolete_end = script.index("\n\n# /policy exposes", obsolete_start)
          script = script[:obsolete_start] + script[obsolete_end:]
          Path('/tmp/apply_1036.py').write_text(script)

          # #1090's final tx_protocol import block is broader than the staging
          # anchor used by the original materializer. Split the two policy
          # helpers into the exact small block the guarded transformation
          # expects, without changing behavior.
          p = Path('crates/pulsedag-rpc/src/handlers/tx_protocol.rs')
          text = p.read_text()
          old = '''use pulsedag_core::{\n    accept_transaction_with_mempool_policy_v3,\n    accept_transaction_with_mempool_policy_v3_for_protocol, compute_submission_id_v2,\n    mempool_policy_rejection_code_from_reason_v3, mempool_policy_rejection_detail_v3,\n    tx_protocol::resolve_transaction_validation_path, AcceptSource, ChainState, MempoolPolicyV3,\n    ProtocolActivationIdentity, PulseError, TransactionValidationPath, TxAcceptanceResult,\n};'''
          new = '''use pulsedag_core::{\n    mempool_policy_rejection_code_from_reason_v3, mempool_policy_rejection_detail_v3,\n};\nuse pulsedag_core::{\n    accept_transaction_with_mempool_policy_v3,\n    accept_transaction_with_mempool_policy_v3_for_protocol, compute_submission_id_v2,\n    tx_protocol::resolve_transaction_validation_path, AcceptSource, ChainState, MempoolPolicyV3,\n    ProtocolActivationIdentity, PulseError, TransactionValidationPath, TxAcceptanceResult,\n};'''
          if text.count(old) != 1:
              raise SystemExit(f'tx_protocol import guard mismatch: {text.count(old)}')
          p.write_text(text.replace(old, new, 1))
          PY

          python3 /tmp/apply_1036.py

          python3 - <<'PY'
          from pathlib import Path
          p = Path('crates/pulsedag-rpc/src/handlers/tx_protocol.rs')
          text = p.read_text()
          old = '''    let reason = rejection_reason(result);\n    if let Some(code) = mempool_policy_rejection_code_from_reason_v3(&reason) {'''
          new = '''    let reason = rejection_reason(result);\n    if let Some(code) = mempool_resource_rejection_code_from_reason_v1(&reason) {\n        let detail = mempool_resource_rejection_detail_v1(&reason);\n        return ApiResponse::err(code, detail);\n    }\n    if let Some(code) = mempool_policy_rejection_code_from_reason_v3(&reason) {'''
          if text.count(old) != 1:
              raise SystemExit(f'classified_rejection guard mismatch: {text.count(old)}')
          p.write_text(text.replace(old, new, 1))
          PY

          rm -f .github/workflows/tmp-1036-resource-v2.yml

          cargo fmt --all
          cargo fmt --all -- --check
          cargo check --locked -p pulsedag-core -p pulsedag-storage -p pulsedag-rpc
          cargo test --locked -p pulsedag-core mempool_resource_v1 --lib
          cargo test --locked -p pulsedag-core mempool_admission_v3 --lib
          cargo test --locked -p pulsedag-storage --test mempool_expiry_persistence
          cargo test --locked -p pulsedag-rpc policy --lib
          git diff --check
          test ! -e .github/workflows/tmp-1036-resource-v2.yml
          test ! -e .github/workflows/tmp-1036-resource-audit.yml
          test ! -e .github/workflows/tmp-1036-resource-implement.yml

          git config user.name 'kalekoi'
          git config user.email 'hermida.prada@gmail.com'
          git add -A
          git commit -m 'core: freeze production mempool resource and expiry policy'
          git push origin HEAD:codex/1036-production-resource-expiry-freeze-v2
