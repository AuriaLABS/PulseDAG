name: Task 27 acceptance fixture fix

on:
  pull_request:
    branches:
      - main
    paths:
      - scripts/task27_acceptance_fixture_fix.py
      - .github/workflows/task27-acceptance-fixture-fix.yml

permissions:
  contents: write

jobs:
  apply:
    if: github.head_ref == 'agent/task27-acceptance-work'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout staging branch
        uses: actions/checkout@v4
        with:
          ref: agent/task27-acceptance-work
          fetch-depth: 0

      - name: Apply canonical final-state fixture fix
        run: python3 scripts/task27_acceptance_fixture_fix.py

      - name: Remove one-shot fixture editor
        run: |
          rm scripts/task27_acceptance_fixture_fix.py
          rm .github/workflows/task27-acceptance-fixture-fix.yml

      - name: Format and validate
        run: |
          cargo fmt --all
          git diff --check

      - name: Run focused convergence matrix
        run: cargo test --locked -p pulsedag-p2p --test task27_acceptance_matrix

      - name: Commit validated fixture
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --exit-code && exit 1 || true
          git commit -m "test: make Task 27 acceptance fixture canonical"
          git push origin HEAD:agent/task27-acceptance-work
