name: Task 38 Phase 11 rustfmt fix

on:
  push:
    branches:
      - codex/issue-1038-amd-opencl-wiring-phase11

permissions:
  contents: write

jobs:
  rustfmt-fix:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: codex/issue-1038-amd-opencl-wiring-phase11
          fetch-depth: 0

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.91.0
          components: rustfmt

      - name: Apply rustfmt
        run: cargo fmt --all

      - name: Commit formatting if needed
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet; then
            echo "rustfmt_changes=none"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- apps/pulsedag-miner/src/lib.rs apps/pulsedag-miner/src/protocol_backend.rs apps/pulsedag-miner/src/opencl_backend.rs
          git commit -m "style: apply rustfmt to Phase 11 wiring"
          git push origin HEAD:codex/issue-1038-amd-opencl-wiring-phase11
