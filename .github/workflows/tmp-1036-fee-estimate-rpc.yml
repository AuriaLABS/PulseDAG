name: temporary 1036 fee estimate RPC verify

on:
  push:
    branches:
      - codex/1036-fee-estimate-rpc

permissions:
  contents: write

jobs:
  verify:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/1036-fee-estimate-rpc
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.91.0
          components: rustfmt,clippy
      - name: Apply RPC wiring and format
        run: |
          python3 .github/scripts/tmp_1036_fee_estimate_rpc.py
          cargo fmt --all
          git diff --check
      - name: RPC tests
        run: |
          cargo test --locked -p pulsedag-rpc -- --nocapture
      - name: RPC clippy
        run: |
          cargo clippy --locked -p pulsedag-rpc --all-targets -- -D warnings
      - name: Publish clean candidate
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/scripts/tmp_1036_fee_estimate_rpc.py
          git rm .github/workflows/tmp-1036-fee-estimate-rpc.yml
          git add crates/pulsedag-rpc/src/handlers/tx_protocol.rs crates/pulsedag-rpc/src/routes.rs
          git commit -m 'rpc: expose deterministic v3 fee estimate'
          git push origin HEAD:codex/1036-fee-estimate-rpc
