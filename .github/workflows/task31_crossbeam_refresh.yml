name: Task31 crossbeam lock refresh

on:
  pull_request:
    branches: [main]
    paths:
      - .github/workflows/task31_crossbeam_refresh.yml
      - Cargo.lock

permissions:
  contents: write

concurrency:
  group: task31-crossbeam-lock-refresh-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  refresh:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'agent/task31-release-freeze'
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout candidate branch
        uses: actions/checkout@v4
        with:
          ref: agent/task31-release-freeze
          fetch-depth: 0

      - name: Refresh only crossbeam-epoch
        shell: bash
        run: |
          set -euo pipefail
          cargo update -p crossbeam-epoch --precise 0.9.20
          python - <<'PY'
          import subprocess
          diff = subprocess.check_output(['git','diff','--unified=0','--','Cargo.lock'], text=True)
          required = [
              '-version = "0.9.18"',
              '+version = "0.9.20"',
              '-checksum = "5b82ac4a3c2ca9c3460964f020e1402edd5753411d7737aa39c3714ad1b5420e"',
              '+checksum = "2d6914041f254d6e9176c01941b21115dcfb7089e55135a35411081bd106ef3f"',
          ]
          changed = [line for line in diff.splitlines() if line.startswith(('+','-')) and not line.startswith(('+++','---'))]
          if sorted(changed) != sorted(required):
              raise SystemExit('unexpected Cargo.lock drift:\n' + diff)
          print(diff)
          PY

      - name: Commit exact lock refresh
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- Cargo.lock; then
            echo 'Cargo.lock already current'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add Cargo.lock
          git commit -m 'security: patch crossbeam-epoch advisory [skip ci]'
          git push origin HEAD:agent/task31-release-freeze
