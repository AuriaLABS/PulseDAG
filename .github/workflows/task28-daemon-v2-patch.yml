name: task28-daemon-v2-patch

on:
  push:
    branches:
      - agent/task28-daemon-v2-block-selector
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  patch-main:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: agent/task28-daemon-v2-block-selector

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Apply bounded main.rs patch
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('apps/pulsedagd/src/main.rs')
          text = path.read_text()

          replacements = []
          replacements.append((
              "mod app_state;\nmod block_request;\nmod config;\n",
              "mod app_state;\nmod block_protocol;\nmod block_request;\nmod config;\n",
          ))
          replacements.append((
              "use block_request::{\n    BlockRequestTracker, DependencyAwareFetchScheduler, GetBlockRequestReadiness,\n    HeaderFetchCandidate,\n};\n",
              "use block_protocol::{\n    resolve_inbound_p2p_block_protocol, summarize_activated_v2_drive, InboundP2pBlockProtocol,\n};\nuse block_request::{\n    BlockRequestTracker, DependencyAwareFetchScheduler, GetBlockRequestReadiness,\n    HeaderFetchCandidate,\n};\n",
          ))
          replacements.append((
              "        tokio::spawn(async move {\n            let mut block_requests = BlockRequestTracker::with_limits(\n",
              "        tokio::spawn(async move {\n            let mut activated_v2_p2p_runtime =\n                pulsedag_core::ActivatedV2P2pRuntime::default();\n            let mut block_requests = BlockRequestTracker::with_limits(\n",
          ))

          selector = r'''                        let protocol_selection = match p2p.as_ref() {
                            Some(p2p_handle) => p2p_handle
                                .local_protocol_capabilities_v1()
                                .map_err(|error| {
                                    format!(
                                        "failed reading local protocol capabilities for inbound block: {error}"
                                    )
                                })
                                .and_then(|capabilities| {
                                    resolve_inbound_p2p_block_protocol(
                                        capabilities.as_ref(),
                                        &guard,
                                    )
                                }),
                            None => Ok(InboundP2pBlockProtocol::Legacy),
                        };
                        let inbound_protocol = match protocol_selection {
                            Ok(protocol) => protocol,
                            Err(error) => {
                                let reason = format!(
                                    "inbound block protocol selector failed closed for {}: {}",
                                    block.hash, error
                                );
                                warn!(
                                    block_hash = %block.hash,
                                    error = %error,
                                    "rejected inbound p2p block because protocol selection failed closed"
                                );
                                let _ = storage.append_runtime_event(
                                    "warn",
                                    "peer_block_protocol_rejected",
                                    &reason,
                                );
                                block_requests.resolve(&block.hash);
                                let mut rt = runtime.write().await;
                                rt.blockdata_received = rt.blockdata_received.saturating_add(1);
                                rt.rejected_p2p_blocks = rt.rejected_p2p_blocks.saturating_add(1);
                                rt.pulsedag_blocks_rejected_total =
                                    rt.pulsedag_blocks_rejected_total.saturating_add(1);
                                rt.record_rejected_block_reason("protocol_selector_fail_closed");
                                rt.last_rejected_peer_block_reason = Some(reason.clone());
                                rt.sync_state = "degraded".to_string();
                                rt.sync_failures = rt.sync_failures.saturating_add(1);
                                rt.sync_pipeline.fallback_after_failure(reason, now_unix());
                                continue;
                            }
                        };

                        if let InboundP2pBlockProtocol::ActivatedV2(identity) = inbound_protocol {
                            let drive = pulsedag_core::drive_activated_v2_p2p_block_atomically(
                                block.clone(),
                                &mut guard,
                                &mut activated_v2_p2p_runtime,
                                &identity,
                                |candidate, prepared| {
                                    storage.persist_block_and_chain_state(candidate, prepared)
                                },
                                |bundle, prepared| {
                                    storage.persist_blocks_and_chain_state(bundle, prepared)
                                },
                                |candidate| {
                                    if let Some(ref p2p_handle) = p2p {
                                        p2p_handle.broadcast_block(candidate)?;
                                    }
                                    Ok(())
                                },
                            );
                            let drive = match drive {
                                Ok(drive) => drive,
                                Err(error) => {
                                    let reason = format!(
                                        "activated-v2 inbound block {} failed: {}",
                                        block.hash, error
                                    );
                                    warn!(
                                        block_hash = %block.hash,
                                        error = %error,
                                        "failed activated-v2 inbound block runtime"
                                    );
                                    let _ = storage.append_runtime_event(
                                        "warn",
                                        "peer_block_v2_failed",
                                        &reason,
                                    );
                                    block_requests.resolve(&block.hash);
                                    let mut rt = runtime.write().await;
                                    rt.blockdata_received = rt.blockdata_received.saturating_add(1);
                                    rt.rejected_p2p_blocks =
                                        rt.rejected_p2p_blocks.saturating_add(1);
                                    rt.pulsedag_blocks_rejected_total =
                                        rt.pulsedag_blocks_rejected_total.saturating_add(1);
                                    rt.record_rejected_block_reason("activated_v2_runtime_error");
                                    rt.last_rejected_peer_block_reason = Some(reason.clone());
                                    rt.sync_state = "degraded".to_string();
                                    rt.sync_failures = rt.sync_failures.saturating_add(1);
                                    rt.sync_pipeline.fallback_after_failure(reason, now_unix());
                                    continue;
                                }
                            };
                            let summary = summarize_activated_v2_drive(&drive);
                            let accepted_count = summary.accepted_hashes.len() as u64;
                            let staged_count = summary.staged_hashes.len() as u64;
                            let duplicate_count = summary.duplicate_hashes.len() as u64;
                            let rejected_count = summary.rejected.len() as u64;

                            block_requests.resolve(&block.hash);
                            for hash in summary
                                .accepted_hashes
                                .iter()
                                .chain(summary.staged_hashes.iter())
                                .chain(summary.duplicate_hashes.iter())
                            {
                                block_requests.resolve(hash);
                            }

                            let mut missing_parent_requests_issued = 0u64;
                            for parent in &summary.missing_parents {
                                if !priority_active
                                    && block_requests.should_issue_getblock_for_peers(
                                        parent,
                                        now_unix(),
                                        active_peer_ids(&p2p),
                                    )
                                {
                                    let request_sent = if let Some(ref p2p_handle) = p2p {
                                        match p2p_handle.request_block(parent) {
                                            Ok(()) => true,
                                            Err(error) => {
                                                warn!(
                                                    error = %error,
                                                    missing_parent = %parent,
                                                    child = %block.hash,
                                                    "failed issuing activated-v2 missing-parent GetBlock request"
                                                );
                                                false
                                            }
                                        }
                                    } else {
                                        false
                                    };
                                    if request_sent {
                                        missing_parent_requests_issued =
                                            missing_parent_requests_issued.saturating_add(1);
                                    }
                                }
                            }

                            let legacy_pending_missing =
                                pulsedag_core::pending_missing_parent_count(&guard);
                            let v2_pending_missing = activated_v2_p2p_runtime.pending_len();
                            let v2_staged = activated_v2_p2p_runtime.staging().len();
                            {
                                let mut rt = runtime.write().await;
                                rt.blockdata_received = rt.blockdata_received.saturating_add(1);
                                rt.pending_block_requests = block_requests.pending.len();
                                rt.inflight_block_requests = block_requests.pending.len();
                                rt.pending_block_request_hashes = block_requests.pending_hashes();
                                rt.pending_missing_parents =
                                    legacy_pending_missing.saturating_add(v2_pending_missing);

                                if accepted_count > 0 {
                                    rt.accepted_p2p_blocks =
                                        rt.accepted_p2p_blocks.saturating_add(accepted_count);
                                    rt.blockdata_accepted =
                                        rt.blockdata_accepted.saturating_add(accepted_count);
                                    rt.pulsedag_blocks_accepted_total = rt
                                        .pulsedag_blocks_accepted_total
                                        .saturating_add(accepted_count);
                                    rt.last_accepted_peer_block = Some(block.hash.clone());
                                    rt.sync_pipeline
                                        .validate_and_apply_blocks(accepted_count, now_unix());
                                }
                                if staged_count > 0 {
                                    rt.sync_state = "catching_up".to_string();
                                }
                                if duplicate_count > 0 {
                                    rt.duplicate_p2p_blocks =
                                        rt.duplicate_p2p_blocks.saturating_add(duplicate_count);
                                    rt.blockdata_duplicate =
                                        rt.blockdata_duplicate.saturating_add(duplicate_count);
                                }
                                if rejected_count > 0 {
                                    rt.rejected_p2p_blocks =
                                        rt.rejected_p2p_blocks.saturating_add(rejected_count);
                                    rt.pulsedag_blocks_rejected_total = rt
                                        .pulsedag_blocks_rejected_total
                                        .saturating_add(rejected_count);
                                    for (_, result) in &summary.rejected {
                                        rt.record_rejected_block_reason(format!(
                                            "activated_v2:{result:?}"
                                        ));
                                    }
                                    rt.last_rejected_peer_block_reason = summary
                                        .rejected
                                        .last()
                                        .map(|(hash, result)| format!("{hash}: {result:?}"));
                                }
                                if !summary.missing_parents.is_empty() {
                                    rt.sync_state = "catching_up".to_string();
                                    rt.blockdata_missing_parent =
                                        rt.blockdata_missing_parent.saturating_add(1);
                                    rt.missing_parents_detected = rt
                                        .missing_parents_detected
                                        .saturating_add(summary.missing_parents.len() as u64);
                                    rt.pulsedag_sync_missing_parents_total = rt
                                        .pulsedag_sync_missing_parents_total
                                        .saturating_add(summary.missing_parents.len() as u64);
                                    rt.dag_sync_missing_parent_recovery_total = rt
                                        .dag_sync_missing_parent_recovery_total
                                        .saturating_add(summary.missing_parents.len() as u64);
                                    rt.missing_parent_requests_sent = rt
                                        .missing_parent_requests_sent
                                        .saturating_add(missing_parent_requests_issued);
                                    rt.missing_parent_request_started_total = rt
                                        .missing_parent_request_started_total
                                        .saturating_add(missing_parent_requests_issued);
                                    rt.getblock_sent =
                                        rt.getblock_sent.saturating_add(missing_parent_requests_issued);
                                }
                                if summary.authoritative_progress()
                                    && v2_pending_missing == 0
                                    && v2_staged == 0
                                    && guard.orphan_blocks.is_empty()
                                {
                                    rt.sync_state = "synced".to_string();
                                    rt.sync_pipeline.complete_cycle(now_unix());
                                }
                            }

                            if summary.authoritative_progress() {
                                let accepted_tip = pulsedag_core::preferred_tip_hash(&guard)
                                    .unwrap_or_else(|| guard.dag.genesis_hash.clone());
                                if let Some(ref p2p_handle) = p2p {
                                    let inventory = local_tip_inventory_status(&guard);
                                    if let Err(error) = p2p_handle.update_tip_inventory(inventory) {
                                        warn!(
                                            error = %error,
                                            block_hash = %block.hash,
                                            "failed refreshing activated-v2 accepted-block tip inventory"
                                        );
                                    }
                                    if let Err(error) = p2p_handle.announce_block_inventory(
                                        std::slice::from_ref(&accepted_tip),
                                    ) {
                                        warn!(
                                            error = %error,
                                            selected_tip = %accepted_tip,
                                            "failed announcing activated-v2 selected tip inventory"
                                        );
                                    }
                                }
                            }

                            info!(
                                event = "peer_block_v2_processed",
                                block_hash = %block.hash,
                                accepted = accepted_count,
                                staged = staged_count,
                                duplicates = duplicate_count,
                                rejected = rejected_count,
                                pending_v2 = v2_pending_missing,
                                staged_v2 = v2_staged,
                                missing_parents = ?summary.missing_parents,
                                "processed inbound p2p block through activated-v2 runtime"
                            );
                            let _ = storage.append_runtime_event(
                                "info",
                                "peer_block_v2_processed",
                                &format!(
                                    "hash={} accepted={} staged={} duplicates={} rejected={} pending_v2={} staged_v2={} missing_parents={:?}",
                                    block.hash,
                                    accepted_count,
                                    staged_count,
                                    duplicate_count,
                                    rejected_count,
                                    v2_pending_missing,
                                    v2_staged,
                                    summary.missing_parents,
                                ),
                            );
                            continue;
                        }

'''
          replacements.append((
              "                        let acceptance = match pulsedag_core::accept_block_atomically(\n",
              selector + "                        let acceptance = match pulsedag_core::accept_block_atomically(\n",
          ))

          for old, new in replacements:
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'expected exactly one patch anchor, found {count}: {old[:100]!r}')
              text = text.replace(old, new, 1)

          path.write_text(text)
          PY

      - name: Format patched sources
        run: cargo fmt --all

      - name: Verify patch whitespace
        run: git diff --check

      - name: Compile pulsedagd
        run: cargo check --locked -p pulsedagd

      - name: Commit validated patch
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- apps/pulsedagd/src/main.rs apps/pulsedagd/src/block_protocol.rs
          git diff --cached --quiet && exit 0
          git commit -m "daemon: wire activated-v2 inbound block runtime"
          git push origin HEAD:agent/task28-daemon-v2-block-selector
