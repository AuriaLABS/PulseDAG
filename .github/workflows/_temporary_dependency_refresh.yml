name: Temporary dependency refresh

on:
  pull_request:
    branches:
      - release/2.4.0
    paths:
      - .github/workflows/_temporary_dependency_refresh.yml

permissions:
  contents: write

concurrency:
  group: temporary-dependency-refresh-v6
  cancel-in-progress: true

jobs:
  refresh-validate-and-remove-self:
    if: github.repository == 'AuriaLABS/PulseDAG' && github.head_ref == 'security/2.4.0-dependency-remediation'
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout remediation branch
        uses: actions/checkout@v4
        with:
          ref: security/2.4.0-dependency-remediation
          fetch-depth: 0

      - name: Install pinned Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.88.0
          components: rustfmt,clippy

      - name: Apply surgical dependency updates
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          path = Path('crates/pulsedag-p2p/Cargo.toml')
          text = path.read_text()
          old = 'libp2p = { version = "0.54",'
          new = 'libp2p = { version = "0.56",'
          if old in text:
              path.write_text(text.replace(old, new, 1))
          elif new not in text:
              raise SystemExit('neither the expected old nor updated libp2p declaration exists')
          PY

          cargo update -p libp2p --precise 0.56.0

          update_if_present() {
            local package="$1"
            local old_version="$2"
            local new_version="$3"
            if awk -v package="$package" -v version="$old_version" '
              $0 == "name = \"" package "\"" { found_name=1; next }
              found_name && $0 == "version = \"" version "\"" { found=1; exit }
              found_name && /^\[\[package\]\]/ { found_name=0 }
              END { exit found ? 0 : 1 }
            ' Cargo.lock; then
              cargo update -p "${package}@${old_version}" --precise "${new_version}"
            else
              echo "dependency_refresh package=${package} old_version=${old_version} action=already_updated_or_absent"
            fi
          }

          update_if_present anyhow 1.0.102 1.0.104
          update_if_present crossbeam-epoch 0.9.18 0.9.20
          update_if_present event-listener 5.4.1 5.4.2

          cargo metadata --locked --format-version 1 >/dev/null
          cargo fmt --all -- --check
          cargo check --locked -p pulsedag-p2p --all-targets
          cargo test --locked -p pulsedag-p2p
          cargo clippy --locked -p pulsedag-p2p --all-targets -- -D warnings

      - name: Capture refreshed graph evidence
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p ci-evidence/dependency-refresh
          cargo tree --locked -p pulsedag-p2p >ci-evidence/dependency-refresh/pulsedag-p2p-tree.txt
          for package in hickory-proto lru crossbeam-epoch event-listener linkme anyhow; do
            cargo tree --locked --workspace --all-features --target all -i "${package}" \
              >"ci-evidence/dependency-refresh/${package}.txt" || true
          done
          {
            echo "source_sha=${GITHUB_SHA}"
            echo "rustc=$(rustc --version)"
            echo "cargo=$(cargo --version)"
            echo "cargo_lock_sha256=$(sha256sum Cargo.lock | awk '{print $1}')"
          } | tee ci-evidence/dependency-refresh/provenance.txt
          sha256sum ci-evidence/dependency-refresh/* >ci-evidence/dependency-refresh/SHA256SUMS

      - name: Remove temporary workflow and commit validated refresh
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/_temporary_dependency_refresh.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add crates/pulsedag-p2p/Cargo.toml Cargo.lock .github/workflows/_temporary_dependency_refresh.yml
          git diff --cached --check
          git commit -m 'security: update vulnerable dependency graph'
          git push origin HEAD:security/2.4.0-dependency-remediation

      - name: Upload refresh graph evidence
        uses: actions/upload-artifact@v4
        with:
          name: dependency_refresh_${{ github.run_id }}
          path: ci-evidence/dependency-refresh
          if-no-files-found: error
          retention-days: 30
