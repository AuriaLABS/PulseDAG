name: Validate #812 retained-history-gap handling

on:
  push:
    branches:
      - fix/fresh-node-orphan-recovery-812
    paths:
      - .github/workflows/fix-812-retained-history-gap.yml

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: fix/fresh-node-orphan-recovery-812
          fetch-depth: 0

      - name: Apply retained-history-gap patch
        run: |
          python3 scripts/apply-fix-812-retained-history-gap.py
          python3 scripts/fix-812-retained-history-gap-init.py

      - name: Format
        run: cargo fmt --all

      - name: Diff check
        run: git diff --check

      - name: Retained history gap regressions
        run: cargo test -p pulsedagd retained_history_gap -- --nocapture

      - name: Selected locator peer rotation regression
        run: cargo test -p pulsedagd tip_inventory_priority_selects_peer_before_generic_tip_fetch -- --nocapture

      - name: Selected segment priority regressions
        run: cargo test -p pulsedagd selected_segment_priority -- --nocapture

      - name: Pending selected locator rearm regression
        run: cargo test -p pulsedagd selected_segment_stale_pending_locator_rearms_without_session -- --nocapture

      - name: Existing selected segment regressions
        run: cargo test -p pulsedagd selected_segment -- --nocapture

      - name: Header request locator regressions
        run: cargo test -p pulsedagd headers_for_request_ -- --nocapture

      - name: Startup selected metadata regressions
        run: cargo test -p pulsedagd startup_selected_chain_metadata_repair_ -- --nocapture

      - name: Clippy
        run: cargo clippy -p pulsedagd --all-targets --all-features -- -D warnings

      - name: Check
        run: cargo check -p pulsedagd

      - name: Commit validated source and remove temporary validation files
        shell: bash
        run: |
          set -euo pipefail
          rm -f scripts/apply-fix-812-retained-history-gap.py
          rm -f scripts/fix-812-retained-history-gap-init.py
          rm -f .github/workflows/fix-812-retained-history-gap.yml
          git add -A
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "fix(sync): fail fast on pruned retained-history gaps"
          git pull --rebase origin fix/fresh-node-orphan-recovery-812
          git push origin HEAD:fix/fresh-node-orphan-recovery-812
