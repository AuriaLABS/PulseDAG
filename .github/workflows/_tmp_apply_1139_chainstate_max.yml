name: tmp-apply-1139-chainstate-max

on:
  workflow_dispatch:
  push:
    branches: [storage/1139-enforce-chainstate-max]
    paths:
      - scripts/_tmp_1139_chainstate_max.patch
      - .github/workflows/_tmp_apply_1139_chainstate_max.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/storage/1139-enforce-chainstate-max'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: storage/1139-enforce-chainstate-max
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Apply patch and drop one-shot files
        run: |
          set -euo pipefail
          git apply --verbose scripts/_tmp_1139_chainstate_max.patch
          rm -f scripts/_tmp_1139_chainstate_max.patch .github/workflows/_tmp_apply_1139_chainstate_max.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add crates/pulsedag-storage/src/lib.rs
          git add -u scripts/_tmp_1139_chainstate_max.patch .github/workflows/_tmp_apply_1139_chainstate_max.yml || true
          git commit -m "storage: enforce ChainState and admission-height MAX_* (#1139)"
          git push origin storage/1139-enforce-chainstate-max
