name: temporary multi-parent fixture repair

on:
  pull_request:
    paths:
      - '.github/workflows/tmp-fix-multiparent-fixture.yml'

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Checkout PR head branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 2

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt

      - name: Apply selected-parent-context fixture repair
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          path = Path('crates/pulsedag-core/src/validation.rs')
          text = path.read_text()
          old = '''        refresh_block_consensus_ids_with_state(&mut block, &state).unwrap();

                  assert!(validate_block(&block, &state).is_ok());'''
          new = '''        let parent_context = parent_state_context(&block, &state).unwrap();
                  block.header.difficulty = crate::expected_difficulty(&parent_context);
                  refresh_block_consensus_ids_with_state(&mut block, &parent_context).unwrap();

                  validate_block(&block, &state)
                      .expect("valid multi-parent fixture should use the selected parent context");'''
          count = text.count(old)
          if count != 1:
              raise SystemExit(f'expected one fixture match, found {count}')
          path.write_text(text.replace(old, new, 1))
          PY
          cargo fmt --all
          cargo fmt --all -- --check
          git diff --check

      - name: Run exact multi-parent validation test
        run: |
          set -euo pipefail
          cargo test -p pulsedag-core --locked --lib \
            validation::tests::validate_block_accepts_valid_multi_parent_block -- \
            --exact --nocapture --test-threads=1

      - name: Run complete core package tests
        run: |
          set -euo pipefail
          cargo test -p pulsedag-core --locked -- --nocapture --test-threads=1

      - name: Publish clean fixture commit
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/tmp-fix-multiparent-fixture.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add crates/pulsedag-core/src/validation.rs .github/workflows/tmp-fix-multiparent-fixture.yml
          git diff --cached --check
          git commit -m 'test(core): derive multi-parent fixture from selected context'
          git push origin HEAD:release/2.4.0
