name: temporary multi-parent fixture repair

on:
  push:
    branches:
      - release/2.4.0
    paths:
      - '.github/workflows/tmp-fix-multiparent-fixture.yml'

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Checkout release branch
        uses: actions/checkout@v4
        with:
          ref: release/2.4.0
          fetch-depth: 2

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt

      - name: Apply selected-parent-context fixture repair
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          path = Path('crates/pulsedag-core/src/validation.rs')
          text = path.read_text()
          old = '''    #[test]
              fn validate_block_accepts_valid_multi_parent_block() {
                  let mut state = init_chain_state("test".to_string());
                  let parent = structurally_valid_block(&state);
                  apply_block(&parent, &mut state).unwrap();
          
                  let parents = vec![state.dag.genesis_hash.clone(), parent.hash.clone()];
                  let mut block = build_candidate_block(parents, 2, 1, vec![coinbase(2)]);
                  block.header.timestamp = parent.header.timestamp + 1;
                  refresh_block_consensus_ids_with_state(&mut block, &state).unwrap();
          
                  assert!(validate_block(&block, &state).is_ok());
              }
          '''
          new = '''    #[test]
              fn validate_block_accepts_valid_multi_parent_block() {
                  let mut state = init_chain_state("test".to_string());
                  let parent = structurally_valid_block(&state);
                  apply_block(&parent, &mut state).unwrap();
          
                  let parents = vec![state.dag.genesis_hash.clone(), parent.hash.clone()];
                  let mut block = build_candidate_block(parents, 2, 1, vec![coinbase(2)]);
                  block.header.timestamp = parent.header.timestamp + 1;
                  let parent_context = parent_state_context(&block, &state).unwrap();
                  block.header.difficulty = crate::expected_difficulty(&parent_context);
                  refresh_block_consensus_ids_with_state(&mut block, &parent_context).unwrap();
          
                  validate_block(&block, &state)
                      .expect("valid multi-parent fixture should use the selected parent context");
              }
          '''
          count = text.count(old)
          if count != 1:
              raise SystemExit(f'expected one fixture match, found {count}')
          path.write_text(text.replace(old, new, 1))
          PY
          cargo fmt --all
          cargo fmt --all -- --check
          git diff --check

      - name: Run exact multi-parent validation test
        run: |
          set -euo pipefail
          cargo test -p pulsedag-core --locked --lib \
            validation::tests::validate_block_accepts_valid_multi_parent_block -- \
            --exact --nocapture --test-threads=1

      - name: Run complete core package tests
        run: |
          set -euo pipefail
          cargo test -p pulsedag-core --locked -- --nocapture --test-threads=1

      - name: Publish clean fixture commit
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/tmp-fix-multiparent-fixture.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add crates/pulsedag-core/src/validation.rs .github/workflows/tmp-fix-multiparent-fixture.yml
          git diff --cached --check
          git commit -m 'test(core): derive multi-parent fixture from selected context'
          git push origin HEAD:release/2.4.0
