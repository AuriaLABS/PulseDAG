name: temporary core fixture repair

on:
  pull_request:
    paths:
      - '.github/workflows/tmp-fix-multiparent-fixture.yml'

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Checkout PR head branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 2

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt

      - name: Apply core fixture repairs
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          validation = Path('crates/pulsedag-core/src/validation.rs')
          text = validation.read_text()
          old = '''        refresh_block_consensus_ids_with_state(&mut block, &state).unwrap();

                  assert!(validate_block(&block, &state).is_ok());'''
          new = '''        let parent_context = parent_state_context(&block, &state).unwrap();
                  block.header.difficulty = crate::expected_difficulty(&parent_context);
                  refresh_block_consensus_ids_with_state(&mut block, &parent_context).unwrap();

                  validate_block(&block, &state)
                      .expect("valid multi-parent fixture should use the selected parent context");'''
          count = text.count(old)
          if count != 1:
              raise SystemExit(f'expected one multi-parent fixture match, found {count}')
          validation.write_text(text.replace(old, new, 1))

          replay = Path('crates/pulsedag-core/tests/replay_order_independence.rs')
          text = replay.read_text()
          old_import = '''    build_candidate_block, build_coinbase_transaction, merge_set_digest, missing_block_parents,
              ordered_dag_digest, preferred_tip_hash, queue_orphan_block, rebuild_state_from_blocks,
              rebuild_state_from_snapshot_and_blocks, refresh_block_consensus_ids_with_state,
              selection_digest, state_digest, AcceptSource, Block, BlockAcceptanceResult, ChainState, Hash,
              OutPoint, Utxo,
          };'''
          new_import = '''    build_candidate_block, build_coinbase_transaction, dev_mine_header, expected_difficulty,
              merge_set_digest, missing_block_parents, ordered_dag_digest, preferred_tip_hash,
              queue_orphan_block, rebuild_state_from_blocks, rebuild_state_from_snapshot_and_blocks,
              refresh_block_consensus_ids, refresh_block_consensus_ids_with_state, selection_digest,
              state_digest, AcceptSource, Block, BlockAcceptanceResult, ChainState, Hash, OutPoint, Utxo,
          };'''
          count = text.count(old_import)
          if count != 1:
              raise SystemExit(f'expected one replay import match, found {count}')
          text = text.replace(old_import, new_import, 1)

          old_helper = '''    let mut block = build_candidate_block(parents, height, 1, txs);
              block.header.timestamp = timestamp;
              block.header.nonce = nonce;
              block.header.blue_score = height;
              refresh_block_consensus_ids_with_state(&mut block, state).unwrap();
              block
          }'''
          new_helper = '''    let difficulty = expected_difficulty(state);
              let mut block = build_candidate_block(parents, height, difficulty, txs);
              block.header.timestamp = timestamp;
              block.header.nonce = nonce;
              block.header.blue_score = height;
              refresh_block_consensus_ids_with_state(&mut block, state).unwrap();
              let (header, mined, _, _) = dev_mine_header(block.header.clone(), 1_000_000);
              assert!(
                  mined,
                  "expected replay-order fixture to satisfy consensus PoW"
              );
              block.header = header;
              refresh_block_consensus_ids(&mut block);
              block
          }'''
          count = text.count(old_helper)
          if count != 1:
              raise SystemExit(f'expected one replay helper match, found {count}')
          replay.write_text(text.replace(old_helper, new_helper, 1))
          PY
          cargo fmt --all
          cargo fmt --all -- --check
          git diff --check

      - name: Run exact multi-parent validation test
        run: |
          set -euo pipefail
          cargo test -p pulsedag-core --locked --lib \
            validation::tests::validate_block_accepts_valid_multi_parent_block -- \
            --exact --nocapture --test-threads=1

      - name: Run replay-order integration suite
        run: |
          set -euo pipefail
          cargo test -p pulsedag-core --locked --test replay_order_independence -- \
            --nocapture --test-threads=1

      - name: Run complete core package tests
        run: |
          set -euo pipefail
          cargo test -p pulsedag-core --locked -- --nocapture --test-threads=1

      - name: Publish clean fixture commit
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/tmp-fix-multiparent-fixture.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add \
            crates/pulsedag-core/src/validation.rs \
            crates/pulsedag-core/tests/replay_order_independence.rs \
            .github/workflows/tmp-fix-multiparent-fixture.yml
          git diff --cached --check
          git commit -m 'test(core): derive replay fixtures from consensus context'
          git push origin HEAD:release/2.4.0
