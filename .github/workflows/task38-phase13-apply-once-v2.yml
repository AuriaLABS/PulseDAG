name: apply Task 38 OpenCL multi-device phase 13 once v2

on:
  push:
    branches:
      - codex/issue-1038-opencl-multidevice-phase13
    paths:
      - ".github/workflows/task38-phase13-apply-once-v2.yml"

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/issue-1038-opencl-multidevice-phase13
          fetch-depth: 0

      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.91.0
          components: rustfmt,clippy

      - uses: Swatinem/rust-cache@v2

      - name: Apply Phase 13 functional patch from reviewed helper
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import textwrap

          helper = Path(".github/workflows/task38-phase13-apply-once.yml").read_text()
          start_marker = "          python3 - <<'PY'\n"
          end_marker = "\n          PY\n"
          start = helper.index(start_marker) + len(start_marker)
          end = helper.index(end_marker, start)
          script = textwrap.dedent(helper[start:end])
          script = script.replace('.replace("          ", "")', '')
          exec(compile(script, "phase13-functional-patch.py", "exec"), {})
          PY

      - name: Format functional tree
        run: cargo fmt --all

      - name: Test OpenCL multi-device contracts
        run: |
          cargo test --locked -p pulsedag-miner --features gpu --lib opencl_backend::tests
          cargo test --locked -p pulsedag-miner --features gpu --lib gpu_device_list_tests
          cargo test --locked -p pulsedag-miner --features gpu --test opencl_driver_launch_contract

      - name: Strict Clippy
        run: cargo clippy --locked -p pulsedag-miner --features gpu --all-targets -- -D warnings

      - name: Commit functional Phase 13 tree
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "pulsedag-phase13-bot"
          git config user.email "actions@users.noreply.github.com"
          git rm .github/workflows/task38-phase13-apply-once.yml .github/workflows/task38-phase13-apply-once-v2.yml
          git add apps/pulsedag-miner/src/lib.rs apps/pulsedag-miner/src/opencl_backend.rs
          git commit -m "miner: add OpenCL multi-device software scheduling for #1038"
          git push origin "HEAD:${GITHUB_REF_NAME}"
