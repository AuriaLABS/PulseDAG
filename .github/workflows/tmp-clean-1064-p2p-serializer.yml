name: Clean unrelated P2P serializer delta from 1064

on:
  push:
    branches:
      - codex/issue-1037-mining-protocol-v3
    paths:
      - .github/workflows/tmp-clean-1064-p2p-serializer.yml

permissions:
  contents: write

jobs:
  clean:
    runs-on: ubuntu-latest
    steps:
      - name: Check out mining branch
        uses: actions/checkout@v4
        with:
          ref: codex/issue-1037-mining-protocol-v3
          fetch-depth: 0
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
      - name: Restore P2P message serializer from current main
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          git checkout origin/main -- crates/pulsedag-p2p/src/messages.rs
          test -z "$(git diff --name-only origin/main -- crates/pulsedag-p2p/src/messages.rs)"
          git diff --check
          cargo fmt --all -- --check
          cargo test -p pulsedag-p2p messages::tests --lib
      - name: Publish scoped cleanup and self-clean
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/tmp-clean-1064-p2p-serializer.yml
          git add crates/pulsedag-p2p/src/messages.rs
          git diff --cached --check
          git diff --cached --name-only | sort > /tmp/changed.txt
          printf '%s\n' '.github/workflows/tmp-clean-1064-p2p-serializer.yml' 'crates/pulsedag-p2p/src/messages.rs' | sort > /tmp/expected.txt
          diff -u /tmp/expected.txt /tmp/changed.txt
          git commit -m 'p2p: drop unrelated inventory serializer truncation'
          git push origin HEAD:codex/issue-1037-mining-protocol-v3
