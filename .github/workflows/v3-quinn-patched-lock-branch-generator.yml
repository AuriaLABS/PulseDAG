name: v3 Quinn patched Cargo.lock resolver (ONE SHOT / DEVELOPMENT BRANCH ONLY)

on:
  push:
    branches:
      - fix/security-quinn-lock-20261113
    paths:
      - .github/workflows/v3-quinn-patched-lock-branch-generator.yml

permissions:
  contents: write

jobs:
  generate-checked-lock:
    if: github.ref == 'refs/heads/fix/security-quinn-lock-20261113' && github.event_name == 'push'
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - name: Check out exact development branch; never main
        uses: actions/checkout@v4
        with:
          ref: fix/security-quinn-lock-20261113
          persist-credentials: true
      - name: Verify strict scope and exact triggering revision
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = 'refs/heads/fix/security-quinn-lock-20261113'
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test -z "$(git status --porcelain)"
      - name: Install pinned Rust 1.91
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: '1.91.0'
      - name: Resolve ONLY patched Quinn crates using Cargo
        shell: bash
        run: |
          set -euo pipefail
          cargo update -p quinn-proto --precise 0.11.19
          cargo update -p quinn-udp --precise 0.5.16
          cargo metadata --locked --format-version 1 --no-deps >/dev/null
          python3 - <<'PY'
          import json
          import os
          import subprocess
          import tomllib
          from pathlib import Path

          original = tomllib.loads(subprocess.check_output(
              ['git', 'show', f'{os.environ["GITHUB_SHA"]}:Cargo.lock'], text=True
          ))
          candidate = tomllib.loads(Path('Cargo.lock').read_text(encoding='utf-8'))
          def packages(doc):
              return {(p['name'], p['version']): p for p in doc['package']}
          old = packages(original)
          new = packages(candidate)
          removed = set(old) - set(new)
          added = set(new) - set(old)
          if removed != {('quinn-proto', '0.11.16'),
                         ('quinn-udp', '0.5.14'),
                         ('windows-sys', '0.59.0')}:
              raise SystemExit(f'unreviewed removed Cargo packages: {sorted(removed)}')
          if added != {('quinn-proto', '0.11.19'),
                       ('quinn-udp', '0.5.16')}:
              raise SystemExit(f'unreviewed added Cargo packages: {sorted(added)}')
          for name, version in sorted(added):
              p = new[(name, version)]
              if p.get('source') != 'registry+https://github.com/rust-lang/crates.io-index':
                  raise SystemExit(f'{name} source not crates.io')
              if len(p.get('checksum', '')) != 64:
                  raise SystemExit(f'{name} missing Cargo-generated checksum')
          # Cargo removed orphan windows-sys@0.59.0; nu-ansi-term@0.50.3
          # now resolves the existing windows-sys@0.61.2. Verify the EXACT
          # revised edge and that its published crate checksum did not change.
          dep_key = ('nu-ansi-term', '0.50.3')
          old_dep = old[dep_key]
          new_dep = new[dep_key]
          old_without_deps = {k: v for k, v in old_dep.items() if k != 'dependencies'}
          new_without_deps = {k: v for k, v in new_dep.items() if k != 'dependencies'}
          if old_without_deps != new_without_deps:
              raise SystemExit('nu-ansi-term package source/checksum drift')
          if old_dep.get('dependencies') != ['windows-sys 0.59.0']:
              raise SystemExit('old nu-ansi-term windows edge differs from reviewed baseline')
          if new_dep.get('dependencies') != ['windows-sys 0.61.2']:
              raise SystemExit('new nu-ansi-term windows edge differs from reviewed Cargo result')
          for key in sorted(set(old) & set(new)):
              if key != dep_key and old[key] != new[key]:
                  raise SystemExit(f'unreviewed same-version Cargo package drift: {key}')
          print('CARGO_REVIEWED_TRANSITIVE_DELTA windows-sys 0.59.0 removed; '
                'nu-ansi-term 0.50.3 windows edge 0.59.0 -> 0.61.2')
          desired = {'quinn-proto': ('0.11.16', '0.11.19'),
                     'quinn-udp': ('0.5.14', '0.5.16')}
          if original.get('version') != candidate.get('version'):
              raise SystemExit('Cargo.lock format changed')
          print(json.dumps({name: {'from': before, 'to': after}
                            for name, (before, after) in desired.items()}, sort_keys=True))
          PY
      - name: Validate compiled P2P, node, miner, wallet and independent PoW
        shell: bash
        run: |
          set -euo pipefail
          cargo check --locked --release -p pulsedag-p2p -p pulsedagd -p pulsedag-miner -p pulsedag-wallet
          cargo test --locked -p pulsedag-core --test native_v3_kaspa_free_pow_oracle_trial
          cargo test --locked --manifest-path tools/pow-upstream-reference/Cargo.toml --test native_pow_backend_migration
      - name: Commit only Cargo-generated lock to this temporary development branch
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "$GITHUB_REF" = 'refs/heads/fix/security-quinn-lock-20261113'
          git add Cargo.lock
          test "$(git diff --cached --name-only)" = 'Cargo.lock'
          test -z "$(git diff --name-only)"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore(security): Cargo-resolve quinn-proto 0.11.19 and quinn-udp 0.5.16"
          git push origin HEAD:refs/heads/fix/security-quinn-lock-20261113
