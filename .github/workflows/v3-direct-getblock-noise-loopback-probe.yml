name: v3 real two-node Noise GetBlock roundtrip (ephemeral CI, no GO)

on:
  pull_request:
    paths:
      - crates/pulsedag-p2p/tests/direct_getblock_noise_roundtrip_v1.rs
      - .github/workflows/v3-direct-getblock-noise-loopback-probe.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ephemeral-noise-accepted-dag-roundtrip:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Checkout exact candidate without persisted credentials
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Validate exact HEAD and runtime fail-closed contracts
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
          grep -Fq 'ProtocolSupport::Inbound' crates/pulsedag-p2p/tests/direct_getblock_noise_roundtrip_v1.rs
          grep -Fq 'ProtocolSupport::Outbound' crates/pulsedag-p2p/src/lib.rs
          if grep -Fq 'ProtocolSupport::Full' crates/pulsedag-p2p/src/lib.rs; then
            echo "::error::unexpected production inbound GetBlock enablement"
            exit 1
          fi
          if grep -Fq '.direct_getblock.send_request(' crates/pulsedag-p2p/src/lib.rs; then
            echo "::error::unexpected production direct GetBlock sends"
            exit 1
          fi
          grep -Fq 'PULSEDAG_P2P_ENABLED=false' configs/public-testnet/node.env.template
          grep -Fq 'PULSEDAG_CONTRACTS_ENABLED=false' configs/public-testnet/node.env.template
      - name: Install pinned Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: '1.91.0'
      - name: Build and run real Noise/TCP ephemeral two-node substream
        run: |
          set -euo pipefail
          cargo test --locked -p pulsedag-p2p --test direct_getblock_noise_roundtrip_v1 -- --nocapture
          cargo fmt --all -- --check
          git diff --exit-code -- Cargo.lock
