name: Task 28 daemon one-shot wiring

on:
  push:
    branches:
      - agent/task28-daemon-v2-runtime

permissions:
  contents: write

concurrency:
  group: task28-daemon-wire-once
  cancel-in-progress: false

jobs:
  wire:
    if: github.event.head_commit.message == 'chore: retry exact Task 28 daemon wiring'
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: agent/task28-daemon-v2-runtime
          fetch-depth: 0

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt

      - name: Apply exact daemon wiring patch
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          path = Path('apps/pulsedagd/src/main.rs')
          text = path.read_text()

          def replace_once(old, new, label):
              global text
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{label}: expected exactly one match, found {count}")
              text = text.replace(old, new, 1)

          replace_once(
              "mod app_state;\nmod block_protocol;\nmod block_request;\nmod config;\n",
              "mod activated_v2_runtime;\nmod app_state;\nmod block_protocol;\nmod block_request;\nmod config;\n",
              "module declaration",
          )
          replace_once(
              "use anyhow::{Context, Result};\nuse app_state::{\n",
              "use activated_v2_runtime::restore_activated_v2_p2p_runtime_for_startup;\nuse anyhow::{Context, Result};\nuse app_state::{\n",
              "startup restore import",
          )
          replace_once(
              "    let startup_consistency_issue_count = pulsedag_core::dag_consistency_issues(&chain_state).len();\n",
              "    let mut startup_consistency_issue_count =\n        pulsedag_core::dag_consistency_issues(&chain_state).len();\n",
              "mutable startup consistency count",
          )

          startup_marker = "\n".join([
              "    } else {",
              "        info!(\"p2p disabled\");",
              "        (None, None)",
              "    };",
              "",
              "    let startup_report = derive_startup_path_report(",
          ]) + "\n"
          startup_replacement = "\n".join([
              "    } else {",
              "        info!(\"p2p disabled\");",
              "        (None, None)",
              "    };",
              "",
              "    let startup_local_protocol_capabilities = match p2p.as_ref() {",
              "        Some(p2p_handle) => p2p_handle",
              "            .local_protocol_capabilities_v1()",
              "            .map_err(|error| {",
              "                anyhow::anyhow!(",
              "                    \"failed reading local protocol capabilities for activated-v2 runtime restore: {error}\"",
              "                )",
              "            })?,",
              "        None => None,",
              "    };",
              "    let (",
              "        restored_chain_state,",
              "        startup_activated_v2_p2p_runtime,",
              "        startup_activated_v2_identity,",
              "    ) = restore_activated_v2_p2p_runtime_for_startup(",
              "        &storage,",
              "        startup_local_protocol_capabilities.as_ref(),",
              "        chain_state,",
              "    )?;",
              "    chain_state = restored_chain_state;",
              "    startup_consistency_issue_count = pulsedag_core::dag_consistency_issues(&chain_state).len();",
              "",
              "    if let Some(identity) = startup_activated_v2_identity.as_ref() {",
              "        let reconcile_result = reconcile_mempool(&mut chain_state);",
              "        if !reconcile_result.removed_txids.is_empty() {",
              "            warn!(",
              "                removed_mempool_tx = reconcile_result.removed_txids.len(),",
              "                \"removed invalid mempool transactions after activated-v2 runtime restore\"",
              "            );",
              "        }",
              "        if cfg.persist_snapshot_on_start {",
              "            storage.persist_activated_v2_p2p_runtime_snapshot(",
              "                identity,",
              "                &chain_state,",
              "                &startup_activated_v2_p2p_runtime,",
              "            )?;",
              "        }",
              "        info!(",
              "            protocol_fingerprint = %identity",
              "                .fingerprint()",
              "                .unwrap_or_else(|_| \"invalid-identity\".to_string()),",
              "            pending_v2 = startup_activated_v2_p2p_runtime.pending_len(),",
              "            staged_v2 = startup_activated_v2_p2p_runtime.staging().len(),",
              "            \"restored activated-v2 P2P runtime\"",
              "        );",
              "    }",
              "",
              "    let startup_report = derive_startup_path_report(",
          ]) + "\n"
          replace_once(startup_marker, startup_replacement, "startup capability-gated restore")

          replace_once(
              "        tokio::spawn(async move {\n            let mut activated_v2_p2p_runtime = pulsedag_core::ActivatedV2P2pRuntime::default();\n",
              "        tokio::spawn(async move {\n            let mut activated_v2_p2p_runtime = startup_activated_v2_p2p_runtime;\n",
              "restored runtime handoff",
          )

          driver_pattern = re.compile(
              r"(?ms)^ {24}if let InboundP2pBlockProtocol::ActivatedV2\(identity\) = inbound_protocol \{\n"
              r" {28}let drive = pulsedag_core::drive_activated_v2_p2p_block_atomically\(\n"
              r".*?"
              r"^ {28}\);\n"
              r"(?= {28}let drive = match drive \{)"
          )
          driver_replacement = "\n".join([
              "                        if let InboundP2pBlockProtocol::ActivatedV2(identity) = inbound_protocol {",
              "                            let drive =",
              "                                pulsedag_core::drive_activated_v2_p2p_block_with_runtime_persistence(",
              "                                    block.clone(),",
              "                                    &mut guard,",
              "                                    &mut activated_v2_p2p_runtime,",
              "                                    &identity,",
              "                                    pulsedag_core::ActivatedV2P2pRuntimePersistence::new(",
              "                                        |state: &pulsedag_core::ChainState,",
              "                                         durable_runtime: &pulsedag_core::ActivatedV2P2pRuntime| {",
              "                                            storage.persist_activated_v2_p2p_runtime_snapshot(",
              "                                                &identity,",
              "                                                state,",
              "                                                durable_runtime,",
              "                                            )",
              "                                        },",
              "                                        |candidate: &pulsedag_core::Block,",
              "                                         prepared: &pulsedag_core::ChainState,",
              "                                         durable_runtime: &pulsedag_core::ActivatedV2P2pRuntime| {",
              "                                            storage.persist_activated_v2_p2p_block_and_runtime(",
              "                                                candidate,",
              "                                                &identity,",
              "                                                prepared,",
              "                                                durable_runtime,",
              "                                            )",
              "                                        },",
              "                                        |bundle: &[pulsedag_core::Block],",
              "                                         prepared: &pulsedag_core::ChainState,",
              "                                         durable_runtime: &pulsedag_core::ActivatedV2P2pRuntime| {",
              "                                            storage.persist_activated_v2_p2p_blocks_and_runtime(",
              "                                                bundle,",
              "                                                &identity,",
              "                                                prepared,",
              "                                                durable_runtime,",
              "                                            )",
              "                                        },",
              "                                    ),",
              "                                    |candidate| {",
              "                                        if let Some(ref p2p_handle) = p2p {",
              "                                            p2p_handle.broadcast_block(candidate)?;",
              "                                        }",
              "                                        Ok(())",
              "                                    },",
              "                                );",
          ]) + "\n"
          text, driver_count = driver_pattern.subn(driver_replacement, text, count=1)
          if driver_count != 1:
              raise SystemExit(f"durable activated-v2 inbound driver: expected exactly one match, found {driver_count}")

          path.write_text(text)
          PY

          cargo fmt --all
          git diff --check

          grep -q '^mod activated_v2_runtime;$' apps/pulsedagd/src/main.rs
          grep -q 'restore_activated_v2_p2p_runtime_for_startup' apps/pulsedagd/src/main.rs
          grep -q 'drive_activated_v2_p2p_block_with_runtime_persistence' apps/pulsedagd/src/main.rs
          if grep -q 'drive_activated_v2_p2p_block_atomically' apps/pulsedagd/src/main.rs; then
            echo 'legacy in-memory activated-v2 driver still present in daemon main.rs' >&2
            exit 1
          fi

      - name: Compile daemon and focused Task 28 tests
        shell: bash
        run: |
          cargo check --locked -p pulsedagd
          cargo test --locked -p pulsedagd block_protocol::tests::
          cargo test --locked -p pulsedagd activated_v2_runtime::tests::

      - name: Commit verified patch and remove one-shot workflow
        shell: bash
        run: |
          git config user.name 'Task 28 wiring bot'
          git config user.email 'actions@users.noreply.github.com'
          git rm .github/workflows/task28-daemon-wire-once.yml
          git add -- apps/pulsedagd/src/main.rs apps/pulsedagd/src/block_protocol.rs apps/pulsedagd/src/activated_v2_runtime.rs
          git diff --cached --check
          git commit -m 'daemon: persist and restore activated-v2 P2P runtime'
          git push origin HEAD:agent/task28-daemon-v2-runtime
