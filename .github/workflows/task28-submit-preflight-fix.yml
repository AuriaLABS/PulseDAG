name: task28-submit-preflight-fix

on:
  push:
    branches:
      - agent/task28-mining-submit-protocol

permissions:
  contents: write

jobs:
  harden-submit-preflight:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: agent/task28-mining-submit-protocol
          fetch-depth: 0

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt

      - name: Apply exact submit preflight patch
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          path = Path('crates/pulsedag-rpc/src/handlers/mining_submit_protocol.rs')
          text = path.read_text()

          old = '''pub async fn post_mining_submit<S: RpcStateLike>(
              State(state): State<S>,
              Json(req): Json<SubmitMinedBlockRequest>,
          ) -> Json<ApiResponse<MiningSubmitData>> {
              if req.block.header.version == BLOCK_HEADER_VERSION_V1 {
                  return super::mining_submit_legacy::post_mining_submit(State(state), Json(req)).await;
              }
              post_activated_v2_mining_submit(state, req).await
          }
          '''
          new = '''pub(crate) fn validate_legacy_submit_protocol_identity(
              block: &Block,
              state: &ChainState,
              identity: Option<&ProtocolActivationIdentity>,
          ) -> Result<(), PulseError> {
              let path = mining_submit_protocol_path(block, state, identity)?;
              if path != PowValidationPath::LegacyV1 {
                  return Err(invalid_protocol(
                      "legacy mining submit did not resolve to the legacy-v1 protocol path",
                  ));
              }
              Ok(())
          }

          pub async fn post_mining_submit<S: RpcStateLike>(
              State(state): State<S>,
              Json(req): Json<SubmitMinedBlockRequest>,
          ) -> Json<ApiResponse<MiningSubmitData>> {
              if req.block.header.version == BLOCK_HEADER_VERSION_V1 {
                  let local_identity = match rpc_protocol_identity(&state) {
                      Ok(identity) => identity,
                      Err(error) => {
                          return rejected_response(
                              &req,
                              "protocol_identity_unavailable",
                              error.to_string(),
                              None,
                          );
                      }
                  };
                  if let Some(identity) = local_identity.as_ref() {
                      let chain_handle = state.chain();
                      let chain = chain_handle.read().await;
                      if let Err(error) = validate_legacy_submit_protocol_identity(
                          &req.block,
                          &chain,
                          Some(identity),
                      ) {
                          return rejected_response(
                              &req,
                              "protocol_mismatch",
                              error.to_string(),
                              None,
                          );
                      }
                  }
                  return super::mining_submit_legacy::post_mining_submit(State(state), Json(req)).await;
              }
              post_activated_v2_mining_submit(state, req).await
          }
          '''
          if text.count(old) != 1:
              raise SystemExit('expected exactly one post_mining_submit router block')
          text = text.replace(old, new)

          marker = '''    #[test]
              fn mixed_local_protocol_tuple_fails_closed() {
                  let state = init_chain_state("task28-rpc-mining-submit".to_string());
                  let block = state
                      .dag
                      .blocks
                      .get(&state.dag.genesis_hash)
                      .cloned()
                      .unwrap();
                  let mut identity = ProtocolActivationIdentity::legacy_from_state(&state);
                  identity.consensus_mode = ProtocolConsensusMode::GhostdagV1;

                  assert!(evaluate_mining_submit_pow(&block, &state, Some(&identity)).is_err());
              }
          '''
          addition = marker + '''
              #[test]
              fn activated_identity_rejects_legacy_submit_preflight() {
                  let state = init_chain_state("task28-rpc-mining-submit-v1-preflight".to_string());
                  let block = state
                      .dag
                      .blocks
                      .get(&state.dag.genesis_hash)
                      .cloned()
                      .unwrap();
                  let activated = activated_identity(&state);

                  assert!(validate_legacy_submit_protocol_identity(
                      &block,
                      &state,
                      Some(&activated),
                  )
                  .is_err());
                  assert!(validate_legacy_submit_protocol_identity(&block, &state, None).is_ok());
                  let legacy = ProtocolActivationIdentity::legacy_from_state(&state);
                  assert!(validate_legacy_submit_protocol_identity(
                      &block,
                      &state,
                      Some(&legacy),
                  )
                  .is_ok());
              }
          '''
          if text.count(marker) != 1:
              raise SystemExit('expected exactly one mixed tuple regression block')
          path.write_text(text.replace(marker, addition))
          PY

          cargo fmt --all
          git diff --check
          cargo test --locked -p pulsedag-rpc activated_identity_rejects_legacy_submit_preflight

          mapfile -t changed < <(git diff --name-only)
          for path in "${changed[@]}"; do
            if [[ "$path" != "crates/pulsedag-rpc/src/handlers/mining_submit_protocol.rs" ]]; then
              echo "::error::unexpected source path changed: $path"
              exit 1
            fi
          done

      - name: Commit source and remove one-shot workflow
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- crates/pulsedag-rpc/src/handlers/mining_submit_protocol.rs
          git rm -- .github/workflows/task28-submit-preflight-fix.yml
          git commit -m "rpc: fail closed on legacy submit under v2 identity"
          git push origin HEAD:agent/task28-mining-submit-protocol
