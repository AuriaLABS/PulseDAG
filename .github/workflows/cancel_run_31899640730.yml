name: cancel queued burn-in run 31899640730

on:
  push:
    branches:
      - ops/v2.4.0-burnin-8a1a5f74
    paths:
      - .github/workflows/cancel_run_31899640730.yml

permissions:
  actions: write
  contents: read

jobs:
  cancel:
    runs-on: ubuntu-latest
    steps:
      - name: Cancel queued run 31899640730
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          code="$(curl -sS -o /tmp/cancel.json -w '%{http_code}' \
            -X POST \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            https://api.github.com/repos/AuriaLABS/PulseDAG/actions/runs/31899640730/cancel)"
          cat /tmp/cancel.json || true
          test "$code" = "202" || test "$code" = "409"
