name: v3 lru remediation lock refresh

on:
  push:
    branches:
      - security/v3-lru-libp2p-056

permissions:
  contents: write

jobs:
  refresh-lock:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.88.0

      - name: Refresh libp2p dependency graph
        run: |
          set -euo pipefail
          cargo update -p libp2p --precise 0.56.0
          cargo metadata --locked --format-version 1 >/dev/null

      - name: Fail if vulnerable lru remains reachable
        run: |
          set -euo pipefail
          if cargo tree -i lru@0.12.5 > /tmp/lru-tree.txt 2>&1; then
            cat /tmp/lru-tree.txt
            echo "::error::lru 0.12.5 is still present in the resolved dependency graph"
            exit 1
          fi
          echo "PASS: lru 0.12.5 is absent from the resolved dependency graph"

      - name: Commit generated lockfile and remove bootstrap workflow
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Cargo.lock
          git rm .github/workflows/security-v3-lru-lock-refresh.yml
          git commit -m "security: refresh lockfile for libp2p 0.56"
          git push origin HEAD:security/v3-lru-libp2p-056
