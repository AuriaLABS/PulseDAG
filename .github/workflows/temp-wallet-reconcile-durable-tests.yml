name: temp wallet reconcile durable regression materializer

on:
  push:
    branches:
      - wallet/v3-pending-utxo-reconcile
    paths:
      - '.github/workflows/temp-wallet-reconcile-durable-tests.yml'

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: wallet/v3-pending-utxo-reconcile
          fetch-depth: 1
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.91.0
          components: clippy,rustfmt
      - name: Guard exact reconcile source
        shell: bash
        run: |
          set -euo pipefail
          test "$(git hash-object crates/pulsedag-wallet/src/bin/pulsedag-wallet-reconcile.rs)" = "f8af1a203bbef5d6406c79db4baa3c539fe4b719"
      - name: Add durable reconcile regressions
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          path = Path('crates/pulsedag-wallet/src/bin/pulsedag-wallet-reconcile.rs')
          text = path.read_text()
          anchor = '''    #[test]\n    fn public_transport_is_https_or_loopback_only() {'''
          assert text.count(anchor) == 1, 'expected unique public transport test anchor'
          insertion = r'''
    fn directory(label: &str) -> PathBuf {
        let unique = std::time::SystemTime::now()
            .duration_since(std::time::UNIX_EPOCH)
            .expect("clock")
            .as_nanos();
        std::env::temp_dir().join(format!(
            "pulsedag-wallet-reconcile-{label}-{}-{unique}",
            std::process::id()
        ))
    }

    #[test]
    fn durable_not_observed_survives_restart_and_retains_reservation() {
        let path = directory("not-observed");
        let network = WalletNetworkIdentity::new("testnet", "pulsedag-testnet").unwrap();
        let txid = "cc".repeat(32);

        {
            let store = WalletPendingJournalStore::try_acquire(&path).expect("store");
            let mut snapshot = store.load_or_new(&network).expect("load");
            snapshot
                .journal
                .reserve_signed(&txid, from_address(), &selected())
                .expect("reserve");
            snapshot.journal.mark_submission_started(&txid).expect("started");
            snapshot
                .journal
                .mark_submission_outcome_unknown(&txid)
                .expect("unknown");
            store
                .save_next(snapshot.generation, &snapshot.journal)
                .expect("save unknown");
        }

        {
            let store = WalletPendingJournalStore::try_acquire(&path).expect("reopen");
            let mut snapshot = store.load_or_new(&network).expect("reload");
            assert!(!apply_observation(
                &mut snapshot.journal,
                &txid,
                ReconcileObservation::NotObserved
            )
            .expect("absence is a no-op"));
            let entry = snapshot.journal.entry(&txid).expect("entry");
            assert_eq!(entry.state, WalletPendingState::SubmissionOutcomeUnknown);
            assert!(entry.state.reserves_outpoints());
            assert_eq!(snapshot.generation, 1);
        }

        {
            let store = WalletPendingJournalStore::try_acquire(&path).expect("second reopen");
            let snapshot = store.load_or_new(&network).expect("second reload");
            let entry = snapshot.journal.entry(&txid).expect("entry");
            assert_eq!(entry.state, WalletPendingState::SubmissionOutcomeUnknown);
            assert!(entry.state.reserves_outpoints());
            assert_eq!(snapshot.generation, 1);
        }

        let _ = std::fs::remove_dir_all(path);
    }

    #[test]
    fn durable_confirmation_is_idempotent_across_restart_and_cross_network_fails_closed() {
        let path = directory("confirmed");
        let network = WalletNetworkIdentity::new("testnet", "pulsedag-testnet").unwrap();
        let wrong_network = WalletNetworkIdentity::new("testnet", "other-chain").unwrap();
        let txid = "dd".repeat(32);

        {
            let store = WalletPendingJournalStore::try_acquire(&path).expect("store");
            let mut snapshot = store.load_or_new(&network).expect("load");
            snapshot
                .journal
                .reserve_signed(&txid, from_address(), &selected())
                .expect("reserve");
            store
                .save_next(snapshot.generation, &snapshot.journal)
                .expect("save signed");
        }

        {
            let store = WalletPendingJournalStore::try_acquire(&path).expect("reopen");
            assert!(store.load_or_new(&wrong_network).is_err());
            let mut snapshot = store.load_or_new(&network).expect("reload");
            assert!(apply_observation(
                &mut snapshot.journal,
                &txid,
                ReconcileObservation::Confirmed
            )
            .expect("confirm"));
            store
                .save_next(snapshot.generation, &snapshot.journal)
                .expect("save confirmed");
        }

        {
            let store = WalletPendingJournalStore::try_acquire(&path).expect("second reopen");
            let mut snapshot = store.load_or_new(&network).expect("second reload");
            let entry = snapshot.journal.entry(&txid).expect("entry");
            assert_eq!(entry.state, WalletPendingState::Confirmed);
            assert!(!entry.state.reserves_outpoints());
            assert_eq!(snapshot.generation, 2);
            assert!(!apply_observation(
                &mut snapshot.journal,
                &txid,
                ReconcileObservation::Confirmed
            )
            .expect("repeat confirmation"));
        }

        let _ = std::fs::remove_dir_all(path);
    }

'''
          path.write_text(text.replace(anchor, insertion + anchor))
          PY
          cargo fmt --all
          git diff --check
          changed="$(git diff --name-only)"
          test "$changed" = "crates/pulsedag-wallet/src/bin/pulsedag-wallet-reconcile.rs"
      - name: Run targeted gate
        shell: bash
        run: |
          set -euo pipefail
          cargo test --locked -p pulsedag-wallet --bin pulsedag-wallet-reconcile
          cargo clippy --locked -p pulsedag-wallet --bin pulsedag-wallet-reconcile -- -D warnings -A clippy::uninlined-format-args
          cargo fmt --all -- --check
          git diff --check
      - name: Publish source and remove materializer
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/temp-wallet-reconcile-durable-tests.yml
          git add crates/pulsedag-wallet/src/bin/pulsedag-wallet-reconcile.rs .github/workflows/temp-wallet-reconcile-durable-tests.yml
          staged="$(git diff --cached --name-only | sort)"
          expected="$(printf '%s\n' '.github/workflows/temp-wallet-reconcile-durable-tests.yml' 'crates/pulsedag-wallet/src/bin/pulsedag-wallet-reconcile.rs' | sort)"
          test "$staged" = "$expected"
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git commit -m 'test: cover durable reconcile restart semantics'
          git push origin HEAD:wallet/v3-pending-utxo-reconcile
