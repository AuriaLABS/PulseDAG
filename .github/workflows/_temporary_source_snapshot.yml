name: One-shot PR review fixes

on:
  push:
    branches:
      - release/2.4.0
    paths:
      - .github/workflows/_temporary_source_snapshot.yml
  pull_request:
    branches:
      - main
    paths:
      - .github/workflows/_temporary_source_snapshot.yml

permissions:
  contents: write

concurrency:
  group: one-shot-pr-787-fixes-${{ github.event_name }}
  cancel-in-progress: false

jobs:
  apply-test-publish:
    if: github.repository == 'AuriaLABS/PulseDAG'
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout triggering candidate
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Recover and apply reviewed patch
        shell: bash
        run: |
          set -euo pipefail
          git show 791cdec70e461488898a806342a7edef5c02e0b4:.github/workflows/_temporary_source_snapshot.yml \
            | python3 -c 'import re,sys; s=sys.stdin.read(); m=re.search(r"PATCH_B64: .([^\x27]+)\x27", s); assert m; print(m.group(1), end="")' \
            | base64 -d > /tmp/pr-787.patch
          git apply --check /tmp/pr-787.patch
          git apply /tmp/pr-787.patch

      - name: Format Rust workspace
        run: cargo fmt --all

      - name: Validate changed Rust crates
        run: cargo check -p pulsedag-core -p pulsedag-rpc -p pulsedagd

      - name: Test fast rejection before state replay
        run: cargo test -p pulsedag-core validate_block_rejects_invalid_difficulty_before_side_parent_replay -- --nocapture

      - name: Test daemon single-node enforcement
        run: cargo test -p pulsedagd single_node -- --nocapture

      - name: Test single-node preflight contract
        run: bash scripts/tests/test_v2_4_0_single_node_preflight.sh

      - name: Remove temporary workflow and verify scope
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/_temporary_source_snapshot.yml
          allowed='^(apps/pulsedagd/src/config\.rs|crates/pulsedag-core/src/validation\.rs|crates/pulsedag-rpc/src/handlers/(mine|pow_auto_run|pow_dashboard|pow_mine_capture|mining_jobs)\.rs|\.github/workflows/_temporary_source_snapshot\.yml)$'
          unexpected="$(git status --short | awk '{print $2}' | grep -Ev "$allowed" || true)"
          if [[ -n "$unexpected" ]]; then
            printf 'unexpected changed paths:\n%s\n' "$unexpected" >&2
            exit 1
          fi
          git diff --check

      - name: Package validated changes
        shell: bash
        run: |
          set -euo pipefail
          git diff --binary > /tmp/pr-787-validated.patch
          tar -czf /tmp/pr-787-validated-files.tar.gz \
            apps/pulsedagd/src/config.rs \
            crates/pulsedag-core/src/validation.rs \
            crates/pulsedag-rpc/src/handlers/mine.rs \
            crates/pulsedag-rpc/src/handlers/pow_auto_run.rs \
            crates/pulsedag-rpc/src/handlers/pow_dashboard.rs \
            crates/pulsedag-rpc/src/handlers/pow_mine_capture.rs \
            crates/pulsedag-rpc/src/handlers/mining_jobs.rs

      - name: Upload validated changes
        uses: actions/upload-artifact@v4
        with:
          name: pr-787-validated-changes-${{ github.run_id }}
          path: |
            /tmp/pr-787-validated.patch
            /tmp/pr-787-validated-files.tar.gz
          if-no-files-found: error
          retention-days: 3

      - name: Commit tested fixes
        if: github.event_name == 'push'
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'fix PR review findings for v2.4.0'
          git push origin HEAD:release/2.4.0
