name: Temporary source snapshot

on:
  push:
    branches:
      - release/2.4.0
    paths:
      - .github/workflows/_temporary_source_snapshot.yml

permissions:
  contents: read

jobs:
  snapshot:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout candidate
        uses: actions/checkout@v4

      - name: Archive tracked source
        shell: bash
        run: |
          set -euo pipefail
          git ls-files -z | tar --null -T - -czf /tmp/pulsedag-source-${GITHUB_SHA}.tar.gz

      - name: Upload source snapshot
        uses: actions/upload-artifact@v4
        with:
          name: temporary-source-snapshot-${{ github.run_id }}
          path: /tmp/pulsedag-source-${{ github.sha }}.tar.gz
          if-no-files-found: error
          retention-days: 1
