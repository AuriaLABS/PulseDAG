name: temp wallet P1 recovery and confirmation fix

on:
  push:
    branches:
      - wallet/v3-pending-utxo-reconcile
    paths:
      - '.github/workflows/temp-wallet-p1-recovery-confirmation-fix.yml'

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          ref: wallet/v3-pending-utxo-reconcile
          fetch-depth: 1
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.91.0
          components: clippy,rustfmt
      - name: Guard exact inputs
        shell: bash
        run: |
          set -euo pipefail
          test "$(git hash-object crates/pulsedag-wallet/src/bin/pulsedag-wallet.rs)" = "4e9a3525c73d9b5961e581963e7349b9f80e647b"
          test "$(git hash-object crates/pulsedag-rpc/src/handlers/address.rs)" = "1c01e1f353a0d2f706e36d2ecbef088ee7d0bdc4"
          test "$(git hash-object .github/temp-wallet-p1-fix.py)" = "8f129cf8a574df18876e4747e93d5eb02eebb6d7"
      - name: Apply guarded P1 fixes
        shell: bash
        run: |
          set -euo pipefail
          python3 .github/temp-wallet-p1-fix.py
          cargo fmt --all
          git diff --check
          test "$(git diff --name-only)" = $'crates/pulsedag-rpc/src/handlers/address.rs\ncrates/pulsedag-wallet/src/bin/pulsedag-wallet.rs'
      - name: Run focused regression gate
        shell: bash
        run: |
          set -euo pipefail
          cargo test --locked -p pulsedag-rpc address_activity
          cargo test --locked -p pulsedag-wallet --bin pulsedag-wallet tx_sign_recovery
          cargo test --locked -p pulsedag-wallet
          cargo clippy --locked -p pulsedag-rpc -p pulsedag-wallet --all-targets -- -D warnings
          cargo fmt --all -- --check
          git diff --check
      - name: Publish fixes and remove temporaries
        shell: bash
        run: |
          set -euo pipefail
          rm .github/temp-wallet-p1-fix.py
          rm .github/workflows/temp-wallet-p1-recovery-confirmation-fix.yml
          git add crates/pulsedag-rpc/src/handlers/address.rs crates/pulsedag-wallet/src/bin/pulsedag-wallet.rs .github/temp-wallet-p1-fix.py .github/workflows/temp-wallet-p1-recovery-confirmation-fix.yml
          test "$(git diff --cached --name-only)" = $'.github/temp-wallet-p1-fix.py\n.github/workflows/temp-wallet-p1-recovery-confirmation-fix.yml\ncrates/pulsedag-rpc/src/handlers/address.rs\ncrates/pulsedag-wallet/src/bin/pulsedag-wallet.rs'
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'wallet: fix confirmation and signed recovery semantics'
          git push origin HEAD:wallet/v3-pending-utxo-reconcile
