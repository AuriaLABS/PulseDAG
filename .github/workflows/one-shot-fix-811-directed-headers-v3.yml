name: one-shot fix 811 directed headers v3

on:
  push:
    branches:
      - fix/rejoin-catchup-stall-811

permissions:
  contents: write

jobs:
  patch-test-commit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable

      - name: Apply directed GetHeaders patch
        shell: python
        run: |
          from pathlib import Path
          import re

          def replace_once(text, old, new, label):
              n = text.count(old)
              if n != 1:
                  raise SystemExit(f"{label}: expected 1 match, found {n}")
              return text.replace(old, new, 1)

          def regex_once(text, pattern, replacement, label):
              out, n = re.subn(pattern, lambda _m: replacement, text, count=1, flags=re.S)
              if n != 1:
                  raise SystemExit(f"{label}: expected 1 match, found {n}")
              return out

          def insert_before_test(text, fn_name, addition, label):
              pos = text.find(f"fn {fn_name}(")
              if pos < 0:
                  raise SystemExit(f"{label}: function not found")
              attr = text.rfind("    #[test]", 0, pos)
              if attr >= 0 and text[attr:pos].strip() == "#[test]":
                  at = attr
              else:
                  at = text.rfind("\n", 0, pos) + 1
              return text[:at] + addition + text[at:]

          # --- Wire: add an optional target; old GetHeaders JSON remains valid. ---
          msg_path = Path("crates/pulsedag-p2p/src/messages.rs")
          msg = msg_path.read_text()
          msg = regex_once(
              msg,
              r"GetHeaders\s*\{\s*chain_id: String,\s*locator: Vec<Hash>,\s*stop_hash: Option<Hash>,\s*limit: usize,\s*\},",
              '''GetHeaders {
                  chain_id: String,
                  locator: Vec<Hash>,
                  stop_hash: Option<Hash>,
                  limit: usize,
                  #[serde(default)]
                  requested_peer_id: Option<String>,
              },''',
              "wire GetHeaders target",
          )
          msg = regex_once(
              msg,
              r'''NetworkMessage::GetHeaders\s*\{\s*chain_id: "testnet"\.into\(\),\s*locator: vec!\["parent"\.into\(\)\],\s*stop_hash: Some\(block\.hash\.clone\(\)\),\s*limit: 64,\s*\},''',
              '''NetworkMessage::GetHeaders {
                      chain_id: "testnet".into(),
                      locator: vec!["parent".into()],
                      stop_hash: Some(block.hash.clone()),
                      limit: 64,
                      requested_peer_id: None,
                  },''',
              "wire roundtrip constructor",
          )
          msg_test = '''    #[test]
              fn get_headers_target_is_backward_compatible() {
                  let legacy = br#"{\"type\":\"GetHeaders\",\"chain_id\":\"testnet\",\"locator\":[\"parent\"],\"stop_hash\":null,\"limit\":64}"#;
                  let decoded: NetworkMessage = serde_json::from_slice(legacy).expect("legacy GetHeaders");
                  match decoded {
                      NetworkMessage::GetHeaders { requested_peer_id, .. } => assert_eq!(requested_peer_id, None),
                      _ => panic!("unexpected message"),
                  }

                  let directed = NetworkMessage::GetHeaders {
                      chain_id: "testnet".into(),
                      locator: vec!["parent".into()],
                      stop_hash: None,
                      limit: 64,
                      requested_peer_id: Some("peer-a".into()),
                  };
                  let encoded = serde_json::to_vec(&directed).expect("encode");
                  let decoded: NetworkMessage = serde_json::from_slice(&encoded).expect("decode");
                  match decoded {
                      NetworkMessage::GetHeaders { requested_peer_id, .. } => assert_eq!(requested_peer_id.as_deref(), Some("peer-a")),
                      _ => panic!("unexpected message"),
                  }
              }

          '''
          msg = insert_before_test(msg, "rejects_malformed_payloads_during_decode", msg_test, "wire compat test")
          msg_path.write_text(msg)

          # --- P2P API / outbound queue / wire runtime. ---
          p2p_path = Path("crates/pulsedag-p2p/src/lib.rs")
          p2p = p2p_path.read_text()

          trait_anchor = '''    fn send_headers(&self, _headers: &[HeaderInventory]) -> Result<(), PulseError> {
          '''
          trait_method = '''    fn request_headers_from(
              &self,
              _peer_id: &str,
              _locator: &[PulseHash],
              _stop_hash: Option<&PulseHash>,
              _limit: usize,
          ) -> Result<(), PulseError> {
              Err(PulseError::Internal(
                  "peer-addressed GetHeaders is not supported by this p2p handle".into(),
              ))
          }
          '''
          p2p = replace_once(p2p, trait_anchor, trait_method + trait_anchor, "P2pHandle request_headers_from")

          # Scope the field change to OutboundMessage; InboundEvent deliberately stays unchanged.
          enum_start = p2p.index("enum OutboundMessage")
          gh_start = p2p.index("    GetHeaders {", enum_start)
          gh_end = p2p.index("    },", gh_start) + len("    },")
          gh = p2p[gh_start:gh_end]
          expected = '''    GetHeaders {
                  locator: Vec<PulseHash>,
                  stop_hash: Option<PulseHash>,
                  limit: usize,
              },'''
          if gh != expected:
              raise SystemExit(f"unexpected OutboundMessage::GetHeaders block:\n{gh}")
          replacement = '''    GetHeaders {
                  locator: Vec<PulseHash>,
                  stop_hash: Option<PulseHash>,
                  limit: usize,
                  requested_peer_id: Option<String>,
              },'''
          p2p = p2p[:gh_start] + replacement + p2p[gh_end:]

          p2p = regex_once(
              p2p,
              r'''OutboundMessage::GetHeaders\s*\{\s*locator,\s*stop_hash,\s*limit,\s*\}\s*=>\s*\{\s*queue\.blocks\.push_back\(OutboundMessage::GetHeaders\s*\{\s*locator,\s*stop_hash,\s*limit,\s*\}\);\s*\}''',
              '''OutboundMessage::GetHeaders {
                  locator,
                  stop_hash,
                  limit,
                  requested_peer_id,
              } => {
                  queue.blocks.push_back(OutboundMessage::GetHeaders {
                      locator,
                      stop_hash,
                      limit,
                      requested_peer_id,
                  });
              }''',
              "queue target preservation",
          )

          # Pure target predicate used by inbound dispatcher and unit-tested.
          dispatch_fn = "fn dispatch_network_message("
          target_helper = '''fn get_headers_targets_local_peer(
              requested_peer_id: Option<&str>,
              local_peer_id: &str,
          ) -> bool {
              requested_peer_id.is_none_or(|peer| peer == local_peer_id)
          }

          '''
          p2p = replace_once(p2p, dispatch_fn, target_helper + dispatch_fn, "dispatcher target helper")
          p2p = regex_once(
              p2p,
              r'''NetworkMessage::GetHeaders\s*\{\s*chain_id,\s*locator,\s*stop_hash,\s*limit,\s*\}\s*=>\s*\{''',
              '''NetworkMessage::GetHeaders {
                  chain_id,
                  locator,
                  stop_hash,
                  limit,
                  requested_peer_id,
              } => {
                  let local_peer_id = inner
                      .lock()
                      .map(|guard| guard.peer_id.clone())
                      .unwrap_or_default();
                  if !get_headers_targets_local_peer(requested_peer_id.as_deref(), &local_peer_id) {
                      return;
                  }''',
              "directed inbound GetHeaders gate",
          )

          # Memory implementation can reuse its existing request_headers behavior.
          mem_start = p2p.index("impl P2pHandle for MemoryP2pHandle")
          mem_req = p2p.index("    fn request_headers(", mem_start)
          mem_send = p2p.index("    fn send_headers(", mem_req)
          mem_method = '''    fn request_headers_from(
              &self,
              _peer_id: &str,
              locator: &[PulseHash],
              stop_hash: Option<&PulseHash>,
              limit: usize,
          ) -> Result<(), PulseError> {
              self.request_headers(locator, stop_hash, limit)
          }

          '''
          p2p = p2p[:mem_send] + mem_method + p2p[mem_send:]

          # Libp2p broadcast requests use None; selected recovery gets a targeted method.
          lib_start = p2p.index("impl P2pHandle for Libp2pHandle")
          lib_req = p2p.index("    fn request_headers(", lib_start)
          lib_send = p2p.index("    fn send_headers(", lib_req)
          section = p2p[lib_req:lib_send]
          section = regex_once(
              section,
              r'''OutboundMessage::GetHeaders\s*\{\s*locator: locator\.to_vec\(\),\s*stop_hash: stop_hash\.cloned\(\),\s*limit,\s*\},''',
              '''OutboundMessage::GetHeaders {
                      locator: locator.to_vec(),
                      stop_hash: stop_hash.cloned(),
                      limit,
                      requested_peer_id: None,
                  },''',
              "Libp2p broadcast GetHeaders",
          )
          p2p = p2p[:lib_req] + section + p2p[lib_send:]
          lib_start = p2p.index("impl P2pHandle for Libp2pHandle")
          lib_req = p2p.index("    fn request_headers(", lib_start)
          lib_send = p2p.index("    fn send_headers(", lib_req)
          lib_method = '''    fn request_headers_from(
              &self,
              peer_id: &str,
              locator: &[PulseHash],
              stop_hash: Option<&PulseHash>,
              limit: usize,
          ) -> Result<(), PulseError> {
              {
                  let mut inner = self
                      .inner
                      .lock()
                      .map_err(|_| PulseError::Internal("p2p lock poisoned".into()))?;
                  if inner.active_connections.get(peer_id).copied().unwrap_or(0) == 0 {
                      return Err(PulseError::Internal(format!(
                          "peer {peer_id} is not a direct request-capable session"
                      )));
                  }
                  inner.header_requests_sent = inner.header_requests_sent.saturating_add(1);
              }
              self.queue_sync_message(
                  OutboundMessage::GetHeaders {
                      locator: locator.to_vec(),
                      stop_hash: stop_hash.cloned(),
                      limit,
                      requested_peer_id: Some(peer_id.to_string()),
                  },
                  "get-headers-from",
              )
          }

          '''
          p2p = p2p[:lib_send] + lib_method + p2p[lib_send:]

          old_arm = "OutboundMessage::GetHeaders { locator, stop_hash, limit } => {"
          if p2p.count(old_arm) != 2:
              raise SystemExit(f"runtime GetHeaders arms expected 2, found {p2p.count(old_arm)}")
          p2p = p2p.replace(old_arm, "OutboundMessage::GetHeaders { locator, stop_hash, limit, requested_peer_id } => {")
          old_id = 'let message_id = format!("sync:get-headers:{}:{stop_part}:{limit}", locator.join(","));'
          if p2p.count(old_id) != 2:
              raise SystemExit(f"runtime GetHeaders message IDs expected 2, found {p2p.count(old_id)}")
          p2p = p2p.replace(old_id, 'let target_part = requested_peer_id.as_deref().unwrap_or("broadcast");\n                        let message_id = format!("sync:get-headers:{target_part}:{}:{stop_part}:{limit}", locator.join(","));')
          old_wire = 'let wire = serde_json::to_vec(&NetworkMessage::GetHeaders { chain_id: cfg.chain_id.clone(), locator, stop_hash, limit });'
          if p2p.count(old_wire) != 2:
              raise SystemExit(f"runtime GetHeaders wire constructors expected 2, found {p2p.count(old_wire)}")
          p2p = p2p.replace(old_wire, 'let wire = serde_json::to_vec(&NetworkMessage::GetHeaders { chain_id: cfg.chain_id.clone(), locator, stop_hash, limit, requested_peer_id });')

          p2p_test = '''    #[test]
              fn directed_get_headers_targets_only_selected_peer() {
                  assert!(get_headers_targets_local_peer(None, "peer-b"));
                  assert!(get_headers_targets_local_peer(Some("peer-a"), "peer-a"));
                  assert!(!get_headers_targets_local_peer(Some("peer-a"), "peer-b"));

                  let inner = Arc::new(Mutex::new(InnerState::default()));
                  let mut queue = OutboundPriorityQueue::default();
                  enqueue_outbound_message(
                      &inner,
                      &mut queue,
                      OutboundMessage::GetHeaders {
                          locator: vec!["tip".to_string()],
                          stop_hash: None,
                          limit: 128,
                          requested_peer_id: Some("peer-a".to_string()),
                      },
                  );
                  match queue.blocks.pop_front().expect("queued") {
                      OutboundMessage::GetHeaders { requested_peer_id, .. } => {
                          assert_eq!(requested_peer_id.as_deref(), Some("peer-a"));
                      }
                      _ => panic!("unexpected message"),
                  }
              }

          '''
          p2p = insert_before_test(p2p, "connected_peers_truth_flag_is_mode_dependent", p2p_test, "P2P target test")
          p2p_path.write_text(p2p)

          # --- Node: selected locator requests use the peer chosen from tip inventory. ---
          main_path = Path("apps/pulsedagd/src/main.rs")
          main = main_path.read_text()
          commit_anchor = "fn commit_candidate_chain_state("
          peer_helper = '''fn pending_selected_locator_accepts_response_peer(
              pending: Option<&PendingSelectedLocator>,
              response_peer: Option<&str>,
          ) -> bool {
              let (Some(pending), Some(response_peer)) = (pending, response_peer) else {
                  return false;
              };
              pending.peer_id == "broadcast-observed-block-gap" || pending.peer_id == response_peer
          }

          '''
          main = replace_once(main, commit_anchor, peer_helper + commit_anchor, "pending locator peer helper")
          main = regex_once(
              main,
              r'''let selected_session_owns_headers = selected_headers_own_broadcast_locator\(\s*selected_segment_session\.is_some\(\),\s*selected_locator_pending,\s*peer_id\.as_deref\(\),\s*session_correlated,\s*\) && \(session_correlated\s*\|\| pending_locator_matches_common_ancestor\);''',
              '''let pending_locator_accepts_response_peer =
                              pending_selected_locator_accepts_response_peer(
                                  pending_selected_locator.as_ref(),
                                  peer_id.as_deref(),
                              );
                          let selected_session_owns_headers = selected_headers_own_broadcast_locator(
                              selected_segment_session.is_some(),
                              selected_locator_pending,
                              peer_id.as_deref(),
                              session_correlated,
                          ) && (session_correlated
                              || (pending_locator_matches_common_ancestor
                                  && pending_locator_accepts_response_peer));''',
              "selected response peer correlation",
          )

          def direct_request_after(text, anchor, peer_expr, label):
              start = text.find(anchor)
              if start < 0:
                  raise SystemExit(f"{label}: anchor missing")
              call = text.find(".request_headers(", start)
              if call < 0:
                  raise SystemExit(f"{label}: request_headers missing")
              end = call + len(".request_headers(")
              return text[:call] + ".request_headers_from(\n" + peer_expr + text[end:]

          main = direct_request_after(main, "let immediate_selected_locator =", "                                        &peer_id,\n", "immediate selected locator")
          main = direct_request_after(main, "let proactive_selected_locator =", "                                &peer_id,\n", "proactive selected locator")
          main = direct_request_after(main, "let selected_locator_peer = selected_locator_peer_for_reconcile", "                                                selected_locator_peer.as_deref().unwrap_or_default(),\n", "final selected locator")

          main_test = '''    #[test]
              fn pending_selected_locator_rejects_wrong_response_peer() {
                  let pending = PendingSelectedLocator {
                      request_id: 8,
                      peer_id: "peer-a".to_string(),
                      locator: vec!["local-1296".to_string()],
                      requested_at_unix: 100,
                  };
                  assert!(pending_selected_locator_accepts_response_peer(Some(&pending), Some("peer-a")));
                  assert!(!pending_selected_locator_accepts_response_peer(Some(&pending), Some("peer-b")));
                  let broadcast = PendingSelectedLocator {
                      peer_id: "broadcast-observed-block-gap".to_string(),
                      ..pending
                  };
                  assert!(pending_selected_locator_accepts_response_peer(Some(&broadcast), Some("peer-b")));
              }

          '''
          main = insert_before_test(main, "stale_selected_segment_rearms_only_after_no_progress_and_no_inflight_requests", main_test, "selected response peer test")
          main_path.write_text(main)

      - name: Format
        run: cargo fmt --all
      - name: Diff sanity
        run: git diff --check
      - name: Test P2P
        run: cargo test -p pulsedag-p2p
      - name: Test selected segment
        run: cargo test -p pulsedagd selected_segment -- --nocapture
      - name: Check node
        run: cargo check -p pulsedagd
      - name: Commit tested patch
        run: |
          rm .github/workflows/one-shot-fix-811-directed-headers-v3.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add crates/pulsedag-p2p/src/messages.rs crates/pulsedag-p2p/src/lib.rs apps/pulsedagd/src/main.rs .github/workflows/one-shot-fix-811-directed-headers-v3.yml
          git commit -m "fix(sync): direct selected header recovery to chosen peer"
          git push origin HEAD:fix/rejoin-catchup-stall-811
