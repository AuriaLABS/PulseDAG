name: temporary covenant v1 deny unknown fields fix

on:
  push:
    branches:
      - codex/issue-1041-covenants-v1-semantics

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: codex/issue-1041-covenants-v1-semantics
      - name: Apply deny_unknown_fields fix
        shell: python
        run: |
          from pathlib import Path

          path = Path("crates/pulsedag-core/src/covenant_v1.rs")
          text = path.read_text()
          old = '#[serde(rename_all = "snake_case")]\npub enum CovenantWitnessV1 {'
          new = '#[serde(rename_all = "snake_case", deny_unknown_fields)]\npub enum CovenantWitnessV1 {'
          assert text.count(old) == 1, text.count(old)
          path.write_text(text.replace(old, new, 1))
      - name: Install Rust 1.91.0
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.91.0
          components: rustfmt, clippy
      - name: Validate patch
        run: |
          cargo fmt --all -- --check
          cargo check -p pulsedag-core --locked
          cargo clippy -p pulsedag-core --all-targets -- -D warnings
      - name: Commit fix
        run: |
          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add crates/pulsedag-core/src/covenant_v1.rs
          git commit -m "fix(core): reject unknown covenant witness fields"
          git push origin HEAD:codex/issue-1041-covenants-v1-semantics
