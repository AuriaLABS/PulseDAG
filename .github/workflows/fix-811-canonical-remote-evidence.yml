name: fix-811 remaining rejoin validation

on:
  push:
    branches:
      - fix/rejoin-catchup-stall-811
    paths:
      - .github/scripts/fix_811_wire_remote_sync_evidence.py

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: fix/rejoin-catchup-stall-811
          fetch-depth: 0

      - name: Apply remaining rejoin patch
        run: python .github/scripts/fix_811_wire_remote_sync_evidence.py

      - name: Format
        run: cargo fmt --all

      - name: Diff check
        run: git diff --check

      - name: RPC wiring regression
        run: cargo test -p pulsedag-rpc sync_status_canonical_state_uses_fresh_remote_tip_inventory -- --nocapture

      - name: Canonical sync regressions
        run: cargo test -p pulsedag-rpc canonical_sync -- --nocapture

      - name: Selected segment regressions
        run: cargo test -p pulsedagd selected_segment -- --nocapture

      - name: Small-gap rejoin regressions
        run: cargo test -p pulsedagd small_rejoin -- --nocapture

      - name: Clippy RPC and daemon
        run: cargo clippy -p pulsedag-rpc -p pulsedagd --all-targets --all-features -- -D warnings

      - name: Daemon compile check
        run: cargo check -p pulsedagd

      - name: Commit validated source and remove temporary harness
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add crates/pulsedag-rpc/src/handlers/sync.rs apps/pulsedagd/src/main.rs
          git rm .github/scripts/fix_811_wire_remote_sync_evidence.py
          git rm .github/workflows/fix-811-canonical-remote-evidence.yml
          git commit -m "fix(sync): continue selected rejoin to remote tip"
          git push origin HEAD:fix/rejoin-catchup-stall-811
