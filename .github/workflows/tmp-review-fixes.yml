name: temporary review fixes validation

on:
  pull_request:
    branches:
      - main
    paths:
      - '.github/workflows/tmp-review-fixes.yml'

permissions:
  contents: write

jobs:
  validate-and-publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Checkout PR head branch
        uses: actions/checkout@v4
        with:
          ref: release/2.4.0
          fetch-depth: 2

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt

      - name: Apply type annotation and canonical formatting
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          path = Path('crates/pulsedag-core/src/retarget.rs')
          text = path.read_text()
          old = '    let mut recent = Vec::with_capacity(limit);'
          new = '    let mut recent: Vec<&Block> = Vec::with_capacity(limit);'
          count = text.count(old)
          if count != 1:
              raise SystemExit(f'expected one retarget vector match, found {count}')
          path.write_text(text.replace(old, new, 1))
          PY
          cargo fmt --all
          cargo fmt --all -- --check
          git diff --check

      - name: Validate hardened single-node preflight
        run: bash scripts/tests/test_v2_4_0_single_node_preflight.sh

      - name: Validate complete core package
        run: cargo test -p pulsedag-core --locked -- --test-threads=1

      - name: Publish clean review-fix commit
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/tmp-review-fixes.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add \
            crates/pulsedag-core/src/retarget.rs \
            crates/pulsedag-core/src/validation.rs \
            scripts/v2_4_0_single_node_preflight.sh \
            scripts/tests/test_v2_4_0_single_node_preflight.sh \
            .github/workflows/tmp-review-fixes.yml
          git diff --cached --check
          git commit -m 'fix(review): harden preflight and reject invalid headers early'
          git push origin HEAD:release/2.4.0
