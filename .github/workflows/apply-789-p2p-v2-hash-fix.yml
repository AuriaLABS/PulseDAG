name: Apply issue 789 P2P v2 hash fix

on:
  push:
    branches:
      - fix/v2.4-p2p-v2-header-hash-789

permissions:
  contents: write

jobs:
  materialize-fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Pin Rust 1.88.0
        run: |
          rustup toolchain install 1.88.0 --profile minimal --component rustfmt
          rustup override set 1.88.0

      - name: Apply version-aware P2P block hash validation
        shell: python
        run: |
          from pathlib import Path

          path = Path("crates/pulsedag-p2p/src/lib.rs")
          text = path.read_text()

          old_import = '''use pulsedag_core::{
              errors::PulseError,
              rank_sync_candidates,
              types::{compute_block_hash, compute_merkle_root, Block, Hash as PulseHash, Transaction},
              RankedSyncPeer, SyncPeerCandidate,
          };'''
          new_import = '''use pulsedag_core::{
              compute_block_hash_v2,
              errors::PulseError,
              rank_sync_candidates,
              types::{
                  compute_block_hash, compute_merkle_root, Block, BlockHeader, Hash as PulseHash, Transaction,
              },
              RankedSyncPeer, SyncPeerCandidate, BLOCK_HEADER_VERSION_V1, BLOCK_HEADER_VERSION_V2,
          };'''
          assert text.count(old_import) == 1, "unexpected pulsedag_core import shape"
          text = text.replace(old_import, new_import)

          old_validator = '''fn validate_inbound_block_shape(block: &Block) -> Result<(), &'static str> {
              if block.hash.is_empty() {
                  return Err("empty_block_hash");
              }
              let mut parents = HashSet::new();
              for parent in &block.header.parents {
                  if parent.is_empty() || !parents.insert(parent) {
                      return Err("invalid_parent_set");
                  }
              }
              let looks_canonical_hash =
                  block.hash.len() == 64 && block.hash.chars().all(|ch| ch.is_ascii_hexdigit());
              if looks_canonical_hash && compute_block_hash(&block.header) != block.hash {
                  return Err("block_hash_mismatch");
              }
              let looks_canonical_merkle = block.header.merkle_root.len() == 64
                  && block
                      .header
                      .merkle_root
                      .chars()
                      .all(|ch| ch.is_ascii_hexdigit());
              if looks_canonical_merkle
                  && compute_merkle_root(&block.transactions) != block.header.merkle_root
              {
                  return Err("merkle_root_mismatch");
              }
              Ok(())
          }
          '''
          new_validator = '''fn protocol_block_hash(header: &BlockHeader, chain_id: &str) -> Option<String> {
              match header.version {
                  BLOCK_HEADER_VERSION_V1 => Some(compute_block_hash(header)),
                  BLOCK_HEADER_VERSION_V2 => compute_block_hash_v2(header, chain_id).ok(),
                  _ => None,
              }
          }

          fn validate_inbound_block_shape(block: &Block, chain_id: &str) -> Result<(), &'static str> {
              if block.hash.is_empty() {
                  return Err("empty_block_hash");
              }
              let mut parents = HashSet::new();
              for parent in &block.header.parents {
                  if parent.is_empty() || !parents.insert(parent) {
                      return Err("invalid_parent_set");
                  }
              }
              let looks_canonical_hash =
                  block.hash.len() == 64 && block.hash.chars().all(|ch| ch.is_ascii_hexdigit());
              if looks_canonical_hash
                  && protocol_block_hash(&block.header, chain_id).as_deref()
                      != Some(block.hash.as_str())
              {
                  return Err("block_hash_mismatch");
              }
              let looks_canonical_merkle = block.header.merkle_root.len() == 64
                  && block
                      .header
                      .merkle_root
                      .chars()
                      .all(|ch| ch.is_ascii_hexdigit());
              if looks_canonical_merkle
                  && compute_merkle_root(&block.transactions) != block.header.merkle_root
              {
                  return Err("merkle_root_mismatch");
              }
              Ok(())
          }

          #[cfg(test)]
          mod protocol_block_hash_tests {
              use super::*;

              fn sample_header(version: u32) -> BlockHeader {
                  BlockHeader {
                      version,
                      parents: vec!["11".repeat(32)],
                      timestamp: 1_700_000_000,
                      difficulty: 42,
                      nonce: 7,
                      merkle_root: compute_merkle_root(&[]),
                      state_root: "22".repeat(32),
                      blue_score: 1,
                      height: 1,
                  }
              }

              #[test]
              fn protocol_hash_dispatches_legacy_v1_and_chain_bound_v2() {
                  let chain_id = "pulsedag-private-v2.4.0";
                  let v1 = sample_header(BLOCK_HEADER_VERSION_V1);
                  assert_eq!(
                      protocol_block_hash(&v1, chain_id),
                      Some(compute_block_hash(&v1))
                  );

                  let v2 = sample_header(BLOCK_HEADER_VERSION_V2);
                  let expected_v2 = compute_block_hash_v2(&v2, chain_id).unwrap();
                  assert_eq!(
                      protocol_block_hash(&v2, chain_id).as_deref(),
                      Some(expected_v2.as_str())
                  );
                  assert_ne!(compute_block_hash(&v2), expected_v2);
              }

              #[test]
              fn inbound_v2_block_shape_uses_chain_bound_hash() {
                  let chain_id = "pulsedag-private-v2.4.0";
                  let header = sample_header(BLOCK_HEADER_VERSION_V2);
                  let block = Block {
                      hash: compute_block_hash_v2(&header, chain_id).unwrap(),
                      header,
                      transactions: vec![],
                  };

                  assert_eq!(validate_inbound_block_shape(&block, chain_id), Ok(()));
                  assert_eq!(
                      validate_inbound_block_shape(&block, "pulsedag-other-chain"),
                      Err("block_hash_mismatch")
                  );
              }

              #[test]
              fn unknown_header_version_fails_closed() {
                  let header = sample_header(99);
                  assert_eq!(protocol_block_hash(&header, "pulsedag-private-v2.4.0"), None);
              }
          }
          '''
          assert text.count(old_validator) == 1, "unexpected inbound block validator shape"
          text = text.replace(old_validator, new_validator)

          old_call = 'if let Err(reason) = validate_inbound_block_shape(&block) {'
          assert text.count(old_call) == 2, "expected exactly two inbound block validator calls"
          text = text.replace(
              old_call,
              'if let Err(reason) = validate_inbound_block_shape(&block, &chain_id) {'
          )

          old_header_check = 'if item.hash.is_empty() || compute_block_hash(&item.header) != item.hash {'
          new_header_check = '''if item.hash.is_empty()
                          || protocol_block_hash(&item.header, &chain_id).as_deref()
                              != Some(item.hash.as_str())
                      {'''
          assert text.count(old_header_check) == 1, "unexpected Headers hash validation shape"
          text = text.replace(old_header_check, new_header_check)

          path.write_text(text)

      - name: Format exact source delta
        run: cargo fmt --all

      - name: Enforce one-source-file working-tree delta
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t changed < <(git diff --name-only)
          printf 'changed: %s\n' "${changed[@]}"
          test "${#changed[@]}" -eq 1
          test "${changed[0]}" = "crates/pulsedag-p2p/src/lib.rs"
          git diff --check

      - name: P2P tests
        run: cargo test -p pulsedag-p2p --locked

      - name: Node compile control
        run: cargo check -p pulsedagd --locked

      - name: Commit validated source and remove materializer
        shell: bash
        run: |
          set -euo pipefail
          git rm .github/workflows/apply-789-p2p-v2-hash-fix.yml
          git add crates/pulsedag-p2p/src/lib.rs
          git diff --cached --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "fix(p2p): validate v2 block hashes in chain domain"
          git push origin HEAD:fix/v2.4-p2p-v2-header-hash-789
