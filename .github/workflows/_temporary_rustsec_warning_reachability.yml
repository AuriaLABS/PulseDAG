name: Temporary RustSec warning reachability

on:
  push:
    branches:
      - security/2.4.0-warning-disposition
    paths:
      - scripts/analyze_v2_4_0_rustsec_warnings.py
      - .github/workflows/_temporary_rustsec_warning_reachability.yml
  pull_request:
    branches:
      - release/2.4.0
    paths:
      - scripts/analyze_v2_4_0_rustsec_warnings.py
      - .github/workflows/_temporary_rustsec_warning_reachability.yml

permissions:
  contents: read

concurrency:
  group: temporary-rustsec-warning-reachability-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyze:
    name: analyze-${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-24.04
          - windows-2022
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Install pinned Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.88.0

      - name: Analyze node and miner warning reachability
        shell: bash
        run: |
          set -euo pipefail
          evidence_dir="ci-evidence/rustsec-warning-${RUNNER_OS}"
          python scripts/analyze_v2_4_0_rustsec_warnings.py \
            --evidence-dir "${evidence_dir}"
          python - "${evidence_dir}" <<'PY'
          import hashlib
          import pathlib
          import sys

          root = pathlib.Path(sys.argv[1])
          lines = []
          for path in sorted(item for item in root.rglob('*') if item.is_file()):
              digest = hashlib.sha256(path.read_bytes()).hexdigest()
              lines.append(f"{digest}  {path.relative_to(root).as_posix()}")
          (root / 'SHA256SUMS').write_text('\n'.join(lines) + '\n', encoding='utf-8')
          PY

      - name: Upload reachability evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rustsec_warning_reachability_${{ runner.os }}_${{ github.run_id }}
          path: ci-evidence/rustsec-warning-${{ runner.os }}
          if-no-files-found: error
          retention-days: 90
