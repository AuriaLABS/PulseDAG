name: temporary covenant v1 rustfmt

on:
  push:
    branches:
      - codex/issue-1041-covenants-v1-semantics

permissions:
  contents: write

jobs:
  rustfmt:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: codex/issue-1041-covenants-v1-semantics
      - name: Install Rust 1.91.0 rustfmt
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.91.0
          components: rustfmt
      - name: Apply rustfmt
        run: cargo fmt --all
      - name: Commit formatting if needed
        run: |
          if git diff --quiet; then
            echo "No formatting changes required"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add crates/pulsedag-core/src/covenant_v1.rs
          git commit -m "style(core): apply rustfmt to covenant v1"
          git push origin HEAD:codex/issue-1041-covenants-v1-semantics
