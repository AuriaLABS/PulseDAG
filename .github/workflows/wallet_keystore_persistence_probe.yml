name: Wallet keystore persistence probe

on:
  push:
    branches:
      - ci/wallet-keystore-persistence-probe-819
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: wallet-keystore-persistence-probe
  cancel-in-progress: true

jobs:
  persistence-probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - name: Checkout probe
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Install pinned Rust toolchain
        shell: bash
        run: |
          set -euo pipefail
          rustup toolchain install 1.88.0 --profile minimal --component clippy,rustfmt --no-self-update
          rustup default 1.88.0
          rustc --version
          cargo --version

      - name: Resolve persistence dependency against existing lock
        shell: bash
        run: |
          set -euo pipefail
          cargo check -p pulsedag-wallet

      - name: Prove resolved graph is locked
        shell: bash
        run: |
          set -euo pipefail
          cargo metadata --locked --format-version 1 >/dev/null

      - name: Apply rustfmt
        shell: bash
        run: cargo fmt --all

      - name: Prove formatting is clean
        shell: bash
        run: cargo fmt --all -- --check

      - name: Execute wallet tests
        shell: bash
        run: cargo test --locked -p pulsedag-wallet --all-targets

      - name: Clippy wallet crate
        shell: bash
        run: cargo clippy --locked -p pulsedag-wallet --all-targets --no-deps -- -D warnings

      - name: Check patch whitespace
        shell: bash
        run: git diff --check

      - name: Record generated lock and formatted source
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Cargo.lock crates/pulsedag-wallet/Cargo.toml crates/pulsedag-wallet/src/lib.rs crates/pulsedag-wallet/src/keystore_persistence.rs
          if git diff --cached --quiet; then
            echo "No generated/formatted changes to persist"
          else
            git commit -m "wallet: record validated persistence lock and formatting"
            git push
          fi
