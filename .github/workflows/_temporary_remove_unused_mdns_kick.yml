name: Temporary remove unused mDNS kick

on:
  push:
    branches:
      - security/2.4.0-dependency-remediation
    paths:
      - .github/workflows/_temporary_remove_unused_mdns_kick.yml
      - scripts/_temporary_remove_unused_mdns.py

permissions:
  contents: write

concurrency:
  group: temporary-remove-unused-mdns-kick
  cancel-in-progress: true

jobs:
  patch-validate-and-clean:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout remediation branch
        uses: actions/checkout@v4
        with:
          ref: security/2.4.0-dependency-remediation
          fetch-depth: 0

      - name: Install pinned Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.88.0
          components: rustfmt

      - name: Apply dependency remediation
        shell: bash
        run: |
          set -euo pipefail
          python scripts/_temporary_remove_unused_mdns.py
          cargo update -p libp2p --precise 0.56.0
          cargo update -p quinn-proto@0.11.14 --precise 0.11.15
          cargo metadata --locked --format-version 1 >/dev/null
          cargo fmt --all

      - name: Validate dependency and runtime contract
        shell: bash
        run: |
          set -euo pipefail
          cargo test --locked -p pulsedag-p2p
          cargo test --locked -p pulsedagd config::tests
          cargo check --locked -p pulsedag-p2p --all-targets
          cargo check --locked -p pulsedagd --all-targets
          if cargo tree --locked --workspace --all-features --target all -i hickory-proto > /tmp/hickory-tree.txt 2>&1; then
            cat /tmp/hickory-tree.txt
            echo 'hickory-proto remains reachable after removing the unused mDNS feature' >&2
            exit 1
          fi
          grep -A2 'name = "quinn-proto"' Cargo.lock | grep 'version = "0.11.15"'

      - name: Capture remediation evidence
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p ci-evidence/dependency-final-remediation
          cargo tree --locked -p pulsedag-p2p >ci-evidence/dependency-final-remediation/p2p-tree.txt
          cargo tree --locked --workspace --all-features --target all -i quinn-proto \
            >ci-evidence/dependency-final-remediation/quinn-proto.txt || true
          {
            echo "source_sha=${GITHUB_SHA}"
            echo "rustc=$(rustc --version)"
            echo "cargo=$(cargo --version)"
            echo "cargo_lock_sha256=$(sha256sum Cargo.lock | awk '{print $1}')"
            echo "mdns_feature_present=$(grep -c '\"mdns\"' crates/pulsedag-p2p/Cargo.toml || true)"
            echo "hickory_lock_entries=$(grep -c 'name = \"hickory-proto\"' Cargo.lock || true)"
          } >ci-evidence/dependency-final-remediation/provenance.txt
          sha256sum ci-evidence/dependency-final-remediation/* \
            >ci-evidence/dependency-final-remediation/SHA256SUMS

      - name: Publish code-only remediation
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/_temporary_remove_unused_mdns.yml
          rm .github/workflows/_temporary_remove_unused_mdns_kick.yml
          rm scripts/_temporary_remove_unused_mdns.py
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --check
          git commit -m 'security: remove unsupported mDNS dependency'
          git push origin HEAD:security/2.4.0-dependency-remediation

      - name: Upload remediation evidence
        uses: actions/upload-artifact@v4
        with:
          name: dependency_final_remediation_${{ github.run_id }}
          path: ci-evidence/dependency-final-remediation
          if-no-files-found: error
          retention-days: 90
