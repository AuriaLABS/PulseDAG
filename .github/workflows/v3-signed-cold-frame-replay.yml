name: v3 signed cold frame replay (TEST ONLY)

on:
  pull_request:
    branches: [main]
    paths:
      - crates/pulsedag-storage/tests/native_v3_signed_cold_restore_differential.rs
      - .github/workflows/v3-signed-cold-frame-replay.yml
  push:
    branches: [main]
    paths:
      - crates/pulsedag-storage/tests/native_v3_signed_cold_restore_differential.rs
      - .github/workflows/v3-signed-cold-frame-replay.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  isolated-signed-replay-after-cold-reopen:
    runs-on: ubuntu-24.04
    timeout-minutes: 55
    env:
      CARGO_INCREMENTAL: "0"
      CARGO_BUILD_JOBS: "2"
    steps:
      - name: Checkout exact SHA without credentials
        uses: actions/checkout@v4
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Assert exact SHA
        shell: bash
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
      - name: Install Rust 1.91.0
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.91.0"
          components: rustfmt, clippy
      - name: Strict rustfmt
        run: cargo fmt --all -- --check
      - name: Real PoW and Ed25519 signed replay cold RocksDB differential
        run: cargo test --locked -p pulsedag-storage --test native_v3_signed_cold_restore_differential -- --nocapture
      - name: Strict Clippy
        run: cargo clippy --locked -p pulsedag-storage --test native_v3_signed_cold_restore_differential -- -D warnings
      - name: Ensure lockfile remains unchanged
        run: git diff --exit-code -- Cargo.lock
