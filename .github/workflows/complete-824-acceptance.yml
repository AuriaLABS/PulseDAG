name: complete-824-acceptance

on:
  push:
    branches:
      - fix/2.4.x-prune-boundary-824

permissions:
  contents: write

jobs:
  complete:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply acceptance completion
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/complete_824_acceptance.py
          cargo fmt --all
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "test: complete #824 retained-history acceptance"
          git push origin HEAD:fix/2.4.x-prune-boundary-824
      - name: Focused #824 validation
        shell: bash
        run: |
          set -euo pipefail
          cargo test -p pulsedag-p2p prune_boundary --locked
          cargo test -p pulsedagd retained_history_boundary --locked
          cargo test -p pulsedagd prune_boundary --locked
