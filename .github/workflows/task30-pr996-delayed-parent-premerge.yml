name: Task30 PR996 delayed-parent premerge

on:
  pull_request:
    branches:
      - main
    paths:
      - .github/workflows/task30-pr996-delayed-parent-premerge.yml

permissions:
  contents: read

env:
  CANDIDATE_SHA: 5e0a97d143faa7e85838873d11e937c44976820e

jobs:
  delayed-parent-selected-segment:
    name: PR996 exact-head delayed-parent K5
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout execution-only control plane
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          path: control-plane
          persist-credentials: false
      - name: Checkout exact PR996 product candidate
        uses: actions/checkout@v4
        with:
          ref: ${{ env.CANDIDATE_SHA }}
          path: candidate
          persist-credentials: false
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
      - name: Cache candidate cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: candidate -> target
      - name: Verify exact candidate and prepare explicit K5 harness
        env:
          ADAPT_DIR: ${{ runner.temp }}/task30-pr996-premerge/delayed-parent-adaptation
        run: |
          set -euo pipefail
          test "$(git -C candidate rev-parse HEAD)" = "$CANDIDATE_SHA"
          test -z "$(git -C candidate status --porcelain)"
          test -z "$(git -C control-plane status --porcelain)"
          mkdir -p "$ADAPT_DIR"
          python3 control-plane/.github/task30-control/adapt_harness.py lag "$GITHUB_WORKSPACE/candidate" "$ADAPT_DIR/runtime-harness.sh"
          bash -n "$ADAPT_DIR/runtime-harness.sh"
          test -s "$ADAPT_DIR/harness.diff"
          test -s "$ADAPT_DIR/SHA256SUMS"
          test -z "$(git -C candidate status --porcelain)"
      - name: Run delayed-parent selected-segment runtime regression
        working-directory: candidate
        env:
          OUT_DIR: ${{ runner.temp }}/task30-pr996-premerge/lag-selected-segment
          RUN_ID: ${{ github.run_id }}-${{ github.run_attempt }}-pr996-premerge
          MIN_SELECTED_GAP: 64
          CI_MODE: 0
          V2_3_0_RUNTIME_HARNESS: ${{ runner.temp }}/task30-pr996-premerge/delayed-parent-adaptation/runtime-harness.sh
        run: |
          set -euo pipefail
          bash scripts/v2_3_0_lag_injection_selected_segment.sh
          jq -e '
            .result == "PASS" and
            .evidence_kind == "runtime" and
            .candidate_commit == env.CANDIDATE_SHA and
            .closeout_eligible == true and
            .node_count == 5 and
            .external_miners == 4 and
            .observed_network_selected_height_gap >= 64 and
            .final_convergence == true and
            .storage_memory_consistent == true and
            .pending_selected_segment_requests == 0 and
            .final_orphan_count == 0 and
            .final_missing_parent_blockers == 0 and
            .public_testnet_ready == false
          ' "$OUT_DIR/evidence_manifest.json" >/dev/null
          test -z "$(git status --porcelain)"
      - name: Upload exact-head delayed-parent evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: task30-pr996-premerge-delayed-parent-${{ env.CANDIDATE_SHA }}
          path: |
            ${{ runner.temp }}/task30-pr996-premerge/lag-selected-segment
            ${{ runner.temp }}/task30-pr996-premerge/delayed-parent-adaptation
          if-no-files-found: error
          retention-days: 30
