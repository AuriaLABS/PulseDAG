name: Task 27 frontier peer guard

on:
  push:
    branches:
      - agent/task27-frontier-reconcile-fetch

permissions:
  contents: write

jobs:
  apply-peer-guard:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: agent/task27-frontier-reconcile-fetch
          fetch-depth: 0

      - name: Apply exact peer guard edits
        run: python3 .github/task27_frontier_peer_guard.py

      - name: Remove one-shot editor files
        run: rm .github/task27_frontier_peer_guard.py .github/workflows/task27-frontier-peer-guard.yml

      - name: Format and validate patch shape
        run: |
          cargo fmt --all
          git diff --check
          git diff --stat
          git diff -- apps/pulsedagd/src/main.rs apps/pulsedagd/src/block_request.rs | sed -n '1,360p'

      - name: Commit exact source edit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "node: enforce strict per-peer frontier fetch bounds"
          git push origin HEAD:agent/task27-frontier-reconcile-fetch
