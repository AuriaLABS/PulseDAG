name: Task38 Phase14 apply once

on:
  push:
    branches:
      - codex/issue-1038-opencl-worker-recovery-phase14
    paths:
      - "scripts/task38_phase14_patch.py"
      - ".github/workflows/task38-phase14-apply-once.yml"

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: codex/issue-1038-opencl-worker-recovery-phase14

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.91.0
          components: rustfmt,clippy

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Apply Phase14 patch
        run: python3 scripts/task38_phase14_patch.py

      - name: Format
        run: cargo fmt --all

      - name: OpenCL worker recovery contracts
        run: cargo test --locked -p pulsedag-miner --features gpu --lib opencl_backend::tests

      - name: Scheduler regression contracts
        run: cargo test --locked -p pulsedag-miner --features gpu --lib accelerator_scheduler_runtime::tests

      - name: Preserve OpenCL driver contract
        run: cargo test --locked -p pulsedag-miner --features gpu --test opencl_driver_launch_contract

      - name: Strict GPU Clippy
        run: cargo clippy --locked -p pulsedag-miner --features gpu --all-targets -- -D warnings

      - name: Audit Phase14 scope
        shell: bash
        run: |
          set -euo pipefail
          grep -q 'AcceleratorSchedule::build' apps/pulsedag-miner/src/opencl_backend.rs
          grep -q 'redistribute_failed_device' apps/pulsedag-miner/src/opencl_backend.rs
          grep -q 'recover_unavailable_workers' apps/pulsedag-miner/src/opencl_backend.rs
          grep -q 'failed_worker_is_isolated_replays_batch_and_recovers_next_job' apps/pulsedag-miner/src/opencl_backend.rs
          ! grep -q 'GPU_MINING_AMD_PASS=true' apps/pulsedag-miner/src/opencl_backend.rs
          ! grep -q 'GPU_MINING_NVIDIA_PASS=true' apps/pulsedag-miner/src/opencl_backend.rs

      - name: Commit functional tree and remove helpers
        shell: bash
        run: |
          set -euo pipefail
          rm scripts/task38_phase14_patch.py .github/workflows/task38-phase14-apply-once.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "miner: isolate and recover OpenCL workers for #1038"
          git push origin HEAD:codex/issue-1038-opencl-worker-recovery-phase14
