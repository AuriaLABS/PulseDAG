name: temporary 1036 evidence exact-head verify

on:
  push:
    branches:
      - codex/1036-evidence-exact-head-verify
    paths:
      - .github/workflows/tmp-1036-evidence-exact-head-verify.yml

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact PR candidate
        uses: actions/checkout@v4
        with:
          ref: babd82f770f843716e2a0ea3984fdd65718e9d2d
          fetch-depth: 1
      - name: Verify exact candidate SHA
        run: test "$(git rev-parse HEAD)" = "babd82f770f843716e2a0ea3984fdd65718e9d2d"
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - name: Restart reconstruction determinism
        run: cargo test --locked -p pulsedag-storage --test v3_mempool_restart_determinism -- --nocapture
      - name: DAG arrival-order determinism
        run: cargo test --locked -p pulsedag-core --test v3_mempool_dag_reorder_determinism -- --nocapture
      - name: Clippy exact evidence targets
        run: |
          cargo clippy --locked -p pulsedag-storage --test v3_mempool_restart_determinism -- -D warnings
          cargo clippy --locked -p pulsedag-core --test v3_mempool_dag_reorder_determinism -- -D warnings
