name: v3 direct GetBlock Swarm lifecycle (NO GO)

on:
  pull_request:
    paths:
      - crates/pulsedag-p2p/src/lib.rs
      - crates/pulsedag-p2p/src/messages/direct_getblock_swarm_bindings_v1.rs
      - .github/workflows/v3-direct-getblock-swarm-lifecycle-probe.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  bound-to-real-swarm-lifecycle:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Fail closed on accidental network or contract activation
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
          grep -Fq 'let mut direct_getblock_bindings =' crates/pulsedag-p2p/src/lib.rs
          grep -Fq 'match DirectGetBlockSwarmBindingsV1::new(&cfg.chain_id, *swarm.local_peer_id())' crates/pulsedag-p2p/src/lib.rs
          grep -Fq 'direct_getblock_bindings.last_connection_closed(&peer_id)' crates/pulsedag-p2p/src/lib.rs
          grep -Fq 'direct_getblock_bindings.expire(std::time::Instant::now())' crates/pulsedag-p2p/src/lib.rs
          grep -Fq 'direct_getblock_bindings.accept_response(' crates/pulsedag-p2p/src/lib.rs
          grep -Fq 'summarize_unapproved_direct_getblock_event_v1(&event)' crates/pulsedag-p2p/src/lib.rs
          grep -Fq 'ProtocolSupport::Outbound' crates/pulsedag-p2p/src/lib.rs
          if grep -Fq 'ProtocolSupport::Full' crates/pulsedag-p2p/src/lib.rs; then
            echo "::error::unreviewed inbound GetBlock service"
            exit 1
          fi
          if grep -Fq '.direct_getblock.send_request(' crates/pulsedag-p2p/src/lib.rs; then
            echo "::error::unreviewed direct GetBlock production send"
            exit 1
          fi
          grep -Fq 'PULSEDAG_CONTRACTS_ENABLED=false' configs/public-testnet/node.env.template
      - name: Pin Rust 1.91
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: '1.91.0'
      - name: Compile real Swarm event variants, lifecycle and no-activation tests
        run: |
          set -euo pipefail
          cargo check --locked -p pulsedag-p2p --all-targets
          cargo test --locked -p pulsedag-p2p --lib direct_getblock_swarm_bindings_v1 -- --nocapture
          cargo test --locked -p pulsedag-p2p --lib direct_getblock_swarm_event_sanitization_tests -- --nocapture
          cargo fmt --all -- --check
          git diff --exit-code -- Cargo.lock
