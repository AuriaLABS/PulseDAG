name: Historical v2.3 observability compon:
  workflow_dispatch:

ml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  observability-contract:
    runs-on: ubuntu-24.04
    env:
      CANDIDATE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@v4
        with:
          ref: ${{ env.CANDIDATE_SHA }}
          persist-credentials: false

      - name: Preserve current release and historical compatibility guardrails
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${CANDIDATE_SHA}"
          test "$(tr -d '\r\n' < VERSION)" = "v3.0.0"
          test "$(awk '/^version = / {gsub(/"/, "", $3); print $3; exit}' Cargo.toml)" = "3.0.0"
          grep -Fq '"release_line": "v2.3.0"' ops/observability/v2.3.0/metrics-inventory.json
          grep -Fq 'SUPPORTED_RELEASE_LINES' scripts/private_testnet/runtime_metrics_exporter.py
          grep -Fq '"v2.3.0"' scripts/private_testnet/runtime_metrics_exporter.py
          grep -Fq '"v2.4.0"' scripts/private_testnet/runtime_metrics_exporter.py
          grep -Fq '`public_testnet_ready=false`' README.md
          grep -Fq '`thirty_day_public_testnet_clock_started=false`' README.md
          mkdir -p ci-evidence/v3.0.0-observability

      - name: Validate syntax and English comments
        shell: bash
        run: |
          set -euo pipefail
          python3 -m py_compile \
            scripts/private_testnet/runtime_metrics_exporter.py \
            scripts/validate_observability_package.py \
            scripts/validate_v2_3_0_observability.py
          bash -n scripts/tests/test_v2_3_0_observability.sh
          python3 scripts/check_code_comment_language.py \
            scripts/private_testnet/runtime_metrics_exporter.py \
            scripts/validate_observability_package.py \
            scripts/validate_v2_3_0_observability.py \
            scripts/tests/test_v2_3_0_observability.sh

      - name: Run historical v2.3 observability regression
        shell: bash
        run: |
          set -euo pipefail
          bash scripts/tests/test_v2_3_0_observability.sh \
            | tee ci-evidence/v3.0.0-observability/observability-contract.log

      - name: Run repository hygiene
        shell: bash
        run: bash scripts/repository_hygiene.sh --strict

      - name: Build compatibility evidence manifest
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path

          output = Path("ci-evidence/v3.0.0-observability")
          manifest = {
              "gate": "v3.0.0-observability-compatibility",
              "candidate_sha": os.environ["CANDIDATE_SHA"],
              "current_release_line": "v3.0.0",
              "historical_inventory_line": "v2.3.0",
              "result": "PASS",
              "historical_regression_preserved": True,
              "rust_field_grounded": True,
              "prometheus_exporter": True,
              "five_node_scrape": True,
              "grafana_dashboard": True,
              "alert_rules": True,
              "runbook_links_valid": True,
              "sensitive_labels_excluded": True,
              "public_testnet_ready": False,
              "thirty_day_public_testnet_clock_started": False,
          }
          (output / "observability-manifest.json").write_text(
              json.dumps(manifest, indent=2) + "\n",
              encoding="utf-8",
          )
          PY
          sha256sum \
            ops/observability/v2.3.0/* \
            scripts/private_testnet/runtime_metrics_exporter.py \
            scripts/tests/test_v2_3_0_observability.sh \
            scripts/validate_v2_3_0_observability.py \
            ci-evidence/v3.0.0-observability/observability-contract.log \
            ci-evidence/v3.0.0-observability/observability-manifest.json \
            > ci-evidence/v3.0.0-observability/SHA256SUMS

      - name: Enforce compatibility manifest
        shell: bash
        run: |
          set -euo pipefail
          jq -e '
            .gate == "v3.0.0-observability-compatibility" and
            .candidate_sha == env.CANDIDATE_SHA and
            .current_release_line == "v3.0.0" and
            .historical_inventory_line == "v2.3.0" and
            .result == "PASS" and
            .historical_regression_preserved == true and
            .rust_field_grounded == true and
            .prometheus_exporter == true and
            .five_node_scrape == true and
            .grafana_dashboard == true and
            .alert_rules == true and
            .runbook_links_valid == true and
            .sensitive_labels_excluded == true and
            .public_testnet_ready == false and
            .thirty_day_public_testnet_clock_started == false
          ' ci-evidence/v3.0.0-observability/observability-manifest.json >/dev/null

      - name: Upload compatibility evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v3_0_0_observability_compatibility_${{ github.run_id }}
          path: ci-evidence/v3.0.0-observability
          if-no-files-found: error
          retention-days: 90
