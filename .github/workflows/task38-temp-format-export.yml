name: Task38 temporary rustfmt apply

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  rustfmt-apply:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout exact PR branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          persist-credentials: true

      - name: Install Rust 1.91 rustfmt
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.91.0
          components: rustfmt

      - name: Apply workspace rustfmt
        run: cargo fmt --all

      - name: Commit exact rustfmt output if needed
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet; then
            echo "rustfmt_already_clean=PASS"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/pulsedag-miner/src/opencl_driver_launch.rs \
                  apps/pulsedag-miner/tests/opencl_driver_launch_contract.rs
          git commit -m "style: apply rustfmt to Task38 phase10"
          git push origin "HEAD:${{ github.event.pull_request.head.ref }}"
