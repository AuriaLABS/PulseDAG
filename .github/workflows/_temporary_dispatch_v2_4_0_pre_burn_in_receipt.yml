name: Temporary traceable v2.4.0 candidate validation dispatch

on:
  push:
    branches:
      - release/2.4.0
    paths:
      - .github/workflows/_temporary_dispatch_v2_4_0_pre_burn_in_receipt.yml

permissions:
  contents: write
  actions: write
  issues: write

concurrency:
  group: temporary-traceable-v2-4-0-candidate-dispatch
  cancel-in-progress: false

jobs:
  cleanup-dispatch-and-record:
    if: github.repository == 'AuriaLABS/PulseDAG'
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout release branch
        uses: actions/checkout@v4
        with:
          ref: release/2.4.0
          fetch-depth: 0

      - name: Remove temporary workflow and publish exact candidate
        id: candidate
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          rm .github/workflows/_temporary_dispatch_v2_4_0_pre_burn_in_receipt.yml
          git add -A
          git commit -m 'ci: freeze traceable v2.4.0 burn-in candidate'
          git push origin HEAD:release/2.4.0
          candidate_sha="$(git rev-parse HEAD)"
          remote_sha="$(git ls-remote origin refs/heads/release/2.4.0 | awk '{print $1}')"
          test "$candidate_sha" = "$remote_sha"
          echo "candidate_sha=$candidate_sha" >> "$GITHUB_OUTPUT"

      - name: Dispatch exact pre-burn-in verification
        id: dispatch
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          CANDIDATE_SHA: ${{ steps.candidate.outputs.candidate_sha }}
        run: |
          set -euo pipefail
          api='https://api.github.com/repos/AuriaLABS/PulseDAG'
          headers=(
            --header 'Accept: application/vnd.github+json'
            --header "Authorization: Bearer ${GH_TOKEN}"
            --header 'X-GitHub-Api-Version: 2022-11-28'
          )
          curl --fail-with-body --silent --show-error --location \
            --request POST "${headers[@]}" \
            "$api/actions/workflows/pre-release-verification.yml/dispatches" \
            --data '{"ref":"release/2.4.0","inputs":{"release_tag":"v2.4.0"}}'

          run_id=''
          for _ in $(seq 1 30); do
            response="$(curl --fail --silent --show-error --location "${headers[@]}" \
              "$api/actions/workflows/pre-release-verification.yml/runs?branch=release%2F2.4.0&event=workflow_dispatch&per_page=20")"
            run_id="$(jq -r --arg sha "$CANDIDATE_SHA" \
              '.workflow_runs[] | select(.head_sha == $sha) | .id' <<<"$response" | head -n1)"
            if [[ -n "$run_id" && "$run_id" != null ]]; then
              break
            fi
            sleep 2
          done
          test -n "$run_id"
          test "$run_id" != null
          echo "run_id=$run_id" >> "$GITHUB_OUTPUT"

      - name: Record candidate and run on issue 789
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          CANDIDATE_SHA: ${{ steps.candidate.outputs.candidate_sha }}
          RUN_ID: ${{ steps.dispatch.outputs.run_id }}
        run: |
          set -euo pipefail
          body="$(printf '%s\n' \
            'Exact combined v2.4.0 burn-in candidate frozen and dispatched for full validation.' \
            '' \
            "- Branch: \`release/2.4.0\`" \
            "- Candidate SHA: \`${CANDIDATE_SHA}\`" \
            "- Pre-burn-in workflow run: \`${RUN_ID}\`" \
            "- Run URL: https://github.com/AuriaLABS/PulseDAG/actions/runs/${RUN_ID}" \
            '- Includes merged fixes from #790 and #791.' \
            '- Temporary dispatch workflow removed before the candidate SHA was published.' \
            '' \
            'Do not start or combine operational burn-in evidence until this exact run completes successfully.')"
          jq -n --arg body "$body" '{body: $body}' > /tmp/comment.json
          curl --fail-with-body --silent --show-error --location \
            --request POST \
            --header 'Accept: application/vnd.github+json' \
            --header "Authorization: Bearer ${GH_TOKEN}" \
            --header 'X-GitHub-Api-Version: 2022-11-28' \
            https://api.github.com/repos/AuriaLABS/PulseDAG/issues/789/comments \
            --data-binary @/tmp/comment.json
