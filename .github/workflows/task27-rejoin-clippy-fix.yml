name: Task 27 rejoin Clippy cleanup

on:
  push:
    branches:
      - agent/task27-rejoin-runtime-work

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: agent/task27-rejoin-runtime-work
          fetch-depth: 0

      - name: Apply exact Clippy cleanup
        run: python3 .github/task27_rejoin_clippy_fix.py

      - name: Remove one-shot editor files
        run: rm .github/task27_rejoin_clippy_fix.py .github/workflows/task27-rejoin-clippy-fix.yml

      - name: Format and validate patch
        run: |
          cargo fmt --all
          git diff --check
          git diff --stat
          git diff -- apps/pulsedagd/src/main.rs

      - name: Commit exact source edit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "test: satisfy Clippy in Task 27 rejoin regression"
          git push origin HEAD:agent/task27-rejoin-runtime-work
