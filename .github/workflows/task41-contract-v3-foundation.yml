name: Task 41 contract v3 foundation

on:
  pull_request:
    branches:
      - main
    paths:
      - '.github/workflows/task41-contract-v3-foundation.yml'
      - 'crates/pulsedag-core/src/contract_v3.rs'
      - 'crates/pulsedag-core/src/lib.rs'
      - 'docs/CONTRACT_TRANSACTION_V3_FOUNDATION.md'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  contract-v3-foundation:
    name: exact-head contract v3 compatibility gate
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CANDIDATE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}

    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 1

      - name: Verify exact SHA and clean checkout
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$CANDIDATE_SHA"
          test -z "$(git status --porcelain)"

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.91.0
          components: rustfmt, clippy

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Validate locked dependency graph
        run: cargo metadata --locked --format-version 1 >/dev/null

      - name: Formatting
        run: cargo fmt --all -- --check

      - name: Focused contract v3 tests
        run: cargo test --locked -p pulsedag-core contract_v3::tests:: -- --nocapture

      - name: Core transaction and protocol compatibility tests
        run: cargo test --locked -p pulsedag-core

      - name: Clippy
        run: cargo clippy --locked -p pulsedag-core --all-targets -- -D warnings

      - name: Verify clean candidate after checks
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$CANDIDATE_SHA"
          test -z "$(git status --porcelain)"
