name: one-shot fix 811 directed headers

on:
  push:
    branches:
      - fix/rejoin-catchup-stall-811

permissions:
  contents: write

jobs:
  patch-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable

      - name: Apply peer-directed selected-header recovery
        shell: python
        run: |
          from pathlib import Path
          import re

          def sub1(text, pattern, replacement, label, flags=re.S):
              updated, count = re.subn(pattern, lambda _m: replacement, text, count=1, flags=flags)
              if count != 1:
                  raise SystemExit(f"{label}: expected 1 match, found {count}")
              return updated

          def subn_exact(text, pattern, replacement, expected, label, flags=re.S):
              updated, count = re.subn(pattern, lambda _m: replacement, text, flags=flags)
              if count != expected:
                  raise SystemExit(f"{label}: expected {expected} matches, found {count}")
              return updated

          def insert_before_test(text, test_name, addition, label):
              pos = text.index(f"fn {test_name}")
              attr = text.rfind("    #[test]", 0, pos)
              if attr < 0:
                  raise SystemExit(f"{label}: test attribute anchor not found")
              return text[:attr] + addition + text[attr:]

          def add_arg_to_first_request_after(text, anchor, arg, label):
              start = text.index(anchor)
              call = text.find(".request_headers(", start)
              if call < 0:
                  raise SystemExit(f"{label}: request_headers call not found")
              open_end = call + len(".request_headers(")
              return text[:call] + ".request_headers_from(\n" + arg + text[open_end:]

          # Wire schema: directed target is optional so old GetHeaders JSON still decodes.
          messages_path = Path("crates/pulsedag-p2p/src/messages.rs")
          messages = messages_path.read_text()
          messages = sub1(
              messages,
              r"GetHeaders \{\s*chain_id: String,\s*locator: Vec<Hash>,\s*stop_hash: Option<Hash>,\s*limit: usize,\s*\},",
              '''GetHeaders {
                  chain_id: String,
                  locator: Vec<Hash>,
                  stop_hash: Option<Hash>,
                  limit: usize,
                  #[serde(default)]
                  requested_peer_id: Option<String>,
              },''',
              "GetHeaders wire field",
          )
          messages = sub1(
              messages,
              r'''NetworkMessage::GetHeaders \{\s*chain_id: "testnet"\.into\(\),\s*locator: vec!\["parent"\.into\(\)\],\s*stop_hash: Some\(block\.hash\.clone\(\)\),\s*limit: 64,\s*\},''',
              '''NetworkMessage::GetHeaders {
                      chain_id: "testnet".into(),
                      locator: vec!["parent".into()],
                      stop_hash: Some(block.hash.clone()),
                      limit: 64,
                      requested_peer_id: None,
                  },''',
              "GetHeaders test constructor",
          )
          compat_test = '''    #[test]
              fn get_headers_target_is_optional_for_wire_compatibility() {
                  let legacy = br#"{\"type\":\"GetHeaders\",\"chain_id\":\"testnet\",\"locator\":[\"parent\"],\"stop_hash\":null,\"limit\":64}"#;
                  let decoded: NetworkMessage = serde_json::from_slice(legacy).expect("legacy GetHeaders");
                  match decoded {
                      NetworkMessage::GetHeaders { requested_peer_id, .. } => {
                          assert_eq!(requested_peer_id, None);
                      }
                      _ => panic!("unexpected message"),
                  }

                  let directed = NetworkMessage::GetHeaders {
                      chain_id: "testnet".into(),
                      locator: vec!["parent".into()],
                      stop_hash: None,
                      limit: 64,
                      requested_peer_id: Some("peer-a".into()),
                  };
                  let encoded = serde_json::to_vec(&directed).expect("directed GetHeaders serializes");
                  let decoded: NetworkMessage = serde_json::from_slice(&encoded).expect("directed GetHeaders decodes");
                  match decoded {
                      NetworkMessage::GetHeaders { requested_peer_id, .. } => {
                          assert_eq!(requested_peer_id.as_deref(), Some("peer-a"));
                      }
                      _ => panic!("unexpected message"),
                  }
              }

          '''
          messages = insert_before_test(
              messages,
              "rejects_malformed_payloads_during_decode",
              compat_test,
              "wire compatibility regression",
          )
          messages_path.write_text(messages)

          # P2P transport.
          p2p_path = Path("crates/pulsedag-p2p/src/lib.rs")
          p2p = p2p_path.read_text()

          p2p = sub1(
              p2p,
              r'''fn request_headers\(\s*&self,\s*_locator: &\[PulseHash\],\s*_stop_hash: Option<&PulseHash>,\s*_limit: usize,\s*\) -> Result<\(\), PulseError> \{\s*Ok\(\(\)\)\s*\}''',
              '''fn request_headers(
                  &self,
                  _locator: &[PulseHash],
                  _stop_hash: Option<&PulseHash>,
                  _limit: usize,
              ) -> Result<(), PulseError> {
                  Ok(())
              }
              fn request_headers_from(
                  &self,
                  _peer_id: &str,
                  _locator: &[PulseHash],
                  _stop_hash: Option<&PulseHash>,
                  _limit: usize,
              ) -> Result<(), PulseError> {
                  Err(PulseError::Internal(
                      "peer-addressed GetHeaders is not supported by this p2p handle".into(),
                  ))
              }''',
              "P2pHandle request_headers_from",
          )

          p2p = sub1(
              p2p,
              r'''GetHeaders \{\s*locator: Vec<PulseHash>,\s*stop_hash: Option<PulseHash>,\s*limit: usize,\s*\},''',
              '''GetHeaders {
                  locator: Vec<PulseHash>,
                  stop_hash: Option<PulseHash>,
                  limit: usize,
                  requested_peer_id: Option<String>,
              },''',
              "Outbound GetHeaders target",
          )

          p2p = sub1(
              p2p,
              r'''OutboundMessage::GetHeaders \{\s*locator,\s*stop_hash,\s*limit,\s*\} => \{\s*queue\.blocks\.push_back\(OutboundMessage::GetHeaders \{\s*locator,\s*stop_hash,\s*limit,\s*\}\);\s*\}''',
              '''OutboundMessage::GetHeaders {
                  locator,
                  stop_hash,
                  limit,
                  requested_peer_id,
              } => {
                  queue.blocks.push_back(OutboundMessage::GetHeaders {
                      locator,
                      stop_hash,
                      limit,
                      requested_peer_id,
                  });
              }''',
              "priority queue target preservation",
          )

          p2p = subn_exact(
              p2p,
              r'OutboundMessage::GetHeaders \{ locator, stop_hash, limit \} => \{',
              'OutboundMessage::GetHeaders { locator, stop_hash, limit, requested_peer_id } => {',
              2,
              "runtime GetHeaders arms",
              flags=0,
          )
          p2p = subn_exact(
              p2p,
              re.escape('let message_id = format!("sync:get-headers:{}:{stop_part}:{limit}", locator.join(","));'),
              'let target_part = requested_peer_id.as_deref().unwrap_or("broadcast");\n                        let message_id = format!("sync:get-headers:{target_part}:{}:{stop_part}:{limit}", locator.join(","));',
              2,
              "runtime GetHeaders message ids",
              flags=0,
          )
          p2p = subn_exact(
              p2p,
              re.escape('let wire = serde_json::to_vec(&NetworkMessage::GetHeaders { chain_id: cfg.chain_id.clone(), locator, stop_hash, limit });'),
              'let wire = serde_json::to_vec(&NetworkMessage::GetHeaders { chain_id: cfg.chain_id.clone(), locator, stop_hash, limit, requested_peer_id });',
              2,
              "runtime GetHeaders wire encoding",
              flags=0,
          )

          p2p = sub1(
              p2p,
              r'''NetworkMessage::GetHeaders \{\s*chain_id,\s*locator,\s*stop_hash,\s*limit,\s*\} => \{''',
              '''NetworkMessage::GetHeaders {
                  chain_id,
                  locator,
                  stop_hash,
                  limit,
                  requested_peer_id,
              } => {''',
              "dispatcher GetHeaders target",
          )
          arm_start = p2p.index("NetworkMessage::GetHeaders {\n            chain_id,")
          count_line = p2p.index("guard.inbound_messages += 1;", arm_start)
          gate_at = p2p.rfind("            if let Ok(mut guard) = inner.lock() {", arm_start, count_line)
          if gate_at < 0:
              raise SystemExit("GetHeaders target gate insertion point missing")
          target_gate = '''            if requested_peer_id.as_ref().is_some_and(|peer| {
                  inner
                      .lock()
                      .map(|guard| peer != &guard.peer_id)
                      .unwrap_or(true)
              }) {
                  return;
              }
          '''
          p2p = p2p[:gate_at] + target_gate + p2p[gate_at:]

          # Memory handle forwards the directed API to its simulated broadcast implementation.
          memory_start = p2p.index("impl P2pHandle for MemoryP2pHandle")
          memory_req = p2p.index("    fn request_headers(", memory_start)
          memory_send = p2p.index("    fn send_headers(", memory_req)
          memory_directed = '''    fn request_headers_from(
              &self,
              _peer_id: &str,
              locator: &[PulseHash],
              stop_hash: Option<&PulseHash>,
              limit: usize,
          ) -> Result<(), PulseError> {
              self.request_headers(locator, stop_hash, limit)
          }

          '''
          p2p = p2p[:memory_send] + memory_directed + p2p[memory_send:]

          # Libp2p broadcast GetHeaders explicitly has no target.
          lib_start = p2p.index("impl P2pHandle for Libp2pHandle")
          lib_req = p2p.index("    fn request_headers(", lib_start)
          lib_send = p2p.index("    fn send_headers(", lib_req)
          section = p2p[lib_req:lib_send]
          section = sub1(
              section,
              r'''OutboundMessage::GetHeaders \{\s*locator: locator\.to_vec\(\),\s*stop_hash: stop_hash\.cloned\(\),\s*limit,\s*\},''',
              '''OutboundMessage::GetHeaders {
                      locator: locator.to_vec(),
                      stop_hash: stop_hash.cloned(),
                      limit,
                      requested_peer_id: None,
                  },''',
              "broadcast GetHeaders target None",
          )
          p2p = p2p[:lib_req] + section + p2p[lib_send:]

          lib_start = p2p.index("impl P2pHandle for Libp2pHandle")
          lib_req = p2p.index("    fn request_headers(", lib_start)
          lib_send = p2p.index("    fn send_headers(", lib_req)
          lib_directed = '''    fn request_headers_from(
              &self,
              peer_id: &str,
              locator: &[PulseHash],
              stop_hash: Option<&PulseHash>,
              limit: usize,
          ) -> Result<(), PulseError> {
              {
                  let mut inner = self
                      .inner
                      .lock()
                      .map_err(|_| PulseError::Internal("p2p lock poisoned".into()))?;
                  if inner.active_connections.get(peer_id).copied().unwrap_or(0) == 0 {
                      return Err(PulseError::Internal(format!(
                          "peer {peer_id} is not a direct request-capable session"
                      )));
                  }
                  inner.header_requests_sent = inner.header_requests_sent.saturating_add(1);
              }
              self.queue_sync_message(
                  OutboundMessage::GetHeaders {
                      locator: locator.to_vec(),
                      stop_hash: stop_hash.cloned(),
                      limit,
                      requested_peer_id: Some(peer_id.to_string()),
                  },
                  "get-headers-from",
              )
          }

          '''
          p2p = p2p[:lib_send] + lib_directed + p2p[lib_send:]

          p2p_tests = '''    #[test]
              fn peer_addressed_get_headers_preserves_target_peer() {
                  let (outbound_tx, mut outbound_rx) = mpsc::unbounded_channel();
                  let inner = Arc::new(Mutex::new(InnerState {
                      active_connections: HashMap::from([("peer-a".to_string(), 1)]),
                      ..InnerState::default()
                  }));
                  let handle = Libp2pHandle { inner, outbound_tx };
                  handle
                      .request_headers_from("peer-a", &["local-tip".to_string()], None, 128)
                      .expect("connected target should accept directed GetHeaders");
                  match outbound_rx.try_recv().expect("queued directed GetHeaders") {
                      OutboundMessage::GetHeaders { requested_peer_id, locator, limit, .. } => {
                          assert_eq!(requested_peer_id.as_deref(), Some("peer-a"));
                          assert_eq!(locator, vec!["local-tip".to_string()]);
                          assert_eq!(limit, 128);
                      }
                      _ => panic!("unexpected outbound message"),
                  }
              }

              #[test]
              fn directed_get_headers_is_ignored_by_non_target_peer() {
                  let wire = serde_json::to_vec(&NetworkMessage::GetHeaders {
                      chain_id: "testnet".to_string(),
                      locator: vec!["local-tip".to_string()],
                      stop_hash: None,
                      limit: 128,
                      requested_peer_id: Some("peer-a".to_string()),
                  })
                  .expect("wire");

                  let inner_a = Arc::new(Mutex::new(InnerState {
                      chain_id: "testnet".to_string(),
                      peer_id: "peer-a".to_string(),
                      ..InnerState::default()
                  }));
                  let (tx_a, mut rx_a) = mpsc::unbounded_channel();
                  dispatch_network_message("testnet", &wire, Some("requester"), &inner_a, &tx_a);
                  assert!(matches!(rx_a.try_recv(), Ok(InboundEvent::GetHeaders { .. })));

                  let inner_b = Arc::new(Mutex::new(InnerState {
                      chain_id: "testnet".to_string(),
                      peer_id: "peer-b".to_string(),
                      ..InnerState::default()
                  }));
                  let (tx_b, mut rx_b) = mpsc::unbounded_channel();
                  dispatch_network_message("testnet", &wire, Some("requester"), &inner_b, &tx_b);
                  assert!(rx_b.try_recv().is_err());
                  assert_eq!(inner_b.lock().unwrap().header_requests_received, 0);
              }

          '''
          p2p = insert_before_test(
              p2p,
              "connected_peers_truth_flag_is_mode_dependent",
              p2p_tests,
              "P2P directed header regressions",
          )
          p2p_path.write_text(p2p)

          # pulsedagd selected-segment recovery uses the peer selected from tip inventory.
          main_path = Path("apps/pulsedagd/src/main.rs")
          main = main_path.read_text()
          commit_anchor = "fn commit_candidate_chain_state("
          helper = '''fn pending_selected_locator_accepts_response_peer(
              pending: Option<&PendingSelectedLocator>,
              response_peer: Option<&str>,
          ) -> bool {
              let (Some(pending), Some(response_peer)) = (pending, response_peer) else {
                  return false;
              };
              pending.peer_id == "broadcast-observed-block-gap" || pending.peer_id == response_peer
          }

          '''
          main = main.replace(commit_anchor, helper + commit_anchor, 1)

          main = sub1(
              main,
              r'''let selected_session_owns_headers = selected_headers_own_broadcast_locator\(\s*selected_segment_session\.is_some\(\),\s*selected_locator_pending,\s*peer_id\.as_deref\(\),\s*session_correlated,\s*\) && \(session_correlated\s*\|\| pending_locator_matches_common_ancestor\);''',
              '''let pending_locator_accepts_response_peer =
                              pending_selected_locator_accepts_response_peer(
                                  pending_selected_locator.as_ref(),
                                  peer_id.as_deref(),
                              );
                          let selected_session_owns_headers = selected_headers_own_broadcast_locator(
                              selected_segment_session.is_some(),
                              selected_locator_pending,
                              peer_id.as_deref(),
                              session_correlated,
                          ) && (session_correlated
                              || (pending_locator_matches_common_ancestor
                                  && pending_locator_accepts_response_peer));''',
              "selected response peer correlation",
          )

          main = add_arg_to_first_request_after(
              main,
              "let immediate_selected_locator =",
              "                                        &peer_id,\n",
              "Tips selected locator",
          )
          main = add_arg_to_first_request_after(
              main,
              "let proactive_selected_locator =",
              "                                &peer_id,\n",
              "proactive selected locator",
          )
          main = add_arg_to_first_request_after(
              main,
              "let selected_locator_peer = selected_locator_peer_for_reconcile",
              "                                                selected_locator_peer.as_deref().unwrap_or_default(),\n",
              "final quiescence selected locator",
          )

          main_test = '''    #[test]
              fn pending_selected_locator_rejects_wrong_response_peer() {
                  let pending = PendingSelectedLocator {
                      request_id: 8,
                      peer_id: "peer-a".to_string(),
                      locator: vec!["local-1296".to_string()],
                      requested_at_unix: 100,
                  };
                  assert!(pending_selected_locator_accepts_response_peer(
                      Some(&pending),
                      Some("peer-a")
                  ));
                  assert!(!pending_selected_locator_accepts_response_peer(
                      Some(&pending),
                      Some("peer-b")
                  ));

                  let broadcast = PendingSelectedLocator {
                      peer_id: "broadcast-observed-block-gap".to_string(),
                      ..pending
                  };
                  assert!(pending_selected_locator_accepts_response_peer(
                      Some(&broadcast),
                      Some("peer-b")
                  ));
              }

          '''
          main = insert_before_test(
              main,
              "stale_selected_segment_rearms_only_after_no_progress_and_no_inflight_requests",
              main_test,
              "selected response peer regression",
          )
          main_path.write_text(main)

      - name: Format
        run: cargo fmt --all
      - name: Check formatting
        run: cargo fmt --all -- --check
      - name: Run directed-header regressions
        run: cargo test -p pulsedag-p2p get_headers -- --nocapture
      - name: Run full P2P tests
        run: cargo test -p pulsedag-p2p
      - name: Run selected-segment regressions
        run: cargo test -p pulsedagd selected_segment -- --nocapture
      - name: Check pulsedagd
        run: cargo check -p pulsedagd
      - name: Verify diff
        run: git diff --check
      - name: Commit tested patch and remove one-shot workflow
        run: |
          rm .github/workflows/one-shot-fix-811-directed-headers.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/pulsedagd/src/main.rs crates/pulsedag-p2p/src/lib.rs crates/pulsedag-p2p/src/messages.rs .github/workflows/one-shot-fix-811-directed-headers.yml
          git commit -m "fix(sync): direct selected header recovery to chosen peer"
          git push origin HEAD:fix/rejoin-catchup-stall-811
