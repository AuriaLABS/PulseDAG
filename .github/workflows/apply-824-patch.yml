name: apply-824-patch

on:
  push:
    branches:
      - fix/2.4.x-prune-boundary-824

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout candidate
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply patch and publish branch commit
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/apply_824_patch.py
          cargo fmt --all
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "p2p: advertise retained history for selected sync (#824)"
          git push origin HEAD:fix/2.4.x-prune-boundary-824
      - name: Focused validation
        shell: bash
        run: |
          set -euo pipefail
          cargo test -p pulsedag-p2p prune_boundary --locked
          cargo test -p pulsedagd prune_boundary --locked
