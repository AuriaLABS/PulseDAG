name: v2.4.0 Task 29 acceptance

on:
  pull_request:
    branches:
      - main
    paths:
      - apps/pulsedagd/**
      - crates/pulsedag-core/**
      - crates/pulsedag-rpc/**
      - crates/pulsedag-storage/**
      - apps/pulsedag-miner/**
      - .github/workflows/task29-acceptance.yml
  push:
    branches:
      - main
    paths:
      - apps/pulsedagd/**
      - crates/pulsedag-core/**
      - crates/pulsedag-rpc/**
      - crates/pulsedag-storage/**
      - apps/pulsedag-miner/**
      - .github/workflows/task29-acceptance.yml

permissions:
  contents: read

jobs:
  task29-acceptance:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout candidate
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Experimental cadence configuration guard
        run: cargo test --locked -p pulsedagd config::tests::experimental_fast_cadence

      - name: Conservative target interval default
        run: cargo test --locked -p pulsedagd config::tests::target_block_interval

      - name: Controlled runtime cadence convergence envelope
        run: cargo test --locked -p pulsedag-core --test task29_high_cadence_envelope

      - name: Bounded orphan-pressure convergence
        run: cargo test --locked -p pulsedag-core --test task29_orphan_pressure

      - name: Multi-miner template identity and bounded retention
        run: cargo test --locked -p pulsedag-rpc task29_

      - name: Bounded mining-submit RPC pressure and liveness
        run: |
          cargo test --locked -p pulsedag-rpc mining_submit_actor_queue_full_returns_submit_busy_path
          cargo test --locked -p pulsedag-rpc handler_queue_full_returns_submit_busy_schema
          cargo test --locked -p pulsedag-rpc mining_submit_actor_timeout_records_bounded_error_metric
          cargo test --locked -p pulsedag-rpc handler_does_not_hold_chain_write_lock_while_waiting_for_actor_response
          cargo test --locked -p pulsedag-rpc submit_metrics_phase_progression_records_bounded_fields

      - name: Bounded runtime-event storage retention
        run: cargo test --locked -p pulsedag-storage --test task29_resource_bounds

      - name: Submit-finality reconciliation without blind resubmit
        run: cargo test --locked -p pulsedag-miner task29_
