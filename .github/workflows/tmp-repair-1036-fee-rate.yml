name: Repair issue 1036 fee-rate width and publish foundation

on:
  push:
    branches:
      - codex/issue-1036-mempool-policy-v3-foundation
    paths:
      - .github/workflows/tmp-repair-1036-fee-rate.yml

permissions:
  contents: write

concurrency:
  group: issue-1036-mempool-policy-v3-foundation
  cancel-in-progress: false

jobs:
  repair:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          ref: codex/issue-1036-mempool-policy-v3-foundation
          fetch-depth: 1
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.91.0
          components: clippy,rustfmt
      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
      - name: Apply guarded export and fee-rate repair
        shell: bash
        run: |
          set -euo pipefail
          python3 .github/scripts/issue_1036_mempool_v3_export.py
          python3 - <<'PY'
          from pathlib import Path

          p = Path('crates/pulsedag-core/src/mempool_v3.rs')
          s = p.read_text()
          replacements = [
              ('pub fee_per_kb: u64,', 'pub fee_per_kb: u128,'),
              ('if fee_rate.fee_per_kb < self.min_relay_fee_rate_per_kb {', 'if fee_rate.fee_per_kb < u128::from(self.min_relay_fee_rate_per_kb) {'),
              ('''    let fee_per_kb = scaled_fee / u128::from(canonical_size_bytes);\n    let fee_per_kb = u64::try_from(fee_per_kb)\n        .map_err(|_| MempoolPolicyAssessmentErrorV3::CanonicalSizeOverflow)?;''', '''    let fee_per_kb = scaled_fee / u128::from(canonical_size_bytes);'''),
              ('''            ((u128::from(tx.fee) * u128::from(FEE_RATE_SCALE_BYTES_V3))\n                / u128::from(a.canonical_size_bytes)) as u64''', '''            (u128::from(tx.fee) * u128::from(FEE_RATE_SCALE_BYTES_V3))\n                / u128::from(a.canonical_size_bytes)'''),
              ('''        let rate = fee_rate_v3(&tx, "legacy").unwrap();\n        assert!(rate.fee_per_kb > 0);''', '''        let rate = fee_rate_v3(&tx, "legacy").unwrap();\n        let expected = (u128::from(u64::MAX) * u128::from(FEE_RATE_SCALE_BYTES_V3))\n            / u128::from(rate.canonical_size_bytes);\n        assert_eq!(rate.fee_per_kb, expected);\n        assert!(rate.fee_per_kb > u128::from(u64::MAX));'''),
              ('min_relay_fee_rate_per_kb: rate.fee_per_kb.saturating_add(1),', 'min_relay_fee_rate_per_kb: u64::try_from(rate.fee_per_kb)\n                .unwrap()\n                .saturating_add(1),'),
          ]
          for old, new in replacements:
              count = s.count(old)
              assert count == 1, f'mempool replacement count={count}: {old[:80]!r}'
              s = s.replace(old, new, 1)
          p.write_text(s)

          d = Path('docs/MEMPOOL_POLICY_V3.md')
          text = d.read_text()
          old = 'The multiplication is performed in `u128`. Canonical size is derived from the already-frozen signed transaction serialization for the transaction version:'
          new = 'The multiplication and retained fee-rate value use `u128`, so a valid `u64::MAX` fee cannot wrap or be rejected merely because the scaled rate exceeds `u64`. Canonical size is derived from the already-frozen signed transaction serialization for the transaction version:'
          assert text.count(old) == 1, text.count(old)
          d.write_text(text.replace(old, new, 1))
          PY
          cargo fmt --all
          git diff --check
          cargo fmt --all -- --check
      - name: Run focused policy tests
        run: cargo test -p pulsedag-core mempool_v3 --lib
      - name: Run core library tests
        run: cargo test -p pulsedag-core --lib
      - name: Run core Clippy
        run: cargo clippy -p pulsedag-core --all-targets --all-features -- -D warnings -A clippy::uninlined-format-args
      - name: Publish verified foundation and self-clean
        shell: bash
        run: |
          set -euo pipefail
          rm .github/scripts/issue_1036_mempool_v3_export.py
          rm .github/workflows/issue-1036-mempool-v3-materialize.yml
          rm .github/workflows/tmp-repair-1036-fee-rate.yml
          git diff --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --name-only | sort > /tmp/changed.txt
          printf '%s\n' '.github/scripts/issue_1036_mempool_v3_export.py' '.github/workflows/issue-1036-mempool-v3-materialize.yml' '.github/workflows/tmp-repair-1036-fee-rate.yml' 'crates/pulsedag-core/src/lib.rs' 'crates/pulsedag-core/src/mempool_v3.rs' 'docs/MEMPOOL_POLICY_V3.md' | sort > /tmp/expected.txt
          diff -u /tmp/expected.txt /tmp/changed.txt
          git commit -m 'core: export verified mempool v3 policy foundation'
          git push origin HEAD:codex/issue-1036-mempool-policy-v3-foundation
