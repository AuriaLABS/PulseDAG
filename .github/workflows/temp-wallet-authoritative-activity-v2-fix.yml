name: temp wallet authoritative activity v2 fix

on:
  push:
    branches:
      - wallet/v3-pending-utxo-reconcile
    paths:
      - .github/workflows/temp-wallet-authoritative-activity-v2-fix.yml

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
      - name: Guard exact inputs
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${GITHUB_SHA}"
          test "$(git hash-object crates/pulsedag-rpc/src/handlers/release.rs)" = "5464b2b144cc6ce9d541f6c06d2c0194320949bd"
          test "$(git hash-object crates/pulsedag-wallet/src/bin/pulsedag-wallet-reconcile.rs)" = "6c9c6afac2666c1973bacd2a93338e8ac986db79"
          test "$(git hash-object crates/pulsedag-wallet/README.md)" = "cd44a1170adde70e8c08f7ccd6ecd6a1accf3b0b"
          test "$(git hash-object docs/WALLET_PENDING_RECONCILIATION.md)" = "8b2ffb78654097a058401be2fa0b5c139da8e28f"
          test "$(git hash-object crates/pulsedag-core/src/validation.rs)" = "c402420b8bc1ad43ffaadc603bcf3eb2aa330bec"
          test "$(git hash-object crates/pulsedag-rpc/src/handlers/address.rs)" = "3637dd07e7af8e561551579643e77dca0ce5f015"
          test "$(git hash-object .github/temp-wallet-authoritative-activity-v2-fix.py)" = "ffca0dbb9dc1465aa4aa9a799f24081945f749be"
      - name: Apply guarded capability-version fix
        run: |
          set -euo pipefail
          python .github/temp-wallet-authoritative-activity-v2-fix.py
          cargo fmt --all
          git diff --check
      - name: Run focused and package regression gates
        run: |
          set -euo pipefail
          cargo test --locked -p pulsedag-wallet --bin pulsedag-wallet-reconcile identity_requires_exact_network_capability_and_activity_endpoint
          cargo test --locked -p pulsedag-rpc release_metadata_reports_keyless_signed_relay_surface
          cargo test --locked -p pulsedag-wallet
          cargo test --locked -p pulsedag-rpc
          cargo clippy --locked --workspace --all-targets -- -D warnings
          cargo fmt --all -- --check
          git diff --check
      - name: Publish fix and remove temporaries
        shell: bash
        run: |
          set -euo pipefail
          rm .github/temp-wallet-authoritative-activity-v2-fix.py
          rm .github/workflows/temp-wallet-authoritative-activity-v2-fix.yml
          git config user.name "pulsedag-ci"
          git config user.email "actions@users.noreply.github.com"
          git add \
            crates/pulsedag-rpc/src/handlers/release.rs \
            crates/pulsedag-wallet/src/bin/pulsedag-wallet-reconcile.rs \
            crates/pulsedag-wallet/README.md \
            docs/WALLET_PENDING_RECONCILIATION.md \
            .github/temp-wallet-authoritative-activity-v2-fix.py \
            .github/workflows/temp-wallet-authoritative-activity-v2-fix.yml
          git diff --cached --check
          git commit -m "wallet: version exact-occurrence activity capability"
          git push origin HEAD:wallet/v3-pending-utxo-reconcile
