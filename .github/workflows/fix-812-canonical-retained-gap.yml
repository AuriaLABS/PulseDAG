name: Validate #812 canonical retained-history-gap state

on:
  push:
    branches:
      - fix/fresh-node-orphan-recovery-812
    paths:
      - .github/workflows/fix-812-canonical-retained-gap.yml

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: fix/fresh-node-orphan-recovery-812
          fetch-depth: 0

      - name: Apply canonical retained-history-gap state patch
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('crates/pulsedag-rpc/src/handlers/canonical_sync.rs')
          text = path.read_text()

          old = '    let no_blockers = lag_blocks == 0\n'
          new = (
              '    let retained_history_gap_active = runtime\n'
              '        .final_quiescence_selected_sync_blocked_reason\n'
              '        .as_deref()\n'
              '        == Some("retained_history_gap");\n'
              '    let no_blockers = !retained_history_gap_active\n'
              '        && lag_blocks == 0\n'
          )
          if text.count(old) != 1:
              raise SystemExit(f'no_blockers anchor count={text.count(old)}')
          text = text.replace(old, new, 1)

          old = '    let (sync_state, catchup_stage, recovery_reason) = if no_blockers\n'
          new = (
              '    let (sync_state, catchup_stage, recovery_reason) = if retained_history_gap_active {\n'
              '        (\n'
              '            "selected_segment_failed".to_string(),\n'
              '            "degraded".to_string(),\n'
              '            Some("selected header sync blocked: retained_history_gap".to_string()),\n'
              '        )\n'
              '    } else if no_blockers\n'
          )
          if text.count(old) != 1:
              raise SystemExit(f'canonical branch anchor count={text.count(old)}')
          text = text.replace(old, new, 1)

          test = (
              '\n    #[test]\n'
              '    fn retained_history_gap_prevents_canonical_synced_state_when_remote_evidence_ages_out() {\n'
              '        let chain = chain_at_selected_height(611);\n'
              '        let runtime = NodeRuntimeStats {\n'
              '            sync_state: "selected_segment_failed".into(),\n'
              '            final_quiescence_selected_sync_blocked_reason: Some(\n'
              '                "retained_history_gap".into(),\n'
              '            ),\n'
              '            ..NodeRuntimeStats::default()\n'
              '        };\n'
              '        let stale_remote = RemoteSelectedTipEvidence {\n'
              '            observed_at_unix: 900,\n'
              '            ..fresh_remote("peer-a", 1311)\n'
              '        };\n'
              '\n'
              '        let stale = build_canonical_sync_state_with_remote_evidence(\n'
              '            &chain,\n'
              '            &runtime,\n'
              '            chain.dag.blocks.len(),\n'
              '            1_000,\n'
              '            None,\n'
              '            &[stale_remote],\n'
              '        );\n'
              '        assert_eq!(stale.best_remote_selected_height, None);\n'
              '        assert_eq!(stale.sync_state, "selected_segment_failed");\n'
              '        assert_eq!(stale.catchup_stage, "degraded");\n'
              '        assert_eq!(\n'
              '            stale.recovery_reason.as_deref(),\n'
              '            Some("selected header sync blocked: retained_history_gap")\n'
              '        );\n'
              '        assert_ne!(stale.sync_state, "synced");\n'
              '\n'
              '        let fresh = build_canonical_sync_state_with_remote_evidence(\n'
              '            &chain,\n'
              '            &runtime,\n'
              '            chain.dag.blocks.len(),\n'
              '            1_000,\n'
              '            None,\n'
              '            &[fresh_remote("peer-a", 1311)],\n'
              '        );\n'
              '        assert_eq!(fresh.best_remote_selected_height, Some(1311));\n'
              '        assert_eq!(fresh.sync_state, "selected_segment_failed");\n'
              '        assert_eq!(fresh.catchup_stage, "degraded");\n'
              '        assert_ne!(fresh.sync_state, "synced");\n'
              '    }\n'
          )
          insert_at = text.rfind('\n}')
          if insert_at < 0:
              raise SystemExit('module closing brace not found')
          text = text[:insert_at] + test + text[insert_at:]

          path.write_text(text)
          print('applied canonical retained-history-gap state patch')
          PY

      - name: Format
        run: cargo fmt --all

      - name: Diff check
        run: git diff --check

      - name: Canonical retained-gap regression
        run: cargo test -p pulsedag-rpc retained_history_gap_prevents_canonical_synced_state_when_remote_evidence_ages_out -- --nocapture

      - name: Canonical sync regressions
        run: cargo test -p pulsedag-rpc canonical_sync -- --nocapture

      - name: Existing retained-gap daemon regressions
        run: cargo test -p pulsedagd retained_history_gap -- --nocapture

      - name: RPC clippy
        run: cargo clippy -p pulsedag-rpc --all-targets --all-features -- -D warnings

      - name: Daemon clippy
        run: cargo clippy -p pulsedagd --all-targets --all-features -- -D warnings

      - name: RPC check
        run: cargo check -p pulsedag-rpc

      - name: Daemon check
        run: cargo check -p pulsedagd

      - name: Commit validated source and remove temporary workflow
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/fix-812-canonical-retained-gap.yml
          git add -A
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "fix(sync): preserve pruned-gap failure in canonical status"
          git pull --rebase origin fix/fresh-node-orphan-recovery-812
          git push origin HEAD:fix/fresh-node-orphan-recovery-812
