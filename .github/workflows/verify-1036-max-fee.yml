name: Verify #1036 max-fee arithmetic

on:
  push:
    branches:
      - codex/issue-1036-mempool-policy-v3-foundation
    paths:
      - '.github/workflows/verify-1036-max-fee.yml'

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/issue-1036-mempool-policy-v3-foundation
          token: ${{ secrets.GITHUB_TOKEN }}
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Run exact max-fee vector
        run: cargo test --locked -p pulsedag-core mempool_v3::tests::maximum_fee_value_does_not_overflow_rate_math --lib -- --exact
      - name: Run complete mempool v3 focused suite
        run: cargo test --locked -p pulsedag-core mempool_v3 --lib
      - name: Remove verification helper after success
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/verify-1036-max-fee.yml
          git config user.name "kalekói"
          git config user.email "hermida.prada@gmail.com"
          git add -A
          git commit -m "ci: remove #1036 max-fee verification helper"
          git push origin HEAD:codex/issue-1036-mempool-policy-v3-foundation
