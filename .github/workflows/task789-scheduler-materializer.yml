name: Materialize issue 789 scheduler stall fix

on:
  push:
    branches:
      - fix/v2.4-p2p-v2-header-hash-789-scheduler
    paths:
      - .github/workflows/task789-scheduler-materializer.yml

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: dtolnay/rust-toolchain@1.88.0
        with:
          components: rustfmt

      - name: Apply scheduler stall fix
        shell: bash
        run: |
          echo '   ' | base64 -d > /tmp/patch.py
          python3 /tmp/patch.py

      - name: Format
        run: cargo fmt --all

      - name: Enforce focused source delta
        shell: bash
        run: |
          git diff --check
          changed="$(git diff --name-only | sort)"
          printf '%s\n' "$changed"
          expected=$'apps/pulsedagd/src/block_request.rs\napps/pulsedagd/src/main.rs'
          test "$changed" = "$expected"

      - name: Test block request scheduler
        run: cargo test -p pulsedagd block_request -- --nocapture

      - name: Compile node
        run: cargo check -p pulsedagd

      - name: Commit validated source and remove materializer
        shell: bash
        run: |
          rm .github/workflows/task789-scheduler-materializer.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add apps/pulsedagd/src/block_request.rs apps/pulsedagd/src/main.rs .github/workflows/task789-scheduler-materializer.yml
          git commit -m 'fix(sync): rearm dependency fetch queue after block acceptance'
          git push origin HEAD:fix/v2.4-p2p-v2-header-hash-789-scheduler
