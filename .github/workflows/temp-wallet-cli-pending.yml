name: TEMP wallet CLI pending patch

on:
  push:
    branches:
      - wallet/v3-pending-utxo-reconcile
    paths:
      - .github/workflows/temp-wallet-cli-pending.yml

permissions:
  contents: write

jobs:
  apply-and-verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: wallet/v3-pending-utxo-reconcile

      - name: Verify source blob and apply exact patch
        shell: bash
        run: |
          set -euo pipefail
          test "$(git hash-object crates/pulsedag-wallet/src/bin/pulsedag-wallet.rs)" = "f209627b1e05a7091d996493a7106ec87b42dec9"
          git apply --check .github/temp-wallet-cli-pending.patch
          git apply .github/temp-wallet-cli-pending.patch
          git diff --check
          cargo fmt --all -- --check

      - name: Wallet tests
        run: cargo test -p pulsedag-wallet

      - name: Wallet clippy
        run: cargo clippy -p pulsedag-wallet --all-targets -- -D warnings

      - name: Publish verified source and remove temporary applicator
        shell: bash
        run: |
          set -euo pipefail
          rm .github/temp-wallet-cli-pending.patch .github/workflows/temp-wallet-cli-pending.yml
          git add -A
          test "$(git diff --cached --name-only)" = "crates/pulsedag-wallet/src/bin/pulsedag-wallet.rs"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "wallet: wire pending reservations into preview and sign"
          git push origin HEAD:wallet/v3-pending-utxo-reconcile
