name: One-shot v2.4 fixture patch

on:
  push:
    paths:
      - .github/workflows/agent-patch-v2-4-test.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: release/2.4.0
          fetch-depth: 0
      - name: Refresh mined fixture block identity
        shell: python
        run: |
          from pathlib import Path

          path = Path("crates/pulsedag-rpc/src/handlers/mining_submit.rs")
          text = path.read_text()
          old = '''        block.header = mined_header;
        (template.template_id, block)
'''
          new = '''        block.header = mined_header;
        {
            let chain = state.chain.read().await;
            refresh_block_consensus_ids_with_state(&mut block, &chain).unwrap();
        }
        (template.template_id, block)
'''
          if old not in text:
              raise SystemExit("expected fixture block not found")
          path.write_text(text.replace(old, new, 1))
      - name: Remove one-shot workflow
        run: rm .github/workflows/agent-patch-v2-4-test.yml
      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add crates/pulsedag-rpc/src/handlers/mining_submit.rs .github/workflows/agent-patch-v2-4-test.yml
          git commit -m "Refresh mined fixture block identity"
          git push origin HEAD:release/2.4.0
