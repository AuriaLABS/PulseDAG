name: v3 launch Task 38 NVIDIA CUDA protocol-search phase 4

on:
  pull_request:
    branches:
      - main
    paths:
      - apps/pulsedag-miner/tests/cuda_protocol_contract.rs
      - apps/pulsedag-miner/src/protocol_backend.rs
      - apps/pulsedag-miner/src/protocol_pow.rs
      - apps/pulsedag-miner/cuda/kheavyhash.cu
      - .github/workflows/task38-nvidia-cuda-protocol-search.yml
  push:
    branches:
      - main
    paths:
      - apps/pulsedag-miner/tests/cuda_protocol_contract.rs
      - apps/pulsedag-miner/src/protocol_backend.rs
      - apps/pulsedag-miner/src/protocol_pow.rs
      - apps/pulsedag-miner/cuda/kheavyhash.cu
      - .github/workflows/task38-nvidia-cuda-protocol-search.yml

permissions:
  contents: read

jobs:
  canonical-protocol-search-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Verify exact SHA and clean checkout
        shell: bash
        env:
          CANDIDATE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$CANDIDATE_SHA"
          test -z "$(git status --porcelain)"
          echo "task38_cuda_protocol_search_candidate_sha=$CANDIDATE_SHA"

      - name: Install Rust 1.91.0
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.91.0
          components: rustfmt, clippy

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Workspace format contract
        run: cargo fmt --all -- --check

      - name: CUDA protocol partition and canonical re-verification tests
        run: cargo test --locked -p pulsedag-miner --test cuda_protocol_contract

      - name: CUDA protocol contract clippy
        run: cargo clippy --locked -p pulsedag-miner --test cuda_protocol_contract -- -D warnings

      - name: Record software-contract scope
        shell: bash
        run: |
          echo "cuda_protocol_nonce_partition_contract=PASS"
          echo "cuda_protocol_target_search_contract=PASS"
          echo "cuda_candidate_canonical_reverification=PASS"
          echo "cuda_runtime_kernel_launch=NOT_CLAIMED"
          echo "nvidia_cuda_hardware_execution=NOT_CLAIMED"
          echo "GPU_MINING_NVIDIA_PASS=NOT_CLAIMED"

  existing-cuda-kernel-compile:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Verify exact SHA and clean checkout
        shell: bash
        env:
          CANDIDATE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$CANDIDATE_SHA"
          test -z "$(git status --porcelain)"

      - name: Compile existing CUDA kernel and run host math vectors
        shell: bash
        run: |
          set -euo pipefail
          docker run --rm \
            -v "${PWD}:/work" \
            -w /work \
            nvidia/cuda:12.9.2-devel-ubuntu24.04 \
            bash -lc '
              set -euo pipefail
              nvcc --version
              nvcc -std=c++17 -O2 \
                -DPULSEDAG_CUDA_HOST_SELF_TEST \
                apps/pulsedag-miner/cuda/kheavyhash.cu \
                -o /tmp/pulsedag-kheavyhash-selftest
              /tmp/pulsedag-kheavyhash-selftest
              nvcc -std=c++17 -O2 -arch=sm_60 \
                -c apps/pulsedag-miner/cuda/kheavyhash.cu \
                -o /tmp/pulsedag-kheavyhash.o
              test -s /tmp/pulsedag-kheavyhash.o
              echo "nvidia_cuda_kernel_compile=PASS"
              echo "nvidia_cuda_hardware_execution=NOT_CLAIMED"
            '
