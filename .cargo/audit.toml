# PulseDAG v2.4.0 RustSec policy.
#
# The only vulnerability ignore is a narrow, time-bounded non-reachability
# exception for hickory-proto 0.24.4 retained in Cargo.lock by the libp2p 0.54
# umbrella dependency. Release builds compile libp2p without dns/mdns/quic and
# the exception validator proves Hickory is absent from exact-candidate compiler
# artifacts before cargo-audit policy is accepted.

[advisories]
ignore = [
  "RUSTSEC-2026-0119",
]
informational_warnings = ["unmaintained", "unsound"]
