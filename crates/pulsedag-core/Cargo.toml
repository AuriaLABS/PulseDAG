[package]
name = "pulsedag-core"
version.workspace = true
edition = "2021"

[features]
default = []
# Opt-in only. Task31 / v2.4.0 node builds must leave this off.
executable-contracts = []

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "1"
sha2 = "0.10"
hex = "0.4"
ed25519-dalek = "2"

sha3 = "0.10"
keccak = "0.1.6"

[dev-dependencies]
# The pinned upstream Kaspa KHeavyHash reference moved to the separately
# locked tools/pow-upstream-reference workspace to prevent dev-only JS crate
# versions from constraining the public network's libp2p dependency graph.
# Never remove its 480 parity cases or release-profile benchmark.
bincode = "1.3"
criterion = { version = "0.5", default-features = false, features = ["cargo_bench_support"] }
proptest = "1"

[[bench]]
name = "pow_core"
harness = false
