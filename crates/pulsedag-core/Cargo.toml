[package]
name = "pulsedag-core"
version.workspace = true
edition = "2021"

[features]
default = []
# Opt-in only. Task31 / v2.4.0 node builds must leave this off.
executable-contracts = []

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "1"
sha2 = "0.10"
hex = "0.4"
ed25519-dalek = "2"

sha3 = "0.10"

[dev-dependencies]
# Kaspa is now only an integration-test byte-parity reference, not a runtime dependency.
kaspa-hashes = { git = "https://github.com/kaspanet/rusty-kaspa", rev = "cfafeb4c093fa37a303f1b9f19c58f986b870ce3" }
kaspa-pow = { git = "https://github.com/kaspanet/rusty-kaspa", rev = "cfafeb4c093fa37a303f1b9f19c58f986b870ce3" }
bincode = "1.3"
criterion = { version = "0.5", default-features = false, features = ["cargo_bench_support"] }
proptest = "1"

[[bench]]
name = "pow_core"
harness = false
