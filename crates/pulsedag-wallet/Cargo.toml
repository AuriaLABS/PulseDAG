[package]
name = "pulsedag-wallet"
version.workspace = true
edition = "2021"

[dependencies]
pulsedag-core = { path = "../pulsedag-core" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
hex = "0.4"
argon2 = { version = "0.5.3", default-features = false, features = ["alloc", "zeroize"] }
chacha20poly1305 = "0.10.1"
rand = "0.8"
zeroize = "1.8"
