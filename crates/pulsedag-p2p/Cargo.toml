[package]
name = "pulsedag-p2p"
version.workspace = true
edition = "2021"

[dependencies]
pulsedag-core = { path = "../pulsedag-core" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["sync", "rt", "macros", "time"] }
futures = "0.3"
libp2p-core = "0.43.2"
libp2p-identity = { version = "0.2.13", features = ["ed25519", "peerid", "rand"] }
libp2p-swarm = { version = "0.47.1", features = ["tokio", "macros"] }
libp2p-gossipsub = "0.49.5"
libp2p-ping = "0.47.0"
libp2p-tcp = { version = "0.44.1", features = ["tokio"] }
libp2p-noise = "0.46.1"
libp2p-yamux = "0.47.0"

[dev-dependencies]
tempfile = "3"
