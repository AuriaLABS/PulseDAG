[package]
name = "pulsedag-storage"
version.workspace = true
edition = "2021"

[lib]
path = "src/root.rs"

[dependencies]
pulsedag-core = { path = "../pulsedag-core" }
rocksdb = "0.22"
serde_json = "1"

bincode = "1.3"
serde = { version = "1", features = ["derive"] }

[dev-dependencies]
proptest = "1"
